name: Check native CH contingency integration

on:
  pull_request:
    paths:
      - 'logical-maps/topics/classicism/lean/**'
      - 'logical-maps/topics/classicism/principles/**'
      - 'logical-maps/topics/classicism/results/**'
      - '.github/workflows/check-ch-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ch-source:
    name: Check CH and its exact source-level map wrappers
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r logical-maps/requirements.txt
      - name: Validate records and regenerate statements
        working-directory: logical-maps
        run: |
          python scripts/pmap.py validate classicism
          python scripts/pmap.py lean classicism
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: logical-maps/topics/classicism/lean
          auto-config: 'false'
          build: 'true'
          build-args: 'Classicism.Results.Records.MathematicalContingency'
          test: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'true'

  native-ch-derivation:
    name: Replay native CH object-language derivations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: logical-maps/topics/classicism/lean
          auto-config: 'false'
          build: 'true'
          build-args: 'Classicism.Certified.MathematicalContingency.GoodsellCH03'
          test: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'true'
