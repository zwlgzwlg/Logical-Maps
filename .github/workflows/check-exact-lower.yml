name: Check exact/at-least finite-cardinality comparison

on:
  pull_request:
    paths:
      - 'logical-maps/topics/classicism/lean/Classicism/Results/Research/ExactLower*.lean'
      - 'logical-maps/topics/classicism/principles/exact-*'
      - 'logical-maps/topics/classicism/results/exact-*'
      - 'logical-maps/topics/classicism/results/necessary-lower-peano-*'
      - '.github/workflows/check-exact-lower.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-lean-theorem:
    name: Check theorem in native Logical-Maps Classicism
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: logical-maps/topics/classicism/lean
          auto-config: 'false'
          build: 'true'
          build-args: 'Classicism.Results.Research.ExactLowerPeanoTransfer'
          test: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'true'
