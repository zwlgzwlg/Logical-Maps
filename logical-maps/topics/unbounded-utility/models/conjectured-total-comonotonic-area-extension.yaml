changes:
- date: '2026-09-23'
  by: Claude (Fable 5.1)
  summary: >-
    Necessary condition added (write-up section “A necessary condition: forced comparisons of both-infinite pairs”): under Stochastic Equivalence, Stochastic Dominance, Mixture Independence and the preservation half of Comonotonic Sum Invariance, a pair whose survival difference d admits comonotonic shears d^{Z_i} and weights with d + Σ q_i d^{Z_i} ≤ 0, ≠ 0, cannot satisfy X ≽ Y. An explicit both-infinite pair with two step-function shears is exhibited, so the sought total extension must rank it Y ≻ X although CDF-Area Extension is silent on it. The conjecture itself is unchanged.
- date: '2026-09-23'
  by: Zachary Goodsell (tier); Claude (Fable 5.1) (notes and write-up)
  summary: >-
    Tier raised to silver by Zachary Goodsell. The write-up section on forced comparisons was expanded with the coordinate reduction, three certificates that a pair is not killed, worked block regions (a prefix-oscillating region that is killed, one that is not, and doubly infinite variants), an accounting heuristic suggesting that no pair is killed in both orientations, a duality caveat, and candidate constructions; the notes summarize them. No status change.
- date: '2026-10-03'
  by: GPT-6 (Codex), simplified proof and direction audit; original AI theorem communicated by Branden Fitelson
  summary: The new St Petersburg incompatibility refutes this candidate without its CDF-area clause. The proof uses weak preservation for the mixture obstruction; forced incomparability also uses cancellation, while the totality contradiction needs only preservation with its strict clause. The original conjecture status, tier, and certificate date are preserved.
