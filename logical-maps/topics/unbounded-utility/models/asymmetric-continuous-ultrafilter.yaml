  Appendix B, Definition 3, Lemma 6 and proof of Theorem 3, pp. 691–692; Remark 3 and Corollary 3, pp.
  692–693. Source of the clipped-expectation ultrafilter, continuous quotient, and asymmetric-cutoff strategy,
  including the possibility of assigning nonzero values to symmetric gambles.
- 'Claude (Fable 5.1), Logical Maps, 23 September 2026: failure of Comonotonic Sum Invariance (half-Cauchy common summand) in writeups/asymmetric-continuous-ultrafilter.md; diagnostic checks/comonotonic_witnesses.py.'
