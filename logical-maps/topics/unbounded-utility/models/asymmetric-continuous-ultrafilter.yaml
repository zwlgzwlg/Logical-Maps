- Zachary Goodsell, Symmetries of value, Noûs 60 (2026), 16–37; DOI 10.1111/nous.12549, Theorem 1, p.
  24. Already states the failure of affine-symmetry implications under DTU, including with L¹ Continuity
  and Relative Expectation, and cites Decision theory unbound, Remark 3, for the reflection countermodel.
- GPT-6 (Codex), explicit source-model specialization and additional calculations, 9 September 2026; writeups/asymmetric-continuous-ultrafilter.md,
