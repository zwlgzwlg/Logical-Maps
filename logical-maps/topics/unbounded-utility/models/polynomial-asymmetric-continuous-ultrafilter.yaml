notes: >-
  Original work: model specialization with moderate evaluation calculations.
  The asymmetric clipping method and its strong expectation/continuity
  compatibility with failure of reflection are already Goodsell's.
  This entry selects upper cutoff equal to the square of the lower
  cutoff and computes its different Pasadena value and unbounded
  Arroyo value. The general construction is not a new AI invention.
  No independent checker or Lean certification is asserted. The free
  ultrafilter remains nonconstructive; the diagnostic checks finite
  formulas and convergence estimates rather than ultrafilter existence.
