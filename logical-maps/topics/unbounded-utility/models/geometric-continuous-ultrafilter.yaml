  summary: 'A single copula exchanging adjacent quarters works for every marginal pair: on each quarter
    one quantile is bounded, so dominated convergence makes clipped addition additive up to an error tending
    to zero. The tolerance-based comparison ignores that error in both directions. Full proof in writeups/calibrated-geometric-continuous-ultrafilter.md (shared clipping proof);
    original construction attribution and date are preserved. The previous record was Lean stated; the
    expanded statement is not Lean-checked.'
