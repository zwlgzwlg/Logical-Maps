description: Use all real-valued gambles with identity utility. Put v_X(t)=E[max(-t,min(X,2t))] for every real
  t>0, and X≽Y iff liminf(v_X(t)-v_Y(t))≥0 as t tends to infinity. The common clipping proof establishes DU
  and the stated expectation, continuity and fixed-copula properties. Reparametrizing t by t/a and the bounded
  shift argument give full Positive Affine Invariance. Symmetric St Petersburg has constant clipped value 1/2
  for t≥1, refuting neutral symmetry and reflection. A symmetric base-four law has values 1/2 and 1 on two
  cofinal sequences, making it incomparable with 3/4. Alternating St Petersburg has value zero. The accompanying
  write-up supplies every witness and all quantified proofs.
