description: 'Use all real-valued gambles with identity utility. Put v_X(t)=E[max(-t,min(X,t))] for every real
  t>0, and X≽Y iff liminf(v_X(t)-v_Y(t))≥0. The common clipping proof gives DU, area/relative expectation,
  continuity and a fixed shuffle copula; oddness and reparametrization give reflection and positive affine
  invariance. The folded-tail integral proves Folded Expectation. For independent positive Lévy variables,
  W=εL1 is indifferent to zero, while the clipped difference between W+L2 and L2 tends to -1/2: Independent
  Sum Preservation fails. The Cauchy common-summand witness refutes comonotonic invariance. Alternating St
  Petersburg has clipped values -1/3 and -2/3 on cofinal sequences, and is incomparable with -1/2. The write-up
  proves every stated flag.'
