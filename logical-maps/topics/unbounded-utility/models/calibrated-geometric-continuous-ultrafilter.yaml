description: Use identity real utility and a free ultrafilter on positive integers. Clip at a_n=(7/4)4^n on
  the negative side and b_n=2·4^n on the positive side, and compare clipped expectations up to every positive
  tolerance on an ultrafilter-large set. The common clipping proof gives DTU, the area/expectation/continuity
  properties and a fixed shuffle copula. Alternating St Petersburg and its double both have clipped expectation
  -1/2 at every index; thus the recorded alternating evaluation holds but Integer Affine Preservation fails.
  Symmetric Cauchy has value log(8/7)/π>0, refuting Folded Expectation, neutral symmetry and reflection. Complete
  proofs, including the shared clipping and shuffle-copula argument, are in the model write-up.
