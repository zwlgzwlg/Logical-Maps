id: comonotonic-sum-weak-preservation
name: Comonotonic Sum Weak Preservation
statement: |-
  If X and Z are comonotonic, and Y and Z are comonotonic, then $X\succeq Y$ implies $X+Z\succeq Y+Z$. A pair is comonotonic when its members admit nondecreasing representations in one common uniform random variable.
category: invariance-principles
tags: [background-risk]
sources:
- 'Zachary Goodsell, project conversation, 3 October 2026: request to distinguish preservation and cancellation in the St Petersburg incompleteness proof. Precise separation recorded by GPT-6 (Codex).'
source_names: [Goodsell preservation/cancellation audit 3 Oct]
notes: |-
  Numerical scope is the same as Comonotonic Sum Invariance: real utility variables for which the pointwise sums exist in the outcome chart. This is only the forward weak implication. It neither requires strict preservation nor asserts cancellation. Stochastic Equivalence remains separate. The finite-mixture obstruction in st-petersburg-refutes-total-comonotonic-preservation uses just this direction.
date: '2026-10-03'
