id: existential-nonindependent-copula-sum-consistency
name: Existential Nonindependent Copula Sum Invariance
statement: |-
  There exists one copula $C\ne\Pi$ such that $\operatorname{SC}(C)$ holds for all eligible X,Y,Z, where $\Pi$ is the product (independence) copula. The copula is chosen once for the preference relation, independently of the triple and its marginal laws. A copula is a Borel probability measure on $[0,1]^2$ with uniform marginals. Write $H_C(u,v)=C([0,u]\times[0,v])$. A real-utility pair (A,B) admits C when $P(A\le a,B\le b)=H_C(F_A(a),F_B(b))$ for every real a,b. Define $\operatorname{SC}(C)$: whenever both (X,Z) and (Y,Z) admit this same C, $X\succeq Y$ iff $X+Z\succeq Y+Z$.
formal: '$\exists C\in\operatorname{Cop}_2,\ C\ne\Pi\ \land\ \operatorname{SC}(C)$.'
category: invariance-principles
tags: [background-risk, copula]
aliases: [Existential Copular Non Independent]
sources:
- 'Zachary Goodsell, project conversation, 3 October 2026: proposed existential invariance for a fixed copula other than independence; precise formulation recorded by GPT-6 (Codex).'
source_names: [Goodsell nonindependent copula proposal 3 Oct]
notes: |-
  Uses the same numerical scope and pair-compatibility convention as Existential Copula Sum Invariance. C differs from the product as a measure, equivalently H_C(u,v) differs from uv somewhere. Individual degenerate marginal pairs may still be independent; excluding them would change the quantifiers. Atoms do not require a uniquely assigned copula. No law invariance is built in. This asserts at least one fixed nonindependent copula, not every such copula and not a choice depending on X,Y,Z.
  The quarter-shuffle copula already verified for continuous clipped-expectation models is nonindependent, so this principle is consistent with DTU. Moreover, Expected Utility and Mixture Independence make interior perturbations of the product copula indifferent to independent sums; see independent-sum-eu-imply-nonindependent-copula. Commuting with all mixtures is a strictly stronger law-level requirement, uniquely satisfied by the product copula.
