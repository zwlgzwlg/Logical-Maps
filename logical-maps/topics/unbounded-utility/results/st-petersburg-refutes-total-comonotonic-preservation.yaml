proof: |-
  Let P(S=2^k)=2^(-k), k>=1. Compare X1 with law (1/5)delta_3+(4/5)law(3S) and Y1 with law (2/5)delta_4+(3/5)law(4S). Let X2 have law (1/5)delta_0+(1/5)delta_5+(3/5)law(4S), and Y2 have law (1/5)delta_0+(2/5)delta_6+(2/5)law(6S). For each pair the write-up supplies three increasing backgrounds Zj with sum_j[law(Xs+Zj)-law(Ys+Zj)]=(delta_(4s+1)-delta_(4s+2))/5. Thus weak comonotonic preservation and Mixture Independence exclude Xs>=Ys, since the equal mixture of the Y sums strictly stochastically dominates the equal mixture of the X sums. Totality forces Y1>X1 and Y2>X2. The comonotonic sums satisfy X1+X2=R+A and Y1+Y2=R+B for a nondecreasing R and simple equal-mean A,B. Simple EU and weak preservation make these sums indifferent, whereas strict preservation and transitivity make the Y sum strictly preferred. This is a contradiction. Dominance supplies law invariance. Separately, without Totality, weak preservation plus cancellation forces the original pair incomparable. All constructions, identities, and direction uses are proved in the write-up.
