notes: |-
  The original theorem and two-pair mechanism are credited to the AI proof communicated by Fitelson, who is the communicator, not the proof producer or checker. The small-prize witness, three-background certificate, and direction audit are the present simplification. No independent checking or Lean verification is claimed. Rich Outcomes makes all displayed real gambles available; Simple EU supplies the one finite equal-mean indifference. No CDF-area assumption, symmetry, independent-sum principle, or continuity is used. Separate cancellation is unnecessary for the stated totality contradiction because Preservation here includes its strict clause. The write-up does not claim that weak preservation alone, or cancellation alone, is inconsistent with DTU. This result refutes the existing silver total comonotonic extension candidate by closure.
