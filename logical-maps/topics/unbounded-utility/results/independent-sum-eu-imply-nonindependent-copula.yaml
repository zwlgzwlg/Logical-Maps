proof: |-
  Put f=1_[1/4,1/2)-1_[1/2,3/4), and choose once the copula with density c(u,v)=1+f(u)f(v)/2. Its density is positive and its marginals uniform; it is not the product copula. For any two real laws mu,nu, the difference between their C-sum and independent-sum laws is the pushforward under (u,v) -> Q_mu(u)+Q_nu(v) of the signed measure f(u)f(v)du dv/2. It is supported in a bounded interval, since the density difference vanishes outside the interior square, and has mass and first moment zero, since integral f=0. If two probability laws differ by such a measure, its normalized positive and negative Jordan parts are bounded equal-mean laws and are indifferent by Expected Utility. Adding their common residual law by Mixture Independence proves the original laws indifferent. Thus every C-sum is indifferent to its independent counterpart. Stochastic Equivalence transfers these comparisons to actual pairs admitting C, and Independent Sum Invariance proves SC(C). Rich Outcomes supplies all required real realizations. The write-up also proves that the product is nevertheless the unique copula whose sum operation commutes with all mixtures.
