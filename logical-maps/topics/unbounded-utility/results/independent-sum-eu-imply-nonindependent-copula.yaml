notes: |-
  This gives a family of nonindependent copulas compatible with the proved total independent-sum extension, so a counterexample recipe for every nonindependent copula is impossible. No Totality or dominance is needed for this implication. Expected Utility is used for bounded Jordan-part laws and is not silently replaced by Simple EU or the DU preset. The argument changes laws by an exactly zero-mean bounded signed measure; it does not subtract divergent expectations of the original gambles.
