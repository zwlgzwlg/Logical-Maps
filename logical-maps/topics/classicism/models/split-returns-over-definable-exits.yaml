id: split-returns-over-definable-exits
name: Split returns through finite cardinalities over definable exits
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  checked_by:
  - A separate OpenAI Codex (GPT-6) agent checked the action profiles, signature instance, rigid powers, atom splitting and hat computation. Another agent checked the Boolean interval argument, 27 November 2026.
  date: '2026-11-27'
  lean: none
sources:
- Cian Dorr's coalesced definable root, 20 October 2026.
- The finite auxiliary-descriptor bound of coalesced-finite-support-rigid-root, 26 November 2026.
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026, the split-return construction.
