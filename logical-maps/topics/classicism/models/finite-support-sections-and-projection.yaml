definition: >-
  An ideally full finitely pinned action model over a two-object category. $W_0$ has individuals
  $\mathbb N$ and $W_1$ has individuals $\mathbb N\times\{0,1\}$. The arrows are the identity of
  $W_0$ (the only arrow $W_0\to W_0$); the sections $f_T(n)=(n,T(n))$ for every $T:\mathbb
  N\to\{0,1\}$, from $W_0$ to $W_1$; the projection $\pi(n,i)=n$ from $W_1$ to $W_0$; and the
  identity of $W_1$ with the retractions $e_T:=f_T\circ\pi$ from $W_1$ to itself. They compose
  by $\pi\circ f_T=1$, $e_T\circ f_U=f_T$, $e_T\circ e_U=e_T$ and $\pi\circ e_T=\pi$. The
  evaluation point is the identity of $W_0$; every world reachable from it can return to it
  through $\pi$.

# 3 October 2026: met for the topic's general argument intensional-choice-well-ordering.
meets:
  codomain-intensions: >-
    The model is ideally full at both objects, and an intension whose value at an arrow depends
    only on the arrow's codomain is pinned down by $\emptyset$ (Appendix D, the remark after
    Definition D.3).
  metatheory-choice: The construction is carried out in ZFC (Appendix D).

