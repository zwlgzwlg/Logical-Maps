notes: >-
  Found on 27 September 2026 in answer to Cian Dorr's question whether Actuality implies
  Inextensible Comprehension, after the observation that Christopher Sun's witness $\lambda\bar
  z\, .\,\Diamond(w\land F\bar z)$ can fail only at worlds from which the actual world is
  reachable, and only through entities there that are not the images of actual ones. The
  write-up also records a sufficient condition for Inextensible Comprehension in models of this
  kind, which explains why every earlier model with Actuality satisfies it. Checked informally
  by Cian Dorr and Christopher Sun the same day.

  Actuality and □Actuality hold, but Inextensible Comprehension fails at type $e\to t$ for the
  universal property: an inextensible property coextensive with it would have to hold, at the
  world $f_T$, of exactly the range of $f_T$, and no finite set of individuals pins that down.

  BF fails, as it must by BF and Actuality ⇒ Inextensible Comprehension: the property holding at
  the identity of everything and at $f_T$ of everything except $(0,1-T(0))$ is pinned down by
  $\{0\}$ and necessary of every individual, but it is not necessarily universal.
