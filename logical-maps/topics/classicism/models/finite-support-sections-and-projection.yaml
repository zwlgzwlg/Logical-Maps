- holds:
  - tame-rigidity-r
  - necessary-tame-rigidity-r
  choice: free
  by: Claude Opus 5.5 (Anthropic), on Cian Dorr's request to settle Tame Rigidity where it was open
  date: '2026-10-09'
  text: 'Write a relation $Y$ at an object as its intension over the arrows $g$ out of it, $Y\bar a$ holding
    at $g$ iff $g\cdot\bar a\in Y_g$, so that $(h\cdot Y)_g=Y_{gh}$. Since the model is ideally full,
    for $E$ the extension at the identity the intension $B_N(E)_g:=\bigcup\{g^{\prime} \cdot E:g^{\prime}\text{
    agrees with }g\text{ on }N\text{ and has its codomain}\}$ is in the domain, and weak inextensibility
    says exactly $Y\subseteq B_N(E)$ for every finite $N$; rigidity is weak rigidity at every world. At
    $W_0$, a weakly rigid $Y$ has $Y_1=E$ and $f_T\cdot E\subseteq Y_{f_T}\subseteq\bigcup\{f_{T''}\cdot
    E:T''\text{ agrees with }T\text{ on }N\}$ for each $N$. At the world $f_T$, with $E_T:=Y_{f_T}$: persistence
    holds since $\pi f_{T''}=1$ and $e_Uf_{T''}=f_U$; inextensibility along $\pi$ asks $E\subseteq\pi\cdot
    E_T$, true as $\pi f_T=1$, and along $e_U$ asks $Y_{f_U}\subseteq\bigcup\{e_{U''}\cdot E_T:U''\text{
    agrees with }U\text{ on }N\}$, true because $Y_{f_U}$ lies in $\bigcup\{f_{U''}\cdot E\}$ over the
    same $U''$ and $f_{U''}\cdot E=e_{U''}\cdot(f_T\cdot E)$. So Tame Rigidity holds at $W_0$. At $W_1$,
    whose worlds are $\pi$, $1$ and the $e_U$: for $Y$ weakly rigid with extension $E$ there, $Y_\pi=\pi\cdot
    E$ (the only arrow to $W_0$ is $\pi$), and a member $x$ of $Y_{e_V}$ lies, for each $N$ containing
    a point off the graph of $V$, in $\bigcup\{e_{V''}\cdot E\}$ over the $V''$ agreeing with $V$ on the
    projection of $N$. Hence at the world $\pi$, where the intension is $1\mapsto Y_\pi$, $f_T\mapsto
    Y_{e_T}$, inextensibility holds, as $f_{T''}\cdot\pi\cdot E=e_{T''}\cdot E$; and at the world $e_U$,
    $x\in Y_{e_V}$ is $e_{V''}\cdot e=e_{V''}\cdot(e_U\cdot e)$ with $e_U\cdot e\in Y_{e_U}$, while $\pi\cdot
    Y_{e_U}=\pi\cdot E$ and $e_V\cdot Y_{e_U}\subseteq Y_{e_V}$ give persistence. So Tame Rigidity holds
    at $W_1$ as well, hence at every world.'
- id: barcan-t
  fails:
  - barcan-t
  choice: free
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request to settle BF at the relational types
  date: '2026-10-11'
  text: 'At $W_0$. The proposition $q:=\{1_{W_1}\}$ is in the domain at $W_1$ (it is pinned down by $\{(0,0),(0,1)\}$,
    as for identity-singletons). It is the transport $f_T\cdot p=\{k:k\circ f_T\in p\}$ of no proposition
    $p$ at $W_0$: since $1\circ f_T=f_T$, $\pi\circ f_T=1_{W_0}$ and $e_U\circ f_T=f_U$, that would need
    $p$ to contain $f_T$ and no other $f_U$, and no finite set of points pins such a $p$ down, infinitely
    many $f_U$ agreeing with $f_T$ on any finite set. So the property $X$ that holds of every proposition
    at arrows into $W_0$ and of every proposition other than $q$ at arrows into $W_1$, pinned down by
    $\emptyset$ since it depends only on the codomain, satisfies $\forall p\, .\,\Box Xp$ at $W_0$, while
    after any $f_T$ it fails of $q$.'
- id: rigid-power
  holds:
  - necessary-rigid-power-r
  by: GPT-6 Astra (OpenAI), at Cian Dorr's request; checked and recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: 'Boxed Rigid Power: every weakly rigid relation is $T(E)$ ($h\mapsto hE$) and every $T(A)$ below
    a rigid one is admitted, so rigid subrelations lift exactly. Criterion (1) is part (1) of tame-rigidity-factorizable,
    which holds with several objects.

    (a) Weakly rigid relations are exact images. At $W_0$, with $E:=F_1$: by (1) a member $x$ of $F_{f_T}$
    is $f_Ua$ with $a\in E$ and $U$ agreeing with $T$ on a finite $N$ containing $\pi M$, $M$ pinning
    $x$ down. Then $e_Ux=e_Uf_Ua=x$; $e_U$ and $e_T$ agree on $M$, so $e_Tx=x$; and $\pi x=a$; so $x=e_Tx=f_T\pi
    x=f_Ta$. So $F_{f_T}=f_TE$. At $W_1$, $F_\pi=\pi E$, $\pi$ being the only arrow to $W_0$; for $x\in
    F_{e_T}$ take $N$ containing a pin of $F$, a pin of $x$ and a whole fibre of $\pi$, which no arrow
    agreeing with $e_T$ on $N$ can be the identity; (1) gives $x=e_Ua$ with $a\in E$, and as before $x=e_Tx=f_T\pi
    a=e_Ta$.

    (b) Subsets are admitted. Let $F=T(E)$ be rigid at $W_0$, pinned down by $S$. If $U,V$ agree on $S$,
    $f_UE=f_VE$; for $a\in E$ pick $b$ with $f_Ua=f_Vb$ and apply $\pi$: $a=b$. So $f_Ua=f_Va$ for each
    $a\in E$, and $T(A)$ is pinned down by $S$ for every $A\subseteq E$. At $W_1$, with a fibre of $\pi$
    in $S$ (so the identity agrees with no retraction on $S$), $e_UE=e_VE$ gives $e_Ua=e_Vb$ with $\pi
    a=\pi b$, so $e_Ua=f_V\pi a=e_Va$.

    (c) For a rigid $F=T(E)$ at either object, an arrow $h$ and a rigid $X\le h\cdot F$ with extension
    $D$, $A:=\{a\in E:ha\in D\}$ gives a rigid $T(A)\le F$ with $h\cdot T(A)=X$. So the power property
    of $F$ is the exact image of its extension, and rigid. Rigid Power holds at both objects, hence at
    every world.'
- id: collapse-split
  holds:
  - necessary-truth-implies-five-necessity
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'At $W_0$ the actual-world proposition $\{1_{W_0}\}$ is in the domain (the sections have the other
    target), so $\Box_{\ne}p$ iff $p\supseteq\Diamond\{1_{W_0}\}$, which is every arrow out of $W_0$,
    since $\pi\circ f_T=1$: $\Box_{\ne}=\Box$ there. But $\hat\Diamond\{1_{W_0}\}$ contains no section:
    the only retraction of $f_T$ is $\pi$, and $\pi$ cannot return to the truth $\mathrm{fix}_{\{(n,0),(n,1)\}}=\{1_{W_1}\}$
    at $W_1$, since $f_U\circ\pi=e_U\ne1_{W_1}$. So $\hat{\hat\Box}$ is the identity operator at $W_0$,
    $\{1_{W_0}\}$ is two-hat necessary and not ND-necessary, and every truth is two-hat necessary, hence
    5-necessary. At $W_1$ the same holds: $\{1_{W_1}\}$ is in the domain, no arrow out of $W_1$ other
    than the identity has a retraction ($f_U\circ\pi=e_U$ and $j\circ e_T=e_T$ or $\pi$), so $\Box_{\ne}$
    is already the identity there. (The verdicts this argument also establishes but does not record are
    derived by the engine.)'
- fails:
  - countable-boolean-completeness-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    At $\sigma=e$, $\tau=e\to t$. Boolean Completeness fails here by the chain Actuality + Boolean
    Completeness ⇒ Weak Rigid Comprehension, Tame Rigidity + Weak Rigid Comprehension ⇒ Rigid
    Comprehension ⇒ Inextensible Comprehension, each step taken for one property $X$, and the first
    uses Boolean Completeness only for the property $H$ of being the haecceity of an instance of $X$.
    For the witness $X=\top_e$ at $W_0$ the instances are the individuals $\mathbb N$; the numerals at
    $e$ are standard there and pairwise distinct, and extensional fullness at $W_0$ puts in the domain
    $H$ and the relation pairing the haecceity of $n$ with the $n$-th numeral. So $H$ is countable
    relative to $e$, and a least upper bound of it would give, with Actuality and Tame Rigidity, an
    inextensible coextension of $\top_e$, which the recorded argument excludes.
- fails:
  - plenitude-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  text: >-
    At $\sigma=e$, $\tau=t$. Let $Z_n:=\{f_T:T(n+1)=0\}$, a proposition at $W_0$ pinned down by
    $\{n+1\}$, and let $U$ hold at the identity of exactly the pairs $\langle n,Z_n\rangle$ and at no
    arrow into $W_1$: an intension depending only on the codomain, so pinned down by $\emptyset$ and in
    the domain, and functional at the identity. Suppose $X$ of type $e\to t$, pinned down by a finite
    $N$, has $Xn=Z_n$ for every $n$. Take $n$ with $n,n+1\notin N$, and $T,T^{\prime}$ differing only at
    $n+1$, with $T(n+1)=0$. Then $f_T$ and $f_{T^{\prime}}$ agree on $N\cup\{n\}$, so $X_{f_T}=
    X_{f_{T^{\prime}}}$ and both contain $f_T(n)=f_{T^{\prime}}(n)$ or neither: $Xn$ is true at both or
    at neither, while $Z_n$ is true at $f_T$ and not at $f_{T^{\prime}}$.
- fails: [analytic-necessitism]
  withdrawn:
    date: '2026-10-29'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after a trawl subagent's report
    reason: >-
      The step from the equality of transports to membership in the carrier by inextensibility does not
      follow: inextensibility bounds a rigid carrier from above, by the transports of its actual
      instances, and puts nothing new into its actual extension.
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: >-
    At $W_0$, at type $tt$. The propositions at $W_0$ are countably infinite, a set of sections
    belonging to one according to the restrictions of their functions $T$ to some finite set, with
    the identity free; so the entities of type $tt$ at $W_0$ assigning any set of them to the
    identity and nothing to the sections, pinned down by $\{0\}$, are continuum many, and with the
    intensions for the order, sum, product and natural numbers of the reals carried over, pinned
    down in the same way, they form a real number structure of type $tt$ at $W_0$, complete since
    every subset of its carrier is the extension of a subproperty. Suppose $\mathfrak R$ were a
    rigid one, necessarily a real number structure, with carrier $X$, and let $f:=f_T$ for the zero
    function $T$. Its boxed clauses hold at $f$ and along the arrows after it, and $X_f$, its
    instances at $W_1$, is a complete ordered field there. But no entity $x$ of type $tt$ at $W_1$
    is determined by its transport along $\pi$: the singleton of the identity of $W_1$ is pinned
    down by $\{(0,0),(0,1)\}$, the identity being the only arrow out of $W_1$ that separates them,
    and no arrow after $\pi$ is the identity, so the entity $y$ agreeing with $x$ except at the
    identity, where the top proposition is added or removed, is in the domain, differs from $x$, and
    has $\pi\cdot y=\pi\cdot x$; for $x\in X_f$ persistence gives $\pi\cdot y\in X_{\pi\circ f}$,
    inextensibility $y\in X_f$, and necessary distinctness $\pi\cdot y\ne\pi\cdot x$. So $X_f$ is
    empty, a contradiction, and Analytic Necessitism fails.
- id: necessity-of-arithmetic
  holds: [necessity-of-arithmetic]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    Both objects are extensionally full with infinitely many individuals and propositions, so at each
    the numbers at every type are the distinct numerals with standard sum and product, and an
    arithmetical sentence holds at every world iff it is true.
- id: boolean-completeness-t
  fails: [boolean-completeness-t, forcing-possibilism]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, in a trawl for cheaply settled verdicts; checked by Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    The propositions at $W_0$ are $\{1_{W_0}\}$ or not together with a clopen set of sections. Let $a_m$
    be the sections $f_T$ with $T$ zero below $m$ and $T(m)=1$; an upper bound of the $a_{2m}$ pinned
    down by $\{0,\ldots,k-1\}$ contains every $f_T$ with $T$ zero below $k$, hence some $a_{2m+1}$,
    whose removal leaves a smaller upper bound. And $\{1_{W_0}\}$ is the only atom, so no proposition
    has exactly four below it, though $\bot$, $\{1_{W_0}\}$, its negation and $\top$ form a complete
    four-element algebra.
notes: Found on 27 September 2026 in answer to Cian Dorr's question whether Actuality implies Inextensible
  Comprehension, after the observation that Christopher Sun's witness $\lambda\bar z\, .\,\Diamond(w\land
  F\bar z)$ can fail only at worlds from which the actual world is reachable, and only through entities
  there that are not the images of actual ones. The write-up also records a sufficient condition for Inextensible
  Comprehension in models of this kind, which explains why every earlier model with Actuality satisfies
  it. Checked informally by Cian Dorr and Christopher Sun the same day.
