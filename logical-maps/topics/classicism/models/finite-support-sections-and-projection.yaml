group: finite-support-two-object
settings: {}
definition: An ideally full finitely pinned action model over a two-object category. $W_0$ has individuals
  $\mathbb N$ and $W_1$ has individuals $\mathbb N\times\{0,1\}$. The arrows are the identity of $W_0$
  (the only arrow $W_0\to W_0$); the sections $f_T(n)=(n,T(n))$ for every $T:\mathbb N\to\{0,1\}$, from
  $W_0$ to $W_1$; the projection $\pi(n,i)=n$ from $W_1$ to $W_0$; and the identity of $W_1$ with the
  retractions $e_T:=f_T\circ\pi$ from $W_1$ to itself. They compose by $\pi\circ f_T=1$, $e_T\circ f_U=f_T$,
  $e_T\circ e_U=e_T$ and $\pi\circ e_T=\pi$. The evaluation point is the identity of $W_0$; every world
  reachable from it can return to it through $\pi$.
meets:
  extensionally-full: >-
    At $W_0$ the identity is the only arrow into $W_0$, so an intension with any value at the identity
    and $\varnothing$ at the sections is pinned down by $\varnothing$; at $W_1$ the identity is the only
    arrow agreeing with the identity on a fibre of $\pi$, so the same holds with that fibre as pin.
  infinitely-many-individuals: >-
    The individuals at $W_0$ are the natural numbers.
  infinitely-many-propositions: >-
    The propositions $\{f_T:T(n)=0\}$ are pairwise distinct.
  full-continuum-everywhere: >-
    The domains contain every intension whose value depends only on the arrow's codomain, and there are
    infinitely many propositions at $W_0$ and at $W_1$. So the intensions of type $tt$ with value an
    arbitrary set of propositions at each codomain are continuum many, and every set of tuples of them is
    the extension at the object of the intension, again depending only on the codomain, whose value at an
    arrow is the set of the tuples' transports along it.
  finitely-pinned-domains: >-
    Ideally full with the ideal of finite sets at both objects: every intension pinned down by a
    finite set is in the domain, and every entity in a domain is one.
  codomain-intensions: The model is ideally full at both objects, and an intension whose value at an arrow
    depends only on the arrow's codomain is pinned down by $\emptyset$ (Appendix D, the remark after Definition
    D.3).
  identity-singletons: $\{1_{W_0}\}$ is pinned down by $\emptyset$, the identity being the only arrow
    from $W_0$ to $W_0$, and $\{1_{W_1}\}$ by $\{(0,0),(0,1)\}$, which no $e_T$ fixes pointwise (see the
    write-up, on Actuality).
  unique-retractions-everywhere: Out of $W_0$, the identity has only itself as retraction and each section
    $f_T$ only $\pi$, the one arrow back. Out of $W_1$, the identity has only itself; $\pi$ has none,
    since $f_T\circ\pi=e_T\ne1$; and no $e_T$ has one, since $e_T$ is not injective.
  retractions: The arrows out of $W_0$ are its identity and the sections $f_T$, each retracted by $\pi$.
arguments:
- holds:
  - necessary-atoms-are-self-atoms-r
  - necessary-atoms-are-strong-atoms-r
  - necessary-self-atoms-are-atoms-r
  - necessary-self-atoms-are-strong-atoms-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At $W_0$ the propositions over the sections $f_T$ are pinned down by finite sets and refine (two
    sections agreeing with $f_T$ on $N$ disagree at a point outside $N$), so no atom contains a section;
    $\{1_{W_0}\}$ is pinned down by $\varnothing$, its transport along every $f_T$ being $\{\pi\}$, and
    is the only atom. At $W_1$ likewise no atom contains $1_{W_1}$ or any $e_T$, and $\{\pi\}$ is the
    only atom. Each is a self-atom and a strong atom: $\{1_{W_0}\}$ becomes $\{\pi\}$ under $f_T$, and
    $\{\pi\}$ becomes $\{1_{W_0}\}$ under $\pi$ and $\{\pi\}$ under $e_T$, sets of at most one arrow.
    No self-atom contains a section or an $e_T$ or $1_{W_1}$, since its transport along that arrow would
    be an atom containing $1_{W_1}$; so the self-atoms are the two atoms. An atom or self-atom of a relational
    type has an atom, respectively self-atom, as its existential projection, so sits over $1_{W_0}$ or
    $\pi$ with one tuple; it is then an atom and a strong atom, its transports having at most one pair.
    So all four bridge principles hold at both objects, at every type.'
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      The original argument incorrectly excludes the identity singleton at W1, despite its
      admission by the identity-singletons clause. At W1 the atoms include both identity/tuple
      and projection/tuple singletons. Identity singletons become bottom under every nonidentity
      arrow, so they are strong and do not invalidate the four bridge verdicts. The appended
      Identity-singleton correction (30 October 2026) in the writeup gives the corrected
      all-type atom/self-atom classification and transports. The original text is preserved.
