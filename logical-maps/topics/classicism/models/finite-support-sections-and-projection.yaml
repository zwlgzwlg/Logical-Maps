- fails: [inextensible-comprehension-r]
  writeup: finite-support-sections-and-projection
  text: >-
    At type $e\to t$ for the universal property: an inextensible property coextensive with it
    would have to hold, at the world $f_T$, of exactly the range of $f_T$, and no finite set of
    individuals pins that down. See the write-up.

# migration: the old notes without their sentence on BF, now derived.
- fails: [atomicity-t]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  text: >-
    The proposition $\{f_T : T(0)=0\}$, pinned down by $\{0\}$, has no atom below it. A nonempty
    proposition below it pinned down by a finite $N$ contains every section agreeing on $N$ with
    one of its members, and the propositions pinned down by $N\cup\{m\}$, for $m\notin N$, split
    that set by the value $T(m)$.

- holds: [tame-rigidity-r, necessary-tame-rigidity-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), on Cian Dorr's request to settle Tame Rigidity where it was open
  date: '2026-10-09'
  text: >-
    Write a relation $Y$ at an object as its intension over the arrows $g$ out of it, $Y\bar a$
    holding at $g$ iff $g\cdot\bar a\in Y_g$, so that $(h\cdot Y)_g=Y_{gh}$. Since the model is
    ideally full, for $E$ the extension at the identity the intension $B_N(E)_g:=\bigcup\{g^{\prime}
    \cdot E:g^{\prime}\text{ agrees with }g\text{ on }N\text{ and has its codomain}\}$ is in the
    domain, and weak inextensibility says exactly $Y\subseteq B_N(E)$ for every finite $N$;
    rigidity is weak rigidity at every world. At $W_0$, a weakly rigid $Y$ has $Y_1=E$ and
    $f_T\cdot E\subseteq Y_{f_T}\subseteq\bigcup\{f_{T'}\cdot E:T'\text{ agrees with }T\text{ on
    }N\}$ for each $N$. At the world $f_T$, with $E_T:=Y_{f_T}$: persistence holds since
    $\pi f_{T'}=1$ and $e_Uf_{T'}=f_U$; inextensibility along $\pi$ asks $E\subseteq\pi\cdot E_T$,
    true as $\pi f_T=1$, and along $e_U$ asks $Y_{f_U}\subseteq\bigcup\{e_{U'}\cdot E_T:U'\text{
    agrees with }U\text{ on }N\}$, true because $Y_{f_U}$ lies in $\bigcup\{f_{U'}\cdot E\}$ over the
    same $U'$ and $f_{U'}\cdot E=e_{U'}\cdot(f_T\cdot E)$. So Tame Rigidity holds at $W_0$. At $W_1$,
    whose worlds are $\pi$, $1$ and the $e_U$: for $Y$ weakly rigid with extension $E$ there,
    $Y_\pi=\pi\cdot E$ (the only arrow to $W_0$ is $\pi$), and a member $x$ of $Y_{e_V}$ lies, for
    each $N$ containing a point off the graph of $V$, in $\bigcup\{e_{V'}\cdot E\}$ over the $V'$
    agreeing with $V$ on the projection of $N$. Hence at the world $\pi$, where the intension is
    $1\mapsto Y_\pi$, $f_T\mapsto Y_{e_T}$, inextensibility holds, as $f_{T'}\cdot\pi\cdot
    E=e_{T'}\cdot E$; and at the world $e_U$, $x\in Y_{e_V}$ is $e_{V'}\cdot e=e_{V'}\cdot(e_U\cdot
    e)$ with $e_U\cdot e\in Y_{e_U}$, while $\pi\cdot Y_{e_U}=\pi\cdot E$ and $e_V\cdot
    Y_{e_U}\subseteq Y_{e_V}$ give persistence. So Tame Rigidity holds at $W_1$ as well, hence at
    every world.

notes: >-
  Found on 27 September 2026 in answer to Cian Dorr's question whether Actuality implies
  Inextensible Comprehension, after the observation that Christopher Sun's witness $\lambda\bar
  z\, .\,\Diamond(w\land F\bar z)$ can fail only at worlds from which the actual world is
  reachable, and only through entities there that are not the images of actual ones. The
  write-up also records a sufficient condition for Inextensible Comprehension in models of this
  kind, which explains why every earlier model with Actuality satisfies it. Checked informally
  by Cian Dorr and Christopher Sun the same day.
