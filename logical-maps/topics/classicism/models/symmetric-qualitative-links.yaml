# --- from the source (19 Sep record) ---

- holds: [boolean-completeness-r]
  text: >-
    By the draft's main theorem in its closure-operation form: the constant closure operations do
    not work here, and the operation used instead adds to a finite set the point coordinates of
    its members and then both companions of each of its points.

- fails: [rigid-comprehension-r]
  when: {individuals: base}  # proved at type $e$ (3 October: the one-individual variant leaves it open)
  text: >-
    At type e. The property of being related to the distinguished pair is persistent and finitely
    pinned, and it is shown to be the only candidate coextensive with itself. But at a world
    collapsing the pair, its extension shrinks to a two-element fibre, and the union of the two
    haecceities of that fibre is persistent with the same extension there while being strictly
    stronger, because some arrow merges the two companions. So the rigidity criterion fails at
    that world.

# --- later additions ---

- fails: [atomicity-t]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    Confirming the draft's unwritten claim, by the splitting argument it indicates. The
    proposition $C:=\{h : h0=h1\}$ of the collapsing arrows is nonzero, symmetric and pinned down
    by $\{0,1\}$. Suppose $q\le C$ is nonzero and pinned down by a finite $N$, and take $h\in q$.
    Enlarge $N$ to its closure in the draft's sense, which includes $0$ and $1$, and choose a
    point $m$ outside it. The draft's extension step (proof of its Proposition 50) extends any
    $R$-coherent prescription on a closed finite set that merges $0$ with $1$ to a collapsing
    arrow. So there are arrows $k_1,k_2$ agreeing with $h$ on $N$ with $k_1m=k_1 0$ and $k_2m\ne
    k_2 0$: prescribe $h$ on the closure of $N$, send $m$ to $h0$ or to a fresh point, and send
    its companions to companions of its image. Both lie in $q$. The proposition $\{k : km=k0\}$ is
    symmetric and pinned down by $\{0,m\}$, and it contains $k_1$ but not $k_2$, so $q$ is not an
    atom. So nothing below $C$ is an atom. With No Pure Contingency, □Atomicity fails too, as the
    recorded implication from □Atomicity, Boolean Completeness and BF to Rigid Comprehension
    requires, BF being now established.

# migration: the old notes' paragraphs that no argument holds, verbatim, with the old description's
# sentence on the type-$e$ instance of BF, a principle the map does not list, as the second. The
