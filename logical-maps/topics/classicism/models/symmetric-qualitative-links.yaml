# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ, in which "described above" becomes ", the symmetry group", the Actuality witness of the
# argument below.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object whose individuals carry
    qualitative structure. The domain is the disjoint union of points, of two companions for each
    point, and of infinitely many links for each ordered pair of distinct points. A ternary relation
    holds of two points and a third individual when that individual is a link over the two if they
    differ, and a companion of them if they coincide, so the relation's fibres are infinite over
    distinct points and of size two over a repeated point. The arrows are required to preserve that
    relation. The symmetry group is the relation-preserving permutations that fix a distinguished
    pair of points setwise, and the remaining arrows are the surjective relation-preserving maps
    that collapse that pair. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\emptyset$, and for $N$ the property of being a link not in $N$ (links are carried to links
    by every member of the symmetry group, whose inverse is again $R$-preserving): a chosen $y$ is a
    link $\langle m,n,k\rangle$, and its transposition with a link $\langle m,n,k'\rangle\notin N$,
    which exists since the fibre is infinite, preserves $R$ and fixes every point, so lies in the
    symmetry group.
  separable-collapses: >-
    The pairs $\{0,m\}$ for points $m$ other than the distinguished pair $0,1$: by the draft's
    extension step (proof of its Proposition 50), an $R$-coherent prescription on a closed finite set
    containing $0$, $1$, $m$ and $m'$ that merges $0$, $1$ and $m$ but not $m'$ extends to a
    collapsing arrow, as in the record's argument for the failure of Atomicity (type t).
  surjective-arrows: The arrows are relation-preserving permutations and surjective relation-preserving maps.
  symmetry-group-pinned: >-
    Membership in the symmetry group is the condition that the distinguished pair is not collapsed,
    so the group is pinned down by that pair.
  actual-world-isolated: >-
    The actual-world proposition is the symmetry group, pinned down by the distinguished pair; under
    a collapsing arrow $i$, a composite $k\circ i$ would have to be a permutation, and no composite
    with a map that collapses the distinguished pair is injective.
  actuality-contingent: >-
    The actual-world proposition, the symmetry group, is in the domain; at every world a collapsing
    arrow leads outside it, and a collapsing arrow carries it to the empty set.
  irreversible-arrow: >-
    A collapsing arrow: no composite with it is injective.
  finite-pinning: Every object carries the ideal of finite sets.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
