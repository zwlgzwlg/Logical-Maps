  - signature-b-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Corrected the reason given for the failures of Independence (signature Σ) and Distinctness
    (signature Σ): the true atom is denoted by no closed pure term, since such terms denote entities fixed
    by every arrow; the failures come from the other relational constants, which denote top. No verdict
    changes.'
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Recorded the failure of Relational Choice, at types (e→t) and e: a functional subrelation
    of the serial relation pairing each property with its members would be symmetric and finitely pinned,
    and a symmetry fixing its pinning set would carry its choice for the property of lying outside that
    set to a second choice. Cian Dorr’s observation that a choice cannot be finitely pinned; argument
    in the notes.'
  violates:
  - relational-choice-r
- date: '2026-09-25'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Recorded the Distinctness-preserving collapse by the argument used for the other symmetric
    models. Let $a$ be the symmetry group, the model’s Actuality witness, so $a\le p$ for every true
    $p$. Take $q:=a$: under an arrow $i$ in the group, $p$ holds since $i\in a\subseteq p$; under a
    collapsing arrow $i$, $\Diamond a$ would need $k\circ i$ to be a permutation, and no composite with
    a map that collapses the distinguished pair is injective. So every truth is $\Box_{\ne}$-necessary.'
  satisfies:
  - distinctness-preserving-collapse
- date: '2026-09-27'
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  summary: 'Recorded BF at every type, by pulling any finitely pinned symmetric entity back along a surjective
    arrow, and the failure of Atomicity at type t, by splitting any finitely pinned proposition below the
    collapsers on whether a fresh point is merged with 0. Replaces the note that left both unknown.'
  satisfies:
  - barcan-r
  violates:
  - atomicity-t
