group: symmetric-ideally-full
settings:
  construction: >-
    A symmetric ideally-full intensional action model over two objects, $E$ and $O$, with individuals
    $\mathbb N$ at $E$ and $\mathbb N\sqcup\mathbb N'$ at $O$, $\mathbb N'$ a disjoint copy of
    $\mathbb N$; members of $\mathbb N$ at $O$ are old, members of $\mathbb N'$ new. The arrows are
    injections: from $E$ to $E$ all injections of $\mathbb N$; from $E$ to $O$ the injections with
    range among the old individuals; from $O$ to $E$ all injections into $\mathbb N$; from $O$ to $O$
    the permutations preserving old and new ($G_O$) and the injections with range among the old
    ($K$). The symmetry groups are all permutations of $\mathbb N$ at $E$ and $G_O$ at $O$, and both
    objects carry the ideal of finite sets. The evaluation point is the identity arrow on $E$.
  individuals: base
  sigma: top
meets:
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$, at $E$, where the domain is
    symmetric and finitely pinned: the transposition of $y$ with another individual of $E$ outside
    $N$ lies in its symmetry group.
  finitely-many-propositions: >-
    $E$ has four propositions: each set of arrows from $E$ to one object is a single class under
    symmetry and finite pinning, a finite partial injection extending to a symmetry.
  finitely-many-propositions-everywhere: >-
    $E$ has four propositions and $O$ eight, generated by the arrows into $E$, $G_O$ and $K$, the
    last two separated by whether the arrow sends a given new individual to a new one.

arguments:

- holds: [necessary-strong-actuality]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    At $E$ the arrows to $E$ form a true strong world: along an arrow to $E$ it becomes itself, along
    an arrow to $O$ the set of arrows from $O$ to $E$, an atom. At $O$, $G_O$ is one: along a member
    of $G_O$ it becomes itself, along a member of $K$ or an arrow to $E$ the empty set. Both objects
    are reachable from $E$.

- holds: [distinctness-necessary-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    Every arrow $f$ out of $E$ is finitely invertible: for any arrow $h$ out of $E$ and finite $N$,
    some arrow $k$ after $f$ has $k\circ f$ agreeing with $h$ on $N$. So entities that differ at a
    tuple $\langle\bar a,h\rangle$ differ, after $f$, at $\langle\bar a,k\rangle$, by pinning; and
    arrows are injective on individuals.

- holds: [necessary-atomicity-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    At both objects every relational type is atomic. The entities pinned down by a finite $M$ form
    the complete atomic algebra whose atoms are the orbits of the tuples $\langle\bar a,h\rangle$
    with $h$ restricted to $M$; such an orbit stays an atom for every larger $M$ once $h(M)$
    contains every individual in the arguments' pinning sets that an arrow of $h$'s kind can reach.
    Any nonzero entity contains such a tuple, after moving $h$ on fresh points. See the write-up.

- fails: [inextensible-comprehension-r]
  when: {individuals: base}
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction, correcting the argument given by
    Claude Fable 5.1
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    For the universal property of individuals at $E$. A coextensive $Y$ holds of everything at every
    arrow to $E$, by symmetry and pinning; inextensibility at $E$, with the property of being old,
    keeps the new individuals out of $Y$ at the inclusion $\iota:E\to O$. At $\iota$ every $Y$-thing
    is necessarily distinct from $0'$, yet after any arrow $m:O\to E$, $Y$ holds of $m(0')$; so $Y$
    is not weakly inextensible at $\iota$.

- fails: [strong-leibniz-t]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    The arrows from $E$ to $O$ form a possible proposition whose only nonzero part is itself, and
    along the inclusion $\iota$ it becomes $G_O\cup K$, which $G_O$ splits; so no strong world lies
    below it. (The map derives the failures of BF and of □ND at $t$; the write-up also gives them
    directly.)

- holds: [necessary-boolean-completeness-t]
  fails: [infinity-t]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  text: >-
    The propositions at $E$ are four and those at $O$ eight, finite Boolean algebras, so complete;
    and there are not five pairwise distinct propositions at $E$.

- fails: [boolean-completeness-r]
  when: {individuals: base}
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: >-
    The haecceities of the even numbers have no least upper bound: one pinned down by $N$ would,
    by a symmetry fixing $N$, hold at the identity of an odd $m\notin N$, while the property of
    differing from the image of $m$ is an upper bound that does not.

- holds: [necessary-boolean-completeness-r, necessary-rigid-comprehension-r]
  when: {individuals: singleton}
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-07'
  writeup: symmetric-old-new-individuals
  text: >-
    With one individual every entity is fixed by every symmetry, and is a union of finitely many
    classes, one for each kind of arrow (to $E$, from $E$ to $O$, in $G_O$, in $K$) and tuple of
    arguments; by induction on types, so every domain is finite and complete. Transport along an
    arrow then depends only on its kind, and the kind of a composite on the kinds of its factors,
    so the intension whose extension at $h$ is $X$'s extension at the identity transported along $h$
    is a union of classes, in the domain; it is persistent and inextensible, at both objects.

notes: >-
  Found by Claude Fable 5.1 as a countermodel to a principle from another context, and recorded at
  Cian Dorr's request on 6 October 2026. Like the sections-and-projection model it has □Actuality
  without Inextensible Comprehension; unlike it, it has Atomicity at every type, and so separates
  Atomicity and Actuality, even with ND and □Strong Actuality, from Inextensible Comprehension. Its
  actual world at $E$ is the set of all arrows from $E$ to $E$, which properly contains the identity,
  so it does not meet the group's condition symmetry-group-pinned. No Lean verification is claimed.
