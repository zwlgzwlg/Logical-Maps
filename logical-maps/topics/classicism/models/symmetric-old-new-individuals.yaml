notes: Found by Claude Fable 5.1 as a countermodel to a principle from another context, and recorded at
  Cian Dorr's request on 6 October 2026. Like the sections-and-projection model it has □Actuality without
  Inextensible Comprehension; unlike it, it has Atomicity at every type, and so separates Atomicity and
  Actuality, even with ND and □Strong Actuality, from Inextensible Comprehension. Its actual world at
  $E$ is the set of all arrows from $E$ to $E$, which properly contains the identity, so it does not meet
  the group's condition symmetry-group-pinned. No Lean verification is claimed.
