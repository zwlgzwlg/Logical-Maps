  note: The symmetric ideally-full models, of which this is one, on a new two-object category.
group: symmetric-ideally-full
settings:
  construction: 'A symmetric ideally-full intensional action model over two objects, $E$ and $O$, with
    individuals $\mathbb N$ at $E$ and $\mathbb N\sqcup\mathbb N''$ at $O$, $\mathbb N''$ a disjoint copy
    of $\mathbb N$; members of $\mathbb N$ at $O$ are old, members of $\mathbb N''$ new. The arrows are
    injections: from $E$ to $E$ all injections of $\mathbb N$; from $E$ to $O$ the injections with range
    among the old individuals; from $O$ to $E$ all injections into $\mathbb N$; from $O$ to $O$ the permutations
    preserving old and new ($G_O$) and the injections with range among the old ($K$). The symmetry groups
    are all permutations of $\mathbb N$ at $E$ and $G_O$ at $O$, and both objects carry the ideal of finite
    sets. The evaluation point is the identity arrow on $E$.'
  individuals: base
  sigma: top
meets:
  infinitely-many-orbits-everywhere:
    when: {individuals: base}
    text: >-
      At $E$ and at $O$, the only objects, the properties of being one of a finite set of individuals lie in
      infinitely many orbits under the symmetry group, which preserves the size of the set.
  finitely-pinned-domains: >-
    Both objects carry the ideal of finite sets: the domains hold every symmetric intension pinned
    down by a finite set, and every entity in them is one.
  transposable: '$M=\emptyset$, and for $N$ the property of not belonging to $N$, at $E$, where the domain
    is symmetric and finitely pinned: the transposition of $y$ with another individual of $E$ outside
    $N$ lies in its symmetry group.'
  finitely-many-propositions: '$E$ has four propositions: each set of arrows from $E$ to one object is
    a single class under symmetry and finite pinning, a finite partial injection extending to a symmetry.'
  finitely-many-propositions-everywhere: $E$ has four propositions and $O$ eight, generated by the arrows
    into $E$, $G_O$ and $K$, the last two separated by whether the arrow sends a given new individual
    to a new one.
arguments:
- id: singleton-necessary-transversal-choice
  when: {individuals: singleton}
  holds: [necessary-transversal-choice-r]
  by: OpenAI Codex, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: free
  writeup: symmetric-singleton-relational-choice
  text: >-
    At both objects every type domain is finite and every designated symmetry
    acts trivially. Inductively, finitely pinned intensions are constant on each
    arrow kind: a target symmetry matches any two arrows of that kind on their
    finite pinning set. At E there are two outgoing kinds; at O there are three,
    and composition preserves kinds. Each intension is therefore a finite list
    of subsets of finite tuple domains, and source symmetries fix that list.
    For an actual equivalence relation choose one element from each of its
    finitely many cells and represent the transversal by a finite disjunction
    of equalities. This works at every admitted type at both E and O, proving
    boxed Transversal Choice. Boxed Relational Choice is derived from the
    existing boxed TC-to-RC theorem and is not duplicated here. Original proof:
    OpenAI Codex, prompted by Daniel Kodsi, singleton applications §3,
    22 October 2026, unpaginated; direct source misc. Only finite choice is used.

- holds:
  - necessary-self-atoms-are-atoms-r
  - necessary-self-atoms-are-strong-atoms-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At $E$ the only symmetric propositions over the arrows $E\to E$ are empty or everything, any
    two injections of $\mathbb N$ agreeing on a finite set up to a permutation; so the set of all arrows
    $E\to E$ is the atom containing $1_E$. At $O$ the symmetry group $G_O$ is pinned down by any new individual,
    since an injection into the old individuals cannot agree with a permutation preserving old and new
    at it, and is the atom containing $1_O$. No self-atom at $E$ contains an arrow $f$ into $O$: its transport
    along $f$ would be $G_O$, but an injection $m$ into the old individuals fixing $f(N)$ pointwise, for
    $N$ pinning the self-atom, is not in $G_O$ and carries $f$ to an arrow agreeing with it on $N$. So
    the self-atoms at $E$ sit over the atom of all arrows $E\to E$, and are atoms; at $O$, likewise, no
    self-atom contains an injection into the old individuals, and the symmetric pinned propositions over
    the arrows $O\to E$ are empty or everything, so the self-atoms there are $G_O$ and the set of all
    arrows $O\to E$, both atoms. Each is a strong atom: the atom at $E$ is the recorded true strong atom;
    $G_O$ becomes empty under an injection into the old individuals and under an arrow to $E$; the set
    of all arrows $O\to E$ becomes itself under an arrow $O\to O$ and the set of all arrows $E\to E$ under
    an arrow to $E$, atoms. At relational types a self-atom sits over one of these as the orbit of a single
    pair, an atom and a strong atom. So both principles hold at both objects, at every type.'
- holds:
  - necessary-strong-actuality
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: 'At $E$ the arrows to $E$ form a true strong atom: along an arrow to $E$ it becomes itself, along
    an arrow to $O$ the set of arrows from $O$ to $E$, an atom. At $O$, $G_O$ is one: along a member of
    $G_O$ it becomes itself, along a member of $K$ or an arrow to $E$ the empty set. Both objects are
    reachable from $E$.'
- holds:
  - distinctness-necessary-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: 'Every arrow $f$ out of $E$ is finitely invertible: for any arrow $h$ out of $E$ and finite $N$,
    some arrow $k$ after $f$ has $k\circ f$ agreeing with $h$ on $N$. So entities that differ at a tuple
    $\langle\bar a,h\rangle$ differ, after $f$, at $\langle\bar a,k\rangle$, by pinning; and arrows are
    injective on individuals.'
- holds:
  - necessary-atomicity-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: At both objects every relational type is atomic. The entities pinned down by a finite $M$ form
    the complete atomic algebra whose atoms are the orbits of the tuples $\langle\bar a,h\rangle$ with
    $h$ restricted to $M$; such an orbit stays an atom for every larger $M$ once $h(M)$ contains every
    individual in the arguments' pinning sets that an arrow of $h$'s kind can reach. Any nonzero entity
    contains such a tuple, after moving $h$ on fresh points. See the write-up.
- fails:
  - inextensible-comprehension-r
  when:
    individuals: base
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction, correcting the argument given by Claude Fable
    5.1
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: For the universal property of individuals at $E$. A coextensive $Y$ holds of everything at every
    arrow to $E$, by symmetry and pinning; inextensibility at $E$, with the property of being old, keeps
    the new individuals out of $Y$ at the inclusion $\iota:E\to O$. At $\iota$ every $Y$-thing is necessarily
    distinct from $0'$, yet after any arrow $m:O\to E$, $Y$ holds of $m(0')$; so $Y$ is not weakly inextensible
    at $\iota$.
- fails:
  - strong-atomicity-t
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: The arrows from $E$ to $O$ form a possible proposition whose only nonzero part is itself, and
    along the inclusion $\iota$ it becomes $G_O\cup K$, which $G_O$ splits; so no strong atom lies below
    it. (The map derives the failures of BF and of □ND at $t$; the write-up also gives them directly.)
- holds:
  - necessary-boolean-completeness-t
  fails:
  - infinity-t
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  text: The propositions at $E$ are four and those at $O$ eight, finite Boolean algebras, so complete;
    and there are not five pairwise distinct propositions at $E$.
- fails:
  - boolean-completeness-r
  when:
    individuals: base
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-06'
  writeup: symmetric-old-new-individuals
  text: 'The haecceities of the even numbers have no least upper bound: one pinned down by $N$ would,
    by a symmetry fixing $N$, hold at the identity of an odd $m\notin N$, while the property of differing
    from the image of $m$ is an upper bound that does not.'
  withdrawn:
    date: '2026-10-24'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after GPT-6 Astra (OpenAI), prompted by Daniel Kodsi
    reason: The haecceities of the even numbers are not a property in the model, since the set of even numbers
      is invariant under no group of symmetries fixing a finite set; Boolean Completeness holds at $E$ (argument
      boolean-completeness-root).
- id: boolean-completeness-root
  holds:
  - boolean-completeness-r
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi; checked and recorded by Claude Opus 5.5 (Anthropic),
    prompted by Cian Dorr
  date: '2026-10-24'
  writeup: symmetric-old-new-individuals
  text: 'At $E$, every relational type. An entity $F$ pinned down by a finite $S$ is determined by the pair
    $(F_{1_E},F_\iota)$, $\iota$ the inclusion into the old individuals, invariant under the symmetries fixing
    $S$ and $\iota S$; every such pair is an entity, and the order is componentwise inclusion. For a property
    pinned down by $N$, the componentwise unions of its instances are invariant under the symmetries fixing
    $N$, and the second under all permutations of the new individuals, so they form an entity, the least
    upper bound.'
- id: boolean-completeness-fails-at-o
  fails:
  - necessary-boolean-completeness-r
  when:
    individuals: base
  by: GPT-6 Astra (OpenAI), prompted by Daniel Kodsi; checked and recorded by Claude Opus 5.5 (Anthropic),
    prompted by Cian Dorr
  date: '2026-10-24'
  writeup: symmetric-old-new-individuals
  text: 'At $O$, at $e\to t$: the haecceities of the old individuals, a property pinned down by $\emptyset$,
    have no least upper bound. If $L$, pinned down by $S$, were one, take an old $n\notin S$, a new $m\notin S$
    and $h:O\to E$, and $h''$ agreeing with $h$ on $S$ with $h''(n)=h(m)$; then $L_h$ contains $h(m)$, which
    the upper bound $\lambda y\, .\,y\ne m$ omits.'
- holds:
  - necessary-boolean-completeness-r
  - necessary-rigid-comprehension-r
  when:
    individuals: singleton
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-07'
  writeup: symmetric-old-new-individuals
  text: With one individual every entity is fixed by every symmetry, and is a union of finitely many classes,
    one for each kind of arrow (to $E$, from $E$ to $O$, in $G_O$, in $K$) and tuple of arguments; by
    induction on types, so every domain is finite and complete. Transport along an arrow then depends
    only on its kind, and the kind of a composite on the kinds of its factors, so the intension whose
    extension at $h$ is $X$'s extension at the identity transported along $h$ is a union of classes, in
    the domain; it is persistent and inextensible, at both objects.
- id: rigid-power
  holds:
  - necessary-rigid-power-r
  by: GPT-6 Astra (OpenAI), at Cian Dorr's request; checked and recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: 'Boxed Rigid Power, for either choice of individuals. Arrows are injective; at $E$ the symmetry
    group is all permutations, at $O$ those preserving old and new; the arrows out of $O$ other than symmetries
    (exiting arrows) go to $E$ or have old range.

    (a) At $E$, a rigid $F$ pinned down by $S$ has every tuple of its extension pinned down by $S$. Each
    tuple has a least finite support under the permutations. Suppose $z\in F_1$ has a point $n\notin S$
    in it. Let $i:E\to O$ be the inclusion into the old individuals, $b$ a new point, and $r:O\to E$ an
    injection with $rb=n$ and $ri$ fixing $S$; so $z\in F_{ri}$. Every tuple of $F_i$ is pinned down by
    old points (it is $lz^{\prime}$ for an arrow $l:E\to O$, of old range). By the weak inextensibility
    of $i\cdot F$ at $O$, tested on $B_Q(F_i)$ with $Q\ni b$ containing $iS$ (part (1) of tame-rigidity-factorizable,
    which holds with several objects), $z=r^{\prime}z^{\prime\prime}$ for an $r^{\prime}$ agreeing with
    $r$ on $Q$ and $z^{\prime\prime}\in F_i$ pinned down by old points $M$; then $z$ is pinned down by
    $r^{\prime}M$, which omits $n=r^{\prime}b$ by injectivity, contradicting the least support. Support
    by $S$ then gives pinning by $S$, through injections agreeing on $S$ factored through permutations
    fixing $S$.

    (b) So $X_0(A)$ ($k\mapsto kA$) is in the domain and rigid for every $A\subseteq F_1$, and $F=X_0(F_1)$.
    For an arrow $h$ and rigid $X\le h\cdot F$ with extension $D$, the tuples of $D\subseteq hF_1$ are
    pinned down by $hS$, so $X=X_0(D)$, and $X=h\cdot X_0(A)$ for $A:=\{z\in F_1:hz\in D\}$. So the power
    property is $X_0$ of its extension, and rigid.

    (c) At $O$: let $F$ be rigid, pinned down by $S$ containing a new point. Composing with a bijection
    $O\to E$ and (a), each exiting arrow $h$ acts on the tuples of $F_1$ through $h|_S$, and $F_1$ is
    invariant under the symmetries fixing $S$; a symmetry and an exiting arrow cannot agree on $S$. So
    $F=X_0(F_1)$, and (b) goes through for exiting arrows, symmetries being lifted by their inverses.
    Rigid Power holds at both objects, hence at every world.'
- id: tame-rigidity
  fails:
  - tame-rigidity-r
  when:
    individuals: base
  by: GPT-6 Astra (OpenAI), at Cian Dorr's request; checked and recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: Let $U$ hold of every individual at arrows into $E$ and of exactly the old individuals at arrows
    into $O$. It is symmetric, pinned down by $\emptyset$, and equal to $B_N$ of its extension for every
    finite $N$, so weakly rigid. At the inclusion $i:E\to O$ its extension is the old individuals, each
    necessarily distinct from a new individual $b$, all arrows being injective; but after any arrow $m:O\to
    E$ the transported relation holds of $mb$. So $i\cdot U$ is not weakly inextensible, $U$ is not rigid,
    and Tame Rigidity fails at type $e$.
- id: collapse-split
  fails:
  - two-hat-implies-nd-necessity
  holds:
  - necessary-truth-implies-five-necessity
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-10-14'
  text: 'At $E$ the four propositions are determined by the target, and the strong atom $a$ is the set
    of arrows $E\to E$. $\Diamond a$ is every arrow out of $E$, since an injection $E\to O$ with old range
    is followed by an injection $O\to E$, so $\Box_{\ne}=\Box$ at $E$. But $\hat\Diamond a$ contains no
    arrow $u:E\to O$: its retractions $v:O\to E$ cannot return to the truth $G_O$ at $O$, because any
    $x:E\to O$ has old range and $x\circ v\in K$. So $\hat{\hat\Box}$ at $E$ is the box over $a$; $a$
    is two-hat necessary and not ND-necessary, and every truth ($\top$ and $a$) is two-hat necessary.
    At $O$, with strong atom $G_O$, $\hat\Diamond G_O=G_O$ (a member of $K$ or an arrow to $E$ cannot
    be brought back into $G_O$), so every truth at $O$, each containing $G_O$, is two-hat necessary. With
    necessary Strong Actuality, $\Box_5=\hat{\hat\Box}$ everywhere, so every truth is 5-necessary at both
    objects.'
- holds:
  - countable-boolean-completeness-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  writeup: symmetric-old-new-individuals
  text: >-
    At $E$, for every $\sigma$. If $R$ injects $X$ into the numerals at $\sigma$, with $N$ a finite
    set pinning both, then each instance of $X$ is fixed by every symmetry fixing $N$ pointwise: the
    symmetry carries the pair of the instance and its numeral to another such pair, and the numeral
    is fixed. An entity pinned down by $M$ and fixed by those symmetries is pinned down by $M\cap N$.
    So the instances of $X$ are all pinned down by $N$, and their union is in the domain and is the
    least upper bound. The haecceities of the even numbers, which have none, are not countable in
    the model. See the write-up.
  revisions:
  - date: '2026-10-24'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: The remark about the haecceities of the even numbers is moot. They are not a property in the model
      at all, and Boolean Completeness holds at $E$ (boolean-completeness-root).
- holds:
  - necessary-countable-boolean-completeness-r
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-16'
  choice: free
  writeup: symmetric-old-new-individuals
  text: >-
    The argument for Countable Boolean Completeness at $E$ also works at $O$, the other object
    reachable from $E$, once a new individual $0'$ is put into the finite set $N$: arrows into $O$
    that agree on $0'$ are both in $G_O$ or both in $K$, and within each kind the construction of the
    intermediate arrow goes through, with the fresh points chosen of the same sort. So every closed
    instance holds at both objects, hence necessarily. See the write-up.
