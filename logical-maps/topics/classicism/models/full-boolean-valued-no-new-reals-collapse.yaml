id: full-boolean-valued-no-new-reals-collapse
name: Full Boolean-valued model with a no-new-reals collapse
definition: Inside a countable M satisfying ZFC+not-CH, let kappa=2^omega and A be the regular-open completion
  of the forcing of countable partial functions omega_1→kappa. Put B=2×A and use the internally full relational
  hierarchy with D_e=omega^M. Externalize standard finite types and evaluate at the isolated atom (first-coordinate
  truth). Necessity is the global top test and identities are crisp. The forcing adds no reals, preserves
  omega_1 and makes CH true. The writeup specifies all-type capacity and field transfer without assuming
  M transitive.
