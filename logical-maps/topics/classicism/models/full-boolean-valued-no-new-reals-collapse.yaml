arguments:
- id: boolean-core
  holds:
  - necessary-distinctness-necessary-r
  - necessary-relational-choice-r
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-no-new-reals-collapse
  text: Crisp identity and top-test necessity give C5. Internal well-ordering disjointifies each relation
    row, making the full relational-choice schema and its box top. This uses the Boolean-model
    proof, displayed in the writeup.
- id: rigid-real-field-at-every-possible-carrier
  holds:
  - analytic-necessitism
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-no-new-reals-collapse
  text: The forcing has a ground-continuum antichain, so B injects into every non-e carrier by constant
    functions. Endpoint-valued copies of the ground real field are rigid; no new reals makes them complete
    for every new bounded relation. At e the real-field antecedent is impossible. Writeup §§2–5.
- id: ground-and-forcing-ch-disagree
  fails:
  - non-contingency-of-ch
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-no-new-reals-collapse
  text: Ground not-CH and forced CH give universal CH and universal not-CH values (0,1) and (1,0) at t.
    Neither is top, so neither necessary disjunct holds. Writeup §6; the direct unary represented-power
    obstruction is also included.
notes: Relative consistency upper bound from Con(ZFC); no countable transitive-model or large-cardinal
  assumption. A distinct forcing variant from the existing full-boolean-valued-atom-and-atomless record.
  Necessary BF and failure of SOAN are derived and are not duplicated as explicit flags.
