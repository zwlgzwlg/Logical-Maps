group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
settings:
  monoid: >-
    Proposition D.5, part 6 (p. 78): the arrows are the identity and the truncations $g_n$,
    $g_nm=\min\{m,n\}$, which compose as $g_n\circ g_m=g_{\min\{n,m\}}$.
  sigma: top

meets:
  uniformly-pinned-rigidity: >-
    An intension is pinned down by $[0,s]$ iff it is constant on $\{g_n:n\ge s\}\cup\{1\}$. Weak
    inextensibility at the identity, tested with $[0,s']$ for $s'>n$, where $g_n$ is the only arrow
    with its germ, forces $Y(g_n)=g_n\cdot Y(1)$ for every $n$; and $k\mapsto k\cdot E$ is in the
    domain iff $g_n\cdot E=E$ for all large $n$, which, as $g_n\cdot E\subseteq\operatorname{Pin}([0,n])$,
    holds iff $E\subseteq\operatorname{Pin}([0,n_0])$ for some $n_0$.
  arrows-finitely-determined: >-
    Each $g_n$ is the only arrow with $g_n(n+1)=n$, so $\{g_n\}$ is pinned down by $\{n+1\}$.
  evens-avoidable: >-
    With $N_0\subseteq[0,M_0]$: $i:=g_n$ with $n\ge M_0$, an even $b>n$, and $N^{\prime}:=[0,n+1]$:
    the only arrow agreeing with $g_n$ on $[0,n+1]$ is $g_n$ itself, whose range $[0,n]$ omits $b$.
  pinned-atoms: >-
    Every nonempty proposition contains some $g_n$, and each $\{g_n\}$ is pinned down by a finite
    set ($\{n-1,n,n+1\}$ for $n>0$, $\{0,1\}$ for $n=0$).
  unbounded-haecceities: >-
    With $A:=\mathbb N$: the strongest persistent property with extension $\mathbb N$ pinned down
    by $\{0,\ldots,n\}$ becomes ever stronger.
  no-least-pinned-cover: >-
    Let $F$ be the family of singletons $\{g_n\}$ for even $n$. A superset of $\bigcup F$ pinned
    down by $\{0,\ldots,N\}$ contains, with any $g_m$ for $m\ge N$, every arrow agreeing with it on
    $\{0,\ldots,N\}$, so the least one is $\bigcup F\cup\{1_{\mathbb N}\}\cup\{g_m : m\ge N\}$,
    which strictly shrinks as $N$ grows.

arguments:

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. What follows is this record's own.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.

- id: actuality
  fails: [actuality]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(6), p. 78'}
  text: >-
    The strongest true proposition pinned down by $\{0,\ldots,n\}$ is
    $\{1_{\mathbb N}\}\cup\{g_m:m\ge n\}$, ever stronger as $n$ grows.

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true proposition $p$ pinned down by a finite set take as the witness $q$ the strongest
    true proposition pinned down by $\{0,\ldots,N\}$ for $N$ beyond the pinning set of $p$,
    namely $\{1_{\mathbb N}\}\cup\{g_m:m\ge N\}$. Under $g_n$ the only arrows reachable are
    $g_m$ with $m\le n$, so $\Diamond q$ holds at $g_n$ only if $n\ge N$, and then $g_n$ agrees
    with the identity on the pinning set of $p$ and is in $p$.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them. Even the universal property has no
  inextensible coextension, since $\operatorname{Inextensible}(\top_{et})$ unfolds to $\Box$BF at
  type $e$.

was_conjectured: true
