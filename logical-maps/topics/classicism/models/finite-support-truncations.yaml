id: finite-support-truncations
name: 'Finite-support action model: truncations of N'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
  # migration: the 6 KB `trawl` block moves verbatim to provenance/trawl-0329824a975f4e67bb50fc3e7a3e20b9.yaml.
  # It concerned the review argument for Strong Leibniz (type t) and BF (type t), dropped once both
  # verdicts were derived; the sidecar keeps the trawl's provenance.
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, Proposition D.5, part 6, pp.
  74, 78; p. 79 (No Pure Contingency).
- DeepSeek (deepseek-flash), Classicism theorem trawl, 25 September 2026; mathematically reviewed and
  corrected by OpenAI Codex (GPT-6), 25 September 2026. Accepted additions only; original construction
