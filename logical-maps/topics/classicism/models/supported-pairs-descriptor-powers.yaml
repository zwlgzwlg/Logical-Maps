id: supported-pairs-descriptor-powers
name: 'Coalesced sum: supported pairs with finite descriptor support for weakly rigid bounds'
certificate:
  source_id: misc
  produced_by: OpenAI GPT-6, prompted by Daniel Kodsi, 27 November 2026
  recorded_by: OpenAI GPT-6, prompted by Daniel Kodsi, 27 November 2026
  checked_by: []
  date: '2026-11-27'
  lean: none
sources:
- OpenAI GPT-6, prompted by Daniel Kodsi, original construction and independent AI review, 27 November 2026.
- The finite descriptor support construction of 26 November 2026 and the swappable-pairs Henkin model of 26 October 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.6 and Appendix E.
source_names:
- GPT-6 27 Nov
- GPT-6 26 Nov and Astra 26 Oct
