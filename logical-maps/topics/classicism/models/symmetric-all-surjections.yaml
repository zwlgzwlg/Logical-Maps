group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. The
# interpretation's "one fixed individual $d$" lost its "$d$", which the No Contingency (signature Σ)
# argument, now a general one, names itself.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; the individuals were the base already.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its arrows are all the surjections of that set, and its symmetry group is all the
    permutations. A relational domain holds exactly the intensions that are symmetric, meaning
    indifferent to relabelling the individuals of a world, and pinned down by some finite set. The
    evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$: the transposition of $y$ with
    another individual outside $N$ is a permutation, so lies in the symmetry group.
  surjective-arrows: The arrows are all the surjections of $\mathbb N$.
  homogeneous-individuals: >-
    Every permutation of $\mathbb N$ is in the symmetry group, and relabelling by it is an
    automorphism of the model, carrying each individual to its image.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
