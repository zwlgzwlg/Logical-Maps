id: interpretation-cover-surjective-chain-names
name: 'Interpretation cover: surjective chain names'
definition: In ZFC retain a set-sized family of pointed C action models witnessing every pure C-consistent
  closed sentence, with all old domains and arrows unchanged. For each admitted type sigma choose an infinite
  name cardinal kappa_sigma sufficient for the prescribed set-sized free-constant signature and let C_sigma={sigma}×kappa_sigma×N.
  Add a root whose individuals are C_e and whose loops preserve every name chain and act on it by a nondecreasing
  surjection N→N. Include every typed interpretation of names into each old object; there are no old-to-root
  arrows. Root designated symmetry is trivial. At every relational type admit exactly all finite-typed-pin
  profiles, evaluated on full target argument domains, whose entire section at every old interpretation is
  an admitted old entity. Transport is precomposition. Relational constants denote singleton-pinned named lifts
  with empty root rows and their assigned whole old sections; individual constants denote their designated
  names. Evaluate at root identity.
