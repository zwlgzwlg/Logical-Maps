# migration: the definition is the old description without its verdict sentences.
definition: >-
  Take the full Henkin models $M_n$ with individual domain $\{1,\ldots,n\}$ for every $n\ge1$, and
  add a root world. Individuals are threads $(a_n)_n$ with $a_n\in\{1,\ldots,n\}$; propositions
  are sets of worlds; an entity of a function type is a family of $M_n$-entities together with an
  arbitrary root component defined on whole threads. Application is componentwise, identity at
  world $n$ is the identity of $M_n$ and at the root is identity of elements. Every theorem of C
  holds at every world. Evaluation point: the root.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- as first recorded (20 Sep) ---

- holds: [axiom-of-infinity-e, axiom-of-infinity-t]
  text: >-
    At the root the finite cardinalities are the numerals, the $k$-th numeral's successor holds of
    the universal property at world $k+1$, and $\Diamond$ at the root is truth at some world, so
    the sentence that there could be any positive number of individuals, used in
    pure-possibility-implies-axiom-of-infinity-t, holds there. The root has uncountably many
    individuals and infinitely many propositions, so both Axioms of Infinity hold there.

- fails: [distinctness-necessary-r]
  text: >-
    Two threads that agree at some world are distinct but possibly identical, so ND fails at type
    $e$.

# --- later additions ---

- id: sigma-top
  fails: [witnessed-possibility-r, independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.
    Everything that implies these fails with them.

- holds: [barcan-r]
  # migration: the arguments of 22 September before it in the old notes, for Actuality and their
  # lead-in "Further facts:", and after it, for the failures of No Pure Contingency and Possibility
  # Maximalism (pure), all now derived, are dropped.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    An entity of a relational type there is a family of component entities with a free root
    component, every component entity is the component of some root entity, so if $\forall y\,
    .\,\Box Xy$ holds at the root then every component of $X$ is universal and so is its root
    component, whence $\Box\forall y\, .\,Xy$; BF holds at the one-world components trivially, so
    $\Box$BF holds.

- holds: [necessary-strong-leibniz-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    At the root, the singleton of the arrow to component $n$ becomes that component’s identity
    under it and empty under every other arrow, and the root proposition becomes empty under every
    non-identity arrow, so every singleton is a strong world; the components are one-world models.

- id: free-root-component
  holds: [atomicity-t, boolean-completeness-t, relational-choice-r]
  # migration: the argument after it in the old notes, for the failure of Possibility+ (pure), now
  # derived, is dropped.
  # Recorded although the other verdicts give them: the □Relational Choice argument builds on this
  # one.
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    Here the components are full Henkin models, so every set of arrows is a root proposition: the
    root propositions form a complete atomic algebra, giving Atomicity and Boolean Completeness at
    type t, and Relational Choice holds at the root by a functional choice in the free root
    component.

- holds: [necessary-relational-choice-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    Relational Choice holds at the root by the free root component and at every component, each
    being a full Henkin model.

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Let $a$ be the proposition true at the actual world alone (the identity arrow). For any true
    $p$, take $q:=a$ in the definition of $\Box_{\ne}p$: under a non-identity arrow $i$, $\Diamond
    a$ would need an arrow $k$ with $k\circ i$ the identity, and none exists, since the components
    have no arrows to the root; under the identity, $p$ holds. So every truth is
    $\Box_{\ne}$-necessary, although ND fails.

- holds: [necessary-rigid-comprehension-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    At a type $\sigma\to t$ a root entity is a pair $(G_0,(G_n)_n)$ with $G_0$ any function on the
    root domain and $G_n$ in the full domain of $M_n$; entailment is componentwise. Atomicity:
    below a nonzero $G$ lies the atom that is true at the root of one argument $a$ with $G_0(a)=1$
    and bottom in every component, or, if $G_0=0$, the atom that is bottom at the root and in all
    but one component $M_n$, where it is an atom of that full model below $G_n$. Both kinds of
    atom are strong worlds: at the root they entail every entity or its negation, being singletons
    in one coordinate and bottom elsewhere, and their shifts to the components are bottom or atoms
    of a one-world full model. So the Strong Leibniz Biconditionals hold at every type. Boolean
    Completeness: the componentwise meet of any set of root entities is a root entity and is the
    greatest lower bound. Rigid Comprehension: given $X$ with root extension $E$, let $Y$ have
    root component $X_0$ and, in $M_n$, the projection of $E$ to the $n$-th coordinates; $Y$ is
    persistent, since a root instance has its projection in every component, and inextensible,
    since a relation necessary of every root instance contains those projections, while in the
    one-world components persistence and inextensibility are automatic. Each component is a full
    Henkin model, in which all of these hold, so the boxed forms hold at the root; Countable
    Boolean Completeness, the weak rigid comprehension principles and Necessity of Arithmetic
    follow by the recorded results.

- fails: [pure-b-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The pure sentence that there are two individuals is true at the root and false at the first
    component, from which no arrow returns.

- holds: [necessary-rigid-comprehension-r]
  # migration: "Review of 25 September 2026." becomes `date`; `by` condenses the record's third
  # source. A second, independent argument for the same verdict.
  by: DeepSeek (deepseek-flash), trawl; reviewed and corrected by OpenAI Codex (GPT-6)
  date: '2026-09-25'
  writeup: coalesced-all-finite-individual-domains
  provenance: admission-c0a37bbe6b6c45cc985428b174812564
  text: >-
    The appended handwritten verification establishes necessary Atomicity, necessary Boolean
    Completeness and necessary Rigid Comprehension at every relational type. The existing rules
    derive the unboxed and Strong Leibniz consequences. These are additions for this particular
    full-Henkin-component construction; they do not apply to arbitrary coalesced sums.

