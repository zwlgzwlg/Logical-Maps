notes: >-
  Recorded to witness the consistency with C of the sentence through which Possibility
  Maximalism (pure) reaches the Axiom of Infinity at type $t$, and of that Axiom itself. The
  construction and its verification are in the write-up; no independent check is claimed.

  Interpretation of Σ, fixed for this record: each relational constant denotes the top element
  of its type and each individual constant denotes one fixed individual. Further facts: the root
  proposition, true at the root alone, is an atom entailing every root truth, so Actuality
  holds. BF holds at the root: an entity of a relational type there is a family of component
  entities with a free root component, every component entity is the component of some root
  entity, so if $\forall y\, .\,\Box Xy$ holds at the root then every component of $X$ is
  universal and so is its root component, whence $\Box\forall y\, .\,Xy$; BF holds at the
  one-world components trivially, so $\Box$BF holds. No Pure Contingency fails, since the pure
  sentence that there are at least two individuals is true at the root and false at the first
  component. Possibility Maximalism (pure) fails, since Atomlessness is consistent with C but
  false at every world: each component is a one-world model and the root proposition is an atom.
  The type-t Strong Leibniz Biconditionals hold necessarily: at the root, the singleton of the
  arrow to component $n$ becomes that component’s identity under it and empty under every other
  arrow, and the root proposition becomes empty under every non-identity arrow, so every
  singleton is a strong world; the components are one-world models. Possibility+ (pure) fails:
  the component with three individuals has three at its only world; take two root individuals
  that differ at that component and agree everywhere else; the pure formula saying that $x\ne y$
  and there are exactly two individuals is consistent, but at the root there are infinitely many
  individuals, under every arrow into another component the two collapse, and under the arrow
  into that component there are three.

