# migration: the definition is the old description without its verdict sentences.
group: coalesced-sums
# migration (2 October): the old definition is the group's, completed by these settings.
settings:
  # migration: the old definition's sentences in the old order, except that the clause on domains
  # ("propositions are sets of worlds; an entity of a function type is ...") is the `domains` slot,
  # which the group's definition places last.
  construction: >-
    Take the full Henkin models $M_n$ with individual domain $\{1,\ldots,n\}$ for every $n\ge1$, and
    add a root world. Individuals are threads $(a_n)_n$ with $a_n\in\{1,\ldots,n\}$. Application is
    componentwise, identity at world $n$ is the identity of $M_n$ and at the root is identity of
    elements. Every theorem of C holds at every world. Evaluation point: the root.
  domains:
    text: >-
      Propositions are sets of worlds; an entity of a function type is a family of $M_n$-entities
      together with an arbitrary root component defined on whole threads.
# migration (3 October): the interpretation of Σ has no individual constants, as the topic's condition
# sigma-top now says (Cian Dorr's decision); it read "and each individual constant denotes one
# fixed individual".
# migration (2 October): the interpretation of Σ that the change of 22 September fixed (see
# `history`), stated in the definition, as every record's is. (Moved out of the definition's text
# on 3 October, where YAML had read it as part of the definition.)
definition: >-
  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
  denotes the top element of its type.
meets:
  free-root-component: An entity of a function type has an arbitrary root component defined on whole threads.
  sigma-top: This is the interpretation the definition fixes.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another coalesced sum is now a shared argument of the group
