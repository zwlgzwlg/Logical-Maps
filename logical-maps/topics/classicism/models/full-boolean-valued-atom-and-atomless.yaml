notes: >-
  Full verification is in the write-up.

  The source uses an infinite individual domain and a particular regular-open algebra for its
  analysis of the continuum hypothesis. Neither feature is needed for this counterexample; the
  recorded specialization requires only ZFC. For an extensionally full model in ZFC, Relational
  Choice follows by representing a set-theoretic functional subrelation, and Plenitude then
  gives Functional Choice. The qualitative-contrast model of Classicism does not meet this
  fullness condition: its finite-support and symmetry restrictions exclude the needed selector.
  In the present model, $R(p,q):=(p\land q=\top)\lor(\neg p\land q=\bot)$ has Seriality and
  Functionality of value $1_B$, but $\exists f\,\forall p\,R(p,f(p))$ has value exactly $a$. The
  write-up includes the atomless-component calculation and the comparison with the older model.
  The finite check tests the Boolean calculation, not the infinite construction.

  Actuality and the type-$t,t$ instances of Plenitude and Functional Choice have Boolean value
  exactly $a$, so their boxed forms fail.

