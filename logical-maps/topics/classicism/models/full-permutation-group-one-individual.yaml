# migration: the definition is the old description up to its verdict sentences, then the notes'
# interpretation of Σ.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. Its
# text ("$a$ is the singleton of the identity arrow, the unique true atom; ... Σ being assumed to
# contain at least one; and every individual constant denotes the sole individual") said the same
# as the group's, which the topic's condition sigma-true-atom spells out.
settings:
  construction: >-
    The full one-object action model whose arrows are all the permutations of a countably infinite
    set, as in the record for the natural action, but with a single individual, fixed by every
    arrow. Propositions are all sets of arrows with the division action and every function type
    carries all functions. Evaluate at the identity arrow.
  sigma: true-atom
meets:
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: >-
    It has one object.
  one-individual: >-
    There is a single individual, fixed by every arrow, at the sole object.
  homogeneous-individuals: There is only one individual.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another full action model is now one of the topic's general
# arguments (arguments/), reached through the group full-action-models and this record's `meets`;
# what follows is this record's own. Only the verdicts the engine needs to derive the rest are
# recorded, the source's first.

- holds: [axiom-of-infinity-t, functional-choice-r]
  text: >-
    The modal logic of propositions is S5 with the arrows as worlds, every arrow acts bijectively
    at every type, and fullness gives the necessitated lattice, comprehension and choice
    principles as in the natural-action record; the propositions are infinite while there is
    exactly one individual at every arrow.

- holds: [modal-freedom-signature-r]
  when: {sigma: true-atom}
  text: >-
    The two tuples of constants are disjoint, so one of the two sentences contains no designated
    constant and denotes a fixed point, hence the empty set or the set of all arrows; if it is
    possible it is the latter, and the conjunction is as possible as the other conjunct.

# migration: the old notes' first and last sentences and the old description's last, verbatim. The
# notes' sentences on Converse Witnessed Possibility, the Fregean Axiom, Extensionality, the
# Distinctness-preserving collapse and Distinctness Maximalism (pure), all now derived, are dropped.
notes: >-
  Full proofs are in the write-up, which records the differences from the natural-action model.
  The model witnesses the joint consistency of $\Box$ND, the Axiom of Infinity at type $t$ and
  $\Box$Relational Choice with there being one individual. Suggested by Cian Dorr on 23 September
  2026.
