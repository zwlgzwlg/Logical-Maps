# migration: the definition is the old description up to its verdict sentences, then the notes'
# interpretation of Σ.
definition: >-
  The full one-object action model whose arrows are all the permutations of a countably infinite
  set, as in the record for the natural action, but with a single individual, fixed by every
  arrow. Propositions are all sets of arrows with the division action and every function type
  carries all functions. Evaluate at the identity arrow.


  Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
  $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the singleton of the identity
  arrow, the unique true atom; every other relational constant denotes the top element of its
  type, Σ being assumed to contain at least one; and every individual constant denotes the sole
  individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

- holds: [axiom-of-infinity-t, functional-choice-r]
  text: >-
    The modal logic of propositions is S5 with the arrows as worlds, every arrow acts bijectively
    at every type, and fullness gives the necessitated lattice, comprehension and choice
    principles as in the natural-action record; the propositions are infinite while there is
    exactly one individual at every arrow.

- fails: [no-contingency-signature-r, independence-signature-r]
  text: >-
    No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes
    $a$, true and not the set of all arrows; B for sentences of Σ holds by B. Witnessed
    Possibility fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since
    $c=\top_\tau$ is false at every arrow, $\lambda\bar x\, .\,a$ differing from $\lambda\bar x\,
    .\,\top$ and identity being uniform; Separated Structure, Distinctness Maximalism (signature
    Σ), Possibility Maximalism (signature Σ) and Logical Necessity fail with it. Independence
    (signature Σ) fails through the other relational constants, which denote closed pure terms;
    $\lambda\bar x\, .\,a$ itself is denoted by no closed pure term, since such terms denote
    entities fixed by every arrow and $a$ is fixed only by the identity.

- holds: [modal-freedom-signature-r]
  text: >-
    The two tuples of constants are disjoint, so one of the two sentences contains no designated
    constant and denotes a fixed point, hence the empty set or the set of all arrows; if it is
    possible it is the latter, and the conjunction is as possible as the other conjunct.

- fails: [infinity-e]
  text: >-
    There is exactly one individual at every arrow, so the first numeral holds of the universal
    property of individuals, the second instance of the Infinity Schema at type $e$ is false,
    Possible Infinity at type $e$ fails, and Possibility Maximalism (pure) fails for the
    C-consistent sentence that there are two individuals.

