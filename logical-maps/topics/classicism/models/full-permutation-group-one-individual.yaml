notes: >-
  Full proofs are in the write-up, which records the differences from the natural-action model.
  The model witnesses the joint consistency of $\Box$ND, the Axiom of Infinity at type $t$ and
  $\Box$Relational Choice with there being one individual. Suggested by Cian Dorr on 23
  September 2026.

  Modal Freedom (signature Σ) holds: the two tuples of constants are disjoint, so one of the two
  sentences contains no designated constant and denotes a fixed point, hence the empty set or
  the set of all arrows; if it is possible it is the latter, and the conjunction is as possible
  as the other conjunct. Converse Witnessed Possibility holds as in the natural-action record.
  Distinctness Maximalism (pure) fails: $(\forall xy\, .\,x=y)=\top$ is a true closed pure
  identity that C does not prove.
