# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
settings:
  construction: >-
    Use two objects with one nonidentity arrow from W0 to W1, evaluated at W0.
  sigma: top
meets:
  sigma-apart: The construction does not mention Σ.
  finitely-many-propositions: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all.
  actual-world-isolated: >-
    The actual-world proposition, the singleton of the identity, is in the domain, the model being
    full; no arrow leads back from $W_1$ to $W_0$.
  irreversible-arrow: >-
    The arrow $k$ to $W_1$, from which no arrow leads back.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another full action model is now one of the topic's general
# arguments (arguments/), reached through the group full-action-models and this record's `meets`;
# what follows is this record's own. Only the verdicts the engine needs to derive the rest are
# recorded, the source's first.

# --- from the source (17 Sep record) ---

- holds: [necessary-rigid-comprehension-r, necessary-atomicity-r]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, fourth paragraph'}

- fails: [no-pure-contingency-r]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, fourth paragraph'}
  text: >-
    The source makes the Fregean Axiom false at W0 and true at W1.

# --- later additions ---

- holds: [necessary-strong-leibniz-r]
  # migration: the argument of 22 September for the type-$t$ principle, now derived, is dropped.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    An atom of type $\bar\sigma t$ at $W_0$ is a single pair $\{\langle\bar a,h\rangle\}$, and its
    transport along $k$ is $\{\langle\bar a,j\rangle : j\circ k=h\}$ with $j$ ranging over the
    arrows out of $W_1$, of which there is one; so the transport is empty or a single pair, and
    decides every relation of $W_1$’s full domain. Every possible relation contains a pair, so
    every possible relation has a strong world below it, at $W_0$ and trivially at the one-world
    $W_1$.

- fails: [pure-b-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The pure sentence that there are three pairwise distinct propositions is true at $W_0$ and
    false at $W_1$, from which no arrow returns.

# migration: text of the old notes that no argument holds, verbatim: their first two sentences, the
# sentence that followed the Σ argument, and the last sentence of the argument for BF (type $t$).
# That argument, the one for the failure of Possible Infinity (type $t$) and the one for □Relational
# Choice of 20 September, whose verdicts are now derived, are dropped.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them. Whether BF holds at type $e$ depends
  on the individual domains, which the record does not fix, so the schema is left open.

was_conjectured: true

