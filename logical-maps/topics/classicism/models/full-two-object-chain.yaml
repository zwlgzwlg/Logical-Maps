id: full-two-object-chain
name: 'Full action model: two-object chain'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: stated
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, p. 59, fourth paragraph; p. 61.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, p. 59, fourth paragraph; p. 61

# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, one individual and Σ top; the source
# leaves the individuals open.
settings:
  construction: >-
    Use two objects with one nonidentity arrow from W0 to W1, evaluated at W0.
  individuals: singleton
  sigma: top
meets:
  fewer-propositions-after: >-
    $W_0$ has four propositions and $W_1$, after which there is only itself, two.
  nonidentity-arrow: >-
    The arrow $W_0\to W_1$.
  unretracted-arrow: >-
    There is no arrow from $W_1$ back to $W_0$.
  epic-arrows: >-
    Out of $W_1$ there is only the identity, so the arrow $W_0\to W_1$ is an epimorphism; and on the individuals every arrow is the identity.
  finitely-many-propositions-everywhere: >-
    $W_0$ has four propositions and $W_1$ two.
  sigma-apart: The construction does not mention Σ.
  finitely-many-propositions: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all.
  actual-world-isolated: >-
    The actual-world proposition, the singleton of the identity, is in the domain, the model being
    full; no arrow leads back from $W_1$ to $W_0$.
  irreversible-arrow: >-
    The arrow $k$ to $W_1$, from which no arrow leads back.

arguments: []

