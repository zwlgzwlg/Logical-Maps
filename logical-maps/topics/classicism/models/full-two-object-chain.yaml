id: full-two-object-chain
name: 'Full action model: two-object chain'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), prompted by Zachary Goodsell, 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, p. 59, fourth paragraph; p. 61.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, p. 59, fourth paragraph; p. 61
group: full-action-models
settings:
  construction: Use two objects with one nonidentity arrow from W0 to W1, evaluated at W0.
  individuals: singleton
  sigma: top
meets:
  comparable-free-arrows-everywhere: >-
    Out of $W_0$ the arrows are $1$ and $h=h\circ1$; out of $W_1$ only $1$.
  uniquely-factored-free-arrows-everywhere: >-
    $h=m\circ1$ only for $m=h$ and $h=m\circ h$ only for $m=1_{W_1}$; at $W_1$ only the identity.
  finitely-many-arrows-everywhere: >-
    Two arrows out of $W_0$ and one out of $W_1$.
  fewer-propositions-after: $W_0$ has four propositions and $W_1$, after which there is only itself, two.
  nonidentity-arrow: The arrow $W_0\to W_1$.
  unretracted-arrow: There is no arrow from $W_1$ back to $W_0$.
  epic-arrows: Out of $W_1$ there is only the identity, so the arrow $W_0\to W_1$ is an epimorphism; and
    on the individuals every arrow is the identity.
  finitely-many-propositions-everywhere: $W_0$ has four propositions and $W_1$ two.
  sigma-apart: The construction does not mention Σ.
  finitely-many-propositions: The propositions at the evaluation object are the subsets of the two arrows
    out of it, four in all.
  actual-world-isolated: The actual-world proposition, the singleton of the identity, is in the domain,
    the model being full; no arrow leads back from $W_1$ to $W_0$.
  trivial-isomorphisms-everywhere: The only arrows are the identities and $W_0\to W_1$, which has no inverse.
  retracted-arrows-invertible-everywhere: 'No non-identity arrow has a retraction: nothing returns from
    $W_1$.'
arguments:
- id: analytic-necessitism-same-carrier-repair
  holds: [second-order-analytic-necessitism]
  when: {metatheory: choice, individuals: fixed-infinite}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    The category has finitely many arrows out of each object, and individuals form the same fixed infinite set. The type induction gives, at each carrier type, either finite domains everywhere or a coherent separated continuum at every object.
    At e, the fixed individual set either cannot carry a real field or has a fixed
    continuum. Apply the full-action same-carrier criterion: direct-image field
    profiles are rigid and necessarily real, and the direct-image higher families
    of all subset relations give represented powers of every finite arity.
    This proves every same-carrier SOAN instance; AN is derived. ZFC and the recorded
    fixed/singleton individual settings are essential to the stated scope.
    Proof and construction hypotheses:
    [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 4–5.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Appended the carrier-sensitive SOAN proof for the explicitly guarded ZFC settings,
      replacing lost shared support without duplicating the derived AN verdict or
      claiming a choiceless extension. All previous arguments and certificate retained.
notes: The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Everything
  that implies these fails with them.
was_conjectured: true
