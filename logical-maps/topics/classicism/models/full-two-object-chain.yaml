- holds: [strong-leibniz-r]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Extended the Strong Leibniz Biconditionals from type t to every relational type, with the
    necessitation: transports of atoms along the unique arrow out of W1 are atoms or empty.

- holds: [barcan-t, necessary-barcan-t]
  fails: [possible-infinity-t]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    Added BF (type t) and □BF (type t), and the failure of Possible Infinity (type t) and of B
