- holds: [transversal-choice-r]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    Added Transversal Choice, by the argument recorded for Relational Choice: a full model
    contains every intension, in particular one whose extension at the evaluation point is a
    transversal, chosen in the metatheory, of the extension there of an equivalence relation;
