# full stop.

# --- from the source (17 Sep record) ---

- holds: [necessary-rigid-comprehension-r, necessary-atomicity-r]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, fourth paragraph'}

- fails: [no-pure-contingency-r]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, fourth paragraph'}
  text: >-
    The source makes the Fregean Axiom false at W0 and true at W1.

# --- later additions ---

- fails: [infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all, and every intension of a full model is present, so the numerals are the finite
    cardinalities and the fourth holds of the universal property of propositions: the Axiom of
    Infinity at type t fails, as does the fifth instance of the schema.

- id: sigma-top
  fails: [witnessed-possibility-r, independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.
    Everything that implies these fails with them.

- holds: [necessary-relational-choice-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    The truncation of a full action model at any arrow is again a full action model, its domains
    at the reachable objects being unchanged, and Relational Choice holds in every full model
    given choice in the metatheory (Classicism, p. 61).

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Let $a$ be the proposition true at the actual world alone (the identity arrow). For any true
    $p$, take $q:=a$ in the definition of $\Box_{\ne}p$: under a arrow $k$ to $W_1$, $\Diamond a$
    would need an arrow back to $W_0$, and none exists, since no arrow leads back to the actual
    world; under the identity, $p$ holds. So every truth is $\Box_{\ne}$-necessary, although ND
    fails.

- holds: [necessary-strong-leibniz-r]
  # migration: the argument of 22 September for the type-$t$ principle, now derived, is dropped.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    An atom of type $\bar\sigma t$ at $W_0$ is a single pair $\{\langle\bar a,h\rangle\}$, and its
    transport along $k$ is $\{\langle\bar a,j\rangle : j\circ k=h\}$ with $j$ ranging over the
    arrows out of $W_1$, of which there is one; so the transport is empty or a single pair, and
    decides every relation of $W_1$’s full domain. Every possible relation contains a pair, so
    every possible relation has a strong world below it, at $W_0$ and trivially at the one-world
    $W_1$.

- fails: [pure-b-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The pure sentence that there are three pairwise distinct propositions is true at $W_0$ and
    false at $W_1$, from which no arrow returns.

