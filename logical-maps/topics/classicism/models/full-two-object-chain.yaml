# migration: text of the old notes that no argument holds, verbatim: their first two sentences, the
# sentence that followed the Σ argument, and the last sentence of the argument for BF (type $t$).
# That argument, the one for the failure of Possible Infinity (type $t$) and the one for □Relational
# Choice of 20 September, whose verdicts are now derived, are dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
# "Everything that implies these fails with them." is back at the end of the argument it followed (5 October 2026).
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References. Whether BF holds at type $e$ depends on the individual domains, which the
  record does not fix, so the schema is left open.

  The type-t Strong Leibniz Biconditionals hold necessarily: at $W_0$ the singleton $\{k\}$
  becomes $\{\mathrm{id}_{W_1}\}$ under $k$ and $\{\mathrm{id}_{W_0}\}$ becomes empty, so both
  singletons are strong worlds; at $W_1$ there is one arrow and one non-bottom proposition. The
  Strong Leibniz Biconditionals hold at every relational type, necessarily. The arrow $k$ sends
  a proposition $p\subseteq\{1_{W_0},k\}$ to $\{1_{W_1}\}$ if $k\in p$ and to $\emptyset$
  otherwise, so it acts surjectively on the two propositions of $W_1$, which gives the type-$t$
  instance at $W_0$; $W_1$ is a one-world model, where BF is trivial. Possible Infinity (type
  $t$) fails: $W_0$ has four propositions and $W_1$ two, the models being full, so the Axiom of
  Infinity at type $t$ is false at both worlds. B for pure sentences fails, and B for sentences
  of $\Sigma$ with it: the pure sentence that there are three pairwise distinct propositions is
  true at $W_0$ and false at $W_1$, from which no arrow returns. Observations of Claude Fable
  5.1 (Anthropic), 25 September 2026.

