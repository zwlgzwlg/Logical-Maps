id: henkin-compactness-full-current-surjective-cover
name: 'Henkin compactness: full-current surjective cover'
definition: For a countable free signature, first reduce a C-complete family of pointed action models to countably
  many whole semantic objects, arrows and typed fibers, retaining all parameterized term operations, quantifier
  clauses and profile-separation witnesses. Apply the surjective-chain-name interpretation cover K, with countably
  many typed names. Add a full-current root R over K and countably many terminal singleton-individual full
  models; use K's individual set at R, identity entrance into K and the unique entrances into the terminal
  models. Thus the scalar algebra is 2 x B_K x 2^omega. Interpret signature constants by distinct type-matching
  names in K and their lifts at R. For an arbitrary set-sized fixed free signature Sigma, take a model of the
  many-sorted Henkin theory of C(Sigma) and the eight verified packages below by finite satisfiability in these
  countable-signature constructions. All lambda templates and literal identity clauses are retained. Evaluate
  at the designated current truth predicate.
