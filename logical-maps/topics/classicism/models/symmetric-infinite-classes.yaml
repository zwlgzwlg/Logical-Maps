# --- as first recorded (27 Sep) ---

- fails: [transversal-r]
  when: {individuals: base}  # proved at type $e$ (3 October: the one-individual variant leaves it open)
  text: >-
    At type e. The class of a fixed individual is the extension of a property pinned down by that
    individual. A classifier F pinned down by a finite set cannot choose a representative for the
    class of an individual in a class disjoint from that set: by symmetry and uniqueness the
    representative is fixed by every automorphism that fixes the pinning set of F and preserves
    the class, so its least pinning set lies inside the pinning set of F, and then its extension
    would be preserved by an automorphism that swaps the class with another.

# --- later additions ---

