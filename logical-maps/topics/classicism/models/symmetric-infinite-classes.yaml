# migration: the definition is the old description's first paragraph.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; the record fixed no interpretation of Σ until then.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers,
    equipped with an equivalence relation that has infinitely many classes, each infinite. Its
    arrows are all the surjections of that set, as in Base 1 of the draft, and its symmetry group is
    the automorphism group of the equivalence relation: the permutations that map classes onto
    classes. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  collapse-onto-point: >-
    Take $F:=\lambda x\, .\,x\ne a$, so $p\notin F_h$. $h$ is any surjection constant on $N\cup\{a\}$; a transposition inside $y$'s class that fixes $p$ is an automorphism of the equivalence relation, and moves $y$.
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$: the transposition of $y$ with
    another individual of its class outside $N$, which exists since the classes are infinite, maps
    classes onto classes, so lies in the symmetry group.
  surjective-arrows: The arrows are all the surjections of $\mathbb N$, as in Base 1.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
