# migration: the definition is the old description's first paragraph.
definition: >-
  A symmetric ideally-full intensional action model over one object, the set of natural numbers,
  equipped with an equivalence relation that has infinitely many classes, each infinite. Its
  arrows are all the surjections of that set, as in Base 1 of the draft, and its symmetry group is
  the automorphism group of the equivalence relation: the permutations that map classes onto
  classes. The evaluation point is the identity arrow.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- as first recorded (27 Sep) ---

- fails: [transversal-r]
  text: >-
    At type e. The class of a fixed individual is the extension of a property pinned down by that
    individual. A classifier F pinned down by a finite set cannot choose a representative for the
    class of an individual in a class disjoint from that set: by symmetry and uniqueness the
    representative is fixed by every automorphism that fixes the pinning set of F and preserves
    the class, so its least pinning set lies inside the pinning set of F, and then its extension
    would be preserved by an automorphism that swaps the class with another.

- holds: [no-pure-contingency-r, atomlessness, boolean-completeness-r, barcan-r]
  fails: [relational-choice-r]
  # migration: the sentence "Boolean Completeness, BF and No Pure Contingency hold as in Base 1, and
  # Actuality, Relational Choice, Atomicity at type t and ND fail as there." becomes "As in Base
  # 1."; Atomlessness, which had no sentence of its own, holds as in Base 1 too.
  text: >-
    As in Base 1.

# --- later additions ---

- holds: [inextensible-comprehension-r]
  # migration: `by` and `date` are those of the 28 September change, which adds that the argument
  # was not yet checked.
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-28'
  writeup: symmetric-infinite-classes
  text: >-
    At every relational type: the witness for X pinned down by S agrees with X at the worlds that
    preserve the equivalence pattern on S, and is the S-hull of the extension of X elsewhere.
    Details in the write-up.

