description: 'A symmetric ideally-full intensional action model over one object, the set of natural numbers,
  equipped with an equivalence relation that has infinitely many classes, each infinite. Its arrows are
  all the surjections of that set, as in Base 1 of the draft, and its symmetry group is the automorphism
  group of the equivalence relation: the permutations that map classes onto classes. The evaluation point
  is the identity arrow.


  Transversal fails at type e. The class of a fixed individual is the extension of a property pinned down
  by that individual. A classifier F pinned down by a finite set cannot choose a representative for the
  class of an individual in a class disjoint from that set: by symmetry and uniqueness the representative
  is fixed by every automorphism that fixes the pinning set of F and preserves the class, so its least
  pinning set lies inside the pinning set of F, and then its extension would be preserved by an automorphism
  that swaps the class with another. Boolean Completeness, BF and No Pure Contingency hold as in Base 1,
  and Actuality, Relational Choice, Atomicity at type t and ND fail as there. Inextensible Comprehension
  holds at every relational type: the witness for X pinned down by S agrees with X at the worlds that
  preserve the equivalence pattern on S, and is the S-hull of the extension of X elsewhere. Details in
  the write-up.'
notes: >-
  The first recorded model refuting Transversal, so Transversal is not a theorem of C. Since the
  coalesced roots make every pure sentence consistent with C possible, □Transversal fails there too.
  The classes must be infinite: with finite classes, being identical to one of the members of a class
  is a canonical representative. The mechanism is a failure of weak elimination of imaginaries: the
  class, as a definable set, has no canonical finite set of parameters. Structures with weak elimination
  of imaginaries, such as a dense linear order or the random graph, give no such failure, and in the
  binary tree with a parent function the levels are fixed as soon as one node is. Since Inextensible
  Comprehension holds, it does not imply Transversal. Left unknown: the Axiom of Infinity at type e,
  and every signature schema, since no interpretation of Σ has been fixed. Vicinity fails by derivation: Weakly Inextensible
  Comprehension holds, and with Vicinity it would give Actuality.
