# migration: the old notes, whole.
notes: >-
  The first recorded model refuting Transversal, so Transversal is not a theorem of C. Since the
  coalesced roots make every pure sentence consistent with C possible, □Transversal fails there
  too. The classes must be infinite: with finite classes, being identical to one of the members of
  a class is a canonical representative. The mechanism is a failure of weak elimination of
  imaginaries: the class, as a definable set, has no canonical finite set of parameters.
  Structures with weak elimination of imaginaries, such as a dense linear order or the random
  graph, give no such failure, and in the binary tree with a parent function the levels are fixed
  as soon as one node is. Since Inextensible Comprehension holds, it does not imply Transversal.
  Left unknown: the Axiom of Infinity at type e, and every signature schema, since no
  interpretation of Σ has been fixed. Vicinity fails by derivation: Weakly Inextensible
  Comprehension holds, and with Vicinity it would give Actuality.

  Since 2 October the Axiom of Infinity at type e holds by the group's argument, and the record's
  interpretation of Σ is its own text saying that none is fixed; its variants with each of the
  group's interpretations are generated.

