group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 8 (pp. 78–79): the arrows are the maps $k_n$ with $k_nm=0$ for $m\le n$
    and $k_nm=m-n$ otherwise, which compose as $k_n\circ k_m=k_{n+m}$; $k_0$ is the identity.
  sigma: top

meets:
  actual-world-pinned: >-
    $\{k_0\}$ is pinned down by $\{1\}$, since $k_n1=0$ for $n>0$.
  non-identity-non-injective: >-
    Each $k_n$ with $n>0$ sends $0,\ldots,n$ to $0$.
  pinned-atoms: >-
    $\{k_0\}$ and each $\{k_n\}$ are pinned down by finite sets: $k_n$ is the only arrow sending
    $n+1$ to $1$.
  d6-surjective: >-
    $k_n$ sends $0$ to $0$ and $m+n$ to $m$ for $m\ge1$, so it is a surjection of $\mathbb N$.
    So each arrow acts surjectively on the pinning sets, the finite subsets of $\mathbb N$, and on the individuals, whether these are the natural numbers or a single one that every arrow fixes.
  unbounded-haecceities: >-
    With $A$ the even numbers: the strongest persistent property pinned down by $\{0,\ldots,n\}$
    whose extension contains them has, at $k_m$, the evens, the odds with $0$, or all of $\mathbb N$
    according as $m<n$ is even, $m<n$ is odd, or $m\ge n$.
  no-least-pinned-cover: >-
    An arrow $k_n$ is determined by its value at any $m\ge n$ and all $k_n$ with $n\ge N$ agree on
    $\{0,\ldots,N\}$, so the finitely pinned propositions are exactly the finite and cofinite sets
    of arrows. Let $F$ be the family of singletons $\{k_{2j}\}$: a finitely pinned superset of
    $\bigcup F$ is a cofinite set, and removing from it an odd-indexed member gives a strictly
    smaller one.

