# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ, in which "$\{k_0\}$" replaces "described above", since nothing above
# described the actual-world proposition.
definition: >-
  Proposition D.5, part 8 (pp. 78–79): the arrows are the maps $k_n$ with $k_nm=0$ for $m\le n$
  and $k_nm=m-n$ otherwise, which compose as $k_n\circ k_m=k_{n+m}$; $k_0$ is the identity. In
  every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the model is ideally
  full: a proposition is a set of arrows whose membership depends only on the arrows’ values on
  some finite set of individuals (it is pinned down by that set), an entity of a higher type is an
  applicative behaviour profile pinned down by a finite set in the same sense, and the individuals
  are the natural numbers acted on by the arrows themselves. Propositions and properties are thus
  about finitely many individuals and indifferent to how the arrows treat the rest. Evaluation
  point: the sole object, at the identity arrow.


  Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
  $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of the
  model, the actual-world proposition $\{k_0\}$; every other relational constant denotes the top
  element of its type and every individual constant one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
