- holds: [barcan-r]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(8), pp. 78–79'}
  text: >-
    All arrows are surjective, so BF holds.

- holds: [atomicity-r]
  # migration: the bare clause "ND fails" that followed is dropped; the failure is derived.
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(8), pp. 78–79'}
  text: >-
    $\{k_0\}$ and each $\{k_n\}$ are pinned down by finite sets, so Actuality and Atomicity hold.

- fails: [boolean-completeness-r]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(8), pp. 78–79'}
  text: >-
    The strongest persistent property pinned down by $\{0,\ldots,n\}$ whose extension contains the
    even numbers has, at $k_m$, the evens, the odds with $0$, or all of $\mathbb N$ according as
    $m<n$ is even, $m<n$ is odd, or $m\ge n$, and so becomes ever stronger.

- holds: [no-pure-contingency-r]
  source: {paper: bacon-dorr-classicism, locator: 'p. 79'}
  text: >-
    Boxed positive flags use the source’s explicit one-object No Pure Contingency observation,
    applied separately to each closed instance.

# --- later additions ---

- holds: [axiom-of-infinity-e, axiom-of-infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary, which is the text.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The individuals are the natural numbers and identity at the evaluation arrow is literal, so no
    numeral counts them. The propositions that a given individual is fixed by the arrow, one for
    each individual, are pairwise distinct and each has that individual as finite support, so
    there are infinitely many propositions. The set of numerals at each type is invariant under
    every arrow, hence has empty support and lies in the domain, so finite cardinality is standard
    and no finite cardinality holds of the universal property at either type.

- id: sigma-true-atom
  fails: [independence-signature-r, signature-b-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The text is the 23
  # September version; the revision notes are the two 23 September changes, the first without its
  # closing "; see the notes". The sentence that followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes
    $a$, true and contingent; B for sentences of Σ fails, since under any arrow that no arrow
    composes back into $a$, $\Diamond a$ is false, so $\Box\Diamond a$ fails; Witnessed
    Possibility fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since
    $\Diamond(c=\top_\tau)$ is $\Diamond\Box a$ and $a$ is necessary at no arrow; Separated
    Structure fails with it, being equivalent to Possibly Witnessed Possibility; Independence
    (signature Σ) and Distinctness Maximalism (signature Σ) fail through the other relational
    constants, Σ being assumed to contain at least one: such a constant $c'$ of type $\tau'$
    denotes what the closed pure term $\top_{\tau'}$ denotes, and $c'=\top_{\tau'}$ is a true
    identity that C(Σ) does not prove. The designated constant refutes neither: closed pure terms
    denote entities fixed by every arrow (Classicism, §3.5, p. 58), whereas $a$ is fixed by no
    arrow but the identity, so no closed pure term denotes $\lambda\bar x\, .\,a$.
  revisions:
  - date: '2026-09-23'
    by: Claude Fable 5.1 (Anthropic)
    note: >-
      Re-fixed the interpretation of Σ so as to settle No Contingency (signature Σ) and B for
      sentences of Σ, at Cian Dorr’s request.
  - date: '2026-09-23'
    by: Claude Fable 5.1 (Anthropic)
    note: >-
      Corrected the reason given for the failures of Independence (signature Σ) and Distinctness
      (signature Σ): the true atom is denoted by no closed pure term, since such terms denote
      entities fixed by every arrow; the failures come from the other relational constants, which
      denote top. No verdict changes.

- fails: [countable-boolean-completeness-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    At type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as
    its extension a countable family of haecceities, and the extensional fullness the source
    invokes to put $E$ in the domain also puts in the relation pairing the haecceity of the $k$-th
    member of that family with the numeral $k$, which injects $E$ into the numerals.

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true proposition $p$ pinned down by a finite set take as the witness $q$ the
    actual-world proposition $\{k_0\}$: under $k_n$ with $n>0$, $\Diamond q$ would need $k\circ
    k_n$ to be the identity, impossible since $k_n$ is not injective.

- holds: [relational-choice-r]
  # migration: `by` renders the closing "Cian Dorr’s observation of 23 September 2026." and the
  # change's author.
  by: Cian Dorr (observation); recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The model is ideally full, hence extensionally full at every object (Appendix D, the remark
    after Definition D.3): for any set $R$ of tuples from the domains at an object $V$, the
    intension that assigns to every arrow out of $V$ into an object $U$ a fixed set $R_U$ of
    tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$, so it is the intension
    of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation $U$
    serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph
    is such an $R$, and its element $S$ is functional and a subrelation of $U$ at $1_V$, both
    conditions being unboxed. The closed Relational Choice instance is true at an arrow $h\colon
    W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those of
    the model, so it holds at every arrow and $\Box$Relational Choice follows.

- fails: [boolean-completeness-t]
  # migration: the first sentence rewrites "Boolean Completeness fails at type $t$ as well, which
  # the source (n. 92) conjectures but does not show."; the closing "Observation of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source." becomes `by` and `date`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The source (n. 92) conjectures this but does not show it. Any set $F$ of propositions is the
    extension at the identity of an element of the domain at type $t\to t$, namely the profile
    $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is natural, independent of $h$ and so
    pinned down by the empty set, and each of its values is pinned down by the pinning set of $p$,
    since $i\cdot p$ depends only on the values of $i$ there. A least upper bound of $F$ under
    entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the least
    $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here an arrow
    $k_n$ is determined by its value at any $m\ge n$ and all $k_n$ with $n\ge N$ agree on
    $\{0,\ldots,N\}$, so the finitely pinned propositions are exactly the finite and cofinite sets
    of arrows. Let $F$ be the family of singletons $\{k_{2j}\}$: an upper bound is a cofinite set
    containing them, and removing an odd-indexed member of it gives a strictly smaller upper
    bound. So $F$ has no least upper bound, and, taking pointwise negations, the family of
    complements has no greatest lower bound.

- fails: [boolean-completeness-t]
  # migration: "Review of 25 September 2026. Boolean Completeness already fails at type t:" becomes
  # `date` and `fails`; `by` condenses the record's second source. A second, independent argument
  # for the same verdict.
  by: DeepSeek (deepseek-flash), trawl; reviewed and corrected by OpenAI Codex (GPT-6)
  date: '2026-09-25'
  writeup: finite-support-truncated-shifts
  provenance: admission-c0a37bbe6b6c45cc985428b174812564
  text: >-
    The finite/cofinite algebra of arrow indices has no least upper bound for the even-index
    singleton family. The family is represented by a domain property because this ideally full
    model is extensionally full (Definition D.3, p. 74). See the dated handwritten write-up.

