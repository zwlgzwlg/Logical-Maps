# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
definition: >-
  Proposition D.5, part 2 (pp. 76–77): the one-object category whose arrows are the monotone
  surjections of $\mathbb N$ (the source first considers all surjections, which gives the same
  package, and restricts to the monotone ones to make the failure of Boolean Completeness easier
  to exhibit). In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the
  model is ideally full: a proposition is a set of arrows whose membership depends only on the
  arrows’ values on some finite set of individuals (it is pinned down by that set), an entity of a
  higher type is an applicative behaviour profile pinned down by a finite set in the same sense,
  and the individuals are the natural numbers acted on by the arrows themselves. Propositions and
  properties are thus about finitely many individuals and indifferent to how the arrows treat the
  rest. Evaluation point: the sole object, at the identity arrow.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

