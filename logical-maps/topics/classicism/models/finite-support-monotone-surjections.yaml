- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, Proposition D.5, part 2, pp.
  74, 76–77; p. 79 (No Pure Contingency).
- DeepSeek (deepseek-flash), Classicism theorem trawl, 25 September 2026; mathematically reviewed and
  corrected by OpenAI Codex (GPT-6), 25 September 2026. Accepted additions only; original construction
  attribution is unchanged. writeups/finite-support-monotone-surjections.md; Classicism, Definition D.3,
  footnote 92 and Proposition D.5, pp. 73–79.
source_names:
- Classicism
- DeepSeek trawl; GPT-6 review 25 Sep
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Appendix D, Proposition D.5(2), pp. 74–75; construction pp. 76–77; p. 79 (No Pure Contingency)

# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
settings:
  monoid: >-
    Proposition D.5, part 2 (pp. 76–77): the one-object category whose arrows are the monotone
    surjections of $\mathbb N$ (the source first considers all surjections, which gives the same
    package, and restricts to the monotone ones to make the failure of Boolean Completeness easier
    to exhibit).
  sigma: top

meets:
  evens-avoidable: >-
    With $N_0\subseteq[0,M_0]$: $i$ the monotone surjection that is the identity on $[0,M_0+1]$,
    sends $M_0+2$ to $M_0+1$ and $x$ to $x-1$ for $x\ge M_0+2$; an even $b\ge M_0+2$, whose only
    preimage under $i$ is the odd $b+1$; and $N^{\prime}:=[0,b+2]$: a monotone map agreeing with $i$
    there has the same preimages of $b$ within $[0,b+2]$ and takes values at least $i(b+2)=b+1$
    beyond it.
  d6-surjective: >-
    The arrows are the monotone surjections of $\mathbb N$.
    So each arrow acts surjectively on the pinning sets, the finite subsets of $\mathbb N$, and on the individuals, whether these are the natural numbers or a single one that every arrow fixes.
  unbounded-haecceities: >-
    With $A$ the even numbers: the strongest persistent property containing them and pinned down by
    $\{0,\ldots,n\}$ becomes strictly stronger as $n$ grows.
  no-least-pinned-cover: >-
    Let $F$ be the family of propositions $A_m$ ($m\ge1$), each pinned down by $\{2m-1,2m\}$, that
    the arrow sends $2m-1$ to $0$ and $2m$ to $1$, so that its first step is at the even position
    $2m$. The least superset of $\bigcup F$ pinned down by $\{0,\ldots,N\}$ consists of the arrows
    whose first step is at an even position or beyond $N$, and it strictly shrinks as $N$ grows.

arguments:

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. What follows is this record's own.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.

- fails: [distinctness-necessary-r]
  when: {individuals: naturals}
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(2), pp. 76–77'}
  text: >-
    At the non-injective arrows.

- holds: [atomlessness]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(2), pp. 76–77'}
  text: >-
    As in part 1.

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true proposition $p$ pinned down by a finite set take as the witness $q$ the proposition
    that the arrow fixes $0,\ldots,N$ for $N$ beyond the pinning set. An arrow fixing $0,\ldots,N$
    agrees with the identity on that set and so is in $p$. An arrow $h$ that does not, with least
    moved point $m\le N$, has $hm<m$ by monotone surjectivity and so collapses $m-1$ and $m$; then
    no $k\circ h$ can fix both, so $\Diamond q$ fails at $h$. Hence $\Box(\Diamond q\to p)$.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

