id: protected-numbers-all-types-growth
name: Necessary canonical noncollapse at all types with growing numerical field
definition: Finitary Henkin component K satisfies every Box I*_rho and has an additional canonical t-number
  c not equal to any standard numeral, plus Q necessary of every standard numeral but false of c. Attach
  a full present using pairs (current relation, K-entity), retaining K quantifiers over their whole domains.
  The root has all Box I*_rho, but the whole numerical predicate at t is not weakly inextensible.
