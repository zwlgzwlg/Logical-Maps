  text: The same root satisfies every boxed canonical I* schema, with the active guard at t, but its whole
    N_t has a new K-component member excluded by an admitted persistent test. Thus it is not rigid, refuting
    Arithmetic Necessitism. Total predecessor operations follow from the bare-C boxed guard theorem.
notes: The positive verdict is the full type schema Box I*_rho, including rho=e. The failure of Arithmetic
  Necessitism is witnessed at counting type t with its guard true. This is not the quantified individual-Infinity
  principle.
