  writeup: suslin-analytic-truth-separation
  text: No new reals, together with the all-type capacity argument, supplies rigid necessarily complete
    real fields at every carrier where a field is possible. CH holds in the ground and is forced, so the
    positive boxed universal CH alternative holds at every carrier, including fields real only on a proper
    Boolean support. At et a fixed endpoint-coded field R0 has Real value (1,1_A), while the finite unary/binary
    sentence ST expressing Suslin-tree existence has value (0,1_A). Instantiation at R0 bounds the two
    native universal matrices by (0,1_A) and (1,0_A), respectively. Both are proper values, so both native
    top-test boxes fail. Sections 1–7 give the construction, transfer, all-type AN proof and exact boxed-universal
    calculation.
notes: One relative-consistency model with exactly two positive seeds and one negative seed. Necessary
  positive CH is stronger formula metadata, not an additional node. The negative is one failed Necessity
  of Second-Order Analysis instance at et, not a failure at every carrier or a necessary failure. The
  necessarily real field makes the failure nonvacuous. No SOAN, Boolean-completeness, choice, Strong Possibility
  or unrelated model flags are imported. The same model ID replaces any conditional predecessor rather
  than supplementing it. Classical consistency/forcing and inherited Boolean semantics retain their credits.
  No independent human check, formal verification or literature-wide novelty claim is made.
