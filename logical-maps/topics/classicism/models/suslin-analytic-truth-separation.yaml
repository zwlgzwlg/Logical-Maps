id: suslin-analytic-truth-separation
name: Suslin-tree analytical truth with Analytic Necessitism and necessary CH
definition: Relative to Con(ZFC), take an ordinary countable M of ZFC+CH+SH. Internally let P be Jech's
  all-countable-length regular-graph forcing, A=RO(P), B=2 x A, D_e=omega^M, and take the internally full
  typed Boolean hierarchy. Evaluate at the isolated first coordinate. Countable closure adds no reals
  and preserves CH, while Jech's theorem supplies a Suslin tree in the forcing interpretation. The construction
  does not require a transitive or externally well-founded ground model.
