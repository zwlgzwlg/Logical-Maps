# --- from the source (17 Sep record) ---

- holds: [distinctness-signature-r]
  source: {paper: bacon-dorr-classicism, locator: 'Theorem 3.26, §3.6, pp. 62–64'}

# --- later additions ---

- holds: [axiom-of-infinity-e]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    The root individuals are all families of component individuals, infinitely many since
    components have arbitrarily many individuals; identity at the root is identity of families;
    and the property of cardinalities that is true of exactly the standard numerals at the root
    and universal in every component is a root entity, so a finite cardinality at the root is a
    standard numeral, and no standard numeral holds of the universal property over an infinite
    domain.

- fails: [possibility-plus-r]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    Some component $N$ satisfies necessarily that there are at least three individuals, since that
    sentence is consistent; take two root individuals that differ at $N$ and agree everywhere
    else; the pure formula saying that $x\ne y$ and there are exactly two individuals is
    consistent, but at the root there are infinitely many individuals, under every arrow into
    another component the two collapse, and under every arrow into $N$ there are at least three.

# migration: the first two sentences of the old notes, verbatim; their other text is above. The
# arguments for □Relational Choice and the 23 September correction, whose verdicts are now derived,
# are dropped.

