id: interpretation-cover-progressive-substitutions
name: 'Interpretation cover: progressive substitutions'
definition: In ZFC retain a set-sized pure-C-complete family of pointed old C action models and every old domain
  and arrow. Index each typed auxiliary name set by an infinite initial ordinal lambda, large enough for the
  old-domain bounds and distinct names for every symbol of a fixed set-sized constant signature Sigma. Root
  individuals are its individual names. Root loops are ALL type-preserving maps f satisfying index(f(c_alpha))
  >= alpha, with no requirement of injectivity or order preservation between different inputs. Include every
  typed interpretation into each old object, composed by precomposition with root maps and old transport. There
  are no old-to-root arrows and root designated symmetry is trivial. Root relational entities are exactly the
  finite-typed-pin profiles whose whole old sections are admitted in the unchanged targets; the same pinning
  condition governs identity and all root loops. Transport is precomposition. Interpret individual constants
  by distinct designated names and relational constants by the named lifts with zero root rows and whole interpreted
  old sections. Evaluate at root identity.
