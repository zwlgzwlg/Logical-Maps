arguments:
- id: progressive-cylinders-and-splitting
  holds:
  - atomlessness
  - distinctness-preserving-collapse
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: free
  writeup: interpretation-cover-progressive-substitutions
  text: For a finite pin S, the admitted root-only proposition q_S says that the root map fixes S. Progressiveness
    gives Diamond q_S=q_S at every coordinate. If S pins a current truth p, q_S <= p, so q_S witnesses the
    native ND-necessity of p. Every nonzero proposition splits at a fresh coordinate, either by moving a root
    individual-name image upwards or by assigning a fresh propositional name top/bottom in the same old target.
- id: weak-inextensible-comprehension-obstruction
  fails:
  - weakly-inextensible-comprehension-r
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: free
  writeup: interpretation-cover-progressive-substitutions
  text: 'The empty-pinned root table E={q_{c_n}: n in N}, with empty old rows, is admitted at tt. Any coextension
    Y has a finite pin. Move a fresh c_k while fixing that pin. Y''s future table still contains the whole
    q_{c_k}. A pinned tester omitting that whole proposition exactly when c_k moves, and containing bottom
    at all old targets, necessarily contains every current E-member because moved cylinders become bottom.
    It fails on the retained q_{c_k} in Y''s future full domain, contradicting weak inextensibility.'
- id: current-transversal-choice
  holds:
  - transversal-choice-r
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-progressive-substitutions
  text: 'Every external relation on whole current entities is the row of an admitted empty-pinned profile:
    keep that row at all root loops and take empty old rows. Select a representative of each current equivalence
    class in ZFC and represent the selected subset by such a profile. All clauses of native Transversal Choice
    are current. Relational Choice and Transversal follow from recorded implications; their direct proofs are
    also given. Writeup Sections 6–7.'
- id: quantified-individual-infinity
  holds:
  - axiom-of-infinity-e
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-progressive-substitutions
  text: Current relation fullness admits the higher predicate whose extension is exactly the whole standard
    numeral denotations Z_n. It contains Frege zero and is closed under successor, so every current finite
    cardinality is one of these entities. Finite induction shows Z_n holds of a property exactly when its current
    extension has n individuals. No Z_n holds of the universal infinite name set. This proves the impredicative
    Axiom of Infinity, not merely external infinitude. Writeup Section 8.
- id: individual-parameter-possibility-plus
  holds:
  - possibility-plus-signature-r
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-progressive-substitutions
  text: Eliminate the finitely many occurring signature constants and existentially close the displayed individual
    variables. The pure-complete old family supplies typed witnesses. Assign the pairwise-distinct current
    names and the designated constant names their values; the native exclusion from individual constants occurring
    in the formula makes the assignments compatible. Every typed interpretation remains available, and whole
    named-lift landing gives the required possibility. Empty tuples are included. Pure Possibility+ and both
    Maximalisms are derived. Writeup Section 9.
- id: barcan-failure-at-propositions
  fails:
  - barcan-t
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: free
  writeup: interpretation-cover-progressive-substitutions
  text: Let c be the least individual name and q_c its root-only fixed-name proposition. If a progressive map
    moves c, its name image omits c, so every transported current proposition has a finite pin omitting c.
    The proposition q_c has no such pin. The admitted {c}-pinned tt tester is universal when c is fixed, omits
    q_c otherwise, and has universal whole old sections. It therefore necessarily holds of every transported
    current proposition but fails on q_c in a full future target domain. This directly refutes the native BF_t
    formula. Writeup Section 10.
notes: Current Truths are ND-necessary is the native distinctness-preserving-collapse principle. The monoid
  is progressive, with no injectivity or monotonicity requirement between different inputs. Quantified Infinity,
  Possibility+ for the fixed free-constant signature, and Transversal Choice hold currently; BF at t and Weakly
  Inextensible Comprehension at tt fail. Pure Possibility+, both Maximalisms, Relational Choice, Transversal
  and failure of Vicinity are derived. The unchanged old components supply the stated C-completeness input;
  no boxed upgrade is asserted.
