references:
- paper: dorr-bc-not-rc
  role: background
  locator: Definitions 15–18 and Proposition 20, p. 8
  note: Symmetric ideally-full action semantics.
definition: >-
  At $E$ the individuals are the natural numbers and at $O$ they are the
  natural numbers together with one new point. Arrows are all injections
  into $E$, all injections into the old part of $O$, and the permutations
  of $O$ fixing its new point. Use relations with finite source pins and
  equivariance under target permutations preserving the new point. Evaluate
  at the identity of $E$ with all relational signature constants denoting top.
arguments:
- id: all-type-completeness
  holds: [necessary-boolean-completeness-r]
  writeup: one-new-individual-upper-point
  choice: free
  text: >-
    Enlarge a pin at $O$ by its sole new point. Choose one bijection onto
    the permitted range for each arrow kind. Every target symmetry fixing
    the representative image of a family pin restricts along this bijection
    to a source symmetry fixing that pin. Hence the union of the representative
    rows of all current family members has a common finite pin. Finite
    interpolation with target permutations gives its extension to all
    arrows; the representative rows read off the entire entailment order.
- id: necessity-and-comprehension
  holds: [distinctness-necessary-r, necessary-strong-actuality]
  fails: [inextensible-comprehension-r, barcan-t]
  writeup: one-new-individual-upper-point
  choice: free
  text: >-
    Injections out of $E$ admit inverses on each finite pin. The event of
    ending at $E$ there and the permutation event at $O$ witness Strong
    Actuality. A weakly inextensible coextension of all individuals must omit
    the new point on entry into $O$, yet after returning to $E$ it contains
    the image of that point, violating weak inextensibility at the entrance.
    The $O$-permutation event is absent from every transport of an $E$
    proposition into $O$; the tester excluding it only at those entrances
    refutes propositional Barcan.
- id: upper-point-inheritance
  holds: [necessary-atomicity-r, necessary-intensional-choice-r, arithmetic-necessitism, necessity-of-arithmetic, necessity-of-second-order-analysis, necessary-axiom-of-infinity-e, necessary-truth-implies-five-necessity]
  fails: [relational-choice-r, potential-infinity-t]
  writeup: one-new-individual-upper-point
  choice: uses
  text: >-
    These are the upper objects in the marked-entrance construction. Its
    proofs of the boxed verdicts already apply at both upper objects.
    At $E$ the fresh-transposition argument prevents a selector for pairs
    of individuals. There are at most eight propositions at every point.
