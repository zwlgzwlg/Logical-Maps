- The symmetric old-and-new model of Claude Fable 5.1 at Cian Dorr's direction, 6 October 2026, with the corrected inextensibility argument by Claude Opus 5.5.
- GPT-6 Astra, prompted by Daniel Kodsi, 22 October 2026, the Boolean Completeness argument at the unmarked point.
