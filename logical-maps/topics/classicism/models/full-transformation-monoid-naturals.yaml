group: full-transformation-monoid
settings:
  carrier: Take $X=\mathbb N$.
meets:
  infinitely-many-individuals: The individuals are the natural numbers.
  infinitely-many-propositions: Singletons of the infinitely many constant maps are distinct propositions.
  noninvertible-retracted-arrow: The successor injection has the predecessor map as a left inverse, but
    is not onto.
  separated-retractions: The maps r with r(n+1)=n and r(0)=0 or 1 are distinct left inverses of successor,
    separated by a singleton proposition.
  continuum-many-arrows: Each binary sequence is a distinct transformation of the natural numbers.
arguments: []
notes: The full model validates necessary Atomicity at all relational types (full-atomicity), as well
  as necessary Rigid Comprehension. It does not refute Atomicity. Its natural action on individuals is
  essential to the type-e Barcan counterexample.
