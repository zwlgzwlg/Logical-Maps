id: countable-terminal-fan-new-individual
name: Countable full terminal fan with a new individual
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  checked_by:
  - Two additional GPT-6 research agents independently reviewed the ordinal and typed Barcan arguments.
  date: '2026-11-26'
  lean: none
sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, countable terminal fan, 26 November 2026.
- The map's full two-object chain with a new individual and the bounded-individual ordinal test.
source_names:
- Codex via Kodsi, 26 Nov
- Two-object chain
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61 and Appendix D, full action models
definition: >-
  There is one root with one arrow to each member of a countably infinite
  family of distinct terminal objects, and the identities. The root individual
  domain is a singleton. Every terminal domain has two individuals, and
  every entrance sends the root individual to the first. At each relational
  type every row profile is admitted. Evaluate at the root and take the
  relational signature names to denote top.
meets:
  full-model: The full domains include every row profile.
  full-action-model: This is a full action model at every object.
  extensionally-full: Every subset of each current tuple domain is an available row.
  finite-extension-properties-everywhere: Full row domains contain haecceities and realize every finite extension.
  identity-singletons: The proposition supported on the identity is present at either kind of object.
  rigid-haecceity-disjunctions: Each relation sending an extension to all its transported images is admitted.
  codomain-intensions: The terminal domains and the root's row profiles are full.
  relationally-epic-arrows: The category is thin and each terminal has only its identity as an outgoing arrow.
  trivial-isomorphisms-everywhere: Every nonidentity arrow goes from the root to a terminal.
  boundedly-many-individuals: The two sizes of individual domain are one and two.
  finitely-many-individuals-everywhere: There are at most two individuals at every reachable object.
  infinitely-many-propositions: Any subset of the countably many entrance arrows gives a root proposition.
  sigma-top: Every designated name of relational type denotes top.
arguments:
- id: mathematical-possibilism
  holds: [forcing-possibilism]
  choice: uses
  text: >-
    At the ordinal type take the root entities given by an extensional
    order/field table over the singleton and one common extensional table on
    the two individuals at each terminal. There are only finitely many such
    entities. Zero and successor preserve the tables by their local well-order
    and restriction tests. A rigid family of them is the finite union of
    the haecceities of its actual members by persistence and weak
    inextensibility, so its limit uses the same finite list of tables at
    every terminal. The ordinal benchmark is finite. Every infinite carrier
    therefore contains a countably infinite power-closed subset above the
    benchmark: all smaller subsets and their powers are finite and all
    required graphs are current rows. Every revised-small algebra is finite.
    For an algebra with $k$ atoms choose $k$ arrows. Their powerset is the
    interval below the proposition selecting these arrows.
- id: different-barcan-sorts
  holds: [necessary-barcan-relational]
  fails: [barcan-r]
  choice: free
  text: >-
    Each terminal relation is the image of a root relation, by prescribing
    its row at that particular terminal. At terminal identities Barcan is
    automatic. At $e$, a root tester with full current row and just the image
    individual at every terminal necessarily holds of each current individual;
    the second individual fails it at each entrance.
