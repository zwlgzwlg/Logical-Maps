settings:
  forcing: Here $P=\operatorname{Fn}((\omega_1)^V,2,{<}(\omega_1)^V)$ is the set in $V$ of countable partial
    functions from $(\omega_1)^V$ to $2$, ordered by reverse inclusion. It is countably closed and weakly
    homogeneous. It adds a subset of $(\omega_1)^V$ but no subsets of $\omega$. Use the group's ground-model
    root, full extensional terminal object, and ground-definable transport; the truth point is the root.
arguments:
- id: fixed-real-fields-at-every-carrier
  holds:
  - analytic-necessitism
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: stitched-countably-closed-subset
  text: 'At every infinite relational type a uniformly ground-definable embedding of the ground real field
    into the terminal domain has a ground-coded family of root lifts. Their carrier and field relations
    are paired with their exact transported images, so they are rigid and the carrier has necessarily
    distinct instances. No new subsets of omega means no new rational cuts: the same field is complete
    at both objects, including for new bounded families at the terminal object. The individual type and
    the remaining finite types cannot carry a real structure. Thus the same-type ANA schema holds at every
    type. The writeup gives the type induction and the simultaneous admitted structure.'
notes: Relative consistency in the usual ZFC forcing interpretation of the stitching construction. The
  group's necessary Rigid Comprehension and necessary Relational Choice apply without an adds-a-real hypothesis.
  This model supplies their joint compatibility with Analytic Necessitism; its fixed real fields actually
  exist, for example at et. No global ND, CH-stability assertion, or general all-type ANA transfer rule
  is used. This is distinct from the full Boolean-valued countably-closed-subset construction.
