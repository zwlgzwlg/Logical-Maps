# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; the individuals were the base already.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over two objects, each a copy of the natural
    numbers. The arrows from the first object to itself are the permutations; the arrows from the
    first to the second and from the second to itself are all the functions; there are none back.
    Both symmetry groups are all the permutations. The first object carries the ideal of finite
    sets, the second the improper ideal, so at the second object every symmetric intension belongs
    to the domain. The evaluation point is the identity arrow on the first object.
  individuals: base
  sigma: top
meets:
  collapse-onto-point: >-
    Take $F:=\lambda x\, .\,x\ne a$, so $p\notin F_h$. $h$ is a function from the first object to the second that is constant on $N\cup\{a\}$; the symmetry group of the second object is all permutations.
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$, at the first object, where the
    domain is symmetric and finitely pinned: the transposition of $y$ with another individual of the
    first object outside $N$ lies in its symmetry group.
  separable-collapses: >-
    The pairs $\{n,m\}$ of individuals of the first object: a function into the second object that
    collapses $n$ with $m$ and nothing else is an arrow, all functions being arrows there.
  actual-world-isolated: >-
    The actual-world proposition is the set of arrows from the first object to itself, all
    permutations, in the domain by the source argument for Actuality; no arrow from the second object
    returns to the first.
  actuality-contingent: >-
    The actual-world proposition, the arrows from the first object to itself, is in the domain; at
    every world an arrow into the second object leads outside it, and such an arrow carries it to the
    empty set.
  irreversible-arrow: >-
    An arrow into the second object: no arrow returns from there to the first.

