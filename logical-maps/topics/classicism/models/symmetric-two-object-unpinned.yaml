# migration: text of the old notes that no argument holds, verbatim.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
# "Everything that implies these fails with them." is back at the end of the argument it followed (5 October 2026).
notes: >-
  The point of the model is that boxed Boolean Completeness and boxed Actuality, and so Weak
  Rigid Comprehension, do not yield Rigid Comprehension. The gap is exactly the leading box of
  the inextensibility conjunct. The status of the unboxed BF schema at the base world is left
  unknown here: the draft's working comments report that higher-type instances fail there, which
  would make the schema fail, but its text does not. The source is a work in progress.

  Argument of 23 September 2026, after Cian Dorr’s observation that a choice over the
  individuals cannot be finitely pinned down; the well-ordering of the individuals that he had
  in mind is refuted by the same two facts, but the direct route needs no derivation of a
  well-ordering from Relational Choice in C. Atomicity fails at $W_0$ already at type $t$,
  although Actuality holds. B for pure sentences fails, and B for sentences of $\Sigma$ with it:
  the type-$e$ instance of BF is a closed pure sentence true at the base world and false at the
  second object, and no arrow leads back from the second object, so at that world the sentence
  is not even possible. Observation of Claude Fable 5.1 (Anthropic), 25 September 2026.

