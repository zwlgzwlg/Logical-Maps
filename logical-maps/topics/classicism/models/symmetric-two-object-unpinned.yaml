# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ.
definition: >-
  A symmetric ideally-full intensional action model over two objects, each a copy of the natural
  numbers. The arrows from the first object to itself are the permutations; the arrows from the
  first to the second and from the second to itself are all the functions; there are none back.
  Both symmetry groups are all the permutations. The first object carries the ideal of finite
  sets, the second the improper ideal, so at the second object every symmetric intension belongs
  to the domain. The evaluation point is the identity arrow on the first object.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (19 Sep record) ---

- holds: [necessary-actuality]
  text: >-
    At both objects, and hence necessarily: at each, the orbit of the identity under the symmetry
    group is the smallest symmetric set of arrows containing it, and it is in the domain, at the
    first object because it is pinned down by the empty set and at the second because nothing is
    required there.

- holds: [necessary-boolean-completeness-r]
  text: >-
    At both, and hence necessarily: at the first by the draft's main theorem with the empty
    distinguished set, since an arrow to the first object is automatically a permutation and so
    separated, while for arrows to the second splicing is unconstrained; at the second trivially,
    since its domains are closed under arbitrary unions.

- fails: [rigid-comprehension-r]
  text: >-
    No rigid property of individuals is coextensive with the universal one. Weak persistence
    together with finite pinning forces any candidate to contain every pair whose arrow targets
    the second object, so its transport there is the top property. But the property of being in
    the range of one's arrow is symmetric and persistent, its extension at that world is
    everything, and the top property does not entail it, because the arrows out of the second
    object include non-surjections. So the rigidity criterion fails at that world.

- fails: [necessary-barcan-r, no-pure-contingency-r]
  text: >-
    The draft records that the type-e instance of BF is true at the base world and false at the
    second object, so BF is true while boxed BF is false; that is what the violation of boxed BF
    records, and it also refutes No Pure Contingency, since that instance is a closed pure
    sentence true at the base and false at an accessible world.

- fails: [distinctness-necessary-r]
  text: >-
    At type e because some arrow to the second object collapses two individuals.

# --- later additions ---

- holds: [axiom-of-infinity-e, axiom-of-infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary, which is the text.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The individuals are the natural numbers and identity at the identity arrow is literal, so no
    numeral counts them. The propositions that a given individual is fixed by the arrow, one for
    each individual, are pairwise distinct, symmetric and pinned by that individual, so there are
    infinitely many propositions. The set of numerals at each type is invariant under every arrow,
    hence symmetric and pinned by the empty set, so finite cardinality is standard and no finite
    cardinality holds of the universal property at either type.

- id: sigma-top
  fails: [witnessed-possibility-r, independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.
    Everything that implies these fails with them.

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Let $a$ be the set of arrows from the first object to itself, all permutations, a symmetric
    proposition true at the identity and, as the record’s Actuality witness, entailed by no other
    truth. For a true $p$, $a\le p$. Take $q:=a$: under a permutation $i$, $p$ holds since $i\in
    a\subseteq p$; under a non-permutation $i$, $\Diamond a$ would need $k\circ i$ to be a
    permutation, and no arrow from the second object returns to the first. So every truth is
    $\Box_{\ne}$-necessary.

- fails: [relational-choice-r]
  # migration: the closing "Argument of 23 September 2026, after Cian Dorr’s observation that a
  # choice over the individuals cannot be finitely pinned down;" becomes `by` and `date`; in what
  # followed it, "he" becomes "Cian Dorr".
  by: Claude Fable 5.1 (Anthropic), after Cian Dorr’s observation that a choice over the
    individuals cannot be finitely pinned down
  date: '2026-09-23'
  text: >-
    At the types $(e\to t)$ and $e$. Let $U:=\lambda Xy\, .\,Xy\lor\neg\exists z\, .\,Xz$, a
    closed term, hence in the domain, and serial. A functional subrelation $S$ of $U$ would lie in
    the domain at the evaluation object, so it is symmetric and pinned down by a finite set $N$.
    Two facts about such an $S$ (Dorr, draft, Lemma 21): every $g\in G$ fixing $N$ pointwise
    satisfies $g^{[\sigma]}S=S$, and symmetry gives $\langle gA,gy,g\rangle\in S$ whenever
    $\langle A,y,1\rangle\in S$; together, $\langle gA,gy,1\rangle\in S$. Now let $A$ be the
    property of not belonging to $N$, evaluated at the first object, where the domain is symmetric
    and finitely pinned. It is in the domain, being pinned down by that finite set and symmetric,
    and its extension is nonempty, so $S$ relates $A$ at the identity to some $y$ in its
    extension. The transposition of $y$ with another individual of the first object outside $N$
    lies in $G_{W_0}$, fixes $A$ and moves $y$ to some $gy\ne y$, so $S$ relates $A$ to $gy$ as
    well, and $S$ is not functional at the identity arrow. The well-ordering of the individuals
    that Cian Dorr had in mind is refuted by the same two facts, but the direct route needs no
    derivation of a well-ordering from Relational Choice in C.

- fails: [atomicity-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The symmetry group of $W_0$ is an atom, but no atom lies inside the nonempty proposition of
    the arrows into $W_1$, which is pinned down by the empty set since targets are: a nonempty
    symmetric $p$ of such arrows pinned down by $N$ and containing $h$ contains every arrow into
    $W_1$ whose restriction to $N$ has the same fibres as $h$’s, the symmetry group of $W_1$ being
    all permutations, and those agreeing in that sense on $N\cup\{m\}$ form a smaller nonempty
    symmetric proposition.

- fails: [pure-b-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The type-$e$ instance of BF is a closed pure sentence true at the base world and false at the
    second object, and no arrow leads back from the second object, so at that world the sentence
    is not even possible.

