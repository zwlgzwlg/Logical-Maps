arguments:
- id: supported-coordinate-atoms-and-joins
  holds: [strong-atomicity-r, boolean-completeness-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    The global old and local new wreath actions preserve the category and recursive domains.
    The union tables of an admitted family are constant outside its finite replica support;
    independent local new permutations make the common table invariant under every new
    permutation, and global old permutations give a common finite old pin. The resulting
    coordinate union is admitted and is its least upper bound. Every nonzero entity contains
    a singleton free-coordinate atom, whose nonzero old transports are a strong proposition
    conjoined with a tuple haecceity. They decide every relation in the full target domain.
    See §§1–5 of the writeup.
- id: necessary-atomicity-and-propositional-completeness
  holds: [necessary-atomicity-r, necessary-boolean-completeness-t]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    Root Strong Atomicity gives root Atomicity. At both unchanged old objects the finite-pin
    stable-class proof supplies all-type Atomicity. Their proposition algebras have four and
    eight elements, so are complete; root Boolean Completeness includes type t. These are all
    possible target objects, yielding precisely the two necessary verdicts. See §§5–6.
- id: propositional-barcan
  holds: [barcan-t]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    Each y-arrow and each good z-arrow is onto the full target proposition domain. For one
    fixed admitted root property F of propositions, the hypothesis that every root proposition
    necessarily has F therefore makes all its replica rows universal. Outside F's finite
    exceptional set such a row is its eventual old O table, so that table and every bad x-row
    are universal as well. This proves the native current BF_t instance, with full target
    quantification and no uniform bound on the exceptions of all bound propositions. See §6.
- id: preserved-old-tail-failures
  fails: [necessary-inextensible-comprehension-r, necessary-boolean-completeness-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    At accessible E the universal individual property has no inextensible coextension: its
    finite pin makes all E-target rows universal, while inextensibility excludes new individuals
    at O and fails after their subsequent injection back into E. At accessible O the admitted
    family of old-individual haecceities has no least upper bound, by two injections agreeing
    on a proposed finite pin and identifying the images of a fresh old and fresh new individual.
    The failures occur at et. Old domains and outgoing arrows are unchanged. See §7.
- id: relational-barcan
  fails: [barcan-relational]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    No root et-entity transports to the whole haecceity of a new O-individual. At x-arrows its
    current row is new-invariant; at z-arrows two exits agreeing on all old individuals but
    exchanging two new ones give equal rows for a transported entity and unequal rows for
    that haecceity. The admitted constant-replica property excluding exactly these new
    haecceities therefore holds necessarily of every current et-entity but misses a full
    target entity. This refutes BF_et and hence the relational schema. See §8.
- id: necessary-rigid-power
  holds: [necessary-rigid-power-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: wreath-cofinite-old-new-entrance
  text: >-
    Every rigid root carrier is an exact-image profile. Its whole cofinite compatibility,
    together with injective E-originating tuple transport, gives one finite replica exception
    set outside which good transport agrees pointwise with the old inclusion on the entire
    carrier. Every finitely supported subcarrier therefore has an admitted rigid exact-image
    profile. The inverse image of any admitted target rigid subrelation is supported: at cone
    arrows use the common pointwise E pin, and at good replicas use the target relation's own
    finite setwise pin. Thus every target rigid subrelation lifts, and the admitted power
    property has exact-image rows and is rigid. The unchanged E/O tail satisfies Rigid Power
    independently, giving its necessary all-type form. See §9 of the writeup.
notes: >-
  ZFC construction. Boolean Completeness is internal to admitted families; all-type completeness
  is asserted currently, and necessary completeness only at t. Necessary propositional Barcan
  fails at the unchanged E tail; the writeup gives its direct witness and the map derives this
  failure from the retained verdicts. The old/new tail and the wreath action distinguish this
  model from the nominal sections/projection entrance.
