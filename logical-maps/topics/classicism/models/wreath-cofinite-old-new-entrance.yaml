id: wreath-cofinite-old-new-entrance
name: Wreath-supported cofinite entrance over old and new individuals
definition: >-
  Use the base-individual symmetric old/new tail: E has individuals N, O has N disjoint union N',
  E-to-E arrows are all injections, E-to-O arrows have old range, O-to-E arrows are all injections,
  and O-to-O arrows are sort-preserving permutations G_O or old-range injections. Keep its symmetric
  finitely pinned domains. Add root R with individuals N, arrows y_u and x_u corresponding to old
  arrows out of E, and distinct replicas z_(n,g):R-to-O for n in N and g in G_O. A good O symmetry
  postcomposes z_(n,g) to z_(n,kg); the first exiting arrow h sends it to y_(hgi) or x_(hgi), where
  i:E-to-O is old inclusion. At each relational type, a root entity has a supported current table,
  an admitted E-entity a, and finitely supported O tables C_n eventually equal to a_i. Its replica
  transports have G_O rows g[C_n] and exiting rows a_(hi). Root support uses global old permutations,
  permutations of the replica indices, and independent new-individual permutations at each replica.
  The writeup gives the exact recursive domain, support, action and transport rules. Evaluate at R.
