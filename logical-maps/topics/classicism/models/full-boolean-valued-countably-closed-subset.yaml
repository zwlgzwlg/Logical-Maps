id: full-boolean-valued-countably-closed-subset
name: Full Boolean-valued model with countably closed subset forcing
definition: Inside a countable M satisfying ZFC+CH, let A be the regular-open completion of the forcing
  of countable partial functions omega_1→2. Put B=2×A and use the internally full relational hierarchy
  with D_e=omega^M. Externalize standard finite types and evaluate at the isolated atom (first-coordinate
  truth); necessity is the top test. The forcing preserves reals, omega_1 and CH while adding a new subset
  of omega_1. The writeup constructs all-carrier rigid real fields and verifies the full native represented-power
  obstruction.
