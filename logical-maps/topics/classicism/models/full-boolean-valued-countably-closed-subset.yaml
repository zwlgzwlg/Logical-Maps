  writeup: full-boolean-valued-countably-closed-subset
  text: A continuum antichain supplies all non-e carrier capacity; endpoint fields remain complete because
    no reals are added, while e is vacuous. Ground and forced CH, with field categoricity below every
    candidate Boolean support, make the boxed universal CH assertion top at each type. See the positive
    AN and CH proofs.
- id: new-subset-defeats-all-unary-powers
  fails:
  - second-order-analytic-necessitism
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-countably-closed-subset
  text: The generic subset of omega_1 is forced unequal to every ground subset. By CH transfer it to each
    prospective rigid real carrier. Rigid relations and a qualifying rigid family have endpoint-valued
    ground supports; every selected representative has agreement value zero in the forcing coordinate.
    Their existential join cannot be top, so the boxed representation clause fails for every candidate.
    The t, arity-one SOAN instance has true antecedent and false consequent.
notes: Relative consistency upper bound from Con(ZFC). CH is stable, but full Necessity of Second-Order
  Analysis is not asserted. No transitive ground or large-cardinal assumption. Necessary BF is derived.
  This is separate from the no-new-reals collapse variant because the forcing and CH premise differ.
