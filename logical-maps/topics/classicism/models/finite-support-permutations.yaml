# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the fixed individual "$d$", used nowhere else in the record.
settings:
  monoid: >-
    Proposition D.5, part 1 (pp. 75–76): the one-object category whose arrows are all the
    permutations of $\mathbb N$, so that each arrow $h$ represents the possibility in which each
    individual $n$ plays the role actually played by $hn$, and the roles can be redistributed in any
    way.
  sigma: top
meets:
  evens-avoidable: >-
    Let $i$ swap an even $b$ and an odd $o$, both outside $N_0$, and let $N^{\prime}:=\{o\}$: an
    arrow agreeing with $i$ on $\{o\}$ sends $o$ to $b$, so, being injective, it sends no even
    number to $b$.

