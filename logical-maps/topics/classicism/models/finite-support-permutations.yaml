notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References.

  Under it the signature schemata that give the constants a special role fail: with $c\in\Sigma$
  of relational type $\tau$, $c=\top_\tau$ necessarily, so Witnessed Possibility fails for the
  pure formula $x\ne\top_\tau$, Separated Structure fails since $\lambda x\, .\,x$ and $\lambda
  x\, .\,\top_\tau$ agree on $c$, Independence (signature Σ) fails since $c$ denotes what a
  closed pure term denotes, and Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$
  is true and unprovable. But No Contingency (signature Σ), and with it B for sentences of Σ,
  hold. Boolean Completeness fails here through C5 and the failure of Actuality (Propositions
  2.5–2.6), which gives nothing about countable families; but the part 2 argument transfers: the
  strongest persistent property pinned down by a finite $X$ whose extension contains the even
  numbers has, at an arrow $h$, the extension $h(X\cap\text{evens})\cup(\mathbb N\setminus hX)$,
  which strictly shrinks as $X$ grows, so the haecceities of the even numbers have no least
  upper bound. Countable Boolean Completeness fails as well, at type $e\to t$: the property $E$
  that the source shows to lack a least upper bound has as its extension a countable family of
  haecceities, and the extensional fullness the source invokes to put $E$ in the domain also
  puts in the relation pairing the haecceity of the $k$-th member of that family with the
  numeral $k$, which injects $E$ into the numerals. Distinctness-preserving collapse fails:
  every arrow $h$ has an inverse, so for any true $q$ the arrow $q$-member$\circ h^{-1}$ carries
  $h$ into $q$, making $\Diamond q$ true everywhere; so $\Box(\Diamond q\to p)$ would need
  $p=\top$, and the true proposition that $0$ is fixed is not $\top$. Observations of 23
  September 2026, answering Cian Dorr’s question whether the failure of Actuality can be
  sharpened to a failure of Inextensible Comprehension, in the simpler form and with the
  type-$(t\to t)$ instance of 25 September 2026. Boolean Completeness fails at type $t$ as well,
  which the source (n. 92) conjectures but does not show. Observation of Claude Fable 5.1
  (Anthropic), 25 September 2026; not in the source.

