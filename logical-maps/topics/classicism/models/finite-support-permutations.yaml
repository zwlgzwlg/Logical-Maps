id: finite-support-permutations
name: 'Finite-support action model: permutations of N'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: stated
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, Proposition D.5, part 1, pp.
  74–76; p. 79 (No Pure Contingency).
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Appendix D, Proposition D.5(1), pp. 74–75; construction pp. 75–76; p. 79 (No Pure Contingency)

# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the fixed individual "$d$", used nowhere else in the record.
settings:
  monoid: >-
    Proposition D.5, part 1 (pp. 75–76): the one-object category whose arrows are all the
    permutations of $\mathbb N$, so that each arrow $h$ represents the possibility in which each
    individual $n$ plays the role actually played by $hn$, and the roles can be redistributed in any
    way.
  sigma: top

meets:
  homogeneous-individuals: >-
    The arrows are all the permutations of $\mathbb N$, and conjugation by any of them is an
    automorphism of the model, carrying each individual to its image.
  evens-avoidable: >-
    Let $i$ swap an even $b$ and an odd $o$, both outside $N_0$, and let $N^{\prime}:=\{o\}$: an
    arrow agreeing with $i$ on $\{o\}$ sends $o$ to $b$, so, being injective, it sends no even
    number to $b$.
  unbounded-haecceities: >-
    With $A$ the even numbers, the part 2 argument transfers: the strongest persistent property
    pinned down by a finite $X$ whose extension contains the even numbers has, at an arrow $h$, the
    extension $h(X\cap\text{evens})\cup(\mathbb N\setminus hX)$, which strictly shrinks as $X$
    grows.
  no-least-pinned-cover: >-
    Let $F$ be the family of propositions $A_m$ ($m\ge1$), each pinned down by $\{0,m\}$, that the
    permutation swaps $0$ and $m$. A permutation $\pi$ belongs to the least superset of $\bigcup F$
    pinned down by $S=\{0,\ldots,N\}$ iff either $\pi(0)\in S\setminus\{0\}$ and $\pi(\pi(0))=0$,
    or $\pi(0)\notin S$ and $0\notin\pi(S)$; the $3$-cycle $(0\ N{+}1\ N{+}2)$ satisfies the second
    clause for $S$ but neither clause for $\{0,\ldots,N+1\}$, so these supersets strictly shrink.

arguments:

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. What follows is this record's own.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.

- holds: [distinctness-necessary-r, atomlessness]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(1), pp. 75–76'}
  text: >-
    Every arrow is invertible, so transport along it is injective at every type.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The reason for No Distinctness Necessity's holding, added so that it visibly covers the
      variant with a single individual; Atomlessness concerns propositions only.

- fails: [weakly-inextensible-comprehension-r]
  # Recorded although the group's shared argument gives the verdict at type e→t: this one shows the
  # failure at type t→t, and the argument for Weakly Inextensible Comprehension in
  # finite-support-two-object-all-maps refers to it.
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of
    Actuality can be sharpened to a failure of Inextensible Comprehension
  date: '2026-09-23'
  text: >-
    At type $t\to t$, for the family $E$ of propositions $p_n$ that $n$ is fixed: for $Y$ weakly
    inextensible with extension $E$ pinned down by $S$, pick $k\notin S$ and let $X$, pinned down
    by $S_X:=S\cup\{k\}$, hold at an arrow $h$ exactly of the propositions $\{i : i(m)=n\}$ with
    $n\notin S_X$ and of the propositions $\{i : i(h(n))=n\}$ with $n\in S_X$; $X$ is necessary
    of every $p_n$, but at a permutation $h$ fixing $S$ pointwise and moving $k$ its extension
    omits $p_k$, which the extension of $Y$ at $h$ contains. Inextensible Comprehension fails
    with it.
  revisions:
  - date: '2026-09-25'
    by: Claude Opus 5.5 (Anthropic)
    note: >-
      Merged the two sets of arguments recorded on 23 and 25 September into one: the simpler 25
      September argument for Inextensible Comprehension, which also refutes the weak form,
      replaces the 23 September one.
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      Cut to its type $t\to t$ part; the type $e\to t$ part duplicated the group's shared argument
      weakly-inextensible-comprehension, which applies here.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. The source derives the failure of Boolean Completeness through C5 and the failure of Actuality
  (Propositions 2.5–2.6), which gives nothing about countable families.

was_conjectured: true

# The old `changes` log, verbatim and frozen.
history:
- date: '2026-09-17'
  by: OpenAI Codex (GPT-6)
  summary: Adopted the source’s relational type system at the user’s request. The cited construction now
    directly supplies the recorded model; the former type-extension obligation is removed.
  satisfies:
  - distinctness-necessary-r
  - barcan-r
  - no-pure-contingency-r
  - necessary-distinctness-necessary-r
  - necessary-barcan-r
  - atomlessness
  violates:
  - atomicity-r
  - actuality
  - boolean-completeness-r
  - rigid-comprehension-r
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the evaluation arrow is literal, so no numeral counts them. The propositions that
    a given individual is fixed by the arrow, one for each individual, are pairwise distinct and each
    has that individual as finite support, so there are infinitely many propositions. The set of numerals
    at each type is invariant under every arrow, hence has empty support and lies in the domain, so finite
    cardinality is standard and no finite cardinality holds of the universal property at either type.
  satisfies:
  - axiom-of-infinity-e
  - axiom-of-infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: Expanded the description from Appendix D, naming Proposition D.5 and its part; added the failure
    of Countable Boolean Completeness at type e→t; settled the Distinctness-preserving collapse.
  violates:
  - countable-boolean-completeness-r
  - distinctness-preserving-collapse
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: Re-fixed the interpretation of Σ so as to settle No Contingency (signature Σ) and B for sentences
    of Σ, at Cian Dorr’s request; see the notes.
  satisfies:
  - no-contingency-signature-r
  - signature-b-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Added Relational Choice and its necessitation at Cian Dorr’s direction: ideally full models
    are extensionally full at every object, and choice in the metatheory supplies the functional subrelation;
    see the notes.'
  satisfies:
  - relational-choice-r
  - necessary-relational-choice-r
- date: '2026-09-25'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Added Transversal Choice, by the argument recorded for Relational Choice: the model is extensionally
    full at every object, so for an equivalence relation at the evaluation point a transversal of its
    extension there, chosen in the metatheory, is the extension of an element pinned down by the empty
    set; the equivalence and transversal conditions are unboxed. Recorded on a question of Zachary Goodsell,
    after an observation of Christopher Sun.'
  satisfies:
  - transversal-choice-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: Recorded the failure of Inextensible Comprehension at type e→t for the property of being even,
    sharpening the failure of Actuality; argument in the notes.
  violates:
  - inextensible-comprehension-r
- date: '2026-09-25'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added the failure of Boolean Completeness (type t) and of Inextensible Comprehension, with
    the arguments in the notes.
  violates:
  - boolean-completeness-t
  - inextensible-comprehension-r
- date: '2026-09-25'
  by: Claude Opus 5.5 (Anthropic)
  summary: 'Merged the two sets of arguments recorded on 23 and 25 September into one: the simpler 25
    September argument for Inextensible Comprehension, which also refutes the weak form, replaces the
    23 September one.'
  violates:
  - weakly-inextensible-comprehension-r

