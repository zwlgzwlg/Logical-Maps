- holds: [distinctness-necessary-r, atomlessness]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(1), pp. 75–76'}

- holds: [no-pure-contingency-r]
  source: {paper: bacon-dorr-classicism, locator: 'p. 79'}
  text: >-
    Boxed positive flags use the source’s explicit one-object No Pure Contingency observation,
    applied separately to each closed instance.

# --- later additions ---

- holds: [axiom-of-infinity-e]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary, which is the text.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The individuals are the natural numbers and identity at the evaluation arrow is literal, so no
    numeral counts them. The propositions that a given individual is fixed by the arrow, one for
    each individual, are pairwise distinct and each has that individual as finite support, so
    there are infinitely many propositions. The set of numerals at each type is invariant under
    every arrow, hence has empty support and lies in the domain, so finite cardinality is standard
    and no finite cardinality holds of the universal property at either type.

- id: sigma-top
  fails: [independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    With $c\in\Sigma$ of relational type $\tau$, $c=\top_\tau$ necessarily, so Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, Separated Structure fails since
    $\lambda x\, .\,x$ and $\lambda x\, .\,\top_\tau$ agree on $c$, Independence (signature Σ)
    fails since $c$ denotes what a closed pure term denotes, and Distinctness Maximalism
    (signature Σ) fails since $c=\top_\tau$ is true and unprovable.

- holds: [no-contingency-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-23'
  text: >-
    The relational constants denote pure entities, so a closed Σ-sentence denotes what some
    $P(d,\ldots,d)$ denotes for a pure formula $P$; the model’s automorphisms carry every
    individual to every other, so $P(d,\ldots,d)$ is materially equivalent to the pure sentence
    $\forall x\, .\,P(x,\ldots,x)$ and its negation to $\forall x\, .\,\neg P(x,\ldots,x)$;
    whichever is true is necessary by No Pure Contingency, and instantiation under the box gives
    $\Box P(d,\ldots,d)$ or $\Box\neg P(d,\ldots,d)$.

- fails: [boolean-completeness-r]
  # migration: `by` and `date` are those of the 23 September change that added Countable Boolean
  # Completeness; the commit that made it added this text.
  # Recorded although the other verdicts give it: the Countable Boolean Completeness argument builds
  # on this one.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Through C5 and the failure of Actuality (Propositions 2.5–2.6), which gives nothing about
    countable families; but the part 2 argument transfers: the strongest persistent property
    pinned down by a finite $X$ whose extension contains the even numbers has, at an arrow $h$,
    the extension $h(X\cap\text{evens})\cup(\mathbb N\setminus hX)$, which strictly shrinks as $X$
    grows, so the haecceities of the even numbers have no least upper bound.

- fails: [countable-boolean-completeness-r]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    At type $e\to t$: the property $E$ that the source shows to lack a least upper bound has as
    its extension a countable family of haecceities, and the extensional fullness the source
    invokes to put $E$ in the domain also puts in the relation pairing the haecceity of the $k$-th
    member of that family with the numeral $k$, which injects $E$ into the numerals.

- id: relational-choice
  holds: [relational-choice-r]
  # migration: `by` renders the closing "Cian Dorr’s observation of 23 September 2026." and the
  # change's author.
  # Recorded although Transversal Choice gives it: the Transversal Choice argument builds on this
  # one.
  by: Cian Dorr (observation); recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The model is ideally full, hence extensionally full at every object (Appendix D, the remark
    after Definition D.3): for any set $R$ of tuples from the domains at an object $V$, the
    intension that assigns to every arrow out of $V$ into an object $U$ a fixed set $R_U$ of
    tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$, so it is the intension
    of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation $U$
    serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph
    is such an $R$, and its element $S$ is functional and a subrelation of $U$ at $1_V$, both
    conditions being unboxed. The closed Relational Choice instance is true at an arrow $h\colon
    W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those of
    the model, so it holds at every arrow and $\Box$Relational Choice follows.

- fails: [weakly-inextensible-comprehension-r]
  # migration: the closing "Observations of 23 September 2026, answering …, in the simpler form and
  # with the type-$(t\to t)$ instance of 25 September 2026." becomes `by`, `date` and the revision,
  # whose note is the 25 September change.
  # Recorded although the other verdicts give it: the argument for Weakly Inextensible Comprehension
  # in finite-support-two-object-all-maps refers to this one.
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of
    Actuality can be sharpened to a failure of Inextensible Comprehension
  date: '2026-09-23'
  text: >-
    At type $e\to t$, for the property of being even, which is in the domain as the constant
    intension, pinned down by $\emptyset$; indeed no coextension $Y$ is even weakly inextensible,
    so Weakly Inextensible Comprehension fails too. For an odd $o$, the property of being distinct
    from $o$ is necessarily true of each even number, as permutations never collapse two
    individuals; so weak inextensibility would give $Y\le\lambda x\, .\,x\ne o$ for every odd $o$,
    and the extension of $Y$ at every arrow $h$ would lie within $h(\text{evens})$. But if $Y$ is
    pinned down by the finite set $S$, a permutation $h$ fixing $S$ pointwise has $h\cdot Y=Y$, so
    the extension of $Y$ at $h$ is the evens, and $h$ may swap an even and an odd number outside
    $S$. Both fail at type $t\to t$ as well, for the family $E$ of propositions $p_n$ that $n$ is
    fixed: for $Y$ weakly inextensible with extension $E$ pinned down by $S$, pick $k\notin S$ and
    let $X$, pinned down by $S_X:=S\cup\{k\}$, hold at an arrow $h$ exactly of the propositions
    $\{i : i(m)=n\}$ with $n\notin S_X$ and of the propositions $\{i : i(h(n))=n\}$ with $n\in
    S_X$; $X$ is necessary of every $p_n$, but at a permutation $h$ fixing $S$ pointwise and
    moving $k$ its extension omits $p_k$, which the extension of $Y$ at $h$ contains.
  revisions:
  - date: '2026-09-25'
    by: Claude Opus 5.5 (Anthropic)
    note: >-
      Merged the two sets of arguments recorded on 23 and 25 September into one: the simpler 25
      September argument for Inextensible Comprehension, which also refutes the weak form,
      replaces the 23 September one.

- holds: [transversal-choice-r]
  # migration: `by` adds the summary's last sentence; the lead-in "Added Transversal Choice, by"
  # becomes "By".
  by: Claude Fable 5.1 (Anthropic), on a question of Zachary Goodsell, after an observation of
    Christopher Sun
  date: '2026-09-25'
  text: >-
    By the argument recorded for Relational Choice: the model is extensionally full at every
    object, so for an equivalence relation at the evaluation point a transversal of its extension
    there, chosen in the metatheory, is the extension of an element pinned down by the empty set;
    the equivalence and transversal conditions are unboxed.

- fails: [boolean-completeness-t]
  # migration: the first sentence rewrites "Boolean Completeness fails at type $t$ as well, which
  # the source (n. 92) conjectures but does not show."; the closing "Observation of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source." becomes `by` and `date`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The source (n. 92) conjectures this but does not show it. Any set $F$ of propositions is the
    extension at the identity of an element of the domain at type $t\to t$, namely the profile
    $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is natural, independent of $h$ and so
    pinned down by the empty set, and each of its values is pinned down by the pinning set of $p$,
    since $i\cdot p$ depends only on the values of $i$ there. A least upper bound of $F$ under
    entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the least
    $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here let $A_m$
    ($m\ge1$) be the proposition, pinned down by $\{0,m\}$, that the permutation swaps $0$ and
    $m$. A permutation $\pi$ belongs to the least superset of $\bigcup_mA_m$ pinned down by
    $S=\{0,\ldots,N\}$ iff either $\pi(0)\in S\setminus\{0\}$ and $\pi(\pi(0))=0$, or
    $\pi(0)\notin S$ and $0\notin\pi(S)$; the $3$-cycle $(0\ N{+}1\ N{+}2)$ satisfies the second
    clause for $S$ but neither clause for $\{0,\ldots,N+1\}$, so these supersets strictly shrink.
    So $F$ has no least upper bound, and, taking pointwise negations, the family of complements
    has no greatest lower bound.

