id: finite-support-permutations
name: 'Finite-support action model: permutations of N'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, Proposition D.5, part 1, pp.
  74–76; p. 79 (No Pure Contingency).
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: Appendix D, Proposition D.5(1), pp. 74–75; construction pp. 75–76; p. 79 (No Pure Contingency)

# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
definition: >-
  Proposition D.5, part 1 (pp. 75–76): the one-object category whose arrows are all the
  permutations of $\mathbb N$, so that each arrow $h$ represents the possibility in which each
  individual $n$ plays the role actually played by $hn$, and the roles can be redistributed in any
  way. In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and the model is
  ideally full: a proposition is a set of arrows whose membership depends only on the arrows’
  values on some finite set of individuals (it is pinned down by that set), an entity of a higher
  type is an applicative behaviour profile pinned down by a finite set in the same sense, and the
  individuals are the natural numbers acted on by the arrows themselves. Propositions and
  properties are thus about finitely many individuals and indifferent to how the arrows treat the
  rest. Evaluation point: the sole object, at the identity arrow.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual $d$.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
