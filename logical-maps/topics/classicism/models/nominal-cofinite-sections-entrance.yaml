id: nominal-cofinite-sections-entrance
name: Nominal cofinite entrance over sections and projection
definition: Use the original finitely pinned sections/projection tail A=N, B=N×2, with sections f_T, projection
  p and e_T=f_T p. Fix S={0} and its finite pattern set 2^S. Add root O with one individual, y:O→A, x_T=f_T
  y, and distinct z_(eta,n):O→B, with p z=y and e_U z=x_U. Evaluate at O. The external group product_eta
  Sym(N) permutes replicas and fixes the old tail. At every relational type admit exactly the root profiles
  with a finitely supported current row, arbitrary A identity row, and eventually constant B identity-table
  sequences in each pattern, with their eventual tables supplying the x_T rows. The writeup defines the
  recursive action, landing and transport. Old domains and outgoing arrows are unchanged.
