arguments:
- id: strong-atoms-and-internal-joins
  holds:
  - strong-atomicity-r
  - boolean-completeness-r
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-sections-entrance
  text: The external replica action gives whole-entity finite supports and C closure. An admitted actual
    family has a finite support; replica transpositions force its coordinate unions to be eventually constant
    as whole old tables. Free-coordinate order proves leastness. Every nonzero profile contains a root/y/replica
    singleton whose nonzero transports are literal atoms in the full target algebra. Writeup §§4–7.
- id: unchanged-tail-failures
  fails:
  - necessary-inextensible-comprehension-r
  - necessary-atomicity-t
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-sections-entrance
  text: At accessible A the unchanged universal individual property has no inextensible coextension (the
    section graph is not finitely pinned). A nonzero section-supported proposition splits at every fresh
    coordinate outside any finite pin and has no atom below it. Writeup §§8–9.
- id: missing-common-pin-proposition
  fails:
  - barcan-t
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-sections-entrance
  text: For k outside S the A proposition testing T(k) is admitted but is not the y-image of a root proposition.
    The admitted tt root predicate has universal current/replica rows and excludes just this proposition
    at its A identity row, giving forall P Box F(P) but not Box forall P F(P). Writeup §9.
notes: ZFC construction. Completeness is internal for admitted families; the proposition algebra is externally
  incomplete. No choice, boxed completeness or boxed strong atomicity verdict is asserted.
