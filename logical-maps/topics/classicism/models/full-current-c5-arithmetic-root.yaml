id: full-current-c5-arithmetic-root
name: 'Full present: Rosser-selected C5 component'
definition: 'Let A be the countable pointed classical Henkin C5 component selected in symmetric-cohen-arithmetic-contingency,
  Sections 1–2: its canonical arithmetic satisfies Box I*_e and disagrees with standard arithmetic about
  the fixed standard-true Rosser sentence G. Keep every original application, quantifier and parameterized
  lambda operation of A. Form a new model R with individuals omega times A_e and projection q_e onto A_e.
  For each flattened relational type tau = alpha_1 ... alpha_k t, including k = 0, take all pairs (S,a),
  where S is an arbitrary subset of the product of the R_alpha_i and a is an A_tau entity. Application
  and abstraction use the current row and the original A operation on projected parameters; a quantified
  formula uses the full current R domain in its truth coordinate and the full original A domain in its
  A coordinate. Evaluate at the new classical present. Interpret any fixed relational signature constants
  by their top entities. The construction and its C interpretation are given in the writeup; this is a
  different root from the symmetric Cohen construction.'
