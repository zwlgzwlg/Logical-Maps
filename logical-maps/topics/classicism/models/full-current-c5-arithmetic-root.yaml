arguments:
- id: necessary-powers
  holds:
  - necessary-weakly-rigid-power-r
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: full-current-c5-arithmetic-root
  text: At each finite argument tuple, a pair (S,f) is rigid exactly when f is rigid in the C5 component
    and its current component extension is the projection of S. Crisp complement tests prove the reverse
    image inclusion; component weak inextensibility proves sufficiency. Every admitted rigid component
    subrelation of f then lifts to a rigid subrelation of (S,f). The literal canonical power therefore
    has exactly the component canonical power as its projected extension. The C5 power theorem and the
    pair necessity clause give necessary Rigid Power. The same image argument sends a weakly rigid root
    relation to a weakly rigid component relation; component Tame Rigidity and its necessitation give
    necessary Tame Rigidity at the root. Their recorded composition gives necessary Weakly Rigid Power.
    The argument includes the nullary case and mixed individual arguments. Sections 3–5.
- id: arithmetic-contingency
  fails:
  - necessity-of-arithmetic
  - arithmetic-necessitism
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: full-current-c5-arithmetic-root
  text: Full current rows admit the standard numeral orbit as an induction test, and separate recursion
    tests make native Sum and Prod standard there. The same sentence G has whole value (true,g), where
    g differs from the component top, while I*_e is the whole top pair. Thus both Box(I_e implies G) and
    Box(I_e implies not G) fail with Box I*_e true. The component has a nonstandard current number c;
    pair the full current row with its predicate n not equal to c. This test is necessarily true of every
    current root number, but the full component quantifier witnesses failure of the necessary inclusion
    of N_e in it. Hence N_e is not weakly inextensible, and Arithmetic Necessitism fails at e with its
    guard true. Sections 6–7.
notes: 'One model combines the power and arithmetic assertions. Necessary Rigid Power and necessary Tame
  Rigidity are proved directly in the writeup and also follow from the minimal necessary-Weakly-Rigid-Power
  seed through the recorded rules. The component''s NoReal properties are not transferred to this different
  root: no Analytic Necessitism, SOAN, Boolean Completeness or root C5 verdict is asserted. The arithmetic
  failures concern type e; no necessary failure or failure at every counting type is claimed. This is
  an informal mathematical proof with no independent human check or new Lean verification.'
