  writeup: functional-choice-countermodel
  text: Sections 3–4 construct every admitted type and prove term locality, whole-object substitution,
    beta, eta, and the H-restricted Logical Equivalence schema. Section 5 represents every set function
    between the domains at r with relational output, giving all-type Functional Choice. Section 6 gives
    an admitted family of propositions with no supremum in 2 x (P(N)/Fin). The failure of full Boolean
    Completeness and Rigid Comprehension follows through the existing implications.
notes: Functional Choice is unboxed. Boolean Completeness fails at proposition type t. Section 9 separately
  shows why the construction does not satisfy necessary Functional Choice.
