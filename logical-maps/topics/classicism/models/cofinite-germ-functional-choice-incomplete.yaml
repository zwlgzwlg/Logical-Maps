id: cofinite-germ-functional-choice-incomplete
name: 'Cofinite-germ model: Functional Choice without Boolean Completeness'
definition: At r in the cofinite-neighborhood germ model over {r} union N, all relational domains are
  germs of arbitrary pointwise relation tables. D_e is a singleton; application and lambda abstraction
  are table slicing and tabulation; quantifiers use full point domains. The proposition algebra at r is
  2 x (P(N)/Fin). See complete accompanying proof note.
