definition: >-
  Over ZFC start with the full singleton-individual action model on A,B, generated by h:A->B
  and distinct j_1,j_2:B->A with j_i h=1_A and e_i=h j_i. Add a root R, with singleton individuals,
  arrows y:R->A and x,z_n:R->B (n in N), and no nonidentity arrow into R. Put hy=x,
  j_i x=j_i z_n=y, and e_i x=e_i z_n=x. The replica z_n arrows remain distinct and are not factored
  through fresh A arrows. The old domains and outgoing arrows stay full and unchanged.

  For a relational type tau, an old A entity a has rows A_0 at 1_A and A_1 at h.
  For any B-current table C, b(a,C) has row C at 1_B, A_0 at each j_i and A_1 at each e_i.
  Then j_i b(a,C)=a and e_i b(a,C)=ha as whole entities. A root relation consists of a current
  tuple extension K with finite support under replica permutations, an arbitrary old a, and B-current
  tables C_n equal to A_1 outside a finite set. Its whole transports are yX=a, xX=ha,
  z_nX=b(a,C_n). Define the action and root domains recursively on argument types. Replica permutations
  act on root arguments and on the C_n sequence, fixing all old entities. At each object, truth,
  application and quantifiers use its full admitted domain. Evaluate at R. The write-up proves
  closure, C soundness and the whole-profile order.
arguments:
- id: self-atomic-free-coordinates
  holds: [self-atomicity-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-double-retraction-entrance
  text: >-
    Necessary inclusion is inclusion at the free coordinates K, A_0 and every C_n. Each nonzero
    relation contains a singleton at one of these coordinates. Root-current and replica singletons
    are strong. An A_0 singleton becomes an ordinary atom at A and a false-current two-j-row
    profile at B. It is an atom wherever instantiated and therefore is a self-atom, although
    it is not strong. Any nonzero dependent A_1 row appears cofinitely among the C_n rows and
    is covered by a replica singleton. This proves all-type Self-Atomicity. See sections 5–6.
- id: supported-joins-and-necessary-atomicity
  holds: [necessary-boolean-completeness-r, necessary-atomicity-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-double-retraction-entrance
  text: >-
    A current family has a finite support J. Union its free rows. The union current row is
    J-supported, and transpositions outside J make the union C_n tables equal outside J.
    Recompute A_1 as that common table and choose the full A entity with this row and the
    union A_0 row. The resulting admitted entity is the least upper bound in the exact free
    order; complements give greatest lower bounds. The coordinate singleton atoms also give
    root Atomicity. All old typed profile algebras are full and finite, so both properties hold
    at every old point as well. These are the boxed all-type verdicts. See sections 5–7.
- id: necessary-inextensible-comprehension
  holds: [necessary-inextensible-comprehension-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-double-retraction-entrance
  text: >-
    At R retain any relation's supported current extension and set all old data to bottom.
    This is an admitted inextensible coextension: every strict future image is bottom, and a
    root tester necessarily covering its current instances bounds it. At each old full object,
    exact-image profiles of arbitrary current tuple sets are admitted inextensible coextensions
    at every continuation. Thus IC holds at R,A,B. See section 9.
- id: failure-of-strong-actuality-at-the-tail
  fails: [necessary-strong-actuality]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: nominal-cofinite-double-retraction-entrance
  text: >-
    At A any true proposition contains 1_A, so its h-image contains both j_1 and j_2.
    The full B proposition with only j_1 separates them; no true proposition at A is strong.
    Since y reaches A, necessary Strong Actuality fails at R. Section 8 also directly refutes
    root Strong Atomicity_t using the nonstrong A_0 propositional atom; the map derives that
    failure from the recorded negative verdict.
notes: >-
  This one construction separates Self-Atomicity from necessary Strong Actuality while retaining
  necessary all-type BC, Atomicity and IC. Root completeness is internal to admitted families.
  Strong Atomicity_t fails and is derived; this is not a counterexample to Strong Atomicity plus
  necessary BC implying necessary IC. No claim about necessary Self-Atomicity, Barcan, Choice,
  Rigid Power or a signature expansion is made.
