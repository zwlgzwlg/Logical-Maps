definition: >-
  Use [[full-three-object-fork]]. Add a new root with one entrance to its
  initial object and countably many independent entrances to each of its two
  other objects. For each such object the corresponding whole entities must
  agree cofinitely with the projection of the initial-object entity there.
  Take arbitrary current rows, singleton individuals and top relational names.
arguments:
- id: atom-scopes
  holds: [strong-atomicity-r, necessary-atomicity-r, necessary-self-atomicity-r, necessary-atoms-are-self-atoms-r, necessary-strong-actuality, barcan-r]
  fails: [necessary-atoms-are-strong-atoms-t, necessary-barcan-t]
  choice: free
  writeup: sequence-covers-of-a-pair-and-a-fork
  text: >-
    A nonempty middle or terminal row now occurs at an isolated copy, and
    every middle-object atom is strong. These and current singletons give
    strong atoms densely at the new root. Every possible witness beyond
    the root lifts directly or on another entrance with the same tester.
    The merged address and the unequal-bit Barcan tester persist in the old fork.
- id: ordinal-benchmark-and-scalar-intervals
  holds: [forcing-possibilism]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: countable-bases-and-mathematical-possibilism
  text: >-
    Individuals are singletons throughout. Full current rows make infinite
    algebras large relative to the finite ordinal benchmark; the independent
    isolated sequence indices provide enough scalar atoms to represent every
    finite algebra.
