id: symmetric-surjections-finite-terminal
name: 'Symmetric surjections: a two-individual finite terminal'
definition: Take two objects A=N and F={0,1}, with the displayed sets as individual domains. Arrows are
  every surjection A->A, every A->F map with two infinite fibers, and every permutation F->F; there are
  no F->A arrows. Symmetries are the full permutation groups and pins are finite subsets. Rebuild the
  entire recursive hierarchy of all target-covariant finitely pinned profiles over full target tuple domains.
  Interpret relational constants by top and evaluate at A. At F this is the full finite extensional hierarchy.
