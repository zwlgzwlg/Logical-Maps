arguments:
- id: root-cylinder-splitting
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: symmetric-surjections-finite-terminal
  text: 'Every nonzero proposition, including one supported only on finite-terminal arrows, splits by
    a fresh equality cylinder: preserve its pin and extend two prescriptions that respectively identify
    and separate two fresh individuals. Both prescriptions extend to allowed arrows of the same target.
    See Section 2.'
  holds:
