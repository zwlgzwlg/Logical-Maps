notes: One joint separation of Atomlessness plus necessary Inextensible Comprehension from necessary Atomlessness.
  The writeup additionally verifies I*_t and failure of the numerical predecessor demand through a future
  3_t=4_t with 2_t different. These typed arithmetic claims are not identified with the separately named
  quantified Infinity principles. Pure Maximalism fails in this construction. The original all-surjections
  model is unchanged.
