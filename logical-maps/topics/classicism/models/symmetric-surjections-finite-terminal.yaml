- id: masked-all-type-inextensibility
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: symmetric-surjections-finite-terminal
  text: For X pinned by S, choose T containing S with at least three elements and mask X by injectivity
    on T. All finite-target transports become whole bottom. On noncollapsing A-loops a permutation adjustment
    and finite-pin lift handle every full target tuple. Both the witness inextensibility box and the outer
    comprehension box are verified. See Section 3.
  holds:
  - necessary-inextensible-comprehension-r
- id: finite-terminal-atomlessness-failure
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: symmetric-surjections-finite-terminal
  text: The accessible F hierarchy is full extensional with exactly two propositions, so Atomlessness
    fails there. See Sections 1–2.
  fails:
