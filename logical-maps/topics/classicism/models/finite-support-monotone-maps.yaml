# --- later additions ---

- id: sigma-contingent
  fails: [witnessed-possibility-r, no-contingency-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The text is the 23
  # September version; the revision note is the 23 September change.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    No Contingency (signature Σ) fails, since $\forall\bar x\, .\,c\bar x$ denotes $p_0$, true and
    false at the constant map to $1$. Witnessed Possibility fails for the pure formula
    $x=\top_\tau$, witnessed by $\top_\tau$: $\Diamond(c=\top_\tau)$ is $\Diamond\Box p_0$, and
    $\Box p_0$ holds at no arrow $h$, since the constant map to $1$ composed after $h$ moves $0$.
    Separated Structure fails with it, being equivalent to Possibly Witnessed Possibility.
    Distinctness Maximalism (signature Σ) fails by derivation, since Possibility Maximalism (pure)
    fails here. Whether $c$ denotes what some closed pure term denotes is not settled, so
    Independence (signature Σ) is left unknown. The choice of a contingent rather than a pure
    denotation is deliberate: this is the only recorded model of Atomlessness in which No
    Contingency (signature Σ) is refuted, the others being one-object models with pure
    interpretations of the constants.
  revisions:
  - date: '2026-09-23'
    by: Claude Fable 5.1 (Anthropic)
    note: >-
      Re-fixed the interpretation of Σ so that the designated constant denotes a contingent
      proposition, refuting No Contingency (signature Σ) and settling the open question whether
      Atomlessness implies it; Independence (signature Σ) is no longer claimed for this model.

- fails: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The shift $h$ that fixes $0,\ldots,m-1$ and adds one to everything from $m$ on is a monotone
    injection, so for any true $q$ pinned down by a finite $Y$ a monotone $k$ with $k(hy)=y$ on
    $Y$ exists and $k\circ h\in q$; thus $\Diamond q$ holds at $h$, while the true proposition
    that $m$ is fixed is false there.

- fails: [barcan-t]
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of BF
    sharpens to type $t$
  date: '2026-09-23'
  text: >-
    In a one-object finitely pinned model, BF (type t) fails as soon as there are a finite $N$, an
    arrow $i$ and a proposition $q$ in the domain that is the transport $i^{\prime}\cdot p=\{k :
    k\circ i^{\prime}\in p\}$ of no proposition $p$ along any arrow $i^{\prime}$ agreeing with $i$
    on $N$: the intension $X:=\{\langle r,j\rangle : r\ne q\text{ or }j\text{ disagrees with
    }i\text{ on }N\}$ is pinned down by $N$, contains $\langle i^{\prime}\cdot
    p,i^{\prime}\rangle$ for every $p$ and $i^{\prime}$, so $\forall p\, .\,\Box Xp$ holds at the
    identity, and omits $\langle q,i\rangle$, so $\Box\forall p\, .\,Xp$ fails there. Since
    membership of $k$ in $i^{\prime}\cdot p$ depends only on $k$ restricted to the range of
    $i^{\prime}$, it suffices that $q$ separate two arrows agreeing on every such range. Here take
    $N=\{0\}$, $i$ any monotone map with $i0=2$, so that every $i^{\prime}$ agreeing with it on
    $N$ has range within $[2,\infty)$, and $q:=\{k : k1=1\}$, pinned down by $\{1\}$: two monotone
    maps agreeing on $[2,\infty)$ with $k2\ge1$ may take the values $1$ and $0$ at $1$.

- fails: [boolean-completeness-t]
  # migration: the first sentence rewrites "Boolean Completeness fails at type $t$ as well, which
  # the source (n. 92) conjectures but does not show."; the closing "Observation of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source." becomes `by` and `date`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The source (n. 92) conjectures this but does not show it. Any set $F$ of propositions is the
    extension at the identity of an element of the domain at type $t\to t$, namely the profile
    $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is natural, independent of $h$ and so
    pinned down by the empty set, and each of its values is pinned down by the pinning set of $p$,
    since $i\cdot p$ depends only on the values of $i$ there. A least upper bound of $F$ under
    entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the least
    $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here let $A_m$
    ($m\ge1$) be the proposition, pinned down by $\{0,2m-1,2m\}$, that the arrow is constant on
    $\{0,\ldots,2m-1\}$ and first changes value at $2m$. The least superset of $\bigcup_mA_m$
    pinned down by $\{0,\ldots,N\}$ consists of the arrows whose first change of value is at an
    even position or beyond $N$, and it strictly shrinks as $N$ grows. So $F$ has no least upper
    bound, and, taking pointwise negations, the family of complements has no greatest lower bound.

- fails: [vicinity]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    A true $w$ pinned down by a finite set $S$ contains every arrow agreeing with the identity on
    $S$, among them the monotone map equal to the identity up to $M$ and constant at $M+1$ beyond
    it, for $S\subseteq[0,M]$, one that collapses two individuals $a\ne b$ outside $S$. The
    proposition that $a$ and $b$ are distinct is true, and it is possible at no arrow that
    collapses them, since a collapse persists under composition, so $w\not\le\Diamond(a\ne b)$.

