# migration: the definition is the old description without its verdict clauses, then the notes'
# interpretation of Σ.
definition: >-
  Proposition D.5, part 3 (p. 77): the one-object category whose arrows are all the monotone maps
  of $\mathbb N$. In every part, $W_0^\ddagger$ is the set of finite subsets of $\mathbb N$ and
  the model is ideally full: a proposition is a set of arrows whose membership depends only on the
  arrows’ values on some finite set of individuals (it is pinned down by that set), an entity of a
  higher type is an applicative behaviour profile pinned down by a finite set in the same sense,
  and the individuals are the natural numbers acted on by the arrows themselves. Propositions and
  properties are thus about finitely many individuals and indifferent to how the arrows treat the
  rest. Evaluation point: the sole object, at the identity arrow.


  Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
  $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,p_0$, where $p_0$ is the proposition that the
  arrow fixes $0$, pinned down by $\{0\}$; every other relational constant denotes the top element
  of its type and every individual constant one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (17 Sep record) ---

- fails: [barcan-r]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(3), p. 77'}
  text: >-
    The source notes that with all maps BF would still hold, since every map agrees on any finite
    set with a surjection; monotonicity makes it fail, witnessed by the qualitative property of
    being positive: any monotone map sending $0$ to a positive number sends everything to positive
    numbers, so $\forall y\,\Box(Xz\to Xy)$ holds with $z:=0$ while $\Box\forall y(Xz\to Xy)$
    fails.

- holds: [atomlessness]
  fails: [boolean-completeness-r]
  # migration: the sentence "ND, Actuality and Atomicity fail, Atomlessness holds, and Boolean
  # Completeness fails as in part 2." becomes "As in part 2."; the other failures are derived.
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(3), p. 77'}
  text: >-
    As in part 2.

- holds: [no-pure-contingency-r]
  source: {paper: bacon-dorr-classicism, locator: 'p. 79'}
  text: >-
    Boxed positive flags use the source’s explicit one-object No Pure Contingency observation,
