# --- from the source (17 Sep record) ---

- fails: [barcan-r]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(3), p. 77'}
  text: >-
    The source notes that with all maps BF would still hold, since every map agrees on any finite
    set with a surjection; monotonicity makes it fail, witnessed by the qualitative property of
    being positive: any monotone map sending $0$ to a positive number sends everything to positive
    numbers, so $\forall y\,\Box(Xz\to Xy)$ holds with $z:=0$ while $\Box\forall y(Xz\to Xy)$
    fails.

- holds: [atomlessness]
  fails: [boolean-completeness-r]
