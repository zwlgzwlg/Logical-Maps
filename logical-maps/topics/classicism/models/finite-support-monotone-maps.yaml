# migration: text of the old notes that no argument holds, verbatim: their first two sentences.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References.

  ND, Actuality and Atomicity fail, Atomlessness holds, and Boolean Completeness fails as in
  part 2.

  Countable Boolean Completeness fails as well, at type $e\to t$: the property $E$ that the
  source shows to lack a least upper bound has as its extension a countable family of
  haecceities, and the extensional fullness the source invokes to put $E$ in the domain also
  puts in the relation pairing the haecceity of the $k$-th member of that family with the
  numeral $k$, which injects $E$ into the numerals. So $\langle b,i\rangle\in Y\setminus
  B_{N^{\prime}}$, and $Y$ is not even weakly inextensible, so Weakly Inextensible Comprehension
  fails too. Observation of 23 September 2026, answering Cian Dorr’s question whether the
  failure of Actuality can be sharpened to a failure of Inextensible Comprehension. Observation
  of 23 September 2026, answering Cian Dorr’s question whether the failure of BF sharpens to
  type $t$. Boolean Completeness fails at type $t$ as well, which the source (n. 92) conjectures
  but does not show. Observation of Claude Fable 5.1 (Anthropic), 25 September 2026; not in the
  source.

