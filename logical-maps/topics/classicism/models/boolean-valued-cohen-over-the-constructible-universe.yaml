id: boolean-valued-cohen-over-the-constructible-universe
name: Boolean-valued Cohen extension over the constructible universe
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  checked_by:
  - Two further GPT-6 researchers independently checked the forcing, full analytical semantics and exclusion of all candidate represented powers.
  date: '2026-11-27'
  lean: none
sources:
