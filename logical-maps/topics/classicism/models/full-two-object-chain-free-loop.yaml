id: full-two-object-chain-free-loop
name: 'Full action model: two-object chain with a free loop at the second object'
certificate:
  source_id: misc
  produced_by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell, 19 October 2026
  recorded_by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell, 19 October 2026
  checked_by: []
  date: '2026-10-19'
  lean: none
sources:
- Original construction of 19 October 2026, to settle the recorded conjecture
  possible-infinity-t-implies-axiom-of-infinity-t; the full action model on the category described, which
  is a model of C by Classicism, §3.5 and Appendix D.
source_names:
- Claude Fable 5.1 19 Oct
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models over a category are models of C.
group: full-action-models
settings:
  construction: >-
    Use two objects $W_0$ and $W_1$. The arrows are the identities, one arrow $h\colon W_0\to W_1$, and
    the powers $s^n$ ($n\ge0$) of one endomorphism $s$ of $W_1$, which compose as
    $s^m\circ s^n=s^{m+n}$ and $s^n\circ h=h$, $h$ being the only arrow from $W_0$ to $W_1$; there is no
    arrow from $W_1$ to $W_0$. Evaluate at $W_0$.
  individuals: singleton
  sigma: top
meets:
  fixed-arrow: >-
    $s\circ h=h$ with $s\ne1_{W_1}$.
  comparable-free-arrows-everywhere: >-
    Out of $W_0$ only $1$ is fixed by nothing but the identity, $h$ being fixed by $s$; out of $W_1$
    the arrows $s^n$ are comparable, $s^m=s^{m-n}\circ s^n$ for $n\le m$.
  uniquely-factored-free-arrows-everywhere: >-
    At $W_0$, $1=m\circ h$ is impossible and $1=m\circ1$ forces $m=1$; at $W_1$, $s^n=m\circ s^a$
    forces $m=s^{n-a}$.
  sigma-apart: The construction does not mention Σ.
  finitely-many-propositions: The propositions at $W_0$ are the subsets of the two arrows out of it, four in all.
  nonidentity-arrow: The arrow $h$.
  unretracted-arrow: There is no arrow from $W_1$ back to $W_0$.
  nonepic-arrow: The distinct arrows $s^0$ and $s$ out of $W_1$ agree after $h$, both composites being $h$.
  actual-world-isolated: >-
    The actual-world proposition, the singleton of the identity of $W_0$, is in the domain, the model
    being full; the only other world out of $W_0$ is $h$, and every arrow after $h$ is $h$ again, so no
    world outside it sees a world in it.
  trivial-isomorphisms-everywhere: >-
    The only invertible arrows are the identities: $s^m\circ s^n=s^0$ only for $m=n=0$, and $h$ has no
    inverse.
  retracted-arrows-invertible-everywhere: No arrow other than an identity has a retraction, for the same reason.
arguments:
- holds: [possible-infinity-t]
  choice: free
  text: >-
    $W_1$ sees itself through infinitely many arrows, so, the model being full, it has infinitely many
    propositions, and at $W_1$ the Axiom of Infinity at type $t$ holds: the finite cardinalities of
    propositions there are the numerals, the inductive property of being a numeral being in the full
    domain, and the $k$-th numeral says that there are exactly $k$ propositions, which is false for every
    $k$. The arrow $h$ out of $W_0$ reaches $W_1$, so at $W_0$ the Axiom of Infinity at type $t$ is
    possible, although it fails there, $W_0$ having four propositions.
- fails: [pure-b-r]
  choice: free
  text: >-
    The closed pure sentence that there are exactly four propositions is true at $W_0$ and false at
    $W_1$, which sees only itself; so it is not necessarily possible, and B fails for it.
- fails: [analytic-necessitism]
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  withdrawn:
    date: '2026-10-29'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, after a trawl subagent's report
    reason: >-
      It rests on the step of the withdrawn analytic-necessitism-unretracted-arrow: the instances of a
      rigid carrier need not be determined by their transports along $h$, only to be transported
      injectively, and here they can be (see the argument analytic-necessitism-codomain-chain).
  choice: free
  text: >-
    At $W_0$, at type $tt$. The propositions at $W_1$ are the sets of the arrows $s^n$, continuum
    many, and an entity of type $tt$ at $W_0$ assigns any set of them to $h$ and any set of the four
    propositions at $W_0$ to the identity; so the entities of type $tt$ at $W_0$ include a copy of
    the reals and, the model being full, there is a real number structure of type $tt$ at $W_0$,
    complete since every subset of its carrier is the extension of a subproperty. A rigid one,
    necessarily a real number structure, is impossible: $h$ has no retraction, so, as in the general
    argument analytic-necessitism-unretracted-arrow, no entity of type $tt$ at $W_0$ is determined
    by its transport along $h$, its value at the identity being free, while the instances of a rigid
    carrier would have to be. With infinitely many individuals the general argument applies as it
    stands; this one covers the single individual, where the infinite type lies at $W_1$.
- id: analytic-necessitism-codomain-chain
  withdrawn:
    date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    reason: >-
      Its type-tt construction does not establish the schema at type t. The root has
      four propositions and sees continuum many, so possible Real_t holds and actual
      Real_t fails. See the new type-t argument and [proof](../writeups/analytic-necessitism-carrier-correction.md),
      section 3. The original text and the earlier withdrawal remain unchanged.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Withdrew only the asserted all-carrier AN/SOAN verdicts. The selected tt carrier
      is compatible with the counterexample; the older tt negative is not restored.
  holds: [analytic-necessitism, second-order-analytic-necessitism]
  choice: free
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-29'
  text: >-
    At type $tt$. For a set $A$ of natural numbers let $Y_A$ be the intension whose value at every arrow into
    $W_1$ is $E^A$, for an injection $A\mapsto E^A$ into the sets of propositions at $W_1$, which are continuum
    many, and at the identity of $W_0$ is $\varnothing$. It depends only on the codomain, so it is in the full
    domain; its transport along $h$, or along any arrow into $W_1$, is the codomain-only intension at $W_1$ with
    value $E^A$; and distinct $A$ give distinct $Y_A$ at both objects. Carry the reals onto the $Y_A$ by
    codomain-only relations, whose values at $W_1$ are the transported sets of tuples. Along every arrow the
    structure goes to an isomorphic one, a real number structure at the target, the model being full. So it is
    rigid, with necessarily distinct instances, and necessarily a real number structure, and the codomain-only
    intensions of the sets of its codomain-only relations are represented powers. So Analytic Necessitism and
    its second-order form hold.
- id: analytic-necessitism-fails-at-propositions
  fails: [analytic-necessitism]
  when: {metatheory: choice}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    At W0 there are four propositions, the subsets of its two outgoing arrows id and h.
    At W1 the outgoing arrows are the freely iterated s^n, so its full proposition
    domain is P(N). Fullness admits an actual complete ordered real field on that
    domain, including every subset in the completeness clause. Thus a Real_t is
    possible at W0, but no ordered field has a carrier in its four propositions.
    The necessary-Real_t consequent would imply actual Real_t by the identity arrow.
    Hence AN_t fails. This uses neither the old tt argument nor inextensibility.
    It applies to either individual setting and either signature in ZFC only.
    Full proof and direct sources: [proof](../writeups/analytic-necessitism-carrier-correction.md), section 3.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Preserved and withdrew the codomain-chain argument's all-type verdict; appended
      the independently supplied type-t counterexample in the ordinary ZFC settings.
      SOAN failure is derived rather than duplicated. Original certificate unchanged.
notes: >-
  The two-object chain with an infinite monoid of endomorphisms at the second object. It is recorded to
  refute the conjecture possible-infinity-t-implies-axiom-of-infinity-t: the evaluation object has four
  propositions and sees one with infinitely many. As the conjecture's notes anticipate, BF at type $t$
  and No Pure Contingency both fail; the engine derives both from Possible Infinity (type $t$) and the
  failure of the Axiom of Infinity (type $t$), and they can be seen directly: transport along $h$ sends
  a proposition $p$ at $W_0$ to every arrow out of $W_1$ if $h\in p$ and to none otherwise, so the
  property of propositions whose extension at $h$ is $\{\emptyset,\{s^n:n\ge0\}\}$ and whose
  extension at the identity is everything necessarily holds of every proposition at $W_0$ and fails at
  $W_1$ of $\{s\}$; and the pure sentence that there are exactly four propositions is true at $W_0$
  and false at $W_1$. With one individual the model is finite at $W_0$ in every type, and infinite at
  $W_1$ from type $t$ up.


  Clarification (30 October 2026; GPT-6 Astra, prompted by Daniel Kodsi): the final
  sentence of the original notes overstates finiteness at W0. Only its proposition
  domain is four-element; already at type tt an arbitrary subset of D_t(W1) can be
  chosen as the h-row, giving infinitely many root entities. The new negative
  argument uses precisely the t instance and does not assert all-type finiteness.
