  text: For each relational carrier, late-disagreement clock codes form a continuum preserved injectively
    by every shift. Their exact-image ordinary real field, every finite-arity subset profile, and the
    whole family of transported representatives share one clock pin and are rigid. Arbitrary future relations
    are represented by pullback; the singleton e carrier has impossible antecedent. Writeup §§5–6.
