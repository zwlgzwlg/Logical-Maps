  writeup: symmetric-qualitative-links-clock
  text: The old weakly rigid nonrigid relation has type (tt)t. Recursive injections commute with every
    transport. Every newly admitted test restricts at each fixed clock to an admitted old test with the
    same finite spatial pin, preserving weak inextensibility. The lifted old later failure/test remains,
    so the relation is currently weakly rigid but not rigid. Writeup §§2–4.
notes: ZFC construction under the standard symmetric ideally-full soundness theorem. The direct SOAN proof
  does not use the disputed all-carrier analytic general arguments. AN is derived. No arithmetic, choice,
  Boolean-completeness, Barcan or Maximalism verdict is adopted.
