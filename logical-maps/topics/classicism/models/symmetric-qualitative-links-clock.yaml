id: symmetric-qualitative-links-clock
name: Qualitative-link model with a translation clock
definition: Start from the singleton-individual symmetric qualitative-link model with auxiliary base B,
  monoid M and designated symmetry G. Replace its auxiliary base by B disjoint-union omega, arrows by
  M×(omega,+), acting by m on B and translation by n on the clock, and symmetry by G×{0}. Keep actual
  individuals singleton. Use the exact symmetric ideally-full domains with finite pins at every type;
  each admitted profile has one finite spatial pin uniform across clock values, and the clock point 0
  determines the translation. Evaluate at the identity. Signature constants may be top. The writeup constructs
  recursive equivariant injections of old domains, slices all new tests, and constructs exact-image field/power
  profiles at every relational carrier.
