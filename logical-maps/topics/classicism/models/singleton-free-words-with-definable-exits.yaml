id: singleton-free-words-with-definable-exits
name: Free words with definable exits
certificate:
  source_id: misc
  produced_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026
  checked_by:
  - A separate OpenAI Codex (GPT-6) agent checked the descriptor construction, witness gluing, signature separation countable join argument, weak rigidity obstruction revised smallness and both power obstructions, 27 November 2026.
  date: '2026-11-27'
  lean: none
sources:
- Cian Dorr, coalesced definable root, 20 October 2026, recorded by Claude Fable 5.1 (Anthropic).
- The map's full-free-monoid-glued-constants construction.
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 27 November 2026, the combined construction and signature separation.
