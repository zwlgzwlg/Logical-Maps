definition: >-
  Integer stages are ordered forward, with a free-word label and a
  coefficient in the direct sum of one integer group per stage. Its
  generator at coordinate $i$ rotates disjoint cycles of all positive
  finite lengths in a stage-independent individual domain. A relation
  at $n$ is a target-equivariant arrow profile with a finite orbit
  under the source subgroup generated by coordinates $i\ge n$.
  Evaluate at zero, interpreting one proposition name by word gluing.
arguments:
- id: exact-comprehension
  holds: [necessary-rigid-comprehension-r, necessary-tame-rigidity-r, necessary-boolean-completeness-r]
  choice: free
  writeup: integer-stages-with-decreasing-subgroups
  text: >-
    A current extension has a finite source-subgroup orbit. Its exact
    direct images define an admitted rigid coextension; any weakly
    rigid relation equals that representative. A pointwise union of
    a current family has no more source translates than the family does,
    so all joins are admitted.
- id: missing-power
  fails: [rigid-power-r, weakly-rigid-power-r, barcan-relational]
  choice: free
  writeup: integer-stages-with-decreasing-subgroups
  text: >-
    One stage higher, select one individual per cycle of the previous
    generator. Its exact representative is rigid and has infinitely
    many translates under that generator; every source relation has
    only finitely many. Test this finite-orbit condition at the higher
    stage. It holds necessarily on all old relations but fails for
    this subrelation of the universal individual property.
- id: scalar-tests
  holds: [logical-necessity-r, necessary-barcan-t, necessary-strong-atomicity-t, necessary-truths-are-nd-necessary]
  choice: uses
  writeup: integer-stages-with-decreasing-subgroups
  text: >-
    Scalar rows only depend on target stage and word; their singleton
    addresses are strong atoms and all scalar values lift through a
    suffix. The current singleton address gives the local ND-necessity
    of every truth. Translation identifies pure theories, and distinct
    final-word sectors realize all one-name pure matrix witnesses.
- id: higher-atoms
  holds: [necessary-atoms-are-strong-atoms-r]
  fails: [atomicity-r]
  choice: free
  writeup: integer-stages-with-decreasing-subgroups
  text: >-
    A tuple at stage m has a finite orbit under H_m, while only finitely
    many integer generators intervene between the source and m. The
    quotient of the source subgroup by the tuple stabilizer is therefore
    finitely generated abelian. Finite-index subgroups split any
    nonsingleton orbit, so the atoms are single tuple rows at single
    addresses and are strong. The infinite orbit of the omitted rigid
    property at the next stage contains no periodic tuple and has no
    atom below it.
- id: analysis-and-arithmetic
  holds: [second-order-analytic-necessitism, arithmetic-necessitism, necessity-of-arithmetic, necessary-axiom-of-infinity-e, necessary-axiom-of-infinity-t]
  choice: uses
  writeup: integer-stages-with-decreasing-subgroups
  text: >-
    Pairwise cofinally different stage-bit sequences give permanent
    distinct labels at every relational type. Exact profiles realize
    the standard real structure and all its represented powers on these
    fixed labels. A proposed real structure at individual type would have
    all subsets of its standard numbers coded on the countable carrier,
    since its parameter stabilizer fixes those numbers pointwise. The
    closed standard numeral cut is admitted at every type and stage.
- id: ordinal-benchmark-and-scalar-intervals
  fails: [forcing-possibilism]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: countable-bases-and-mathematical-possibilism
  text: >-
    Stage and word events in the scalar algebra are fixed by the coefficient
    groups. All current graphs on word codes and the closed ordinal
    thresholds are admitted. They present the small atomless Cantor algebra
    while every nonzero principal scalar interval has an atom.
