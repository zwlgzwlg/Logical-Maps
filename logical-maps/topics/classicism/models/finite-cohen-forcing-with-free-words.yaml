references:
- paper: barton-goodsell-continuum-contingency
  role: formulation
  locator: Sections 5.8 and 5.9, represented powers
definition: >-
  Start after one generic extension for finite partial functions from omega to two.
  From each site two ordinary letters preserve the current universe and a
  forcing letter takes it to any further generic extension. A relation has
  an independent name for its tuple row at each finite word, using one
  forcing factor for each forcing letter. Individuals form a singleton.
arguments:
- id: signature-and-rigid-relations
  holds: [logical-necessity-r, necessary-rigid-comprehension-r, necessary-tame-rigidity-r, necessary-boolean-completeness-r, necessary-barcan-r, modal-well-ordering-r, necessary-strong-actuality]
  choice: uses
  writeup: homogeneous-forcing-with-free-words
  text: >-
    Homogeneity and absorption of finite products preserve pure truth.
    Disjoint word cylinders realize the named witnesses. Direct images of
    current extensions give rigid representatives, pointwise unions give
    joins, and forcing names lift whole profiles through each entrance.
    Each word admits a name for a well-order. The identity-only scalar
    is a true strong atom.
- id: continuum-and-power
  holds: [arithmetic-necessitism]
  fails: [analytic-necessitism, rigid-power-r, weakly-rigid-power-r, infinity-e]
  choice: uses
  writeup: homogeneous-forcing-with-free-words
  text: >-
    The canonical arithmetic instance follows from [[necessary-rigid-comprehension-implies-arithmetic-necessitism]]. At the next generic site the new real defines a subset of the transported numbers absent from every old real. All rigid carrier and membership rows are exact images, so no proposed rigid continuum is necessarily real.
    A new subset of separated labels also gives a rigid subrelation outside
    the exact image of the old family of all rigid subrelations.
    The individual carrier always has one member.
