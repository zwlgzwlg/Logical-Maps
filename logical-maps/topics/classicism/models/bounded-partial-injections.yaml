references:
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix D, action models.
definition: >-
  Take a countably infinite set partitioned into infinitely many infinite classes.
  The single object has these individuals and a default individual. A coefficient
  is a partial injection extended to send undefined inputs and the default to the
  default. At finite tag k at most k inputs may be defined; the infinite tag is
  unrestricted. Compose the maps, taking the minimum of tags and multiplying an
  independent free-word coordinate on a countably infinite alphabet. A relational row depends on the word, the
  coefficient on a finite source set, and the tag truncated at a finite bound.
  Rows commute with postcomposition by class automorphisms. Use relational names
  interpreted by top.
arguments:
- id: modal-comparison-on-permutation-units
  holds: [necessary-five-implies-nd-necessity]
  fails: [truth-implies-five-necessity]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  choice: uses
  writeup: partial-embeddings-of-infinite-classes
  text: >-
    Quantifying over the entire subgroup of permutation units gives an admitted S5 operator. The guard requiring a live injective
    restriction to the pin, the empty word and, when present, a sufficiently high tag ensures agreement on the pin with a permutation.
    This makes every 5-necessity ND-necessary. An invertible change of the class pattern of two outputs refutes 5-necessity of their original pattern.
- id: bounded-arrow-orbits
  holds: [necessary-atomicity-r, no-contingency-signature-r, necessary-axiom-of-infinity-e, necessary-axiom-of-infinity-t]
  choice: uses
  writeup: bounded-partial-injections
  text: >-
    Every occupied row is also occupied at a finite bounded arrow whose number
    of defined inputs exactly exhausts its tag. Specifying them isolates the
    orbit of this arrow, which supports an atom through the chosen tuple.
    Pure sentences and the top names are invariant at the single object.
    The inductive set of the closed standard numerals is an invariant current
    row, and neither infinite carrier is counted by any standard numeral.
- id: incompatible-class-supports
  fails: [transversal-r, relational-choice-r, transversal-choice-r]
  choice: free
  writeup: bounded-partial-injections
  text: >-
    The selected representative of a fresh equivalence class would be fixed
    by the class-preserving automorphisms fixing the classifier's finite pin.
    Move a pin for the representative off itself outside that fixed pin. A
    partial identity then retains the class as its row but erases the moved
    pin, so equivariance would fix the class under an automorphism exchanging
    it with another. Selecting a different individual in the same class also
    contradicts invariance under the stabilizer of the input. A transversal
    of the given equivalence relation would make a choice in every fresh class.
- id: word-labels-and-even-tags
  holds: [second-order-analytic-necessitism, arithmetic-necessitism]
  fails: [countable-boolean-completeness-r, boolean-completeness-t]
  choice: uses
  writeup: bounded-partial-injections
  text: >-
    Distinct sets of initial letters label propositions, or full-or-empty
    higher-type rows, that stay distinct after every suffix shift. Arbitrary
    relations on these labels and their represented powers have exact image
    rows depending only on the word. At individual type a finite group pin
    cannot fix infinitely many distinct successor iterates. The invariant
    numeral row makes all Frege numbers standard. In contrast, the
    internally countable family of exact even tags has no join, since no
    scalar can alternate indefinitely at a fixed coefficient and word.
- id: internally-finite-clopens
  fails: [forcing-possibilism]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  choice: uses
  writeup: dedekind-finite-small-algebras-at-bounded-partial-injections
  text: >-
    The finite-coordinate clopens on auxiliary sites form a represented
    internally complete atomless algebra. It is Dedekind finite because a
    fixed finite pin fixes only finitely many clopens. Every Dedekind-finite
    carrier is revised-small, and no principal scalar interval is atomless
    and nontrivial. The assertion is a single pure instance at type t.
