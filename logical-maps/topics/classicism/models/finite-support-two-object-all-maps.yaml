# migration: the definition is the old description without its verdict sentences, then the notes'
# interpretation of Σ.
definition: >-
  Appendix D, p. 79, the paragraph beginning “One particularly interesting result”: two objects,
  $W_0=\mathbb N$ and $W_1=\{0\}$, with all functions between them as arrows, $W_i^\ddagger$ the
  finite subsets of $W_i$, and the model ideally full as in Proposition D.5. Evaluation point:
  $W_0$, at its identity arrow.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (17 Sep record) ---

- holds: [barcan-r]
  fails: [necessary-barcan-r]
  source: {paper: bacon-dorr-classicism, locator: 'p. 79'}
  text: >-
    BF holds at $W_0$, since every map agrees on any finite set with a surjection, and fails at
    $W_1$, where $\forall y\,\Box\,x=y$ holds of the one individual but $\Box\forall y\,x=y$ does
    not; so BF holds without $\Box$BF.

# --- later additions ---

- fails: [atomlessness]
  # migration: `by` and `date` are those of the 19 September change, which calls this an original
  # observation, not in the source. The lead-in "Atomlessness fails at $W_0$:" is dropped, $W_0$
  # being the evaluation point.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-19'
  text: >-
    The closed sentence that there is exactly one individual denotes the singleton of the unique
    map to $W_1$, a nonempty proposition with no nonempty proper subproposition.

- holds: [axiom-of-infinity-e, axiom-of-infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary, which is the text.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The individuals are the natural numbers and identity at the evaluation arrow is literal, so no
    numeral counts them. The propositions that a given individual is fixed by the arrow, one for
    each individual, are pairwise distinct and each has that individual as finite support, so
    there are infinitely many propositions. The set of numerals at each type is invariant under
    every arrow, hence has empty support and lies in the domain, so finite cardinality is standard
    and no finite cardinality holds of the universal property at either type.

- id: sigma-top
  fails: [independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.

- fails: [distinctness-preserving-collapse]
  # migration: the lead-in "Distinctness-preserving collapse fails at $W_0$:" is dropped, $W_0$
  # being the evaluation point.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The transposition of $5$ and $6$ is an arrow with an inverse, so for any true $q$ the
    composite of a member of $q$ with the inverse carries the transposition into $q$, making
    $\Diamond q$ true there, while the true proposition that $5$ is fixed is false there.

- holds: [necessary-relational-choice-r]
  # migration: `by` renders the closing "Cian Dorr’s observation of 23 September 2026." and the
  # change's author.
  by: Cian Dorr (observation); recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The model is ideally full, hence extensionally full at every object (Appendix D, the remark
    after Definition D.3): for any set $R$ of tuples from the domains at an object $V$, the
    intension that assigns to every arrow out of $V$ into an object $U$ a fixed set $R_U$ of
    tuples from $U$’s domains, with $R_V=R$, is pinned down by $\emptyset$, so it is the intension
    of an element of $V^{\bar\sigma\to t}$ with extension $R$ at $1_V$. Given a relation $U$
    serial at $V$, choose for each $x$ a $y$ with $(Ux)y$, by choice in the metatheory; the graph
    is such an $R$, and its element $S$ is functional and a subrelation of $U$ at $1_V$, both
    conditions being unboxed. The closed Relational Choice instance is true at an arrow $h\colon
    W_0\to V$ iff it is true at $1_V$ in the truncation by $h$, whose domains at $V$ are those of
    the model, so it holds at every arrow and $\Box$Relational Choice follows.

- fails: [boolean-completeness-t, countable-boolean-completeness-r]
  # migration: the arguments of 25 September close with "Observations of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source.", which becomes `by` and `date`. They follow
  # "Further verdicts at $W_0$.", which is dropped, and the argument for the failure of Actuality,
  # now derived, which is dropped too. This text keeps the closing "so Countable Boolean
  # Completeness fails too" of its second sentence.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    Any set $F$ of propositions is the extension of the profile $\langle h,p\rangle\mapsto\{i :
    i\cdot p\in F\}$, and for $F$ the family of propositions $A_m$ that a map $W_0\to W_0$ is
    constant on $\{0,\ldots,2m-1\}$ and first changes value at $2m$, the least superset of
    $\bigcup F$ pinned down by $\{0,\ldots,N\}$, the maps whose first change is at an even
    position or beyond $N$, strictly shrinks as $N$ grows, so $F$ has no least upper bound. The
    family is countable in the model's sense, the relation pairing $A_m$ with the numeral $m$
    being in the domain by extensional fullness, so Countable Boolean Completeness fails too.

- holds: [necessity-of-arithmetic]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    At $W_0$ the finite cardinalities are the standard numerals and $I^*$ is true; at $W_1$ the
    numerals remain pairwise distinct, because they differ at the arrows back into $W_0$ and
    identity is necessary, $I^*$ is again true, the numerals are the finite cardinalities by
    extensional fullness, and $\operatorname{Sum}$ and $\operatorname{Prod}$ are standard, their
    graphs being in the domain; so every arithmetical sentence has its standard truth value at
    every world.

- fails: [necessary-barcan-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    At $W_1$ the arrow $c_n\colon W_1\to W_0$ picking $n$ sends a proposition $q$ to $\{j :
    c_{j(n)}\in q\}$ (with the arrow to $W_1$ added when $q$ contains $1_{W_1}$), a proposition
    pinned down by $\{n\}$, so the proposition that $0$ and $1$ are collapsed is in no such image;
    the profile holding at $\langle h,d\rangle$ iff $h=1_{W_1}$ or $d$ is in the image of $h$,
    pinned down by $\{0\}$, is necessary of every proposition at $W_1$ but not universal at the
    world $c_0$.

- id: inextensible-comprehension
  fails: [inextensible-comprehension-r]
  # Recorded although the failure of Weakly Inextensible Comprehension gives it: the argument for
  # that builds on this one.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    At type $t\to t$, for the family $E$ of propositions $p_n$ that $n$ is fixed: for $Y$
    inextensible with extension $E$ pinned down by the finite set $S$, pick $k\notin S$ and let
    $X$, pinned down by $S_X:=S\cup\{k\}$, hold at an arrow $h$ into $W_0$ exactly of the
    propositions $\{i : i(m)=n\}$ with $n\notin S_X$ and of the propositions $\{i : i(h(n))=n\}$
    with $n\in S_X$; $X$ is necessary of every $p_n$, so $Y\le X$, yet at a map $h$ fixing $S$
    pointwise and moving $k$, where $h\cdot Y=Y$, the extension of $X$ omits $p_k$.

- holds: [signature-b-r]
  # migration: the argument before it in the old notes, for B for pure sentences, now derived, is
  # dropped.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    A closed $\Sigma$-sentence denotes what $P(d,\ldots,d)$ denotes for a pure $P$ and the
    individual $d$, and from any world some arrow into $W_0$ carries the current image of $d$ back
    to $d$, as all maps are arrows.

- holds: [transversal-choice-r]
  # migration: `by` adds the summary's last sentence; the lead-in "Added Transversal Choice, by"
  # becomes "By".
  by: Claude Fable 5.1 (Anthropic), on a question of Zachary Goodsell, after an observation of
    Christopher Sun
  date: '2026-09-25'
  text: >-
    By the argument recorded for Relational Choice: the model is extensionally full at every
    object, so for an equivalence relation at the evaluation point a transversal of its extension
    there, chosen in the metatheory, is the extension of an element pinned down by the empty set;
    the equivalence and transversal conditions are unboxed.

- fails: [vicinity]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    A true $w$ pinned down by a finite set $S$ contains every arrow agreeing with the identity on
    $S$, among them a map $W_0\to W_0$ that collapses two individuals $a\ne b$ outside $S$. The
    proposition that $a$ and $b$ are distinct is true, and it is possible at no arrow that
    collapses them, since a collapse persists under composition, so $w\not\le\Diamond(a\ne b)$.

- fails: [weakly-inextensible-comprehension-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    The argument above against Inextensible Comprehension at type $t\to t$ uses only the unboxed
    matrix of inextensibility at the identity arrow of $W_0$, as the corresponding argument in the
    permutation model does.

# migration: text of the old notes that no argument holds, verbatim: their first two sentences, and
# the sentence that followed the Σ argument, referring to its failures. The argument of 23 September
# for the failure of Atomicity (type $t$), now derived, is dropped.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

