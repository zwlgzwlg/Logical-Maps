id: finite-support-two-object-all-maps
name: 'Finite-support action model: N and singleton, all maps'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, p. 79, paragraph beginning
  “One particularly interesting result”.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
