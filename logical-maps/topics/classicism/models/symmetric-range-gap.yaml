# migration: the definition is the old description's first paragraph without its verdict sentence,
# then the notes' interpretation of Σ, in which "described above" becomes ", the symmetry group",
# the Actuality witness of the argument below.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its symmetry group is the permutations fixing a distinguished individual, and its arrows are
    those permutations together with all the functions that omit the distinguished individual from
    their range. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  collapse-onto-point: >-
    The distinguished individual $d$ is fixed by every symmetry, so take $F:=\lambda x\, .\,x\ne a\land\neg Ex$, where $E$ is the constant intension $\{d\}$, pinned down by $\varnothing$. Let $h$ be a range-deficient function constant with value $p\ne d$ on $N\cup\{a\}$. Then $F_h$ omits $p$ and $d$, and permutations fixing $p$ and $d$ move every other point.
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\{0\}$, the distinguished individual, and for $N$ the property of not belonging to
    $N\cup\{0\}$: the transposition of $y$ with another individual outside $N\cup\{0\}$ fixes $0$, so
    lies in the symmetry group.
  separable-collapses: >-
    The pairs $\{n,m\}$ of positive numbers: a function omitting $0$ from its range that collapses
    $n$ with $m$ and nothing else is an arrow.
  symmetry-group-pinned: >-
    The two classes of arrows are told apart by an arrow's value at the distinguished individual.
  fixes-or-omits: >-
    The arrows are the permutations fixing $0$ and the functions omitting $0$ from their range.
  transport-gap: >-
    Take $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow agreeing with it on $N$ omits
    $0$ from its range, and $q:=\{k : k0=0\}$, the symmetry group, pinned down by $\{0\}$ and
    symmetric: a permutation $k$ fixing $0$ and the arrow $k^{\prime}$ agreeing with it off $0$ but
    sending $0$ elsewhere, which omits $0$ from its range, are separated by $q$. The intension the
    argument uses is pinned down by $N$, and symmetric, since $g\cdot q=q$ for $g$ fixing $0$ and
    $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain.
  actual-world-isolated: >-
    The actual-world proposition is the set of arrows that are permutations, pinned down by $\{0\}$;
    no composite with an arrow omitting $0$ from its range is a permutation, since the other arrows
    fix $0$ and so cannot restore it to the range.
  actuality-contingent: >-
    The actual-world proposition, the symmetry group, is in the domain; at every world an arrow
    omitting $0$ leads outside it, and such an arrow carries it to the empty set.
  irreversible-arrow: >-
    An arrow omitting $0$ from its range: no composite with it restores $0$ to the range.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
# witness under `meets`; what follows is this record's own. Only the verdicts the engine needs to
# derive the rest are recorded, the source's first.

# --- from the source (19 Sep record) ---

- holds: [boolean-completeness-r]
  text: >-
    By the draft's main theorem with the distinguished individual as the distinguished set. Moving
    points off a finite set can be done by a permutation fixing that individual, and two arrows
    agreeing there are either both permutations or both range-deficient, so a prescription taken
    from the two of them extends by nonzero values to an arrow of the same kind.

# --- later additions ---

- fails: [atomicity-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The symmetry group is an atom, but no atom lies inside the nonempty proposition $T$ of arrows
    omitting $0$ from their range, which is symmetric and pinned down by $\{0\}$: a nonempty
    symmetric $p\subseteq T$ pinned down by $N\ni0$ and containing $h$ contains every arrow in $T$
    whose restriction to $N$ has the same fibres as $h$’s, and those whose restriction to
    $N\cup\{m\}$ has the same fibres as $h$’s form a smaller nonempty symmetric proposition pinned
    down by $N\cup\{m\}$, since $h$’s value at a fresh $m$ can be made to coincide with, or to
    differ from, a value on $N$.

# migration: text of the old notes that no argument holds, verbatim. Their argument for the failure
# of ND, now derived, is dropped.
notes: >-
  The first of the draft's two variants in which BF is made to fail. Actuality and the range
  deficiency come from the same finite test here, which is what the next variant prises apart.
  Atomicity and Rigid Comprehension are not settled in the draft and are left unknown. The source
  is a work in progress. Everything that implies these fails with them.

# The old `changes` log, verbatim and frozen.
history:
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
