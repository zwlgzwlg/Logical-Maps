# migration: text of the old notes that no argument holds, verbatim. Their argument for the failure
# of ND, now derived, is dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
# "Everything that implies these fails with them." is back at the end of the argument it followed (5 October 2026).
notes: >-
  The first of the draft's two variants in which BF is made to fail. Actuality and the range
  deficiency come from the same finite test here, which is what the next variant prises apart.
  Atomicity and Rigid Comprehension are not settled in the draft and are left unknown. The
  source is a work in progress.

  ND fails at type e because the range-deficient arrows include non-injective ones; the draft
  does not draw that consequence separately. Argument of 23 September 2026, after Cian Dorr’s
  observation that a choice over the individuals cannot be finitely pinned down; the
  well-ordering of the individuals that he had in mind is refuted by the same two facts, but the
  direct route needs no derivation of a well-ordering from Relational Choice in C. Observation
  of 23 September 2026, answering Cian Dorr’s question whether the failure of BF sharpens to
  type $t$. Atomicity fails already at type $t$, although Actuality holds.

