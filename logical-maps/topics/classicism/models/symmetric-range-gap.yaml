group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its symmetry group is the permutations fixing a distinguished individual, and its arrows are
    those permutations together with all the functions that omit the distinguished individual from
    their range. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  moving-proposition-stabilizers: >-
    Choose distinct pinning points $a,b,c$ outside a given finite $N$ and the distinguished point $d$. Then $g=(a\ c)$ is a symmetry fixing $N$. The symmetric proposition $p_{ab}(w)\leftrightarrow w(a)=w(b)$ is pinned by $\{a,b\}$. A function omitting $d$ from its range can identify $a,b$ while keeping $c$ distinct; it is an allowed arrow and distinguishes $p_{ab}$ from $g\cdot p_{ab}=p_{cb}$. The points here are pinning-carrier points, also when the individual domain is a singleton. Source: OpenAI Codex, prompted by Daniel Kodsi, 22 October 2026, singleton applications §2; recorded 30 October 2026.
  exact-collapses-of-every-size: >-
    Take $n\ge2$ points other than the distinguished individual $d$: the map constant on them with a
    value other than $d$, and injective off them with values avoiding $d$ and that value, omits $d$
    from its range.
  factorizable-arrows: >-
    Put the distinguished individual $d$ in $S$ and $N$, take $N^{\prime\prime}:=S$ and, enlarging $N$,
    assume $h(N^{\prime\prime})\subseteq N$. An arrow's value at $d$ tells its kind: a permutation
    fixing $d$, or a map omitting $d$; so $k^{\prime}$ has the kind of $kh$, and $k^{\prime\prime}$ and $j$
    will have the kinds of $h$ and $k$. Let $k^{\prime\prime}$ agree with $h$ on $N^{\prime\prime}$; for
    $m\in M\setminus N^{\prime\prime}$ let $k^{\prime\prime}m:=k^{-1}(k^{\prime}m)$ if $k$ is a permutation and
    $k^{\prime}m\in k(N)$, and otherwise a fresh point outside $N\cup\{d\}$, one for each $m$ if $h$ is
    a permutation and one for each value of $k^{\prime}$ if not. Let $j$ agree with $k$ on $N$ and send
    each fresh point to its value. Since $k^{\prime}m\ne d$ for $m\ne d$, $k^{\prime\prime}m\ne d$; where
    $h$ is a permutation so is $k^{\prime}$ or $k$ omits $d$, and $k^{\prime\prime}$ is injective on $M$;
    where $k$ is a permutation the new values of $j$ lie outside $k(N)$ and are distinct. So both
    extend to arrows of their kinds, and $jk^{\prime\prime}$ agrees with $k^{\prime}$ on $M$.
  finitely-pinned-domains: >-
    A relational domain holds exactly the symmetric intensions pinned down by a finite set, and
    every individual $n$ is pinned down by $\{n\}$.
  collapse-onto-point: >-
    The distinguished individual $d$ is fixed by every symmetry, so take $F:=\lambda x\, .\,x\ne a\land\neg Ex$, where $E$ is the constant intension $\{d\}$, pinned down by $\varnothing$. Let $h$ be a range-deficient function constant with value $p\ne d$ on $N\cup\{a\}$. Then $F_h$ omits $p$ and $d$, and permutations fixing $p$ and $d$ move every other point.
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\{0\}$, the distinguished individual, and for $N$ the property of not belonging to
    $N\cup\{0\}$: the transposition of $y$ with another individual outside $N\cup\{0\}$ fixes $0$, so
    lies in the symmetry group.
  separable-collapses: >-
    The pairs $\{n,m\}$ of positive numbers: a function omitting $0$ from its range that collapses
    $n$ with $m$ and nothing else is an arrow.
  symmetry-group-pinned: >-
    The two classes of arrows are told apart by an arrow's value at the distinguished individual.
  fixes-or-omits: >-
    The arrows are the permutations fixing $0$ and the functions omitting $0$ from their range.
  transport-gap: >-
    Take $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow agreeing with it on $N$ omits
    $0$ from its range, and $q:=\{k : k0=0\}$, the symmetry group, pinned down by $\{0\}$ and
    symmetric: a permutation $k$ fixing $0$ and the arrow $k^{\prime}$ agreeing with it off $0$ but
    sending $0$ elsewhere, which omits $0$ from its range, are separated by $q$. The intension the
    argument uses is pinned down by $N$, and symmetric, since $g\cdot q=q$ for $g$ fixing $0$ and
    $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain.
  actual-world-isolated: >-
    The actual-world proposition is the set of arrows that are permutations, pinned down by $\{0\}$;
    no composite with an arrow omitting $0$ from its range is a permutation, since the other arrows
    fix $0$ and so cannot restore it to the range.
  actuality-contingent: >-
    The actual-world proposition, the symmetry group, is in the domain; at every world an arrow
    omitting $0$ leads outside it, and such an arrow carries it to the empty set.
  irreversible-arrow: >-
    An arrow omitting $0$ from its range: no composite with it restores $0$ to the range.
  hull-conditions: >-
    With $M_0=\{0\}$, the distinguished individual (the draft's argument for this model). Moving
    points off a finite set can be done by a permutation fixing that individual; an arrow that
    $M_0$ does not separate omits $0$ from its range, as does any arrow agreeing with it at $0$, so
    a prescription taken from the two of them extends by nonzero values to an arrow of that kind.

arguments:
- holds:
  - necessary-atoms-are-self-atoms-r
  - necessary-atoms-are-strong-atoms-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: The symmetric propositions over the arrows omitting $d$ refine, two such arrows agreeing with
    a given one on a finite $N$ differing in kernel beyond it, which post-composition with permutations
    preserves; so no atom contains an arrow omitting $d$, and the symmetry group $G$, pinned down by $\{d\}$,
    is the only atom. It is a self-atom and a strong atom (the argument for Self-atoms are atoms). An
    atom of a relational type has an atom as its existential projection, so sits over $G$, and symmetry
    with pinning makes it the orbit of a single pair, a self-atom and a strong atom. One object, so both
    principles hold at every world and every type.
- holds:
  - necessary-self-atoms-are-atoms-r
  - necessary-self-atoms-are-strong-atoms-r
  fails:
  - self-atomicity-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'The symmetry group $G$ is the orbit of the identity and the only atom containing it, pinned down
    by the distinguished individual $d$. Let $q$ be a self-atom containing an arrow $k$ that omits $d$
    from its range, pinned down by a finite $N$. Then $q$ contains every arrow agreeing with $k$ on $N$
    up to symmetry. Let $h$ fix $k(N)$, which omits $d$, pointwise and send every other individual to
    one fixed individual other than $d$: $h$ is an arrow omitting $d$, not in $G$, and $h\circ k$ agrees
    with $k$ on $N$, so lies in $q$. So the transport of $q$ along $k$ contains $h$, while it should be
    the atom $G$. Hence every self-atom lies inside $G$, and is $G$, an atom; and $G$ is a strong atom,
    its transport along an arrow omitting $d$ being empty and along a permutation being $G$. A self-atom
    of a relational type has a self-atom as its existential projection, so sits over $G$, and symmetry
    with the transport condition makes it the orbit of a single pair, an atom and a strong atom. One
    object, so all this holds at every world. Self-Atomicity (type t) fails: the proposition of the arrows
    omitting $d$ is pinned down by $\{d\}$, possible, and has no self-atom below it.'

