  writeup: interpretation-cover-henkin-full-traces
  text: Root-loop witnesses lift through inverse permutations. An old interpretation can be matched on
    a predicate's finite pin by an onto interpretation, obtained by finite modification of an infinite-fibre
    interpretation; named lifts then reach every target entity. This gives current BF on the enlarged
    domains. Arbitrary current relation tables are admitted with constant root rows and Bottom old sections,
    so external choice supplies the selecting relational graphs for current Relational Choice, including
    individual outputs.
