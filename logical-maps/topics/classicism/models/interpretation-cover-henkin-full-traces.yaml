  writeup: interpretation-cover-henkin-full-traces
  text: Existentially close a consistent fixed-signature formula after replacing its constants by typed
    variables. A retained pure witness supplies their values and those of the displayed individual variables.
    The exact Possibility+ antecedent makes the required root name assignments compatible. Named lifts
    preserve the entire old denotation. Pure and signature Max are derived consequences.
- id: incompatible-subset-traces
  fails:
  - rigid-power-r
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-henkin-full-traces
  text: Both terminal components contain all individual singletons s_n, but H has only countably many
    admitted traces on them. Choose A subset N not represented by an H trace; full K has the singleton
    subfamily Y_A. A rigid root F of type (et)t has current members a_n, with singleton images s_n at
    H and K and Bottom images elsewhere. For every current rigid R below F, separate admitted singleton-complement
    tests force its H and K singleton traces to equal {n:R(a_n)}. No such R can therefore land as Y_A
    at K. The actual canonical power of F nevertheless contains Y_A at K. An admitted higher test excluding
    Y_A only there is necessary on every current member of that power but fails on this future member.
    The power is not weakly inextensible. The failed bound type is (et)t and its power property has type
    ((et)t)t.
notes: Both added terminal components individually satisfy Rigid Power. Its failure arises from their
  different admitted subset traces at the common root. It is a verdict for this augmented cover, not for
  every possible old family in the [named-permutation construction](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/writeups/interpretation-cover-named-permutations.md).
  The source positive proofs are re-established for the enlarged domains; none is boxed. No Boolean Completeness,
  Functional Choice or Strong Possibility verdict is asserted. The semantic existence input remains relative
  to the interpretation-root construction. Mathematical review was carried out with ChatGPT assistance;
  no independent human check or Lean proof is recorded.
