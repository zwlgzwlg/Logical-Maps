id: interpretation-cover-henkin-full-traces
name: 'Interpretation cover: Henkin and full subset traces'
definition: 'In ZFC retain a set-sized family of faithful pointed C action models witnessing every C-consistent
  pure sentence, with the action-model-existence input of the interpretation covers. Add two disjoint
  isolated terminal components: the full finite-type hierarchy K on N and a countable elementary Henkin
  substructure H retaining every individual n. The inclusion used to construct H is not a category arrow.
  Rebuild the named-permutation interpretation cover with auxiliary typed name sets large enough for every
  old domain and the prescribed set-sized free signature. Root loops are all typed name permutations,
  designated root symmetry is trivial, and arrows to old objects are all typed interpretations. Admit
  exactly finite-name-pinned profiles with whole admitted old sections. Interpret constants by designated
  names and named lifts, and evaluate at the root identity. The two terminal components are part of this
  particular model.'
