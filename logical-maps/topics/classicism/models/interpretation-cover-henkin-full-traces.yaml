  writeup: interpretation-cover-henkin-full-traces
  text: The root-only truth mask witnesses Vicinity because each root loop has an inverse. A nonbottom
    scalar splits either by a fresh-name permutation at a root loop or by changing a fresh propositional
    interpretation between old Top and Bottom. These proofs apply to all profiles admitted after the two
    terminal components have been added.
