id: interpretation-cover-covariant-surjections
name: 'Interpretation cover: covariant surjections'
definition: >-
  In ZFC, take a set-sized family of faithful pointed C action models witnessing every
  C-consistent pure sentence, using the same action-model-existence input as the
  interpretation-root construction. Retain their objects, domains, arrows and semantics.
  Choose an infinite auxiliary name set C_sigma at each admitted type, large enough for
  the constants of a prescribed set-sized free signature Sigma. Add a root with individuals
  C_e, all typewise surjections of the name sets as loops, all typewise permutations as
  designated symmetries, and every typed interpretation of names as an arrow to each old
  object. There are no old-to-root arrows. At each relational type admit exactly the
  profiles pinned by finitely many typed names, covariant under postcomposition by every
  root permutation, and landing as a whole admitted entity at every old interpretation.
  Rows use the full argument domains of their targets; transport is precomposition.
  Interpret individual constants by distinct designated names and relational constants
  by their named lifts with empty root rows and the assigned old sections. Evaluate at
  the root identity.
