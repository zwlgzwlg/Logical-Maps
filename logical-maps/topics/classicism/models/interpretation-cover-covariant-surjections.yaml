arguments:
- id: named-maximalism
  holds: [distinctness-signature-r]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-covariant-surjections
  text: >-
    Every pure C-consistent sentence retains its old witness. For a C(Sigma)-consistent
    sentence, replace its finitely many constants by variables and existentially close;
    choose the corresponding old witness and assign its values to those names. Named lifts
    land as exactly the assigned whole entities. This gives fixed-signature Max, and pure
    Max follows. The reference theory is C(Sigma), without optional root assumptions.
- id: atomlessness
  holds: [atomlessness]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-covariant-surjections
  text: >-
    A nonbottom proposition with a root-loop truth splits by the admitted equality cylinder
    on two fresh individual names: finite prescriptions extend to surjections both identifying
    and separating them while preserving the proposition's pin. If its truth is only at an
    old interpretation, vary a fresh propositional name between old Top and Bottom. Its named
    lift splits the proposition. Both intersections are nonbottom.
- id: inextensible-coextensions
  holds: [inextensible-comprehension-r]
  by: Daniel Kodsi, with ChatGPT assistance, extending the injectivity-mask argument of Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-covariant-surjections
  text: >-
    For X pinned by S, let delta_S mean that the root loop is injective on S and be Bottom
    at every old target. The admitted relation Y=delta_S and X coextends X. A loop fixing S
    lifts any tuple through a permutation fixing S; covariance keeps that lift inside X's
    current extension. Normalizing any loop injective on S proves weak inextensibility of Y
    against every admitted test. Collapsing loops and all old entrances send Y to Bottom;
    other loops send it to the same construction on the image pin. Thus Y is necessarily
    weakly inextensible. This proves current comprehension at every relational arity,
    including the empty tuple, with the required box inside Inextensible(Y).
- id: barcan
  holds: [barcan-r]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-covariant-surjections
  text: >-
    A root-loop witness has an exact preimage by the finite-pin permutation lift. At an old
    target, assign an arbitrary witness to one fresh name outside the predicate's pin; the
    changed interpretation has the same predicate row and the current named lift reaches
    the witness. These two cases prove the dual Barcan schema at every admitted type.
notes: >-
  One relative construction supplies this joint package. The action-model-existence input
  is inherited from the interpretation covers, not proved anew. The whole old components
  and their quantified domains are unchanged. The recorded comprehension and BF schemata
  are unboxed; no Boolean Completeness, Forcing Possibilism, Strong Possibility or choice
  verdict is added. Full typed permutation covariance is essential to the within-extension
  tuple lift. A larger signature may require larger auxiliary name sets. Mathematical
  review was carried out with ChatGPT assistance; no independent human check or Lean proof
  is recorded.
