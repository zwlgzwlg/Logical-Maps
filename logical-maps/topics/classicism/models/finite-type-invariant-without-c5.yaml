id: finite-type-invariant-without-c5
name: 'Finite two-point model: invariant FTN without C5'
definition: Use the full two-point construction of Finite-Type Necessitism, Section 6.1, equations (6.1)–(6.4),
  with A=B={*}. Evaluate at the root. The finite-type guide states the common construction; Appendix A
  gives this specialization.
