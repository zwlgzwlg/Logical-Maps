# --- later additions ---

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true proposition $p$ pinned down by a finite set take as the witness $q$ the
    actual-world proposition $\{1_{\mathbb N}\}$: under any other arrow $h$, $\Diamond q$ would
    need $k\circ h=1_{\mathbb N}$, impossible since $h$ is not injective.

- fails: [barcan-t]
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of BF
    sharpens to type $t$
  date: '2026-09-23'
  text: >-
    In a one-object finitely pinned model, BF (type t) fails as soon as there are a finite $N$, an
    arrow $i$ and a proposition $q$ in the domain that is the transport $i^{\prime}\cdot p=\{k :
    k\circ i^{\prime}\in p\}$ of no proposition $p$ along any arrow $i^{\prime}$ agreeing with $i$
    on $N$: the intension $X:=\{\langle r,j\rangle : r\ne q\text{ or }j\text{ disagrees with
    }i\text{ on }N\}$ is pinned down by $N$, contains $\langle i^{\prime}\cdot
    p,i^{\prime}\rangle$ for every $p$ and $i^{\prime}$, so $\forall p\, .\,\Box Xp$ holds at the
    identity, and omits $\langle q,i\rangle$, so $\Box\forall p\, .\,Xp$ fails there. Since
    membership of $k$ in $i^{\prime}\cdot p$ depends only on $k$ restricted to the range of
    $i^{\prime}$, it suffices that $q$ separate two arrows agreeing on every such range. Here take
    $N=\{0\}$, $i$ any arrow with $i0=2$ (hence $i1=2$ and range within $[2,\infty)$), and $q:=\{k
    : k1=1\}$, pinned down by $\{1\}$: the arrows $k$ with $k0=k1=1\le k2$ and $k^{\prime}$ with
    $k^{\prime}0=k^{\prime}1=0$, agreeing beyond $1$, are separated by $q$.

- fails: [atomicity-t]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    As the source says in other words: the only finitely pinned singleton is $\{1_{\mathbb N}\}$,
    since a collapsing monotone map is not determined by its values on a finite set, so the
    nonempty proposition of all collapsing arrows, pinned down by $\{0,1\}$, has no atom below it;
    the source’s remark that Atomlessness restricted to false propositions holds says the same.

- fails: [boolean-completeness-t]
  # migration: the first sentence rewrites "Boolean Completeness fails at type $t$ as well, which
  # the source (n. 92) conjectures but does not show."; the closing "Observation of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source." becomes `by` and `date`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The source (n. 92) conjectures this but does not show it. Any set $F$ of propositions is the
    extension at the identity of an element of the domain at type $t\to t$, namely the profile
    $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is natural, independent of $h$ and so
    pinned down by the empty set, and each of its values is pinned down by the pinning set of $p$,
    since $i\cdot p$ depends only on the values of $i$ there. A least upper bound of $F$ under
    entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the least
    $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here let $A_m$
    ($m\ge1$) be the proposition, pinned down by $\{1,2m,2m+1\}$, that the arrow is constant on
    $\{1,\ldots,2m\}$ and increases at $2m+1$; the identity belongs to no $A_m$. The least
    superset of $\bigcup_mA_m$ pinned down by $\{0,\ldots,N\}$ consists of the non-identity arrows
    whose first increase after $1$ is at an odd position or beyond $N$, and it strictly shrinks as
    $N$ grows. So $F$ has no least upper bound, and, taking pointwise negations, the family of
    complements has no greatest lower bound.

- fails: [boolean-completeness-t, atomicity-t]
  # migration: "Review of 25 September 2026." becomes `date`; `by` condenses the record's second
  # source. A second, independent argument for the same verdict. Its last sentence argues for the
  # failure of Atomicity (type $t$).
  by: DeepSeek (deepseek-flash), trawl; reviewed and corrected by OpenAI Codex (GPT-6)
  date: '2026-09-25'
  writeup: finite-support-identity-or-collapse
  provenance: admission-c0a37bbe6b6c45cc985428b174812564
  text: >-
    The dated write-up supplies the accepted BC-t witness using alternating differences of
    agreement classes and Definition D.3's extensional-fullness lemma. It replaces the trawl's
    invalid inference from an unavailable intersection to an unavailable greatest lower bound.
    Atomicity-t also fails, as already specified by the source's footnote 92 and checked by
    splitting any nonempty finitely pinned subproposition of the false proposition h(0)=h(1)=0.

