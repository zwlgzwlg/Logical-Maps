# --- from the source (17 Sep record) ---

- holds: [actuality]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(4), p. 78'}
  text: >-
    The identity is the only arrow that does not collapse $0$ and $1$, so $\{1_{\mathbb N}\}$ is
    pinned down by $\{0,1\}$.

- fails: [atomicity-r]
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(4), p. 78'}
  text: >-
    The actual world is the only world, Atomlessness restricted to false propositions holds, and
    Atomicity fails.

- fails: [barcan-r, boolean-completeness-r]
  # migration: the clause "BF, ND and Boolean Completeness fail as in part 3." becomes "As in part
  # 3."; the failure of ND is derived.
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(4), p. 78'}
  text: >-
