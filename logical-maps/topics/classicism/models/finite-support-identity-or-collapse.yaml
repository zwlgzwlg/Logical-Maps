group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 4 (p. 78): the arrows are the monotone maps $h$ of $\mathbb N$ with
    $h0=h1$, together with the identity.
  sigma: top

meets:
  actual-world-pinned: >-
    The identity is the only arrow that does not collapse $0$ and $1$, so $\{1_{\mathbb N}\}$ is
    pinned down by $\{0,1\}$.
  non-identity-non-injective: >-
    Every other arrow collapses $0$ and $1$.
  collapse-unpinned: >-
    The other arrows are those that collapse $0$ and $1$, pinned down by $\{0,1\}$, and a
    collapsing monotone map is not determined by its values on a finite set.
  positive-preserving: >-
    Every arrow is monotone, and the arrows with $h0=h1=1$ send $0$ to a positive number.
  transport-gap: >-
    Take $N=\{0\}$, $i$ any arrow with $i0=2$ (hence $i1=2$ and range within $[2,\infty)$), and
    $q:=\{k : k1=1\}$, pinned down by $\{1\}$: the arrows $k$ with $k0=k1=1\le k2$ and
    $k^{\prime}$ with $k^{\prime}0=k^{\prime}1=0$, agreeing beyond $1$, are separated by $q$. The
    model is a one-object finite-support model, and the intension the argument uses is pinned down
    by $N$.
  unbounded-haecceities: >-
    As in parts 2 and 3, with $A$ the even numbers.
  no-least-pinned-cover: >-
    Let $F$ be the family of propositions $A_m$ ($m\ge1$), each pinned down by $\{1,2m,2m+1\}$,
    that the arrow is constant on $\{1,\ldots,2m\}$ and increases at $2m+1$; the identity belongs
    to no $A_m$. The least superset of $\bigcup F$ pinned down by $\{0,\ldots,N\}$ consists of the
    non-identity arrows whose first increase after $1$ is at an odd position or beyond $N$, and it
    strictly shrinks as $N$ grows.

