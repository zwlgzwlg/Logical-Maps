id: supported-product-coordinate-symmetry
name: 'Supported-product action model: external coordinate symmetry'
definition: Fix a set-sized finitary signature and an infinite cardinal kappa bounding its syntax. At
  the single object let the arrow monoid be L^I, with L the free monoid on kappa letters and |I|=kappa-plus,
  and let individuals be a singleton. At every relational type admit all profiles having both an arrow-coordinate
  support of size at most kappa and a support of that size under external Sym(I) conjugation. Transport
  is precomposition. Glue the signature interpretations at a fresh coordinate after fixing the pure domains.
  Evaluate at the identity. The external permutation group restricts admission; its permutations are not
  additional arrows.
