id: finite-height-separation-0
name: 'Finite-height independence: omit height 0'
definition: Use the full two-point model of Finite-Type Necessitism, Sections 6.1–6.2, with A⊆B, |A|=1
  and |B|=aleph_0, evaluated at the root. Individual transport is inclusion; relational domains, paired-profile
  operations and full quantifiers are exactly equations (6.1)–(6.3). The common construction is given
  once in the linked finite-type guide and in the paper.
