  text: 'Theorem 6.1 with j=0 gives every exact height except 0: the individual-type capacity is the only
    obstruction; every relational-type instance holds by the projection-section argument. Thus SOAN (=F1)
    and F2 hold, but F0 fails.'
notes: This is one instance of the single arbitrary-height construction, not a separate construction or
  a replacement for the general theorem. [Paper](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.pdf),
  Theorem 6.1 and Corollary 6.2; [shared construction and guide](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/writeups/finite-type-non-contingency-guide.md).
