id: interpretation-cover-stitched-cohen-middle
name: 'Interpretation cover: identity-only over the stitched Cohen middle'
definition: >-
  In the ambient Cohen extension of the existing stitched-cohen-coalesced-middle construction,
  keep its entire four-object component r,s,A,B, all typed domains and all arrows unchanged.
  Choose a countably infinite auxiliary name set C_sigma at each admitted type. Add a root o
  with individuals C_e and only the identity endomorphism. For every old object v include all
  total typed interpretations I_sigma:C_sigma->D_sigma(v) as arrows o->v. Compose by old transport;
  there are no old-to-root arrows. At each relational type admit exactly the root profiles with
  arbitrary current row, one finite typed-name pin on same-target old interpretations, and whole
  old sections belonging to the unchanged old domains. Transport is precomposition. Relational
  signature constants denote top. Evaluate at o. The writeup gives the recursion, named lifts,
  closure proof and inherited forcing assumptions.
