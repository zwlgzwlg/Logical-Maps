arguments:
- id: fresh-name-current-barcan
  holds: [barcan-r]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-stitched-cohen-middle
  text: >-
    For any current predicate F of sigma-entities, a possible witness at the identity is already
    current. For a witness b at an old interpretation I, choose a sigma-name c outside a finite
    pin of F and change only I(c) to b. The new interpretation has the same full F-row. The
    current named lift of c transports to the whole entity b, proving the native dual BF formula.
    This relocates the witness; it does not claim that a fixed interpretation is onto. See Sections 2–4.
- id: necessary-propositional-barcan
  holds: [necessary-barcan-t]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-stitched-cohen-middle
  text: >-
    BF_t holds at o by the fresh-name proof. At every old object the proposition domain is the
    full finite powerset of its outgoing arrows, and every old proposition transport is onto.
    All possible targets are o or one of these unchanged old objects. Direct verification at
    those targets gives necessary BF_t, without necessitating a current optional premise. See Section 5.
- id: inherited-necessary-relational-barcan-failure
  fails: [necessary-barcan-relational]
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: interpretation-cover-stitched-cohen-middle
  text: >-
    At the accessible old root r, the admitted exact-image property of D_et(r) necessarily
    contains every current et-entity. At s it misses the entity (c times {0}, empty, empty),
    whose first coordinate uses the new Cohen real. This refutes BF_et at r. All old domains,
    tests and outgoing arrows remain unchanged, so necessary BF at relational types fails at o.
    Necessary all-type BF failure is derived from this same witness. See Sections 1 and 6.
notes: >-
  One fixed-component application of Dorr's interpretation-root construction. Its contribution is
  current all-type BF together with necessary propositional BF and failure of necessary relational BF.
  The root has only the identity loop.
  The ambient forcing setup is inherited from stitched-cohen-coalesced-middle. Given that component,
  the cover is a ZFC set construction. This does not settle whether current
  all-type BF plus necessary relational BF implies necessary all-type BF.
