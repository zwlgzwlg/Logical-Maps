  text: >-
    The source-only truth is a self-atom since it is true only at the root.
    At the distinguished site its transport splits into two nonempty
    independent return coordinates. Each entrance still embeds the entire
    source, admitting the choice operations, coherent continua and exact
    image profiles. The ordinal tables and finite Boolean intervals are
    unchanged.
