references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models; the category is that of full-two-object-chain.

# Not a member of full-action-models: that group fixes the individuals (one, or infinitely many fixed by
# every arrow), and here the arrow is not onto them. The group's shared conditions are met directly.
definition: >-
  A full action model over two objects $W_0$ and $W_1$, with one nonidentity arrow $f:W_0\to W_1$
  besides the identities, evaluated at the identity of $W_0$. The individuals are $\{{a\}}$ at $W_0$
  and $\{{b,c\}}$ at $W_1$, and $f$ sends $a$ to $b$. Every intension of every relational type is
  present at each object.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
  denotes the top element of its type.

meets:
  full-model: Every intension of every relational type is present at every object.
  full-action-model: An action model, full at every object.
  codomain-intensions: The domains are full at every object.
  extensionally-full: >-
    A full model contains every intension, so in particular one with any given extension at the
    identity.
  identity-singletons: The singleton of the identity arrow at any object is in the domain, the model being full.
  actuality-contingent: >-
    The singleton $a$ of the identity arrow at $W_0$ is in the domain. It is necessary at no world: the
    identity sees $f$, outside it, and $f$ does not fix it, since $1\in f\cdot a$ would need $1\circ f=1$.
  rigid-haecceity-disjunctions: >-
    Every intension is present, so for any set $E$ the intension $k\mapsto k\cdot E$ is in the domain,
    and with persistence a rigid relation equals it (as for the group full-action-models).
  relationally-epic-arrows: Out of $W_1$ there is only the identity, so $f$ is an epimorphism.
  nonidentity-arrow: The arrow $f$.
  unretracted-arrow: There is no arrow from $W_1$ back to $W_0$.
  fewer-propositions-after: $W_0$ has four propositions and $W_1$, after which there is only itself, two.
  finitely-many-propositions: The propositions at $W_0$ are the subsets of the two arrows out of it.
  finitely-many-propositions-everywhere: $W_0$ has four propositions and $W_1$ two.
  actual-world-isolated: >-
    The actual-world proposition, the singleton of the identity, is in the domain; no arrow leads back
    from $W_1$ to $W_0$.
  sigma-top: This is the interpretation the definition fixes.

arguments:

- id: barcan-e
  fails: [barcan-r]
  choice: free
  by: Cian Dorr, recorded by Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: >-
    At type $e$. The haecceity $H$ of $a$, with extension $\{{a\}}$ at the identity of $W_0$ and
    $\{{b\}}$ at $f$, is necessary of everything at $W_0$, whose only individual is $a$; but after $f$
    it fails of $c$. So $\forall x\, .\,\Box Hx$ holds at $W_0$ and $\Box\forall x\, .\,Hx$ fails.

- id: finitely-many-individuals
  fails: [possible-infinity-e, infinity-e]
  choice: free
  by: Claude Opus 5.5 (Anthropic)
  date: '2026-10-11'
  text: >-
    There is one individual at $W_0$ and there are two at $W_1$, so at no world are there infinitely
    many, and the instance of the Infinity schema saying that there are at least two individuals is
    false at $W_0$.

notes: >-
  BF holds, necessarily, at every relational type (full-epic-barcan-relational), while BF at type e
  fails: BF (relational types) does not imply BF.
