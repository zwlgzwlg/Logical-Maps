id: full-two-object-chain-new-individual
name: 'Full action model: two-object chain, one individual becoming two'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 11 October 2026 (the construction and the verdicts on BF)
  recorded_by: Claude Opus 5.5 (Anthropic), 11 October 2026
  checked_by: []
