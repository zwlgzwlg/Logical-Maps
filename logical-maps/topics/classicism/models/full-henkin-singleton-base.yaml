# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ.
definition: >-
  Use the ordinary full Henkin interpretation: D_e is a singleton, D_t={0,1}, and every admitted
  function type contains all functions between its domains.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- as first recorded (17 Sep) ---

- holds: [fregean-axiom, functional-choice-r]
  text: >-
    Domains are finite by induction on types, so every serial relation has a functional
    subrelation and, when the output type is relational, a selecting operation. Equality is
    genuine equality and Box is the identity on truth values. These facts verify the listed
    positive assertions.

- fails: [infinity-e]
  text: >-
    The two finite base domains refute the infinity assertions, top is an atom, and the possible
    existence of two individuals is false although its pure sentence is C-consistent.

# --- later additions ---

- id: sigma-top
  fails: [independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.

# migration: text of the old notes that no argument holds, verbatim. Their arguments of 20 and 22
# September for verdicts now derived (the one-world principles, the pure schemata, No Contingency
# (signature Σ), the boxed choice principles) are dropped.
notes: >-
  Explicit specialization of the source’s standard Henkin construction to a singleton individual
  domain. No independent checking or formal verification is claimed. Everything that implies these
  fails with them.

