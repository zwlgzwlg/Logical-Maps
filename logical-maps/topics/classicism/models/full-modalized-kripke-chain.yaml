arguments:
- id: brouwer
  text: Let $W=\{w,v\}$, with $wRv$ but not $vRw$, and let $p=\{w\}$. At $w$, $p$ is true. At $v$, $\Diamond
    p$ is false, since $v$ sees only $v$. Hence $p\to\Box\Diamond p$ fails at $w$. Proposition 7.4 identifies
    the defined box with the frame modality; the same identity-separation argument works for the expanding-domain
    instance with total propositional domain.
  by: OpenAI Codex, prompted by Andrew Bacon
  date: '2026-10-28'
  choice: free
  fails:
  - modal-b
  writeup: classicism-s4-upper-bound
- id: functionality
  text: Corollary 7.5 proves Functionality at each world of the constant-domain construction, hence its
    necessitation. This includes every admitted input type, including e. The map derives BF and Tractarianism
    from it.
  by: OpenAI Codex, prompted by Andrew Bacon
  date: '2026-10-28'
  choice: free
  holds:
  - necessary-functionality-r
notes: This is a concrete B countermodel, not a single model refuting every S4 non-theorem. The family-level
  S4 upper bound and countermodel transfer are recorded in Background and the linked write-up. Full modalized
  domains here do not mean the repository condition full-action-model.
