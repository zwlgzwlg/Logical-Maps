description: >-
  Conjectured strengthening of the verdicts for the existing model symmetric-all-surjections,
  not a different underlying model. There is one object N, every surjection N to N is an arrow,
  and the symmetry group consists of all permutations. Domains contain the symmetric finitely
  pinned intensions, and evaluation is at the identity. Retain the base record's interpretation
  of signature constants. The proposed additions are Transversal at every admitted type and
  its boxed form; all other displayed properties are inherited from the established base record.
  For an actual extension E with least finite permutation support S_E, propose a representative
  whose extension at h is gE when h is injective on S_E and g agrees with h there, and empty when
  h collapses S_E. The proposed classifier has, at every arrow, the collection of these
  representatives as its extension. The accompanying write-up gives the argument to be checked.
notes: >-
  Conjectured, not proved, at Zachary Goodsell's request on 30 September 2026; bronze tier
  explicitly requested in the same instruction. The proposal is that Base 1 satisfies
  Transversal and therefore, using its No Pure Contingency, necessary Transversal. The proposed
  argument uses the least permutation support of an extension, rather than the pinning set of
  an arbitrarily chosen intension. Verify at every type that these least supports exist,
  that the representative construction is well-defined, symmetric and finitely pinned under
  the full surjection action, and that its equivariant range is the extension of an admissible
  classifier with exactly one representative per coextension class. A verification would
  establish the proposed strengthening; a failure of the particular construction alone would
  not refute Transversal, which would require ruling out all admissible classifiers at some
  type. If correct, Base 1 would witness that Transversal implies neither Actuality nor
  Relational Choice. The existing proved Base 1 record remains unchanged in its verdicts;
  this conjectured record supplies no proved evidence. The named model checks concern Base 1
  itself: a different model with the displayed consistency package cannot resolve them.
