group: finite-support-one-object
# migration: the definition is the group's, completed by these settings: `monoid` is the
# sentence before "In every part", verbatim; Σ is one of the group's two interpretations.
# Its text named the actual-world proposition by the identity arrow; the group describes it.
# migration (3 October): recorded at Σ top, as every member whose interpretation is one of the
# group's values now is; Σ true atom, until then the record's, is now a variant.
settings:
  monoid: >-
    Proposition D.5, part 7 (p. 78): the arrows are the maps $f_n$, for $n$ a power of $2$, sending
    $m$ to the greatest multiple of $n$ not exceeding $m$; $f_1$ is the identity.
  sigma: top

meets:
  arrows-finitely-determined: >-
    Each $\{f_n\}$ is pinned down by a finite set: $f_n$ is the only arrow sending $n$ to $n$ and $n-1$ to $0$.
  actual-world-pinned: >-
    $\{f_1\}$, $f_1$ being the identity, is pinned down by $\{0,1\}$.
  non-identity-non-injective: >-
    Each $f_n$ with $n>1$ is not injective.
  pinned-atoms: >-
    Each $\{f_n\}$ is pinned down by a finite set ($\{n-2,n-1,n\}$ for $n>1$, $\{0,1\}$ for the
    identity).
  unbounded-haecceities: >-
    With $A:=\mathbb N$: the strongest persistent property with extension $\mathbb N$ pinned down
    by $\{0,\ldots,n\}$ has, at $f_m$, the multiples of $\min\{m,n\}$ as extension.
  no-least-pinned-cover: >-
    An arrow $f_n$ is determined by its value at any $m\ge n$ and all $f_n$ with $n>N$ agree on
    $\{0,\ldots,N\}$, so the finitely pinned propositions are exactly the finite and cofinite sets
    of arrows. Let $F$ be the family of singletons $\{f_n\}$ for $n$ an even power of $2$: a
    finitely pinned superset of $\bigcup F$ is a cofinite set, and removing from it an odd-power
    member gives a strictly smaller one.

arguments:

# Rewritten at Cian Dorr's direction on 2 October 2026 (Claude Opus 5.5): every argument this
# record shared in substance with another member is now a shared argument of the group
# finite-support-one-object, with this record's witness under `meets`; second arguments for a
# verdict already argued (the trawl's, among them) were dropped. What follows is this record's own.
# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date.

- fails: [barcan-r]
  when: {individuals: naturals}
  source: {paper: bacon-dorr-classicism, locator: 'Proposition D.5(7), p. 78'}
  text: >-
    An arrow sending $1$ to $0$ sends everything to even numbers.

- fails: [strong-leibniz-t]
  # The trawl's second argument for this verdict (25 September) was dropped on 2 October.
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s questions whether the failure of BF
    sharpens to type $t$ and whether failures of Atomicity’s strengthening can be found where
    Atomicity holds
  date: '2026-09-23'
  text: >-
    A strong world is an atom, and the atoms are the singletons $\{f_n\}$. Seen from $f_n$ with
    $n\ge2$, $\{f_n\}$ becomes $\{k : k\circ f_n=f_n\}=\{f_m : m\le n\}$, since $f_m\circ
    f_n=f_{\max\{m,n\}}$, and the proposition $\{f_1\}$ splits that set. So the only strong world
    is $\{f_1\}$, whose transport along every other arrow is empty, and the possible proposition
    $\{f_2\}$ has no strong world below it.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

