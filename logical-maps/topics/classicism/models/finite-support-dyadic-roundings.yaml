notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References.

  Actuality and Atomicity hold because each $\{f_n\}$ is pinned down by a finite set
  ($\{n-2,n-1,n\}$ for $n>1$, $\{0,1\}$ for the identity); BF fails since an arrow sending $1$
  to $0$ sends everything to even numbers; Boolean Completeness fails because the strongest
  persistent property with extension $\mathbb N$ pinned down by $\{0,\ldots,n\}$ has, at $f_m$,
  the multiples of $\min\{m,n\}$ as extension and so becomes ever stronger.

  Countable Boolean Completeness fails as well, at type $e\to t$: the property $E$ that the
  source shows to lack a least upper bound has as its extension a countable family of
  haecceities, and the extensional fullness the source invokes to put $E$ in the domain also
  puts in the relation pairing the haecceity of the $k$-th member of that family with the
  numeral $k$, which injects $E$ into the numerals.

  Boolean Completeness already fails at type t: the finite/cofinite algebra of arrow indices has
  no least upper bound for the even-index singleton family.

