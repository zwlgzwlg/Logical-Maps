# migration: text of the old notes that no argument holds, verbatim: their first two sentences, and
# the sentence that followed the Σ argument, referring to its failures.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
