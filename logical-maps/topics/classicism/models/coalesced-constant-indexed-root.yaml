# migration: the definition is the old description, then the notes' sentence on the root domains,
# which describes the construction.
group: coalesced-sums
# migration (2 October): the old definition is the group's, completed by these settings.
settings:
  construction: >-
    For a signature Σ with countably infinitely many individual constants and at least one
    relational constant, take a set of action models for L(Σ) complete for C(Σ), and coalesce them
    at a new root whose individual domain is the set of individual constants, each constant denoting
    itself there and being carried by the distinguished arrow to each component onto its
    interpretation in that component; relational constants are glued as in Definition E.2, with free
    root extensions. Evaluation point: the root.
  domains: fullest
meets:
  complete-components: >-
    The action models for L(Σ) are a set complete for C(Σ), so in particular for C.
  free-root-component: The root domains are as full as compatibility allows.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another coalesced sum is now a shared argument of the group
# coalesced-sums or one of the topic's general arguments (arguments/); what follows is this
# record's own. Only the verdicts the engine needs to derive the rest are recorded, the source's
# first.

# --- from the source (22 Sep record) ---

- holds: [possibility-plus-signature-r]
  text: >-
    The root satisfies Maximalist Classicism for Σ, since every C(Σ)-consistent sentence holds at
    some component root. It satisfies Possibility+ (signature Σ): for P with free individual
    variables x̄, instantiate x̄ by pairwise distinct root individuals, that is, distinct
    constants c̄′ not occurring in P; P[c̄′/x̄] is C(Σ)-consistent because the c̄′ are fresh, so
    it is possible at the root. The instances of the pure form follow.

- holds: [axiom-of-infinity-e]
  text: >-
    Distinct constants denote distinct root individuals, so there are infinitely many individuals
    at the root, giving the Infinity Schema at type e and, the root domains being as full as
    possible so that the numeral intensions exist, the Axiom of Infinity at type e.

# --- later additions ---

# migration: the sentence of the old notes that no argument holds, verbatim. The arguments for
# □Relational Choice and the 23 September correction, whose verdicts are now derived, are dropped.

notes: >-
  Possibility+ holds here, unlike at the maximalist root, because the root individuals are the
  constants, and two distinct constants stay distinct in every component where the sentence of
  their distinctness is realized, not in one component only.

