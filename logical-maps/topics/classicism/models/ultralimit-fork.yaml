# migration: the definition is the old description.
# migration (3 October): the interpretation of Σ has no individual constants, as the topic's condition
# sigma-top now says (Cian Dorr's decision); it read "and each individual constant the individual
#".
definition: >-
  An intensional action model with one individual. The objects are the root $o$, $s$, $u$, and $n$ for
  each $n\ge1$; besides identities the arrows are $h_s\colon o\to s$, $j\colon s\to u$, $h_u:=j\circ h_s$
  and $h_n\colon o\to n$, so the root reaches each object by exactly one arrow and worlds may be identified
  with objects. The domains at $s$, $u$ and each $n$ are full. Identify the domains at the terminal objects
  $u$ and $n$ with one finite full type structure $M$ over one individual. Fix a non-principal ultrafilter
  $\mathcal U$ on the positive integers. At the root, an element of a relational type is any element of the
  full intension space whose extension at $u$ is the $\mathcal U$-limit of its extensions at the worlds
  $n$; its extensions at $o$, at $s$ and at each $n$ are unconstrained. So a root proposition is any choice
  of truth values at $o$, $s$ and the $n$s, with its value at $u$ fixed as the limit. Evaluation point: the
  root. Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
  denotes the top element of its type.

# 2 October 2026: the topic's general argument sigma-top replaces this record's copy of it.
meets:
  sigma-top: This is the interpretation the definition fixes.
  # 8 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): conditions of the topic's general
  # arguments that the model meets.
  one-individual: The definition fixes one individual, at every world.
  extensionally-full: >-
    At the root an element's extension at $o$ is unconstrained, so every set of tuples is the
    extension there of an element of the domain; the domains at $s$, $u$ and each $n$ are full.
  infinitely-many-propositions: >-
    A root proposition is any choice of truth values at $o$, $s$ and the $n$s, so there are
    infinitely many.
  metatheory-choice: >-
    The construction uses a non-principal ultrafilter, and so the axiom of choice, in the
    metatheory.
  fewer-propositions-after: >-
    The root has at least three distinct propositions, while each world $n$, which sees only itself,
    has two.
  actual-world-isolated: >-
    The proposition true at $o$ alone (false at $s$, at every $n$, and so in the limit at $u$) is in
    the root domain and entails every truth, every true proposition being true at $o$; no world other
    than $o$ sees $o$.

