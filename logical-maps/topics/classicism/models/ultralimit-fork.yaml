# migration: the definition is the old description.
# migration (3 October): the interpretation of Σ has no individual constants, as the topic's condition
# sigma-top now says (Cian Dorr's decision); it read "and each individual constant the individual
#".
definition: >-
  An intensional action model with one individual. The objects are the root $o$, $s$, $u$, and $n$ for
  each $n\ge1$; besides identities the arrows are $h_s\colon o\to s$, $j\colon s\to u$, $h_u:=j\circ h_s$
  and $h_n\colon o\to n$, so the root reaches each object by exactly one arrow and worlds may be identified
  with objects. The domains at $s$, $u$ and each $n$ are full. Identify the domains at the terminal objects
  $u$ and $n$ with one finite full type structure $M$ over one individual. Fix a non-principal ultrafilter
  $\mathcal U$ on the positive integers. At the root, an element of a relational type is any element of the
  full intension space whose extension at $u$ is the $\mathcal U$-limit of its extensions at the worlds
  $n$; its extensions at $o$, at $s$ and at each $n$ are unconstrained. So a root proposition is any choice
  of truth values at $o$, $s$ and the $n$s, with its value at $u$ fixed as the limit. Evaluation point: the
  root. Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
  denotes the top element of its type.

# 2 October 2026: the topic's general argument sigma-top replaces this record's copy of it.
meets:
  sigma-top: This is the interpretation the definition fixes.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (1 Oct record) ---

- holds: [necessary-atomicity-r, necessary-boolean-completeness-r]
  text: >-
    At the root, the map sending an element to its extensions at $o$, $s$ and the $n$s is an order
    isomorphism onto a product of powerset algebras, the extension at $u$ being recomputed as the
    limit. So every family has a meet and a join, computed coordinatewise except at $u$, and every
    nonzero element lies above an atom with one tuple in one free coordinate. The other worlds carry
    finite full powerset algebras. Hence Boolean Completeness and Atomicity hold at every world and
    every relational type.

- holds: [necessary-barcan-r]
  text: >-
    Every arrow acts surjectively at every type, so BF holds at every world (write-up, Proposition
    4).

- fails: [rigid-comprehension-r]
  # migration: the lead-in "Rigid Comprehension fails at type $t\to t$ (write-up, Theorem 6)."
  # becomes "At type $t\to t$ (write-up, Theorem 6)."
  text: >-
    At type $t\to t$ (write-up, Theorem 6). Let $A_0$ be the root propositions false at $s$ and at
    $u$, and $X$ the property with extension $A_0$ at the root and empty extensions elsewhere. A
    persistent property coextensive with $X$ contains both truth values at every world $n$, since
    members of $A_0$ take both values there; the limit condition then puts the true proposition in
    its extension at $u$. Rigidity at the root forces its extension at $s$ to be the proposition
    false at $s$ and $u$, and rigidity at $s$, tested against that proposition's haecceity, forbids
    the true proposition at $u$. The least upper bound of the haecceities of the $X$s, the candidate
    rigid coextension in the proof of Proposition 2.11, is weakly rigid but fails the rigidity
    condition at $s$. The model therefore refutes Proposition 2.11
    (necessary-atomicity-completeness-bf-imply-rigid-comprehension); the gap is the normalization
    step of n. 42, part (iv), which the write-up runs inside the model (§5).

# migration: text of the old notes that no argument holds, verbatim: their first sentence. The
# argument for Actuality at every world, now derived, is dropped: "Actuality holds at every world: at
# the root the proposition true at $o$ alone is a true atom."
notes: >-
  It is a model: the limit condition commutes with every finite operation, so every term denotes in
  the domains (write-up, Lemma 2).
