# --- from the source (1 Oct record) ---

- holds: [necessary-atomicity-r, necessary-boolean-completeness-r]
  text: >-
    At the root, the map sending an element to its extensions at $o$, $s$ and the $n$s is an order
    isomorphism onto a product of powerset algebras, the extension at $u$ being recomputed as the
    limit. So every family has a meet and a join, computed coordinatewise except at $u$, and every
    nonzero element lies above an atom with one tuple in one free coordinate. The other worlds carry
    finite full powerset algebras. Hence Boolean Completeness and Atomicity hold at every world and
    every relational type.

- holds: [necessary-barcan-r]
  text: >-
    Every arrow acts surjectively at every type, so BF holds at every world (write-up, Proposition
    4).

- fails: [rigid-comprehension-r]
  # migration: the lead-in "Rigid Comprehension fails at type $t\to t$ (write-up, Theorem 6)."
  # becomes "At type $t\to t$ (write-up, Theorem 6)."
  text: >-
    At type $t\to t$ (write-up, Theorem 6). Let $A_0$ be the root propositions false at $s$ and at
    $u$, and $X$ the property with extension $A_0$ at the root and empty extensions elsewhere. A
    persistent property coextensive with $X$ contains both truth values at every world $n$, since
    members of $A_0$ take both values there; the limit condition then puts the true proposition in
    its extension at $u$. Rigidity at the root forces its extension at $s$ to be the proposition
    false at $s$ and $u$, and rigidity at $s$, tested against that proposition's haecceity, forbids
    the true proposition at $u$. The least upper bound of the haecceities of the $X$s, the candidate
    rigid coextension in the proof of Proposition 2.11, is weakly rigid but fails the rigidity
    condition at $s$. The model therefore refutes Proposition 2.11
    (necessary-atomicity-completeness-bf-imply-rigid-comprehension); the gap is the normalization
    step of n. 42, part (iv), which the write-up runs inside the model (§5).

