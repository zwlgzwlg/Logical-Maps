id: full-present-true-theory-nonstandard
name: 'Full present: true-theory nonstandard Henkin component'
definition: >-
  Let F be the full one-world extensional typed hierarchy over omega. In its countable
  many-sorted Henkin presentation, use compactness and downward Lowenheim–Skolem to choose
  a countable H elementarily equivalent to F with a canonical e-number c different from
  every standard numeral. The language retains every parameterized finite lambda template.
  Add a full present R: R_e = H_e with identity projection, and at each flattened relational
  type tau = alpha_1 ... alpha_k t let R_tau consist of all pairs (S,a), where S is an arbitrary
  current relation on the R_alpha_i and a belongs to H_tau. Application, abstraction and
  quantification keep the original H operations in their second coordinates; old quantifiers
  range over the whole H domain. Evaluate at the new present and interpret any fixed
  relational signature constants by top. The writeup proves the C interpretation and verdicts.
