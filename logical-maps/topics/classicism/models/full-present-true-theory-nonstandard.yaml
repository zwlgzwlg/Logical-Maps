arguments:
- id: stable-analysis
  holds: [necessity-of-second-order-analysis]
  choice: uses
  writeup: full-present-true-theory-nonstandard
  text: >-
    Fix any standard finite analytical sentence and its sign in the full real field.
    At every carrier type, the universal assertion that all real-field tuples have that
    sign belongs to Th(F), hence holds in H. Full current rows make each actual real
    field at R an external complete ordered field and supply all finite-arity relations
    on it. The analytical grammar cannot distinguish duplicate relation intensions
    with the same current extension, so the same signed universal holds at R.
    It therefore holds necessarily at R. This proves the full all-carrier schema,
    including vacuous carrier instances. Sections 1–3.
- id: nonrigid-numbers
  fails: [arithmetic-necessitism]
  choice: uses
  writeup: full-present-true-theory-nonstandard
  text: >-
    At R, the current canonical e-numbers are exactly the standard numeral orbit.
    Both R and H satisfy I*_e, so the boxed guard is true. Pair that orbit with
    H's admitted predicate N_e(n) and n not equal to c. Every current R-number
    necessarily has this predicate, but H's number c witnesses failure of the
    necessary inclusion of N_e in it. Thus N_e fails weak inextensibility and
    rigidity with the Arithmetic Necessitism guard true. Section 4.
- id: no-rigid-real-carrier
  fails: [analytic-necessitism]
  choice: uses
  writeup: full-present-true-theory-nonstandard
  text: >-
    R_et has continuum many entities, so a current real field exists there by
    current fullness. Every such field has continuum many current elements.
    Necessary distinctness would make their transport into the countable H_et
    injective, which is impossible. Thus no rigid necessarily-real field at et
    can witness Analytic Necessitism. Section 5.
notes: >-
  The stable truth concerns exactly the native second-order analytical grammar.
  H is elementarily equivalent to the standard full hierarchy, not an elementary
  substructure of it; its internal fields need not be externally complete.
  SOAN failure follows from AN failure. No Necessity of Arithmetic, C5,
  No Pure Contingency or additional choice/completeness verdict is asserted.
  The construction uses ambient ZFC compactness and has a consistency upper
  bound relative to Con(ZFC); no transitive-model hypothesis is needed.
  This is an informal mathematical proof, with no independent human check
  or new Lean verification recorded.
