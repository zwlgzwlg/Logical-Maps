group: coalesced-sums
settings:
  root-arrows: interpretations
  sigma: construction
  construction: >-
    Use the pure reduct of [[periodic-integer-entrance]] as the sole
    component. Adjoin the root of [[coalesced-pinned-interpretations-root]]
    with interpretation arrows for an expanded signature having infinitely
    many names at every type. Each individual name denotes itself at the
    root. Each relational name has empty root row and projects to its
    interpreted whole entity at every entrance. Evaluate at the new root.
  domains:
    text: >-
      The root individuals are the expanded signature's individual names.
      A relational profile has arbitrary identity row, a finite pin of names,
      and transports belonging to the original component domains.
meets:
  free-root-component: Every set of current tuples occurs at the identity with empty rows at every entrance.
arguments:
- id: barcan-scopes
  holds: [barcan-r, necessary-barcan-t, necessary-strong-actuality]
  fails: [necessary-barcan-relational]
  choice: free
  writeup: pinned-interpretations-and-barcan
  text: >-
    The fresh-name witness gives every local Barcan instance at the new
    root. The old scalar entrance projects a pair of bits onto its terminal
    bit. Every transported individual property there has finite translation
    orbit, while the terminal admits the singleton of the integer zero.
    The finite-orbit tester at the old source refutes relational Barcan.
    The current-only scalar witnesses Strong Actuality at the new and old
    roots, and top does so at the terminal.
