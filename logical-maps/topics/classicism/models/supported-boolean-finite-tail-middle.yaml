id: supported-boolean-finite-tail-middle
name: 'Supported Boolean model: finite tail subsets at a middle evaluation'
definition: In external ZFC take B=2 times A times P(N), with A a complete homogeneous atomless Boolean
  algebra, singleton individuals, and the modified interior J(epsilon,a,S) whose first bit tests raw Top
  and whose other coordinates are (1_A,S) exactly when a=1_A and S is cofinite. Keep every raw scalar;
  at each permitted function type admit all nonexpansive functions having finite joint support under Aut(A)
  times Sym(N), with tail supports finite sets of subsets, fixed setwise. Use open-valued equality and
  full-range B quantifiers. Evaluate at any middle ultrafilter of A. The first and principal evaluations
  together with all middle evaluations separate B and satisfy the ordinary quantifier clauses.
