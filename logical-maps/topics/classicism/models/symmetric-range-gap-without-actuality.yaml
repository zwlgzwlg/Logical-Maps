# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; the individuals were the base already.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its arrows are of two disjoint kinds: the surjections for which the distinguished individual is
    its own only preimage, and the functions that omit the distinguished individual from their
    range. Its symmetry group is the permutations fixing that individual, which is now a proper
    subset of the first kind. An arrow's value at the distinguished individual still tells the two
    kinds apart, but no finite set separates any arrow. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  collapse-onto-point: >-
    As for the range-gap model: $F:=\lambda x\, .\,x\ne a\land\neg Ex$ with $E$ the constant intension $\{d\}$ of the distinguished individual, and $h$ a range-deficient function constant with value $p\ne d$ on $N\cup\{a\}$; $F_h$ omits $p$ and $d$, and permutations fixing $p$ and $d$ move every other point.
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\{0\}$, the distinguished individual, and for $N$ the property of not belonging to
    $N\cup\{0\}$: the transposition of $y$ with another individual outside $N\cup\{0\}$ fixes $0$, so
    lies in the symmetry group.
  fixes-or-omits: >-
    The arrows are the surjections for which $0$ is its own only preimage, which fix it, and the
    functions omitting $0$ from their range.
  transport-gap: >-
    Take $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow agreeing with it on $N$ omits
    $0$ from its range, and $q:=\{k : k0=0\}$, the first class of arrows, pinned down by $\{0\}$ and
    symmetric: an arrow $k$ of the first class and the arrow $k^{\prime}$ agreeing with it off $0$ but
    sending $0$ elsewhere, which omits $0$ from its range since $0$ is $k$’s only preimage of $0$,
    are separated by $q$. The intension the argument uses is pinned down by $N$, and symmetric,
    since $g\cdot q=q$ for $g$ fixing $0$ and $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
