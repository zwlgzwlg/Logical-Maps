# full stop.

# --- from the source (19 Sep record) ---

- holds: [boolean-completeness-r]
  text: >-
    By the draft's main theorem with the distinguished individual as the distinguished set. Two
    arrows agreeing there lie in the same one of the two classes, and a prescription taken from
    the two of them extends within that class, by nonzero values in the second case and by
    surjective nonzero values in the first.

- holds: [no-pure-contingency-r]
  text: >-
    One object gives No Pure Contingency and the boxed form.

- fails: [barcan-r]
  text: >-
    At type e by the argument of the previous variant, which goes through verbatim.

- holds: [atomlessness]
  text: >-
    The first class of arrows contains non-injective ones, which restores the arguments used for
    the all-surjections model: given a true proposition pinned down by a finite set containing the
    distinguished individual and one other, the proposition that a fresh individual is not
    collapsed with that set is a strictly stronger truth; and the same splitting applied to an
    arbitrary nonzero proposition rather than a true one gives Atomlessness.

# --- later additions ---

- holds: [axiom-of-infinity-e]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary, which is the text.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The individuals are the natural numbers and identity at the identity arrow is literal, so no
    numeral counts them. The propositions that a given individual is fixed by the arrow, one for
    each individual, are pairwise distinct, symmetric and pinned by that individual, so there are
    infinitely many propositions. The set of numerals at each type is invariant under every arrow,
    hence symmetric and pinned by the empty set, so finite cardinality is standard and no finite
    cardinality holds of the universal property at either type.

- id: sigma-top
  fails: [independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.
    Everything that implies these fails with them.

- fails: [relational-choice-r]
  # migration: the closing "Argument of 23 September 2026, after Cian Dorr’s observation that a
  # choice over the individuals cannot be finitely pinned down;" becomes `by` and `date`; in what
  # followed it, "he" becomes "Cian Dorr".
  by: Claude Fable 5.1 (Anthropic), after Cian Dorr’s observation that a choice over the
    individuals cannot be finitely pinned down
  date: '2026-09-23'
  text: >-
    At the types $(e\to t)$ and $e$. Let $U:=\lambda Xy\, .\,Xy\lor\neg\exists z\, .\,Xz$, a
    closed term, hence in the domain, and serial. A functional subrelation $S$ of $U$ would lie in
    the domain at the evaluation object, so it is symmetric and pinned down by a finite set $N$.
    Two facts about such an $S$ (Dorr, draft, Lemma 21): every $g\in G$ fixing $N$ pointwise
    satisfies $g^{[\sigma]}S=S$, and symmetry gives $\langle gA,gy,g\rangle\in S$ whenever
    $\langle A,y,1\rangle\in S$; together, $\langle gA,gy,1\rangle\in S$. Now let $A$ be the
    property of not belonging to $N\cup\{0\}$. It is in the domain, being pinned down by that
    finite set and symmetric, and its extension is nonempty, so $S$ relates $A$ at the identity to
    some $y$ in its extension. The transposition of $y$ with another individual outside
    $N\cup\{0\}$ fixes $0$, so lies in $G$, fixes $A$ and moves $y$ to some $gy\ne y$, so $S$
    relates $A$ to $gy$ as well, and $S$ is not functional at the identity arrow. The
    well-ordering of the individuals that Cian Dorr had in mind is refuted by the same two facts,
    but the direct route needs no derivation of a well-ordering from Relational Choice in C.

- fails: [barcan-t]
  by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of BF
    sharpens to type $t$
  date: '2026-09-23'
  text: >-
    In a one-object finitely pinned model, BF (type t) fails as soon as there are a finite $N$, an
    arrow $i$ and a proposition $q$ in the domain that is the transport $i^{\prime}\cdot p=\{k :
    k\circ i^{\prime}\in p\}$ of no proposition $p$ along any arrow $i^{\prime}$ agreeing with $i$
    on $N$: the intension $X:=\{\langle r,j\rangle : r\ne q\text{ or }j\text{ disagrees with
    }i\text{ on }N\}$ is pinned down by $N$, contains $\langle i^{\prime}\cdot
    p,i^{\prime}\rangle$ for every $p$ and $i^{\prime}$, so $\forall p\, .\,\Box Xp$ holds at the
    identity, and omits $\langle q,i\rangle$, so $\Box\forall p\, .\,Xp$ fails there. Since
    membership of $k$ in $i^{\prime}\cdot p$ depends only on $k$ restricted to the range of
    $i^{\prime}$, it suffices that $q$ separate two arrows agreeing on every such range. Here take
    $N=\{0\}$, $i$ any arrow with $i0\ne0$, so that every arrow agreeing with it on $N$ omits $0$
    from its range, and $q:=\{k : k0=0\}$, the first class of arrows, pinned down by $\{0\}$ and
    symmetric: an arrow $k$ of the first class and the arrow $k^{\prime}$ agreeing with it off $0$
    but sending $0$ elsewhere, which omits $0$ from its range since $0$ is $k$’s only preimage of
    $0$, are separated by $q$. The intension $X$ is symmetric, since $g\cdot q=q$ for $g$ fixing
    $0$ and $(g\circ j)0=0$ iff $j0=0$, so it lies in the domain.

- holds: [inextensible-comprehension-r]
  # migration: "Argument of Claude Opus 5.5 (Anthropic), 27 September 2026, at Cian Dorr's request."
  # becomes `by` and `date`.
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    At every relational type, by an adaptation of the argument recorded for the all-surjections
    model (symmetric-all-surjections), whose facts (1)–(3) and transversal lemma are used here.
    Write $0$ for the distinguished individual, $A$ for the first class of arrows (surjections
    with $0$ as its own only preimage) and $B$ for the second (arrows omitting $0$ from their
    range). $B$ is absorbing: if $h\in B$ then $i\circ h$ omits $0$, since $i0=0$ only when $i\in
    A$ and then $i$ sends nothing else to $0$. So the proposition $\alpha:=\{k : k0=0\}$, the
    class $A$, is true at $1$, pinned down by $\{0\}$, symmetric, and once false stays false.

    Given $X$ pinned down by $S_X$, put $S:=S_X\cup\{0\}$ and $Y:=\lambda\bar z\,
    .\,\alpha\land\delta_S\land X\bar z$, with $\delta_S$ the proposition that no two members of
    $S$ are collapsed. $Y$ is symmetric, pinned down by $S$ and coextensive with $X$. At a world
    in $B$, or one collapsing $S$, $Y$ is empty there and at every world it sees. A world $i\in A$
    injective on $S$ can be relabelled by a permutation fixing $0$, hence in the symmetry group,
    so that it fixes $S$ pointwise. For such $i$ the transversal lemma holds: $i$ is surjective,
    preimages of points outside $S$ lie outside $S$, the permutation $\tau$ of $\mathbb N\setminus
    S$ fixes $0$ and so lies in the symmetry group, which keeps the extension of $X$ at $1$ closed
    under $\tau\cdot$, and $i\circ\tau\in A$ fixes the pinning set of $r$. The rest of the
    argument, including the leading box, goes through verbatim. BF fails here, so the surjectivity
    used in the lemma is available only at the worlds in $A$; the conjunct $\alpha$ removes the
    others.

