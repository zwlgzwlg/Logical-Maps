# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ.
definition: >-
  A symmetric ideally-full intensional action model over one object, the set of natural numbers.
  Its arrows are of two disjoint kinds: the surjections for which the distinguished individual is
  its own only preimage, and the functions that omit the distinguished individual from their
  range. Its symmetry group is the permutations fixing that individual, which is now a proper
  subset of the first kind. An arrow's value at the distinguished individual still tells the two
  kinds apart, but no finite set separates any arrow. The evaluation point is the identity arrow.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
