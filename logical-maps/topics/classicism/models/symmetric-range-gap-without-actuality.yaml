notes: >-
  The second of the draft's two variants in which BF fails, arranged so that the range
  deficiency no longer brings Actuality with it. Since Actuality fails, Weak Rigid Comprehension
  and Rigid Comprehension fail too, which are recorded as derived verdicts. Atomlessness is the
  Proposition 45 argument for Atomicity read for an arbitrary nonzero proposition, and the
  failure of ND at type e follows from the non-injective arrows; neither is displayed separately
  in the draft. The source is a work in progress.

  Actuality and Atomicity fail because the first class of arrows contains non-injective ones,
  which restores the arguments used for the all-surjections model: given a true proposition
  pinned down by a finite set containing the distinguished individual and one other, the
  proposition that a fresh individual is not collapsed with that set is a strictly stronger
  truth; and the same splitting applied to an arbitrary nonzero proposition rather than a true
  one gives Atomlessness.

  Argument of 23 September 2026, after Cian Dorr’s observation that a choice over the
  individuals cannot be finitely pinned down; the well-ordering of the individuals that he had
  in mind is refuted by the same two facts, but the direct route needs no derivation of a
  well-ordering from Relational Choice in C.

  Argument of Claude Opus 5.5 (Anthropic), 27 September 2026, at Cian Dorr's request.

  Observation of 23 September 2026, answering Cian Dorr’s question whether the failure of BF
  sharpens to type $t$.

