sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, 26 November 2026, preserving a pair at grade zero and sending all individuals into it at positive grades.
- The map's graded-maps-free-words-glued-constants and symmetric-surjection-products constructions for bounded pins and last-letter gluing.
