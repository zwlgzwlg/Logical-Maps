sources:
- The proposal in the 24–25 November 2026 map records for Potential Infinity (type t) and its comparison with Possible Infinity, to put a four-proposition entrance before a hyperfinite world.
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, construction with finite cyclic groups and verification of the entrance's domains and infinity verdicts, 26 November 2026, in the accompanying write-up.
