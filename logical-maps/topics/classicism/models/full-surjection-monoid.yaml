# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. The
# interpretation's "one fixed individual $d$" lost its "$d$", which the No Contingency (signature Σ)
# argument, now a general one, names itself.
# migration (3 October): the construction drops "and a surjective individual action", the
# individuals now being the group's parameter; both of its values act surjectively, which is what
# the source's argument below uses. The `meets` for homogeneous-individuals, which concerned the
# source's action, is now each individuals value's.
settings:
  construction: >-
    Use the monoid of surjections of an infinite set, at its sole object.
  individuals: singleton
  sigma: top
meets:
  incomparable-free-arrows: >-
    Two surjections of $\mathbb N$ with incomparable kernels, say one identifying only $0,1$ and one
    identifying only $2,3$: a surjection is fixed only by the identity, and $k^{\prime}=m\circ k$
    requires the kernel of $k$ to lie inside that of $k^{\prime}$.
  arbitrary-infinite-set: The monoid is that of the surjections of any infinite set.
  continuum-many-arrows:
    when: {metatheory: [choice, no-countable-choice-reals]}
    text: >-
      Once the infinite set contains the natural numbers (by choice, or because it is $\mathbb N$ in
      the variant without countable choice), a set $C$ of natural numbers is sent to the surjection
      that swaps $2n$ and $2n+1$ for each $n\in C$ and fixes everything else, a bijection; distinct
      sets give distinct surjections. With socks the set need contain no copy of the natural numbers.
  numbered-returning-arrows: >-
    $h_0$ the identity and $h_n$ a transposition, a surjection that is its own retraction: of $0$ and
    $n$ when the infinite set is $\mathbb N$ (with choice, or in the variant without countable
    choice), and of the two members of $P_n$ when it is the union of the socks.
  returning-arrow: >-
    A bijection other than the identity, which its inverse retracts.
  nonidentity-arrow: >-
    Halving.
  unretracted-arrow: >-
    Halving is not injective, so no surjection $m$ has $m\circ k=1$ for it.
  epic-arrows: >-
    A surjection $k$ is an epimorphism among the surjections, $m\circ k=m^{\prime}\circ k$ giving $m=m^{\prime}$; and on the individuals every arrow is the identity.
  infinitely-many-propositions: >-
    The propositions are all the sets of arrows, and there are infinitely many surjections.
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: >-
    It has one object.
  irreversible-arrow: >-
    A surjection that is not injective: no composite with it is the identity.

arguments:

- fails: [intensional-choice-r, relational-choice-r]
  when: {metatheory: socks}
  choice: free
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-08'
  text: >-
    At type $t$, with the monoid that of the surjections of the union $X=\bigcup_n P_n$ of the
    socks. For $x\in X$ let $q_x:=\{k : k(x)=x\}$, a proposition since the model is full; $x$ is the
    one point fixed by every member of $q_x$, since for $y\ne x$ the transposition of $y$ with a third
    point is a surjection fixing $x$ and moving $y$. Relational Choice: let $U$ relate $q_x$ to each
    $q_y$ with $y$ in the pair after $x$'s, and every other proposition to every proposition. It is
    serial, and a functional subrelation would give $f$ with $f(x)$ in the pair after $x$'s;
    iterated from a member $s_0$ of $P_0$ it would choose a sock from every pair. Intensional Choice:
    let $F$ hold at each arrow $h$ of the $q_y$ with $y$ in the pair after $h(s_0)$'s. It is
    necessarily instantiated. A $G\le F$ necessarily uniquely instantiated holds at the
    transposition of $s_0$ and $x$ (the identity if $x=s_0$), an arrow given by $x$ without choice,
    of a single $q_y$ with $y$ in the pair after $x$'s, which gives the same $f$. Both fail, with one
    individual or many. The next pair is needed: with $h(s_0)$'s own pair, $G$ could hold at $h$ of
    $q_{h(s_0)}$. (The witness sketched in the analysis of 4 October 2026, for this model.)


