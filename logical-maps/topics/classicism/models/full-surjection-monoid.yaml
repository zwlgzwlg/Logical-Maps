# migration: text of the old notes that no argument holds, verbatim: their first two sentences. The
# arguments for □Strong Leibniz Biconditionals (type t) and □Relational Choice, now derived, are
# dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References.

  Under it the signature schemata that give the constants a special role fail: with $c\in\Sigma$
  of relational type $\tau$, $c=\top_\tau$ necessarily, so Witnessed Possibility fails for the
  pure formula $x\ne\top_\tau$, Separated Structure fails since $\lambda x\, .\,x$ and $\lambda
  x\, .\,\top_\tau$ agree on $c$, Independence (signature Σ) fails since $c$ denotes what a
  closed pure term denotes, and Distinctness Maximalism (signature Σ) fails since $c=\top_\tau$
  is true and unprovable. But No Contingency (signature Σ), and with it B for sentences of Σ,
  hold. In a one-object model whose propositions are all the sets of arrows, a singleton $\{h\}$
  is a strong world exactly when its transport $\{j : j\circ i=h\}$ along every arrow $i$ has at
  most one member, since the propositions at that world are again all sets of arrows and a
  two-element set is split by a singleton. Here every arrow is a surjection, so $j\circ
  i=j^{\prime}\circ i$ forces $j=j^{\prime}$. So every singleton is a strong world, every
  possible proposition contains an arrow, and the type-t Strong Leibniz Biconditionals hold at
  every world. □Relational Choice holds: the truncation of a full action model at any arrow is
  again a full action model, its domains at the reachable objects being unchanged, and
  Relational Choice holds in every full model given choice in the metatheory (Classicism, p.
  61).

