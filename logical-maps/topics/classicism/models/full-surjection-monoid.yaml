settings:
  construction: >-
    Use the monoid of surjections of an infinite set, at its sole object.
  individuals: singleton
  sigma: top
meets:
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: >-
    It has one object.
  irreversible-arrow: >-
    A surjection that is not injective: no composite with it is the identity.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another full action model is now one of the topic's general
# arguments (arguments/), reached through the group full-action-models and this record's `meets`;
# what follows is this record's own. Only the verdicts the engine needs to derive the rest are
# recorded, the source's first.

# --- from the source (17 Sep record) ---

- holds: [no-pure-contingency-r, rigid-comprehension-r, atomicity-r, barcan-r]
  fails: [distinctness-necessary-t]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, third paragraph'}
  # migration (3 October): the source takes a surjective individual action; one individual and
  # infinitely many fixed individuals both act surjectively.
  text: >-
    The source cites Bacon 2020, Proposition A.3 for the higher-type surjectivity argument.

# --- later additions ---

- holds: [axiom-of-infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary.
  # migration (3 October): the type-$e$ half is now the general argument for infinitely many fixed
  # individuals, which is this argument's; the text keeps the type-$t$ half.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The arrows are an infinite monoid, identity at the identity arrow is literal, and the numeral
    sets at type t are intensions of a full model, so no finite cardinality holds of the universal
    property at type t.

- fails: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Let $p:=\{\mathrm{id}\}$, true. Any witness $q$ for $\Box_{\ne}p$ is true, so contains the
    identity, and for a non-identity bijection $i$ the arrow $i^{-1}$ gives $i^{-1}\circ i\in q$,
    so $\Diamond q$ holds under $i$ while $p$ does not. So no true $q$ has $\Box(\Diamond q\to
    p)$.

# migration: text of the old notes that no argument holds, verbatim: their first two sentences. The
# arguments for □Strong Leibniz Biconditionals (type t) and □Relational Choice, now derived, are
# dropped.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References.


  The source takes infinitely many individuals with a surjective action, such as the surjections'
  action on the set by evaluation. That action gives, on the map's principles, what the variant
  with infinitely many fixed individuals gives: it is surjective and homogeneous, and the failure
  of ND at type $e$ that its non-injectivity brings adds nothing, ND failing already at type $t$.

was_conjectured: true

