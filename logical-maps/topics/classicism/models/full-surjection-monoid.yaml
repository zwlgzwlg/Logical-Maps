# migration: text of the old notes that no argument holds, verbatim: their first two sentences. The
# arguments for □Strong Atomicity (type t) and □Relational Choice, now derived, are
# dropped.
- id: analytic-necessitism-same-carrier-repair
  holds: [second-order-analytic-necessitism]
  when: {metatheory: choice}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    Choose x0 and distinct b_n in the infinite set on which the surjection monoid is defined. Put p_A={f:f(x0) is in {b_n:n in A}}. If A and B differ at n, then for every h a permutation u with u(h(x0))=b_n separates the transports h.p_A and h.p_B. Universal/empty rows lift this separated continuum to every relational carrier type.
    At e, the fixed individual set either cannot carry a real field or has a fixed
    continuum. Apply the full-action same-carrier criterion: direct-image field
    profiles are rigid and necessarily real, and the direct-image higher families
    of all subset relations give represented powers of every finite arity.
    This proves every same-carrier SOAN instance; AN is derived. ZFC and the recorded
    fixed/singleton individual settings are essential to the stated scope.
    Proof and construction hypotheses:
    [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 4–5.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Appended the carrier-sensitive SOAN proof for the explicitly guarded ZFC settings,
      replacing lost shared support without duplicating the derived AN verdict or
      claiming a choiceless extension. All previous arguments and certificate retained.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References.

  The source takes infinitely many individuals with a surjective action, such as the surjections'
  action on the set by evaluation. That action gives, on the map's principles, what the variant
  with infinitely many fixed individuals gives: it is surjective and homogeneous, and the failure
  of ND at type $e$ that its non-injectivity brings adds nothing, ND failing already at type $t$.

was_conjectured: true

