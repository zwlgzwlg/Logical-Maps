# --- later additions ---

- fails: [strong-leibniz-t]
  # migration: the lead-in "The type-t Strong Leibniz Biconditionals fail at $W_0$:" is dropped,
  # $W_0$ being the evaluation point.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    The possible proposition $\{h\}$ has only itself as a candidate strong world below it, but
    under $h$ it becomes $\{x : x\circ h=h\}=\{\mathrm{id}_{W_1},k\}$, which the proposition
    $\{\mathrm{id}_{W_1}\}$ of $W_1$’s full domain separates, so $\{h\}$ does not necessarily
    settle every proposition. Since Atomicity holds in this full model, this shows that Atomicity
    (type t) alone does not yield the type-t Strong Leibniz Biconditionals; BF (type t) fails
    here, $h$ acting non-surjectively from a four-element to an eight-element domain.

- holds: [gallin-extensional-comprehension-r]
  # migration: the lead-in "Gallin Extensional Comprehension holds at $W_0$." is dropped, $W_0$
  # being the evaluation point.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    Since $j\circ h=1_{W_0}$, every arrow out of $W_0$ acts injectively at every type (a left
    inverse exists), and the equivalence relation on pairs (arrow $g$ out of $W_0$, tuple at its
    target) generated by $(g,\bar b)\sim(x\circ g,x\cdot\bar b)$ has as its classes the sets
    $\{(1_{W_0},\bar a)\}\cup\{(h,\bar b) : j\cdot\bar b=\bar a\}$, one for each tuple $\bar a$ at
    $W_0$, using $k\circ h=h$ and $j\circ k=j$. Given $X$ with extension $E$ at $W_0$, let $Y$
    hold at $(g,\bar b)$ iff that pair lies in the class of some $(1_{W_0},\bar a)$ with $\bar
    a\in E$; $Y$ is a natural intension, so in the full model, it is coextensive with $X$ at
    $W_0$, and both $Y$ and its negation take only the values $\top$ and $\bot$, so both are
    persistent. The boxed form fails, as recorded, since ND fails at $W_1$.

# migration: the old description's last sentence and the text of the old notes that no argument
# holds, verbatim. The argument for the failure of the Distinctness-preserving collapse, now
# derived, is dropped.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Only the type-t ND assertion is recorded. Everything that implies these fails with
  them.

was_conjectured: true

