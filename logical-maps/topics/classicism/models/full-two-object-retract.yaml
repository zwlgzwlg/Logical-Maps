id: full-two-object-retract
name: 'Full action model: two-object retract'
certificate:
  source_id: bacon-dorr-classicism
  produced_by: Andrew Bacon and Cian Dorr
  recorded_by: OpenAI Codex (GPT-6), prompted by Zachary Goodsell, 17 September 2026
  checked_by: []
  date: '2026-09-17'
  lean: none
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, p. 59, fifth paragraph and n. 81;
  p. 61.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, p. 59, fifth paragraph and n. 81; p. 61
group: full-action-models
settings:
  construction: Use the source’s category with h:W0→W1, j:W1→W0 and k:W1→W1, evaluated at W0.
  individuals: singleton
  sigma: top
meets:
  fixed-arrow: >-
    $k\circ h=h$ with $k\ne1_{W_1}$.
  comparable-free-arrows-everywhere: >-
    Out of $W_0$ only $1$ is fixed by nothing but the identity, $h$ being fixed by $k$; out of $W_1$
    the arrows fixed only by the identity are $1$ and $j$ ($k$ is fixed by $k$), and $j=j\circ1$.
  uniquely-factored-free-arrows-everywhere: >-
    At $W_0$, $1=m\circ h$ forces $m=j$ and $1=m\circ1$ forces $m=1$; at $W_1$, $j=m\circ k$ forces
    $m\circ h=1$, so $m=j$, and $j=m\circ j$ or $1=m\circ x$ force $m=1$ and $x=1$.
  finitely-many-arrows-everywhere: >-
    Two arrows out of $W_0$ and three out of $W_1$.
  nonepic-arrow: $1\circ h=k\circ h$, with $1\ne k$.
  returning-arrow: $h$, which $j$ retracts.
  unique-retractions-everywhere: Out of $W_0$, the identity has only itself as retraction and $h$ only
    $j$, the one arrow back. Out of $W_1$, the identity has only itself; $j$ has none, since $h\circ j=k\ne1$;
    and $k$ has none, since $1\circ k=k\circ k=k$.
  coherent-retractions: Every arrow into $W_0$ is the one function to its single member, so any choice
    is coherent.
  nonidentity-arrow: The arrow $h:W_0\to W_1$.
  retractions: The arrows out of $W_0$ are its identity and $h$, which $j$ retracts.
  finitely-many-propositions: $W_0$ has four propositions, the sets of its two arrows out.
  finitely-many-propositions-everywhere: $W_0$ has four propositions and $W_1$ eight, the sets of its
    three arrows out.
  sigma-apart: The construction does not mention Σ.
  noninvertible-retracted-arrow: $h$ is retracted by $j$ but $h\circ j=k\ne 1_{W_1}$.
  trivial-isomorphisms-everywhere: Out of $W_0$ only the identity is invertible; out of $W_1$, $j$ has
    no inverse and $k$ is a non-identity idempotent.
arguments:
- id: analytic-necessitism-same-carrier-repair
  holds: [second-order-analytic-necessitism]
  when: {metatheory: choice, individuals: fixed-infinite}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    The category has finitely many arrows out of each object, and individuals form the same fixed infinite set. The type induction gives, at each carrier type, either finite domains everywhere or a coherent separated continuum at every object.
    At e, the fixed individual set either cannot carry a real field or has a fixed
    continuum. Apply the full-action same-carrier criterion: direct-image field
    profiles are rigid and necessarily real, and the direct-image higher families
    of all subset relations give represented powers of every finite arity.
    This proves every same-carrier SOAN instance; AN is derived. ZFC and the recorded
    fixed/singleton individual settings are essential to the stated scope.
    Proof and construction hypotheses:
    [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 4–5.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Appended the carrier-sensitive SOAN proof for the explicitly guarded ZFC settings,
      replacing lost shared support without duplicating the derived AN verdict or
      claiming a choiceless extension. All previous arguments and certificate retained.
notes: The cited construction is a model of the map’s relational-type framework. The description identifies
  its evaluation point; construction and verification are given at the PDF locations in References. Only
  the type-t ND assertion is recorded. Everything that implies these fails with them.
was_conjectured: true
