  fails: [necessary-distinctness-necessary-t]
  reserve: true
  source: {paper: bacon-dorr-classicism, locator: "§3.5, p. 59, fifth paragraph and n. 81; p. 61"}

- holds: [relational-choice-r]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-20'
  text: >-
    Added Relational Choice at Cian Dorr's direction. With choice in the metatheory a serial
    relation has a functional subrelation, and a full model contains every intension, so that
    subrelation is in the domain; see Classicism, p. 61, on the principles common to full
    models.

- fails: [witnessed-possibility-r, separated-structure-r, distinctness-signature-r]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.

- fails: [distinctness-preserving-collapse]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
