- holds: [transversal-choice-r]
  reserve: true
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    Added Transversal Choice, by the argument recorded for Relational Choice: a full model
    contains every intension, in particular one whose extension at the evaluation point is a
    transversal, chosen in the metatheory, of the extension there of an equivalence relation;
    the equivalence and transversal conditions are unboxed. Recorded on a question of Zachary
    Goodsell, after an observation of Christopher Sun.

# migration: the old description's last sentence and the text of the old notes that no argument
# holds, verbatim. The argument for the failure of the Distinctness-preserving collapse, now
# derived, is dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
# "Everything that implies these fails with them." is back at the end of the argument it followed (5 October 2026).
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References. Only the type-t ND assertion is recorded.

  The type-t Strong Leibniz Biconditionals fail at $W_0$: the possible proposition $\{h\}$ has
  only itself as a candidate strong world below it, but under $h$ it becomes $\{x : x\circ
  h=h\}=\{\mathrm{id}_{W_1},k\}$, which the proposition $\{\mathrm{id}_{W_1}\}$ of $W_1$’s full
  domain separates, so $\{h\}$ does not necessarily settle every proposition.
  Distinctness-preserving collapse fails at $W_0$: let $p:=\{\mathrm{id}_{W_0}\}$, true. A
  witness $q$ contains $\mathrm{id}_{W_0}$, and $j\circ h=\mathrm{id}_{W_0}$, so $\Diamond q$
  holds under $h$ while $p$ does not. The Infinity Schema at type $t$ fails: $W_0$ has exactly
  four propositions with literal identity, so there are no five pairwise distinct ones; Possible
  Infinity (type $t$) fails as well, since $W_1$ has eight. Observations of Claude Fable 5.1
  (Anthropic), 25 September 2026.

