settings:
  construction: The category with objects $W_0$, $V$, $U$ generated by $h:W_0\to V$ and $g_1,g_2:V\to
    U$ subject to $g_1\circ h=g_2\circ h$; its arrows are the identities, $h$, $g_1$, $g_2$ and $d:=g_1\circ
    h$. Evaluated at $W_0$. Every endomorphism monoid is trivial and no arrow leads back towards $W_0$.
  individuals: singleton
  sigma: top
meets:
  finitely-many-arrows-everywhere: Three arrows out of $W_0$, three out of $V$, one out of $U$.
  finitely-many-propositions-everywhere: Eight propositions at $W_0$ and at $V$, two at $U$.
  finitely-many-propositions: Eight propositions at $W_0$, the subsets of $\{1,h,d\}$.
  sigma-apart: The construction does not mention Σ.
  nonepic-arrow: $g_1\circ h=g_2\circ h$ with $g_1\ne g_2$.
  nonidentity-arrow: $h$.
  unretracted-arrow: No arrow leads into $W_0$ but its identity, so $h$ has no retraction.
  irreversible-arrow: '$h$: no arrow leads back to $W_0$.'
  actual-world-isolated: The actual-world proposition $\{1_{W_0}\}$ is in the domain, the model being
    full; no arrow leads back to $W_0$, so no other world sees it.
  unique-retractions-everywhere: 'No non-identity arrow has a retraction: the only arrows into $W_0$,
    $V$ and $U$ from elsewhere go forward along the fork.'
  retracted-arrows-invertible-everywhere: Only identities are retracted.
  trivial-left-stabilisers-everywhere: Every endomorphism monoid is $\{1\}$, so $m\circ k=k$ forces $m=1$
    everywhere.
  comparable-free-arrows: 'The arrows out of $W_0$ are $1$, $h=h\circ1$ and $d=g_1\circ h$: each is a
    left multiple of the one before.'
  free-nonepic-composite: $d=g_1\circ h=g_2\circ h$ with $g_1\ne g_2$, and $d$ is fixed only by $1_U$.
arguments:
- fails:
  - necessary-self-atoms-are-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At $V$, which $h$ reaches: the arrows $g_1,g_2$ out of it are each fixed only by $1_U$ and neither
    is a left multiple of the other, $U$ having only its identity, so $\{g_1,g_2\}$ is a self-atom at
    $V$ (its transport along either is $\{1_U\}$) that is not an atom. So Self-atoms are atoms (type t)
    fails at $V$, and its boxed form fails at $W_0$.'
- id: analytic-necessitism-same-carrier-repair
  holds: [second-order-analytic-necessitism]
  when: {metatheory: choice, individuals: fixed-infinite}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    The category has finitely many arrows out of each object, and individuals form the same fixed infinite set. The type induction gives, at each carrier type, either finite domains everywhere or a coherent separated continuum at every object.
    At e, the fixed individual set either cannot carry a real field or has a fixed
    continuum. Apply the full-action same-carrier criterion: direct-image field
    profiles are rigid and necessarily real, and the direct-image higher families
    of all subset relations give represented powers of every finite arity.
    This proves every same-carrier SOAN instance; AN is derived. ZFC and the recorded
    fixed/singleton individual settings are essential to the stated scope.
    Proof and construction hypotheses:
    [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 4–5.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Appended the carrier-sensitive SOAN proof for the explicitly guarded ZFC settings,
      replacing lost shared support without duplicating the derived AN verdict or
      claiming a choiceless extension. All previous arguments and certificate retained.
notes: 'Built to separate Self-Atomicity from Strong Atomicity: every arrow is fixed
  only by the identity, so every singleton is a self-atom, but $h$ is not epic. With □Atomicity, □Actuality,
  □Strong Actuality, □Rigid Comprehension and Rigid Power all holding, it shows that no result deriving
  BF, or Strong Atomicity, from them can replace the latter by Self-Atomicity with any
  of those added. Self-atoms are atoms holds at $W_0$ but not at $V$.'
