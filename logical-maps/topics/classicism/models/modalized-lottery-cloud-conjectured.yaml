description: The specified strong-limit lottery at its designated root, as in [[modalized-lottery-cloud]].
notes: The lottery represents all complete Boolean algebras of size below μ. To obtain the revised verdict it
  suffices to prove that the root inexact ordinal carrier has size below μ. Then any carrier of size at least
  μ contains a subset of size μ, strictly larger than H and power-closed by strong limit and full current extensions.
  The strict-propositional-smallness calculation alone does not give the ordinal bound. The proposed bound and
  the model check are refuted by the ordinal thresholds in the base model’s write-up.
