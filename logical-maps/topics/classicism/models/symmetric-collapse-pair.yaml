  by: Claude Fable 5.1 (Anthropic)
  summary: Added both Axioms of Infinity at Cian Dorr's direction. The individuals are the natural numbers
    and identity at the identity arrow is literal, so no numeral counts them. The propositions that a
    given individual is fixed by the arrow, one for each individual, are pairwise distinct, symmetric
    and pinned by that individual, so there are infinitely many propositions. The set of numerals at each
    type is invariant under every arrow, hence symmetric and pinned by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property at either type.
