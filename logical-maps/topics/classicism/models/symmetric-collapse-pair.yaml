# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ, in which "described above" becomes ", the set of arrows that are permutations", the phrase
# the Distinctness-preserving collapse argument uses for the Actuality witness.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. Its
# text named the actual-world proposition "the set of arrows that are permutations", which is the
# symmetry group, as the group's text calls it.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its symmetry group is the permutations that preserve a fixed pair of individuals setwise, and
    its arrows are those permutations together with all the surjections that collapse the two
    members of that pair. Every arrow is therefore invertible or a collapser, and which it is can be
    read off from its behaviour on that pair. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\{0,1\}$, the fixed pair, and for $N$ the property of not belonging to $N\cup\{0,1\}$: the
    transposition of $y$ with another individual outside $N\cup\{0,1\}$ fixes $\{0,1\}$, so lies
    in the symmetry group.
  separable-collapses: >-
    The pairs $\{n,m\}$ with $n,m\ge2$: a surjection that collapses $0$ with $1$ and $n$ with $m$,
    and nothing else, is an arrow.
  surjective-arrows: The arrows are permutations and surjections.
  symmetry-group-pinned: >-
    Membership in the symmetry group is detected by the fixed pair: an arrow is in it iff it does
    not collapse the pair.
  actual-world-isolated: >-
    The actual-world proposition is the symmetry group, the set of arrows that are permutations,
    pinned down by the fixed pair; no composite with a non-bijective arrow is a permutation.
  actuality-contingent: >-
    The actual-world proposition, the symmetry group, is in the domain; at every world a collapsing
    arrow leads outside it, and a collapsing arrow carries it to the empty set.
  irreversible-arrow: >-
    A collapsing arrow: no composite with it is a permutation.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
# witness under `meets`; what follows is this record's own. Only the verdicts the engine needs to
# derive the rest are recorded, the source's first.

# --- from the source (19 Sep record) ---

- holds: [boolean-completeness-r]
  # Recorded although the other verdicts give it: the Rigid Comprehension argument takes the least
  # upper bounds this one provides.
  text: >-
    By the draft's main theorem with the fixed pair as the distinguished set; splicing fails at
    that pair, but the pair is exactly what certifies invertibility, and the separated arrows are
    handled by symmetry instead.

- holds: [rigid-comprehension-r]
  text: >-
    At every relational type. Given a relation with extension S pinned down by a finite set, take
    the least upper bound of the union of the haecceities of the members of S, computed with the
    fixed pair adjoined to the pinning set. Persistence is immediate, and the extension is exactly
    S because an arrow agreeing with the identity on a set containing the fixed pair is
    invertible. The rigidity criterion is then checked separately at invertible worlds, where
    leastness delivers it, and at collapsing worlds, where surjectivity supplies the preimages
    that persistence demands.

- fails: [atomicity-t]
  text: >-
    With the proposition that the two members of the fixed pair are identical as a nonzero
    proposition having no atom below it.

# --- later additions ---

# migration: text of the old notes that no argument holds, verbatim. Their argument for the failure
# of ND, now derived, is dropped.
notes: >-
  This model is not a second witness to the draft's main result but a counterweight to it. Rigid
  Comprehension holds, so the failure of Actuality in the all-surjections model is no accident.
  Because Atomicity fails here, the model settles a question left open in Classicism: Rigid
  Comprehension does not imply Atomicity. The boxed forms of Actuality and Rigid Comprehension use
  the draft's one-object observation, which it states for Boolean Completeness and applies in the
  same way in its final section. The source is a work in progress. Everything that implies these
  fails with them.

