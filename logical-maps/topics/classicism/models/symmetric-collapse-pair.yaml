# migration: the definition is the old description's first paragraph, then the notes' interpretation
# of Σ, in which "described above" becomes ", the set of arrows that are permutations", the phrase
# the Distinctness-preserving collapse argument uses for the Actuality witness.
group: symmetric-ideally-full
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. Its
# text named the actual-world proposition "the set of arrows that are permutations", which is the
# symmetry group, as the group's text calls it.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    A symmetric ideally-full intensional action model over one object, the set of natural numbers.
    Its symmetry group is the permutations that preserve a fixed pair of individuals setwise, and
    its arrows are those permutations together with all the surjections that collapse the two
    members of that pair. Every arrow is therefore invertible or a collapser, and which it is can be
    read off from its behaviour on that pair. The evaluation point is the identity arrow.
  individuals: base
  sigma: top
meets:
  collapse-onto-point: >-
    Take $F:=\lambda x\, .\,x\ne a$, so $p\notin F_h$. $h$ is a surjection sending $N\cup\{a\}$ and both members of the pair to one $p$ outside the pair. Swapping the pair, or transposing $y$ with a point outside the pair, fixes $p$.
  one-object-action-model: >-
    It has one object (Dorr, draft, §3.1: closed pure terms denote entities fixed by every arrow).
  transposable: >-
    $M=\{0,1\}$, the fixed pair, and for $N$ the property of not belonging to $N\cup\{0,1\}$: the
    transposition of $y$ with another individual outside $N\cup\{0,1\}$ fixes $\{0,1\}$, so lies
    in the symmetry group.
  separable-collapses: >-
    The pairs $\{n,m\}$ with $n,m\ge2$: a surjection that collapses $0$ with $1$ and $n$ with $m$,
    and nothing else, is an arrow.
  surjective-arrows: The arrows are permutations and surjections.
  symmetry-group-pinned: >-
    Membership in the symmetry group is detected by the fixed pair: an arrow is in it iff it does
    not collapse the pair.
  actual-world-isolated: >-
    The actual-world proposition is the symmetry group, the set of arrows that are permutations,
    pinned down by the fixed pair; no composite with a non-bijective arrow is a permutation.
  actuality-contingent: >-
    The actual-world proposition, the symmetry group, is in the domain; at every world a collapsing
    arrow leads outside it, and a collapsing arrow carries it to the empty set.
  irreversible-arrow: >-
    A collapsing arrow: no composite with it is a permutation.
  hull-conditions: >-
    With $M_0$ the fixed pair (the draft's argument for this model): splicing fails at that pair,
    but the pair is exactly what certifies invertibility, and the separated arrows are handled by
    symmetry instead; a symmetry may move points freely outside the pair.
  finite-pinning: Every object carries the ideal of finite sets.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another symmetric model is now a shared argument of the group
# symmetric-ideally-full or one of the topic's general arguments (arguments/), with this record's
# witness under `meets`; what follows is this record's own. Only the verdicts the engine needs to
# derive the rest are recorded, the source's first.

# --- from the source (19 Sep record) ---

- holds: [rigid-comprehension-r]
  text: >-
    At every relational type. Given a relation with extension S pinned down by a finite set, take
    the least upper bound of the union of the haecceities of the members of S, computed with the
    fixed pair adjoined to the pinning set. Persistence is immediate, and the extension is exactly
    S because an arrow agreeing with the identity on a set containing the fixed pair is
    invertible. The rigidity criterion is then checked separately at invertible worlds, where
    leastness delivers it, and at collapsing worlds, where surjectivity supplies the preimages
    that persistence demands.

- fails: [atomicity-t]
  text: >-
    With the proposition that the two members of the fixed pair are identical as a nonzero
    proposition having no atom below it.

# --- later additions ---

- id: rigid-power
  fails: [rigid-power-r]
  when: {individuals: base}
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-08'
  text: >-
    At type $e\to t$, with $F:=\top$: the argument of finite-support-pair-injections-or-collapses,
    whose witnesses are all symmetric, with the collapses kept surjective. Write $Z_k$ for the
    extension of a property $Z$ at the arrow $k$, so that $(h\cdot Z)_k=Z_{k\circ h}$. The step that
    needs care changes an arrow $j$ to hit a value $y$ at a point $x$ outside a finite $N\supseteq\{0,1\}$:
    for a collapse, put $j':=j\circ\tau$, where $\tau$ fixes $N$ pointwise, sends $x$ to a
    $j$-preimage $p$ of $y$, and maps the rest of $\mathbb N\setminus N$ onto $\mathbb N\setminus N$
    (possible even if $p\in N$, $\tau$ not being required to be injective); then $j'$ is a surjective
    collapse agreeing with $j$ on $N$, with $j'x=y$. For a permutation and $y\notin j[N]$, put
    $j':=(y\ jx)\circ j$, a permutation preserving $\{0,1\}$ since $y,jx\notin\{0,1\}$.


    (1) $\top$ is rigid: its inextensibility is $\Box$BF at type $e$, which holds.


    (2) $Y$, with $Y_k:=\mathbb N\setminus\{k2\}$ at a permutation and $\mathbb N$ at a collapse, is in
    the domain (pinned down by $\{0,1,2\}$; symmetric, since $y\ne k2$ gives $gy\ne(g\circ k)2$) and
    rigid. It is persistent, every composite with a collapse being a collapse. It is inextensible at
    every world $w$: let $X$, pinned down by $N\supseteq\{0,1\}$, contain $\langle jx,j\rangle$ for
    every $x\in Y_w$ and arrow $j$, and let $y\in Y_{j\circ w}$. If $y=jn$ with $n\in N\cap Y_w$, then
    $\langle y,j\rangle\in X$. If $y=jn$ with $n\in N\setminus Y_w$, then $w$ is a permutation, $n=w2$,
    and $j\circ w$ is a collapse, so $j$ identifies $w0$ with $w1$ and is a collapse; if $y\notin
    j[N]$, $j$ is either. In both cases change $j$ as above at a fresh $x\notin N\cup\{w2\}$, so that
    $x\in Y_w$, $\langle y,j'\rangle\in X$, and by pinning $\langle y,j\rangle\in X$.


    (3) Along a collapse a weakly rigid property $Z$, with extension $S$ and pinned down by
    $N\supseteq\{0,1\}$, has extension $\mathbb N$ or a finite one. If $S$ is infinite, then for any $b$
    change the collapse $m$ as above at some $x\in S\setminus N$ to $m'x=b$; persistence gives
    $b\in Z_{m'}=Z_m$. If $S$ is finite, the symmetric property $k\mapsto k[S]$, pinned down by $S$,
    necessarily holds of each member of $S$, so $Z_m\subseteq m[S]$.


    Let $R:=\lambda X\, .\,\operatorname{Rigid}(X)\land X\le\top$, the value of a closed pure term, so
    that its extension at every arrow is the set of rigid properties. Let $\mathbf X$ hold of $W$ at
    $k$ iff $W=k'\cdot Z$ for some rigid $Z$ and some arrow $k'$ agreeing with $k$ on $\{0,1\}$:
    pinned down by $\{0,1\}$, and symmetric, since $g\cdot(k'\cdot Z)=(g\circ k')\cdot Z$ and the
    rigid properties are closed under transport along symmetries. It necessarily holds of every
    instance of $R$. At a collapse $c$, every $k'$ agreeing with $c$ on $\{0,1\}$ is a collapse, so by
    (3) every member of $\mathbf X$'s extension has extension $\mathbb N$ or a finite one, while $Y$,
    in $R$'s extension there by (2), has extension $\mathbb N\setminus\{2\}$. So $R\not\le\mathbf X$:
    $R$ is not even weakly inextensible, though $\top$ is rigid. With Rigid Comprehension holding,
    Rigid Comprehension (boxed, and with Actuality, BF and Boolean Completeness) does not imply
    Rigid Power.
  revisions:
  - date: '2026-10-08'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      First given on 8 October for symmetric-pair-injections-or-collapses, Cian Dorr's symmetric
      analogue of finite-support-pair-injections-or-collapses, which differs from this model only in
      not requiring the collapses to be surjective; that record was removed the same day, having the
      same verdicts as this one once this argument was recorded.

# migration: text of the old notes that no argument holds, verbatim. Their argument for the failure
# of ND, now derived, is dropped.
- fails: [rigid-power-r]
  when: {individuals: singleton}
  choice: free
  by: Claude Opus 5.5 (Anthropic), on Cian Dorr's request to settle Rigid Power where it was open
  date: '2026-10-09'
  text: >-
    The type $(t\to t)\to t$ argument of finite-support-pair-injections-or-collapses (for its
    variant with one individual), with $\{a,b\}$ for $\{0,1\}$ and the collapses kept surjective:
    $F:=\top$ of type $t\to t$, rigid since BF and $\Box$BF hold at type $t$; $p_n:=\{g:gn\in\{ga,
    gb\}\}$, which is symmetric, with $m\cdot p_n=p_{mn}$ for the permutations $m$ preserving
    $\{a,b\}$; $Y$ built from $E:=\{p_n:n\notin\{a,b,2\}\}$ with $S:=\{a,b,2\}$, symmetric since
    the symmetry group consists of arrows; in step (2), $\tau$ sends $x$ to $2$, some fresh $y$ to
    $x$, and fixes every other number, so that $\tau g$ is still a surjection; and $\mathbf X$,
    pinned down by $\{a,b\}$, is symmetric because $g^{-1}k^{\prime}$ agrees with $k$ on $\{a,b\}$
    when $k^{\prime}$ agrees with $gk$ there.

notes: >-
  This model is not a second witness to the draft's main result but a counterweight to it. Rigid
  Comprehension holds, so the failure of Actuality in the all-surjections model is no accident.
  Because Atomicity fails here, the model settles a question left open in Classicism: Rigid
  Comprehension does not imply Atomicity. The boxed forms of Actuality and Rigid Comprehension use
  the draft's one-object observation, which it states for Boolean Completeness and applies in the
  same way in its final section. The source is a work in progress. Everything that implies these
  fails with them.

