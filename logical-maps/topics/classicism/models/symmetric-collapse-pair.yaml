# migration: text of the old notes that no argument holds, verbatim. Their argument for the failure
# of ND, now derived, is dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
# "Everything that implies these fails with them." is back at the end of the argument it followed (5 October 2026).
notes: >-
  This model is not a second witness to the draft's main result but a counterweight to it. Rigid
  Comprehension holds, so the failure of Actuality in the all-surjections model is no accident.
  Because Atomicity fails here, the model settles a question left open in Classicism: Rigid
  Comprehension does not imply Atomicity. The boxed forms of Actuality and Rigid Comprehension
  use the draft's one-object observation, which it states for Boolean Completeness and applies
  in the same way in its final section. The source is a work in progress.

  ND fails at type e because the proposition that the two members of the fixed pair are
  identical is true at exactly the non-invertible arrows and so is nonzero; the draft displays
  that proposition without drawing the consequence for ND. Argument of 23 September 2026, after
  Cian Dorr’s observation that a choice over the individuals cannot be finitely pinned down; the
  well-ordering of the individuals that he had in mind is refuted by the same two facts, but the
  direct route needs no derivation of a well-ordering from Relational Choice in C.

