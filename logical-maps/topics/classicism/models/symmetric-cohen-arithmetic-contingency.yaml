  text: The entire existential Real proposition is bottom at every admitted carrier, by the all-type NoReal
    proof and the exact component bottom equations. Every SOAN possible-real antecedent is therefore false,
    so SOAN holds. Its existing implication gives AN. The separate arithmetic-truth failure has its original
    nonvacuous canonical-arithmetic guard and witness. See Section 4 of the accompanying proof.
- id: guarded-arithmetic-truth-contingency
  fails:
  - necessity-of-arithmetic
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: uses
  writeup: symmetric-cohen-arithmetic-contingency
  text: The canonical current numbers and native Sum/Prod graphs are standard, by support-empty characteristic
    tests and Boolean finite induction. For the chosen standard-true Rosser sentence G the whole root
    value is (1,g), where g is false at A and therefore differs from top_A. I*_e and I_e are entire top
    objects. Box(I_e -> G) is false because g differs from top_A, and Box(I_e -> not G) is false because
    its current coordinate is 0. Thus both alternatives of the native necessity instance fail while Box
    I*_e holds. Sections 2–3 and 5–6.
notes: This model changes the ground component of the arithmetic-growth construction, using an effective
  NoReal-preserving theory and Rosser incompleteness rather than an elementary extension of standard arithmetic.
  Its contribution is arithmetic truth contingency alongside SOAN and AN, whose possible-real antecedents
  are all false. The arithmetic guard is active. The original named-number-above-all-numerals requirement
  is not imposed on this component. No extra Arithmetic Necessitism, global C5 or unrelated flag is asserted.
