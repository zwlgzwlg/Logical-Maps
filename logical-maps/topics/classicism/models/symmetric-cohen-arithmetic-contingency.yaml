id: symmetric-cohen-arithmetic-contingency
name: 'Symmetric Cohen model: Rosser-selected component'
definition: Use the finite-support Boolean hierarchy B_fs in RO((2^omega)^omega) and the ground countable
  standard-arithmetic NoReal model A0 from symmetric-cohen-arithmetic-growth. Let T_H be the effective
  many-sorted Henkin theory containing the typed term operations, truth clauses, C5, Box I*_e and boxed
  NoReal at every type; Logical Equivalence instances have H-proof certificates. Select a standard-true
  Rosser sentence G undecided by the arithmetic consequences of T_H, and a countable ground model A of
  T_H with not G at counting type e. Build the symmetric Cohen hybrid with individuals omega x D_e(A),
  propositions B_fs x B_A, and finite-support current relational profiles paired with admitted A-components.
  Give A trivial symmetry action and keep its lambda/quantifier operations unchanged. Apply the Boolean-Henkin
  witness reduction to obtain a countable classical model. Relational signature constants may all denote
  top. The writeup specifies the effective theory, component choice, full NoReal preservation and exact
  guarded arithmetic failure.
