# --- later additions ---

# migration: text of the old notes that no argument holds, verbatim. Their sentences on ND and B at
# type t and on Possibility Maximalism (pure), now derived, are dropped.
notes: >-
  Promoted from conjectured on 22 September 2026. The gap in the source was its Theorem A.8,
  stated without proof, and the deferred type-e case; the write-up closes both by choosing a
  self-similar individual domain and applying the book’s coalesced sums. The signature is assumed
  countable; for a larger signature use a tree with as many branches. Distinct constants of one
  type denote distinct entities at the root, since every domain, including the individuals, has
  more than one element; they are also possibly identical. Everything else follows from the listed
  principles by the map’s results. Bacon’s interpretation of his predicates Pure and Fun in this
  model, and the principles stated with them, are not recorded, following Zachary Goodsell’s
  decision to keep the map to the logical vocabulary and the constants of Σ.

was_conjectured: true

