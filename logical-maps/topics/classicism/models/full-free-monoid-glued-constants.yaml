# migration: the definition is the old description without its last sentence, which is the first
# argument.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values. The
# construction interprets Σ by gluing, so the record meets no sigma-apart and has no variants.
settings:
  construction: >-
    Let M be the free monoid of finite sequences of natural numbers under concatenation; its induced
    Kripke frame is the infinitely branching tree with the initial-segment relation and the empty
    sequence as root. Take the standard model over this frame (propositions all sets of accessible
    worlds, function types all homomorphisms) whose individuals at a world are the functions from
    the infinite branches through that world to the natural numbers, with restriction as
    counterpart; equivalently, the full action model over M with this surjective M-set at type e.
    This higher-order frame is isomorphic to the coalesced sum of countably many copies of itself,
    so coalesced sums of Σ-models over it are again Σ-models over it. Enumerate the Σ-sentences
    satisfiable in some Σ-model over the frame, choose a model of each, and glue them by the book’s
    Definition 18.15. Evaluation point: the root.
  sigma:
    text: >-
      The constants of Σ are glued as in the construction above.
meets:
  one-object-action-model: >-
    It has one object.
  actual-world-isolated: >-
    The actual-world proposition, true at the root alone, is in the domain, the model being full;
    under a non-identity arrow $i$ no arrow $k$ has $k\circ i$ the identity, since no arrow leads
    back to the root.
  irreversible-arrow: Any non-identity arrow, since no arrow leads back to the root.

