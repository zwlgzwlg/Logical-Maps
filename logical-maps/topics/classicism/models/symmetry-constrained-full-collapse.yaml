sources:
- >-
  Cian Dorr, suggestion of 3 and 4 October 2026, in conversation with Claude Fable 5.1 (Anthropic):
  a one-object model with the identity and the collapses of three individuals, whose intensions must
  be permutation-invariant at the collapses, so that nothing distinguishes the individuals once they
  have been identified and Intensional Choice fails; transcript in .private.
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026,
  Definitions 15–18, p. 8 (the symmetry condition).
