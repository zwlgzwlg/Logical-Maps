group: symmetry-constrained-full
settings:
  construction: >-
    The arrows are the identity of $X$ and the three collapses $c_i$, the constant maps with value
    $i\in X$; they compose by $c_i\circ h=c_i$ and $h\circ c_i=h$ for $h\ne1$.
  individuals: three
  sigma: top
meets:
  sigma-apart: The construction does not mention Σ.

arguments: []

notes: >-
  The propositions are $\bot$, $\{1\}$, the set of the three collapses, and $\top$: the symmetry
  condition is vacuous at the identity, since no permutation is an arrow, and at a collapse it
  identifies the three collapses. So the propositional structure is that of the full model on the
  two-arrow idempotent monoid, and the relabellings act trivially on it; Intensional Choice fails
  only at type $e$, by the shared argument, and holds at type $t$, where any singleton is fixed. The
  variant with one individual therefore refutes nothing that the two-arrow full model does not. BF
  also fails at type $e$ when there are three individuals: the intension with extension $X$ at the
  identity and $\{i\}$ at $c_i$ is symmetric, holds necessarily of every individual, yet is not
  necessarily universal. That failure, and the failure of ND at type $e$ from two individuals that
  a collapse identifies, are derived from the group's arguments at type $t$ and are not recorded
  separately.
