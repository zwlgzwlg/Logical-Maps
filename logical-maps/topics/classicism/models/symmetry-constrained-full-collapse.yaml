id: symmetry-constrained-full-collapse
name: 'Symmetry-constrained full model: permutations and collapses on three individuals'
certificate:
  source_id: misc
  produced_by: Cian Dorr (the construction and the failure of Intensional Choice, 3 and 4 October
    2026); Claude Fable 5.1 (Anthropic) (verification that it is a model of C and the other verdicts,
    4 October 2026)
  recorded_by: Claude Fable 5.1 (Anthropic), 4 October 2026
