group: symmetry-constrained-full
settings:
  # revision (6 October 2026, Cian Dorr): until then the arrows were the identity and the three
  # collapses, with the symmetry condition imposed only where composing with a permutation gives an
  # arrow; the permutations are now arrows, and the condition is Dorr's.
  construction: >-
    The arrows are the six permutations of $X$ and the three collapses $c_i$, the constant maps
    with value $i\in X$; they compose as maps, so $c_i\circ h=c_i$ and $g\circ c_i=c_{g(i)}$.
  individuals: three
  sigma: top
meets:
  sigma-apart: The construction does not mention Σ.

arguments: []

notes: >-
  The propositions are $\bot$, the set $P$ of the six permutations, the set of the three collapses,
  and $\top$: the symmetry condition makes a proposition contain all the permutations or none, and
  all the collapses or none. $P$ is the strongest true proposition, the true atom. So the
  propositional structure is that of the full model on the two-arrow idempotent monoid, the
  quotient of this one by the symmetries, and the relabellings act trivially on it; Intensional
  Choice fails only at type $e$, by the shared argument, and holds at type $t$, where every
  proposition is fixed by the relabellings. The variant with one individual therefore refutes
  nothing that the two-arrow full model does not. BF also fails at type $e$ when there are three
  individuals: the image intension $h\mapsto h(X)$, $X$ at a permutation and $\{i\}$ at $c_i$, is
  symmetric, holds necessarily of every individual, yet is not necessarily universal. That
  failure, and the failure of ND at type $e$ from two individuals that a collapse identifies, are
  derived from the group's arguments at type $t$ and are not recorded separately.
# The model in Lean (Classicism/Models/SymmetricFull.lean): the symmetric ideally full premodel
# over the permutations and collapses of a three-element set, with the permutations as the symmetries.
lean:
  model: Classicism.Meta.Intensional.SymFull.model Classicism.Meta.Intensional.SymFull.permsCollapses
  is_model: Classicism.Meta.Intensional.SymFull.model_isModel Classicism.Meta.Intensional.SymFull.permsCollapses
  meets:
    one-object-action-model: Classicism.Meta.Intensional.Premodel.oneObject_of_subsingleton _
    finitely-many-propositions: Classicism.Meta.Intensional.SymFull.finitely_many_propositions (M := Classicism.Meta.Intensional.SymFull.permsCollapses)
    extensionally-full: Classicism.Meta.Intensional.SymFull.extFull (M := Classicism.Meta.Intensional.SymFull.permsCollapses)
    actual-world-isolated: Classicism.Meta.Intensional.SymFull.actualWorldIsolated (M := Classicism.Meta.Intensional.SymFull.permsCollapses)
