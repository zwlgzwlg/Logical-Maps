# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ, in which "$\{1\}$" replaces "described above", since nothing above described the
# actual-world proposition.
definition: >-
  The full model on {1,k} with k²=k, evaluated at its sole object.


  Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
  $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of the
  model, the actual-world proposition $\{1\}$; every other relational constant denotes the top
  element of its type and every individual constant one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (17 Sep record) ---

- holds: [no-pure-contingency-r, rigid-comprehension-r, atomicity-r]
  fails: [barcan-t]
  source: {paper: bacon-dorr-classicism, locator: '§3.5, p. 59, first paragraph'}
  text: >-
    Refer to the cited paragraph for the four propositions and the failure witnesses.

# --- later additions ---

- holds: [relational-choice-r]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary; `source` is the page
  # the text cites.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  source: {paper: bacon-dorr-classicism, locator: 'p. 61'}
  text: >-
    With choice in the metatheory a serial relation has a functional subrelation, and a full model
    contains every intension, so that subrelation is in the domain; see Classicism, p. 61, on the
    principles common to full models.

- fails: [infinity-t]
  # migration: `by` adds "at Cian Dorr's direction" from the change's summary.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all, and every intension of a full model is present, so the numerals are the finite
    cardinalities and the fourth holds of the universal property of propositions: the Axiom of
    Infinity at type t fails, as does the fifth instance of the schema.

- id: sigma-true-atom
  fails: [independence-signature-r, signature-b-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The text is the 23
  # September version; the revision notes are the two 23 September changes, the first without its
  # closing "; see the notes". The sentence that followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    No Contingency (signature Σ) fails, since the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes
    $a$, true and contingent; B for sentences of Σ fails, since under any arrow that no arrow
    composes back into $a$, $\Diamond a$ is false, so $\Box\Diamond a$ fails; Witnessed
    Possibility fails for the pure formula $x=\top_\tau$, witnessed by $\top_\tau$, since
    $\Diamond(c=\top_\tau)$ is $\Diamond\Box a$ and $a$ is necessary at no arrow; Separated
    Structure fails with it, being equivalent to Possibly Witnessed Possibility; Independence
    (signature Σ) and Distinctness Maximalism (signature Σ) fail through the other relational
    constants, Σ being assumed to contain at least one: such a constant $c'$ of type $\tau'$
    denotes what the closed pure term $\top_{\tau'}$ denotes, and $c'=\top_{\tau'}$ is a true
    identity that C(Σ) does not prove. The designated constant refutes neither: closed pure terms
    denote entities fixed by every arrow (Classicism, §3.5, p. 58), whereas $a$ is fixed by no
    arrow but the identity, so no closed pure term denotes $\lambda\bar x\, .\,a$.
  revisions:
  - date: '2026-09-23'
    by: Claude Fable 5.1 (Anthropic)
    note: >-
      Re-fixed the interpretation of Σ so as to settle No Contingency (signature Σ) and B for
      sentences of Σ, at Cian Dorr’s request.
  - date: '2026-09-23'
    by: Claude Fable 5.1 (Anthropic)
    note: >-
      Corrected the reason given for the failures of Independence (signature Σ) and Distinctness
      (signature Σ): the true atom is denoted by no closed pure term, since such terms denote
      entities fixed by every arrow; the failures come from the other relational constants, which
      denote top. No verdict changes.

- fails: [strong-leibniz-t]
  # migration: `by` and `date` are those of the 23 September change correcting the claim of 22
  # September that □Strong Leibniz Biconditionals (type t) hold; that claim and its withdrawal are
  # in `history`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The atoms are $\{1\}$ and $\{k\}$; transported along $k$, $\{k\}$ becomes $\{j : j\circ
    k=k\}=\{1,k\}$, which the proposition $\{1\}$ of the full domain splits, so $\{k\}$ is not a
    strong world, while the possible proposition $\{k\}$ has no other candidate below it. ($\{1\}$
    is a strong world, its transport along $k$ being empty.)

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true $p$ take $q:=\{1\}$; under $k$, $\Diamond\{1\}$ would need $x\circ k=1$, but
    $x\circ k=k$ for both arrows, so it fails there, and under $1$, $p$ holds.

- fails: [strong-leibniz-t]
  # migration: "Review of 25 September 2026." becomes `date`; "Strong Leibniz-t fails" is dropped;
  # the write-up's path becomes "the write-up" and `writeup`. `by` condenses the record's second
  # source. A second, independent argument for the same verdict.
  by: DeepSeek (deepseek-flash), trawl; reviewed and corrected by OpenAI Codex (GPT-6)
  date: '2026-09-25'
  writeup: strong-worlds-one-object-action-models
  provenance: trawl-22455d8a01ce49dbaddffeab06b806d6
  text: >-
    By the nonidentity-idempotent singleton witness in the write-up. The successor quantifier
    ranges over all propositions at the target object, including ones outside the transported
    image. Its necessary form therefore also fails. The earlier positive flag and supporting
    paragraph were erroneous; their original dated change remains as superseded history.

