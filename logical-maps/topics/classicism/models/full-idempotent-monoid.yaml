# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ, in which "$\{1\}$" replaces "described above", since nothing above described the
# actual-world proposition.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, one individual and Σ top; the source
# leaves the individuals open, and Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    The full model on {1,k} with k²=k, evaluated at its sole object.
  individuals: singleton
  sigma: top
meets:
  nonidentity-arrow: >-
    The idempotent $k$.
  unretracted-arrow: >-
    $m\cdot k=k$ for both arrows $m$, so $k$ has no retraction.
  finitely-many-propositions-everywhere: >-
    There is one object, with four propositions, the sets of the two arrows.
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: >-
    It has one object.
  finitely-many-propositions: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all.
  actual-world-isolated: >-
    The actual-world proposition $\{1\}$ is in the domain, the model being full; under $k$,
    $x\circ k=k$ for both arrows, so no world outside it sees it.
  irreversible-arrow: >-
    The arrow $k$: $x\circ k=k$ for both arrows $x$, so no composite with it is the identity.

arguments:

# 6 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): verdicts now given by the topic's
# general arguments (full-atomicity, full-rigid-comprehension, full-epic-barcan, invertible-arrows,
# retractions, unretracted-arrow, nonidentity-arrow, infinitely-many-propositions,
# finitely-many-propositions, finitely-many-propositions-everywhere), through this record's `meets`
# and its group's, are dropped from its own arguments, and arguments left with none are dropped:
# no-pure-contingency-r, rigid-comprehension-r, atomicity-r, barcan-t.

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another full action model is now one of the topic's general
# arguments (arguments/), reached through the group full-action-models and this record's `meets`;
# what follows is this record's own. Only the verdicts the engine needs to derive the rest are
# recorded, the source's first.

# --- later additions ---

- fails: [strong-leibniz-t]
  # migration: `by` and `date` are those of the 23 September change correcting the claim of 22
  # September that □Strong Leibniz Biconditionals (type t) hold; that claim and its withdrawal are
  # in `history`.
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The atoms are $\{1\}$ and $\{k\}$; transported along $k$, $\{k\}$ becomes $\{j : j\circ
    k=k\}=\{1,k\}$, which the proposition $\{1\}$ of the full domain splits, so $\{k\}$ is not a
    strong world, while the possible proposition $\{k\}$ has no other candidate below it. ($\{1\}$
    is a strong world, its transport along $k$ being empty.)

# migration: text of the old notes that no argument holds, verbatim: their first two sentences, and
# the sentence that followed the Σ argument, referring to its failures. The argument for □Relational
# Choice, now derived, is dropped.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

