id: finite-type-ordinary-not-invariant
name: 'Full two-point model: FTN without invariant FTN'
definition: Use the full two-point construction of Finite-Type Necessitism, Section 6.1, equations (6.1)–(6.4),
  with A=B=omega. Evaluate at the root. The finite-type guide states the common construction; Appendix
  A gives this specialization.
