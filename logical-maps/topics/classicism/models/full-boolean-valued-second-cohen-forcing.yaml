arguments:
- id: boolean-core
  holds: [necessary-distinctness-necessary-r, necessary-relational-choice-r]
  by: Daniel Kodsi, with ChatGPT assistance, applying the Bacon and Kodsi Boolean construction
  date: '2026-10-30'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    Singleton characteristic predicates make identity crisp and necessity the top test,
    giving C5. Well-order each output domain internally and disjointify every relation
    row. The selecting graph has the same totality value as the original row, is
    single-valued and lies below it. Thus Relational Choice and its box hold at every
    admitted input/output type, including individual outputs. Necessary BF also follows
    directly from the top-test calculation and is derived by the map from C5.
- id: fixed-second-order-analytical-theory
  holds: [necessity-of-second-order-analysis]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    Cohen forcing is weakly homogeneous, its set and order are unchanged after its
    first application, and its square is isomorphic to itself. For every fixed standard
    parameter-free set-theoretic sentence, the sign decided over N is therefore also
    forced by the second Q over M. Translate each native second-order analytical
    sentence into set theory. Full extensional forcing transfer and complete-field
    categoricity, below each candidate field's Boolean support, give the same analytical
    truth at every carrier and in both coordinates. The appropriate boxed universal
    real-structure assertion has value top. This is the complete native schema.
- id: new-real-refutes-analytic-necessitism
  fails: [analytic-necessitism]
  by: Daniel Kodsi, with ChatGPT assistance, applying the earlier new-cut obstruction
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    At et, endpoint sequences contain a ground real-field carrier, so possible Real
    has value top. Any rigid necessarily-real witness must have endpoint-valued field
    relations and hence be one ground complete ordered field. A second Cohen real
    yields a new rational cut without an old supremum, so no such field remains complete
    in the forcing coordinate. Every candidate contributes bottom to the existential
    consequent. Thus the actual et instance of AN fails; SOAN failure is derived.
notes: >-
  Relative existence follows from Con(ZFC) using an arbitrary countable model, not a
  countable transitive model. The forcing completion is formed in M after preparation.
  Theory preservation is an external schema for standard finite parameter-free formulas;
  it asserts neither a truth predicate nor elementarity with parameters from M. No
  No Pure Contingency or finite-type necessitism verdict is added. The analytical verdicts
  use the existing unboxed schema nodes. Mathematical review was carried out with
  ChatGPT assistance; no independent human check or Lean proof is recorded.
