id: full-boolean-valued-second-cohen-forcing
name: Full Boolean-valued model with a second Cohen forcing
definition: >-
  Choose a countable model N of ZFC, with no external well-foundedness assumption.
  Let Q=Fn(omega,2,<omega), take an N-generic G, and put M=N[G]. Inside M form
  the fresh regular-open completion A=RO^M(Q) of a second Cohen forcing, and
  B=2 times A. Use the internally full relational hierarchy with D_e=omega^M,
  D_t=B and all internal functions at every admitted function type. Externalize
  the domains at standard finite types and evaluate at the isolated first
  coordinate. Quantifiers are internal meets and joins; defined necessity is
  the global top test. The preparation of M is part of this model definition.
