id: full-boolean-valued-second-countably-closed-forcing
name: Full Boolean-valued model with a second countably closed forcing
definition: >-
  Choose a countable model N of ZFC+CH, with no external well-foundedness assumption.
  Let Q=Fn(omega_1,2,<omega_1), the countable partial binary functions, take an N-generic
  G, and put M=N[G]. Inside M form the fresh regular-open completion A=RO^M(Q) of a
  second application of this forcing, and B=2 times A. Use D_e=omega^M, D_t=B and the
  internally full function domains at every admitted relational type. Externalize standard
  finite types and evaluate at the isolated first coordinate. Quantifiers are internal
  meets and joins; necessity is the global top test. All countability assertions about
  the forcing and its conditions are internal to the indicated ground.
