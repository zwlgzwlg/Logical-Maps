arguments:
- id: boolean-core
  holds: [necessary-distinctness-necessary-r, necessary-relational-choice-r]
  by: Daniel Kodsi, with ChatGPT assistance, applying the Bacon and Kodsi Boolean construction
  date: '2026-10-30'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    Crisp identity and top-test necessity give C5. Internal well-orders disjointify
    arbitrary relation rows into selecting graphs with the same totality values;
    Relational Choice and its box hold at all admitted input/output types. The direct
    top-test calculation also gives necessary BF, which the map derives from C5.
- id: fixed-second-order-analytical-theory
  holds: [necessity-of-second-order-analysis]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    Countable closure preserves all countable sequences of ordinals and omega_1, so
    after the first forcing every countable partial binary condition is old: the
    recomputed Q has exactly the old set and order. It is weakly homogeneous and
    Q times Q is isomorphic to Q. The product/iteration calculation makes the second
    forcing preserve every standard finite parameter-free set-theoretic sentence over
    M. Extensional transfer and complete-field categoricity give the full native
    second-order analytical schema at every carrier, including vacuous instances.
- id: no-new-reals-give-all-carrier-an
  holds: [analytic-necessitism]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    The second forcing adds no reals. The old complete real field stays complete for
    every new bounded subset because its supremum is determined by an old rational cut.
    Conditions with domain omega give a ground-continuum antichain in A, so every
    nonindividual type admits an endpoint-valued copy of the field. Endpoint rigidity
    and full extensional transfer make it a rigid necessarily-real witness. At e,
    a complete field on a subset of omega is impossible in either coordinate, making
    the antecedent false. This proves every current AN instance with its native guard.
- id: new-subset-refutes-every-unary-power
  fails: [second-order-analytic-necessitism]
  by: Daniel Kodsi, with ChatGPT assistance
  date: '2026-10-29'
  choice: uses
  writeup: full-boolean-valued-repeated-forcing
  text: >-
    A fresh-coordinate dense argument makes the second generic subset of omega_1
    unequal to every old subset with Boolean equality value zero. CH survives the
    first forcing, so transfer this name to every prospective ground real carrier.
    Rigid supported relations are old endpoint-valued subsets. The join of their
    agreement values with the new subset has forcing coordinate zero, so no rigid
    family can satisfy the boxed representation clause. This defeats every field
    tuple and every unary represented power, not just a chosen canonical one.
    The et, arity-one SOAN antecedent is true and its consequent is bottom.
notes: >-
  Relative existence follows from Con(ZFC), using the relative consistency of CH and
  arbitrary countable models. This strengthens the analytical truth profile of the
  one-stage countably closed subset model by a different prescribed ground; it does
  not change that earlier record. Necessary BF is derived. AN and SOAN use their
  existing unboxed nodes; no additional outer-box or finite-type necessitism verdict
  is asserted. The Boolean completion must be taken freshly inside M. Mathematical
  review was carried out with ChatGPT assistance; no independent human check or Lean
  proof is recorded.
