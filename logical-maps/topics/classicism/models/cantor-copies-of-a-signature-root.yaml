definition: >-
  Add Cantor-group loops and Cantor-many absorbing entrances to identical
  copies of a fixed signature Possibility+ model. A relational profile has
  independently locally constant loop rows and a locally constant section
  of whole old entities. Individuals and public names have their old
  entrance values.
arguments:
- id: two-clopen-splittings
  holds: [possibility-plus-signature-r, atomlessness, well-ordering-r]
  fails: [actuality, boolean-completeness-t, countable-boolean-completeness-r]
  choice: uses
  writeup: strong-possibility-signature-and-finite-rigid-bounds
  text: >-
    Any nonzero loop patch or old section splits on two disjoint nonempty
    clopen subsets. The loop cylinders also have a countable family lacking
    a join. Full current rows admit well-orders, and the identity on
    individuals at each old entrance preserves every eligible named tuple.
