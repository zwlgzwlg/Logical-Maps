# --- later additions ---

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    Let $a$ be the proposition true at the actual world alone (the identity arrow). For any true
    $p$, take $q:=a$ in the definition of $\Box_{\ne}p$: under a non-identity arrow $i$, $\Diamond
    a$ would need an arrow $k$ with $k\circ i$ the identity, and none exists, since no arrow leads
    back to the actual world; under the identity, $p$ holds. So every truth is
    $\Box_{\ne}$-necessary, although ND fails.

# migration: text of the old notes that no argument holds, verbatim.
notes: >-
  Shows that Logical Necessity is consistent with there being exactly one individual, necessarily.
  Two individual constants of Σ co-denote at every world, which Logical Necessity tolerates.

