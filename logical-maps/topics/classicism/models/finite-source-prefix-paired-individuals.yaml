id: finite-source-prefix-paired-individuals
name: Paired-individuals model with a singleton-source prefix
definition: 'Start with the unsymmetric ideally-full [[paired-individuals-two-object]] category: W=N with
  its two-element blocks and V=N union {star}, with every block-respecting map. Add a singleton object
  A, only its identity endomorphism, every constant map from A to W or V, and no map from either old object
  to A. Compose as ordinary maps. Use finite pins, trivial symmetry groups, and the original individual
  action. Evaluate at A; relational signature constants may be interpreted as top. The old outgoing categories,
  typed domains and truth values are unchanged.'
