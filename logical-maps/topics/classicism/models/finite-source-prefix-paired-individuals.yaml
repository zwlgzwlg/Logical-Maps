notes: A finite-source entrance construction applied to the already recorded paired tail; not a claim
  of a new general model family. The native verification here uses the corrected old-support reading of
  the tail argument and not its withdrawn BF-failure claim. No positive AN or SOAN verdict, group-generated
  general argument, Functional Choice, or necessary completeness is asserted. The earlier entrance mechanism
  is credited in [[symmetric-entrance-qualitative-links]]; the present source uses every constant arrow
  into the unchanged paired tail. Actuality follows from Boolean Completeness and Relational Choice in
  the recorded closure and is also proved directly in the write-up.
