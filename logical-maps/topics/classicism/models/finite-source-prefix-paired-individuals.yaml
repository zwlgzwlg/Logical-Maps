  text: Every root relational profile is pinned by the singleton base, so its Boolean algebra is the full
    powerset of arrow/target-tuple coordinates. Arbitrary meets exist and singleton coordinates are atoms.
    The singleton identity-arrow proposition is true and entails every current truth; writeup §§1–2.
