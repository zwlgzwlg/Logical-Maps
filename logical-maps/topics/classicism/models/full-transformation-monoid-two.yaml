settings:
  carrier: Take $X=\{0,1\}$.
meets:
  finitely-many-arrows-everywhere: There are four transformations of a two-element set.
  finitely-many-individuals-everywhere: There are two individuals at the sole object.
  finitely-many-propositions: There are 16 subsets of the four-element monoid.
  finitely-many-propositions-everywhere: There is one object, with 16 propositions.
  retracted-arrows-invertible-everywhere: On a finite set a map with a left inverse is bijective.
arguments:
- id: finite-individuals
  fails:
  - infinity-e
  text: At the sole object there are exactly two individuals, at every arrow. Extensional fullness gives
    ordinary finite cardinal arithmetic, so the Axiom of Infinity fails; the third instance of the infinity
    schema fails, and no arrow reaches an infinite individual domain.
  by: OpenAI Codex, prompted by Andrew Bacon
  date: '2026-10-28'
  choice: free
notes: The full model validates necessary Atomicity at all relational types (full-atomicity), as well
  as necessary Rigid Comprehension. It does not refute Atomicity. Its natural action on individuals is
  essential to the type-e Barcan counterexample.
