# migration: the old notes' first and last sentences and the old description's last, verbatim. The
# notes' arguments for Converse Witnessed Possibility and for the failures of the Fregean Axiom,
# Extensionality, Possibility Maximalism (pure), the Distinctness-preserving collapse and
