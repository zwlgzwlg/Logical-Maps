# migration: the definition is the old description up to its verdict sentences, then the notes'
# interpretation of Σ.
definition: >-
  The full one-object action model whose arrows are all the permutations of a countably infinite
  set $X$, composed as functions, acting on the individuals $W^e=X$ by evaluation. Propositions
  are all sets of arrows with the division action $i\cdot p=\{j : j\circ i\in p\}$, and every
  function type carries the full function-space M-set, which here is the set of all functions
  since every arrow acts bijectively. Evaluate at the identity arrow.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual $d$.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

- holds: [axiom-of-infinity-t, axiom-of-infinity-e, functional-choice-r]
  text: >-
    Because the arrows form a group, $\Box p$ holds at an arrow exactly when $p$ is the set of all
    arrows and $\Diamond p$ exactly when $p$ is nonempty, so the propositional modal logic is S5
    with the arrows as worlds; every arrow acts injectively and surjectively at every type, giving
    $\Box$ND and $\Box$BF; fullness gives the necessitations of Atomicity, Actuality, Boolean
    Completeness, Rigid Comprehension, Functionality, Plenitude and the choice principles; and the
    individuals and the propositions are both infinite.

- fails: [independence-signature-r]
  text: >-
    Witnessed Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of a relational constant $c$; Independence (signature Σ) fails since $c$ denotes
    what the closed pure term $\top_\tau$ denotes; Separated Structure, Distinctness Maximalism
    (signature Σ), Possibility Maximalism (signature Σ) and Logical Necessity fail with them by
    the recorded results.

- holds: [no-contingency-signature-r]
  text: >-
    For every bijection $\beta$ of $X$ the map that is $\beta$ at type $e$, the identity on
    propositions and conjugation at the function types is an automorphism of the pure part of the
    model, so a pure formula $P$ denotes the same proposition at $(d,\ldots,d)$ as at
    $(a,\ldots,a)$ for every individual $a$; hence every closed Σ-sentence denotes what the pure
    sentence $\forall x\, .\,P(x,\ldots,x)$ denotes, and No Pure Contingency finishes.

