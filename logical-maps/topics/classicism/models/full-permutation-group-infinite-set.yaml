notes: >-
  Full proofs are in the write-up. The model witnesses the joint consistency of $\Box$ND, the
  Axiom of Infinity at type $t$ and $\Box$Relational Choice. Suggested by Cian Dorr on 23
  September 2026 to fill a gap: no earlier record settled $\Box$ND, the Axiom of Infinity at
  type $t$ and $\Box$Relational Choice together.

  No Contingency (signature Σ) holds: for every bijection $\beta$ of $X$ the map that is $\beta$
  at type $e$, the identity on propositions and conjugation at the function types is an
  automorphism of the pure part of the model, so a pure formula $P$ denotes the same proposition
  at $(d,\ldots,d)$ as at $(a,\ldots,a)$ for every individual $a$; hence every closed Σ-sentence
  denotes what the pure sentence $\forall x\, .\,P(x,\ldots,x)$ denotes, and No Pure Contingency
  finishes. Converse Witnessed Possibility holds under every interpretation of Σ, since $i\in
  P(\bar c)$ gives $1\in P(i\cdot\bar c)$ for pure $P$. The Fregean Axiom fails since the
  singleton of the identity arrow and the set of all arrows are both true and distinct, and
  Extensionality fails with it in its nullary case. Possibility Maximalism (pure) fails since
  the C-consistent sentence that there is exactly one individual is false at every arrow, so
  Possibility+, Strong Possibility and Possibility Maximalism (signature Σ) fail too.
  Distinctness-preserving collapse fails since every true $q$ is possible at every arrow, so
  $\Box(\Diamond q\to p)$ forces $p=\top$, which the true singleton of the identity is not.
  Distinctness Maximalism (pure) fails: $(\exists xy\, .\,x\ne y)=\top$ is a true closed pure
  identity that C does not prove.
