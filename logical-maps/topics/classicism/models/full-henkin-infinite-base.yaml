# migration: the definition is the old description up to its verdict sentences, then the notes'
# interpretation of Σ.
definition: >-
  Use the ordinary full Henkin interpretation with $D_e$ countably infinite, $D_t=\{0,1\}$, and
  every admitted function type containing all functions between its domains; by Proposition 3.7 it
  is a model of C. Identity is genuine identity and $\Box$ is the identity on truth values, so
  $\Diamond$ is truth.


  Interpretation of Σ, fixed for this record: each relational constant denotes the top element of
  its type and each individual constant denotes one fixed individual.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- as first recorded (20 Sep) ---

- holds: [axiom-of-infinity-e]
  text: >-
    Because every domain is full, $\operatorname{FiniteCardinality}_\sigma$ holds exactly of the
    values of the numerals $\operatorname{Suc}_\sigma^k\mathbf{0}_\sigma$: the characteristic
    function of that set is in the domain and is inductive. At type $e$ the $k$-th numeral says
    that there are exactly $k$ individuals, which is false for every $k$, so the Axiom of Infinity
    at type $e$ holds, and with it the schema.

- holds: [fregean-axiom, functional-choice-r]
  # migration: the sentences before this one, on the failures at type $t$ and of Possibility
  # Maximalism (pure), now derived, are dropped.
  text: >-
    The remaining positive assertions hold as in every two-valued full model: each boxed principle
    reduces to its unboxed form; coextensive relations are identical, so Extensionality, the
    Fregean axiom and its modalized form hold; every relation is persistent, inextensible and
    Gallin-extensional, giving the comprehension principles; Actuality holds with top as the
    actual world; each relational type is the complete atomic Boolean algebra of subsets of a
    domain, giving Atomicity and Boolean Completeness; Tractarianism is a tautology; ND holds
    outright, giving C5; every closed sentence is non-contingent; and the choice principles hold
    because every function between domains is present, using choice in the metatheory to select
    from a serial relation on an infinite domain.

# --- later additions ---

- id: sigma-top
  fails: [independence-signature-r]
  # migration: `by` adds "at Cian Dorr’s request" from the change's summary. The sentence that
  # followed the text in the old notes is in `notes`.
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
  date: '2026-09-22'
  text: >-
    Let $c\in\Sigma$ have relational type $\tau$, so $c=\top_\tau$ necessarily. Witnessed
    Possibility fails for the pure formula $x\ne\top_\tau$, witnessed by $\bot_\tau$ but
    impossible of $c$; Separated Structure fails since $\lambda x\, .\,x$ and $\lambda x\,
    .\,\top_\tau$ agree on $c$ and differ; Independence (signature Σ) fails since $c$ denotes what
    the closed pure term $\top_\tau$ denotes; Distinctness Maximalism (signature Σ) fails since
    $c=\top_\tau$ is a true identity that C(Σ) does not prove.

# migration: text of the old notes that no argument holds, verbatim; "listed" in the second sentence
# now means derived. The sentences on No Contingency (signature Σ) and on the boxed choice
# principles, whose verdicts are now derived, are dropped.
notes: >-
  Explicit specialization of the source's standard Henkin construction to an infinite individual
  domain, recorded to separate the type-$e$ infinity principles from the type-$t$ ones: it
  satisfies the Axiom of Infinity at type $e$, hence Possible Infinity at type $e$, while
  violating the Axiom of Infinity at type $t$. It also shows that the sentence used in
  pure-possibility-implies-axiom-of-infinity-t, that there could be any positive number of
  individuals, does not follow from the Axiom of Infinity at type $e$: here there is not possibly
  exactly one individual. It also witnesses the consistency of C with Goodsell's $I$, assumed in
  n. 14 of Arithmetic is Necessary: with infinitely many individuals the numerals are pairwise
  distinct, so $\operatorname{Suc}_e$ is injective on finite cardinalities and $I^*$, hence $I$,
  is true. With Boolean Completeness listed, the model also shows Countable Boolean Completeness
  consistent with C. Everything that implies these fails with them.

