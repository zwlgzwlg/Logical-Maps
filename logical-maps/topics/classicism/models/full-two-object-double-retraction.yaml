id: full-two-object-double-retraction
name: 'Full action model: two-object retract with two retractions'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 6 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), 6 October 2026
  checked_by: []
  date: '2026-10-06'
sources:
- Cian Dorr, suggestion of 6 October 2026, as a model of Actuality without Strong Actuality.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, pp. 58–61; Appendix D, pp. 73–74
  (full action models).
source_names:
- Dorr 6 Oct
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models; the category is the two-object retract's with its arrow back doubled.

group: full-action-models
settings:
  construction: >-
    The category with objects $W_0,W_1$ generated by $h:W_0\to W_1$ and $j_1,j_2:W_1\to W_0$
    subject to $j_1\circ h=j_2\circ h=1_{W_0}$, evaluated at $W_0$. Its arrows are $1_{W_0}$; $h$;
    $j_1,j_2$; and $1_{W_1}$ with the idempotents $e_i:=h\circ j_i$, which compose by $e_i\circ
    e_k=e_k$, $j_i\circ e_k=j_k$ and $e_i\circ h=h$ (the rewriting $j_i\circ h\mapsto1$ has no
    overlaps, so these normal forms are distinct).
  individuals: singleton
  sigma: top
meets:
  nonepic-arrow: >-
    $j_1\circ h=j_2\circ h$, with $j_1\ne j_2$.
  returning-arrow: >-
    $h$, which $j_1$ retracts.
  retractions: >-
    The arrows out of $W_0$ are its identity and $h$, which $j_1$ retracts.
  nonidentity-arrow: >-
    The arrow $h:W_0\to W_1$.
  finitely-many-propositions: >-
    $W_0$ has four propositions, the sets of its two arrows out.
  finitely-many-propositions-everywhere: >-
    $W_0$ has four propositions and $W_1$ thirty-two, the sets of its five arrows out.
  separated-retractions: >-
    $h$ has the retractions $j_1\ne j_2$, and $\{j_1\}$, in the domain at $W_1$ since the model is
    full, separates them.
  sigma-apart: The construction does not mention Σ.

arguments: []

notes: >-
  Proposed by Cian Dorr to separate Strong Actuality from Actuality: the model is full, so it has
  □Rigid Comprehension and hence □Actuality, while $h$'s two retractions keep every true
  proposition from being a strong world. Unlike the two-object retract it does not meet
  coherent-retractions: with $r_h=j_i$, the arrow $x=e_k$ after $h$ for $k\ne i$ gives
  $r_{x\circ h}\circ x=r_h\circ e_k=j_k\ne r_h$. Gallin Extensional Comprehension is not checked.

