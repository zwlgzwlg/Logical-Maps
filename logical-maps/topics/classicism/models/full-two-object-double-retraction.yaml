group: full-action-models
settings:
  construction: The category with objects $W_0,W_1$ generated by $h:W_0\to W_1$ and $j_1,j_2:W_1\to W_0$
    subject to $j_1\circ h=j_2\circ h=1_{W_0}$, evaluated at $W_0$. Its arrows are $1_{W_0}$; $h$; $j_1,j_2$;
    and $1_{W_1}$ with the idempotents $e_i:=h\circ j_i$, which compose by $e_i\circ e_k=e_k$, $j_i\circ
    e_k=j_k$ and $e_i\circ h=h$ (the rewriting $j_i\circ h\mapsto1$ has no overlaps, so these normal forms
    are distinct).
  individuals: singleton
  sigma: top
meets:
  fixed-arrow: >-
    $e_1\circ h=h$ with $e_1\ne1_{W_1}$.
  comparable-free-arrows: >-
    Out of $W_0$ only $1$ is fixed by nothing but the identity, $h$ being fixed by $e_1$.
  free-nonepic-composite: >-
    $j_1\circ h=j_2\circ h=1_{W_0}$ with $j_1\ne j_2$, and $1_{W_0}$ is fixed only by itself.
  finitely-many-arrows-everywhere: >-
    Two arrows out of $W_0$ and five out of $W_1$.
  nonepic-arrow: $j_1\circ h=j_2\circ h$, with $j_1\ne j_2$.
  returning-arrow: $h$, which $j_1$ retracts.
  retractions: The arrows out of $W_0$ are its identity and $h$, which $j_1$ retracts.
  nonidentity-arrow: The arrow $h:W_0\to W_1$.
  finitely-many-propositions: $W_0$ has four propositions, the sets of its two arrows out.
  finitely-many-propositions-everywhere: $W_0$ has four propositions and $W_1$ thirty-two, the sets of
    its five arrows out.
  separated-retractions: $h$ has the retractions $j_1\ne j_2$, and $\{j_1\}$, in the domain at $W_1$ since
    the model is full, separates them.
  sigma-apart: The construction does not mention Σ.
  noninvertible-retracted-arrow: $h$ is retracted by $j_1$ and $j_2$ but has no inverse, since $h\circ
    j_i=e_i\ne 1_{W_1}$.
  trivial-isomorphisms-everywhere: Out of $W_0$ only the identity is invertible; out of $W_1$, $j_i$ has
    no inverse ($h\circ j_i=e_i$) and the $e_i$ are non-identity idempotents.
arguments:
- fails:
  - necessary-self-atoms-are-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'At $W_1$, which $h$ reaches: $j_1$ and $j_2$ are each fixed only by $1_{W_0}$ and neither is
    a left multiple of the other, $W_0$ having only its identity, so $\{j_1,j_2\}$ is a self-atom at $W_1$
    that is not an atom. So Self-atoms are atoms (type t) fails at $W_1$, and its boxed form fails at
    $W_0$.'
- id: analytic-necessitism-same-carrier-repair
  holds: [second-order-analytic-necessitism]
  when: {metatheory: choice, individuals: fixed-infinite}
  by: GPT-6 Astra, prompted by Daniel Kodsi
  date: '2026-10-29'
  text: >-
    The category has finitely many arrows out of each object, and individuals form the same fixed infinite set. The type induction gives, at each carrier type, either finite domains everywhere or a coherent separated continuum at every object.
    At e, the fixed individual set either cannot carry a real field or has a fixed
    continuum. Apply the full-action same-carrier criterion: direct-image field
    profiles are rigid and necessarily real, and the direct-image higher families
    of all subset relations give represented powers of every finite arity.
    This proves every same-carrier SOAN instance; AN is derived. ZFC and the recorded
    fixed/singleton individual settings are essential to the stated scope.
    Proof and construction hypotheses:
    [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 4–5.
  revisions:
  - date: '2026-10-30'
    by: GPT-6 Astra, prompted by Daniel Kodsi
    note: >-
      Appended the carrier-sensitive SOAN proof for the explicitly guarded ZFC settings,
      replacing lost shared support without duplicating the derived AN verdict or
      claiming a choiceless extension. All previous arguments and certificate retained.
notes: 'Proposed by Cian Dorr to separate Strong Actuality from Actuality: the model is full, so it has
  □Rigid Comprehension and hence □Actuality, while $h$''s two retractions keep every true proposition
  from being a strong atom. Unlike the two-object retract it does not meet coherent-retractions: with
  $r_h=j_i$, the arrow $x=e_k$ after $h$ for $k\ne i$ gives $r_{x\circ h}\circ x=r_h\circ e_k=j_k\ne r_h$.
  Gallin Extensional Comprehension fails, since it implies Strong Actuality (gallin-comprehension-implies-strong-actuality),
  though ND and □Rigid Comprehension hold.'
