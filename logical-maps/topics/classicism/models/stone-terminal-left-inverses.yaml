arguments:
- id: two-returns
  holds: [actuality]
  fails: [strong-actuality, five-implies-nd-necessity]
  writeup: stone-terminal-left-inverses
  text: The identity singleton is a strongest truth. After the successor loop every current truth holds at both distinct left inverses and can be split. The proposition supported on the units separates the 5 and distinctness-preserving necessities.
- id: trivial-units
  holds: [truth-implies-two-hat-necessity]
  choice: free
  writeup: stone-terminal-left-inverses
  text: >-
    Every word reduces by cancelling a left inverse against the successor on its right.
    A surviving rightmost left inverse prevents injectivity, and a positive power of
    successor alone prevents surjectivity. Thus the identity is the only unit. The
    identity-only guard witnesses two-hat necessity for every current truth.
