- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 46, p. 32.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §2.3, n. 46, p. 32

# migration: the definition is the old description's first sentence, then the notes' interpretation
# of Σ.
# migration (3 October): the interpretation of Σ has no individual constants, as the topic's condition
# sigma-top now says (Cian Dorr's decision); it read "and each individual constant denotes one
# fixed individual".
definition: >-
  The source’s relative-consistency construction starts in a model of ZF without choice and uses
  the domain of a serial relation with no functional subrelation as its individual domain.


  Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
  denotes the top element of its type.

# The interpretation of Σ in the definition meets the topic's condition sigma-top, so the general
# argument sigma-top (arguments/) gives its failures (2 October 2026; this record's copy of it went).
meets:
  sigma-top: This is the interpretation the definition fixes.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (17 Sep record) ---

- holds: [extensionality-r]
  fails: [relational-choice-r]
  source: {paper: bacon-dorr-classicism, locator: '§2.3, n. 46, p. 32'}
  text: >-
    Refer to note 46; its set-theoretic hypothesis is part of the construction.

# --- later additions ---

- holds: [axiom-of-infinity-e]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    A serial relation on a finite set has a functional subrelation in ZF, so the individual domain
    is infinite, and in the full extensional construction the finite cardinalities are the
    standard numerals, none of which holds of an infinite universal property.

# migration: text of the old notes that no argument holds, verbatim: their first two sentences, and
# the sentence that followed the Σ argument, referring to its failures.
notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them.

was_conjectured: true

