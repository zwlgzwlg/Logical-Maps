# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, Σ top and the base as the individuals; the individuals were the base already.
settings:
  construction: >-
    Appendix D, p. 79, the final construction, the paper’s precursor of the symmetric ideally-full
    models of Dorr’s draft (Definitions 15–18, p. 8): the base has two objects $W_0$ and $W_1$, both
    copies of $\mathbb N$, all permutations of $\mathbb N$ as the arrows between any pair of
    objects, the ideal of finite sets at each, and the symmetry groups $G_{W_0}$ = all permutations
    and $G_{W_1}$ trivial. The paper states the symmetry condition on propositions only, as the
    constraint that a set of arrows in $W_i^t$ containing an arrow $h$ into $W_0$ contains $g\circ
    h$ for every permutation $g$ of $W_0$, and takes the finitely pinned entities at higher types;
    since every arrow is invertible, that is the draft’s symmetry condition at every type, applied
    to the entities’ values. Intuitively $W_0$ is a state in which all individuals are qualitatively
    indiscernible and $W_1$ one in which each plays a unique role. Evaluation point: $W_0$, at its
    identity arrow.
  individuals: base
  sigma: top
meets:
  moving-proposition-stabilizers: >-
    Fix a pinning-carrier point $k$ at $W_1$, whose designated symmetry group is trivial. For $a$ at $W_0$, let $p_a(w)$ mean that $w$ has target $W_1$ and $w(a)=k$. This proposition is symmetric and pinned by $\{a\}$; it is false on arrows ending at $W_0$. Given finite $N$, choose distinct $a,c$ outside it and $g=(a\ c)\in G_{W_0}$. Then $g\cdot p_a=p_c$. A permutation $w:W_0\to W_1$ with $w(a)=k$ has $w(c)\ne k$, so these propositions differ. No collapsing arrow is used. The points here are pinning-carrier points, also when the individual domain is a singleton. Source: OpenAI Codex, prompted by Daniel Kodsi, 22 October 2026, singleton applications §2; recorded 30 October 2026.
  infinitely-many-orbits-everywhere: >-
    With the base as individuals, at $W_0$ and $W_1$ the properties of being one of a finite set of
    individuals lie in infinitely many orbits, symmetries preserving the size of the set. With one
    individual: at $W_1$, whose symmetry group is trivial, there are infinitely many propositions, each its
    own orbit; at $W_0$, the propositions $\{h:h(N)\subseteq M\}$ about arrows into $W_1$, for finite $N$ and
    $M$, lie in infinitely many orbits, the symmetries of $W_0$ moving $N$ but not $M$.
  finitely-pinned-domains: >-
    Each object carries the ideal of finite sets, and the domains hold the finitely pinned symmetric
    entities of every type.
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$, at $W_0$: the transposition of
    $y$ with another individual outside $N$ is a permutation of $W_0$, so lies in $G_{W_0}$.
  actuality-contingent: >-
    The actual-world proposition is the set of all arrows $W_0\to W_0$, in the domain by the source
    argument; at every world an arrow into $W_1$ leads outside it, and such an arrow carries it to
    the empty set.

