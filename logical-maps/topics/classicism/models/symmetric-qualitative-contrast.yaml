notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References. Plenitude still holds by C5 plus Actuality and Propositions 2.5 and 2.14, so
  this model separates it from Functional Choice even under C5, Rigid Comprehension and Boolean
  Completeness. This does not settle whether C5 plus Functional Choice implies Atomicity: the
  model fails the proposed premise.

