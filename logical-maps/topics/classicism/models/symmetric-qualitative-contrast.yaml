# --- from the source (17 Sep record) ---

- holds: [necessary-distinctness-necessary-r, actuality]
  fails: [atomicity-r]
  source: {paper: bacon-dorr-classicism, locator: 'Appendix D, p. 79'}
  text: >-
    The smallest proposition of $W_0^t$ containing the identity is the set of all arrows $W_0\to
    W_0$, which witnesses Actuality at $W_0$; Actuality fails at $W_1$ as in part 1, so
    $\Box$Actuality and hence Atomicity fail at $W_0$ although C5 holds.

# --- later additions ---

- holds: [axiom-of-infinity-t]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    The propositions that the arrow leads to $W_1$ and sends a given individual to itself, one for
    each individual, are pairwise distinct and each is pinned down by that individual; they meet
    the symmetry condition since $G_{W_1}$ is trivial. So there are infinitely many propositions.
    The set of numerals at type $t$ is fixed by every arrow, hence has empty support and lies in
    the domain, so finite cardinality is standard and no finite cardinality holds of the universal
    property.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The type-$t$ half of the old argument, which used the propositions that the arrow fixes a
      given individual; those include arrows into $W_0$, where the symmetry condition asks for
      closure under every permutation of $W_0$. Restricted to arrows into $W_1$, where the symmetry
      group is trivial.

# migration: text of the old notes that no argument holds, verbatim.

- holds: [necessary-intensional-choice-r]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's suggestion
  date: '2026-10-03'
  text: >-
    At every type. (i) An element $a$ of an ideally full domain at $W_0$ is fixed by every permutation
    fixing its pinning set $T$ pointwise, since $(g\cdot a)(k)=a(k\circ g)$ and $k\circ g$ agrees with
    $k$ on $T$. (ii) The arrows into $W_0$ are exactly the symmetries, so $F(h)=h\cdot F(1)$ for them.
    Given $F$ at $W_0$, pick $a\in F(1)$ with pinning set $T$ and let $G(h):=\{h\cdot a\}$ for $h$ into
    $W_0$: the haecceity of $a$, inside $F(h)$ by (ii), symmetric, and pinned down by $T$ by (i). For
    $h$ into $W_1$ there is no symmetry constraint, $G_{W_1}$ being trivial, so let $G(h)$ be the least
    element of $F(h)$ under a fixed well-ordering, which depends only on $h$ on $F$'s pinning set.
    The combined $G$ is in the domain, entails $F$, and has singleton extensions. At $W_1$ the same
    two moves work: the arrows $W_1\to W_0$ are one orbit $h=g\circ h_0$, where $G(h):=\{g\cdot a_0\}$
    for some $a_0\in F(h_0)$, and the arrows $W_1\to W_1$ are unconstrained. So Intensional Choice holds
    at both objects, hence necessarily. In general, the haecceity of an actual instance witnesses
    Intensional Choice wherever every arrow out of the object is a symmetry.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations in
  References. Everything that implies these fails with them. Plenitude still holds by C5 plus
  Actuality and Propositions 2.5 and 2.14, so this model separates it from Functional Choice even
  under C5, Rigid Comprehension and Boolean Completeness. This does not settle whether C5 plus
  Functional Choice implies Atomicity: the model fails the proposed premise.

