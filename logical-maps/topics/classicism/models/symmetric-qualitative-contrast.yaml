settings:
  construction: >-
    Appendix D, p. 79, the final construction, the paper’s precursor of the symmetric ideally-full
    models of Dorr’s draft (Definitions 15–18, p. 8): the base has two objects $W_0$ and $W_1$, both
    copies of $\mathbb N$, all permutations of $\mathbb N$ as the arrows between any pair of
    objects, the ideal of finite sets at each, and the symmetry groups $G_{W_0}$ = all permutations
    and $G_{W_1}$ trivial. The paper states the symmetry condition on propositions only, as the
    constraint that a set of arrows in $W_i^t$ containing an arrow $h$ into $W_0$ contains $g\circ
    h$ for every permutation $g$ of $W_0$, and takes the finitely pinned entities at higher types;
    since every arrow is invertible, that is the draft’s symmetry condition at every type, applied
    to the entities’ values. Intuitively $W_0$ is a state in which all individuals are qualitatively
    indiscernible and $W_1$ one in which each plays a unique role. Evaluation point: $W_0$, at its
    identity arrow.
  individuals: base
  sigma: top
meets:
  transposable: >-
    $M=\emptyset$, and for $N$ the property of not belonging to $N$, at $W_0$: the transposition of
    $y$ with another individual outside $N$ is a permutation of $W_0$, so lies in $G_{W_0}$.
  actuality-contingent: >-
    The actual-world proposition is the set of all arrows $W_0\to W_0$, in the domain by the source
    argument; at every world an arrow into $W_1$ leads outside it, and such an arrow carries it to
    the empty set.

