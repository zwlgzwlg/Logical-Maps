# migration: the definition is the old description without its verdict sentence, then the notes'
# sentence on the root domains (Cian Dorr's, 22 September 2026), which describes the construction.
definition: >-
  Take the alternative coalesced-sum root of Appendix E, p. 83: a set of source action models
  complete for C, coalesced at a new root whose individual domain is a singleton, the unique root
  individual being carried by each distinguished arrow to a chosen individual of that component.
  Evaluation point: the root.


  Root domains are as full as compatibility allows: a root proposition is a choice, for each
  component, of a proposition of that component’s root domain, together with a truth value at the
  root’s identity arrow, and a root entity of a relational type is likewise a family of component
  entities with a root component that is an arbitrary function of the root arguments.

arguments:

# Only the verdicts the engine needs to derive the rest are recorded, the source's first. Lead-ins
# naming the verdict, and attribution sentences, are dropped from the texts, their content being in
# holds, fails, by and date; a text cut from a longer sentence begins with a capital and ends with a
# full stop.

# --- from the source (17 Sep record) ---

- holds: [possibility-plus-r]
  source: {paper: bacon-dorr-classicism, locator: '§2.6, pp. 41–42 and n. 61; Appendix E, p. 83'}
  text: >-
    Choosing the components so that every C-consistent formula with one free individual variable
    is true of the chosen individual in some component gives the n = 1 instances of Possibility+;
    the instances with two or more variables have false antecedents at the root, and the
    empty-tuple instances are Possibility Maximalism.

- holds: [actuality]
  text: >-
    By the singleton root proposition.

- fails: [infinity-e]
  text: >-
    At the root, where there is one individual, although infinitely many are possible.

- holds: [distinctness-preserving-collapse]
  source: {paper: bacon-dorr-classicism, locator: 'Appendix E, p. 83'}

# --- later additions ---

- fails: [barcan-t]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    C is complete for the component set, so some component $M$ refutes BF at its root $M_0$, at
    type $t$ say: some $F$ in $M_0$’s domain has $\forall y\, .\,\Box Fy$ true and
    $\Diamond\exists y\, .\,\neg Fy$ true at $M_0$. Because the root’s domains are as full as
    possible, the thread $F^{\prime}$ that is universal at the root and in every other component
    and is carried onto $F$ by the distinguished arrow to $M_0$ is in the root domain. Every arrow
    from the root into $M$ factors through that distinguished arrow, so $\forall y\, .\,\Box
    F^{\prime}y$ at the root reduces to $\forall y\, .\,\Box Fy$ at $M_0$ together with trivial
    checks elsewhere, and $\Diamond\exists y\, .\,\neg F^{\prime}y$ at the root follows from
    $\Diamond\exists y\, .\,\neg Fy$ at $M_0$ through the same factorization.

- fails: [atomicity-t]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    C is complete for the components, so some component $M$ refutes Atomicity at its root, by a
    proposition $p_M$ with no atom below it in $M$’s domain; the root proposition that is $p_M$ on
    $M$, empty on every other component and false at the root has as its root lower bounds exactly
    the root propositions that are lower bounds of $p_M$ on $M$ and empty elsewhere, so it has no
    atom below it either.

- holds: [relational-choice-r]
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-22'
  text: >-
    The functionality of a subrelation is evaluated at the root’s identity arrow only, while the
    subrelation condition is boxed; so for a serial root relation take the subrelation whose root
    component is a functional choice from the root component, by choice in the metatheory, and
    whose component parts are empty. Its necessitation fails, since some component refutes
    Relational Choice at its root.

- fails: [boolean-completeness-t]
  # migration: the lead-in "Boolean Completeness fails at type $t$ (restoring the claim corrected
  # earlier in the day):" is dropped; the correction it restores, and the arguments of 22 and 23
  # September for Boolean Completeness at type $e\to t$ and Countable Boolean Completeness, now
  # derived, are dropped too, their history being in `history`.
  by: Cian Dorr, recorded by Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    The truncation model of Appendix D, part 6, refutes it at type $t$, as its record now shows,
    and the components are complete for C, so one of them does; the root propositions false at
    every arrow except those into that component form a copy of its propositional domain under the
    root’s entailment order, and a root property of propositions holding exactly of the copies of
    the members of that component’s counterexample family has no least upper bound at the root.

- id: pure-sentences-possible
  fails: [necessary-vicinity, necessary-weakly-inextensible-comprehension-r]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    The components are complete for C and a closed pure sentence at the distinguished arrow into a
    component has its truth value at that component root, so every pure sentence consistent with C
    is possible at the root; the negation of Vicinity is consistent (the truncation model) and so
    is the negation of a closed instance of Weakly Inextensible Comprehension at type $t\to t$
    (the permutation model). Since □Actuality fails here while Vicinity and Weakly Inextensible
    Comprehension hold, the boxed results show that at least one of the boxed principles had to
    fail.

- fails: [necessary-transversal-r]
  by: Claude Opus 5.5 (Anthropic)
  date: '2026-09-28'
  text: >-
    By the same argument: the negation of the type-$e$ instance of Transversal is a pure sentence
    consistent with C, since it holds in symmetric-infinite-classes, so it is possible at the
    root.

