# migration: the definition is the old description without its verdict sentence, then the notes'
# sentence on the root domains (Cian Dorr's, 22 September 2026), which describes the construction.
group: coalesced-sums
# migration (2 October): the old definition is the group's, completed by these settings.
settings:
  construction: >-
    Take the alternative coalesced-sum root of Appendix E, p. 83: a set of source action models
    complete for C, coalesced at a new root whose individual domain is a singleton, the unique root
    individual being carried by each distinguished arrow to a chosen individual of that component.
    Evaluation point: the root.
  domains: fullest
meets:
  complete-components: >-
    The source action models are a set complete for C.
  free-root-component: The root domains are as full as compatibility allows.

arguments:

# Restructured on 2 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every argument this
# record shared in substance with another coalesced sum is now a shared argument of the group
# coalesced-sums or one of the topic's general arguments (arguments/); what follows is this
# record's own. Only the verdicts the engine needs to derive the rest are recorded, the source's
# first.

# --- from the source (17 Sep record) ---

- holds: [possibility-plus-r]
  source: {paper: bacon-dorr-classicism, locator: '§2.6, pp. 41–42 and n. 61; Appendix E, p. 83'}
  text: >-
    Choosing the components so that every C-consistent formula with one free individual variable
    is true of the chosen individual in some component gives the n = 1 instances of Possibility+;
    the instances with two or more variables have false antecedents at the root, and the
    empty-tuple instances are Possibility Maximalism.

- fails: [infinity-e]
  text: >-
    At the root, where there is one individual, although infinitely many are possible.

# --- later additions ---

# migration: the sentences of the old notes that no argument holds, verbatim. The arguments for
# □Relational Choice and the 23 September correction, whose verdicts are now derived, are dropped.

notes: >-
  Promoted on 22 September 2026 for the pure package, which the source establishes; the earlier
  conjectured status concerned an expansion to the map’s signature Σ. That expansion exists
  exactly when Σ has at most one individual constant: with two, the unique root individual would
  have to be carried to two different interpretations in a component where they differ, which no
  arrow can do. So the signature principles are not listed; for a signature with individual
  constants see the constant-indexed root.

was_conjectured: true

