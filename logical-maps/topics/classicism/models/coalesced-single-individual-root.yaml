# migration: the sentences of the old notes that no argument holds, verbatim. The arguments for
# □Relational Choice and the 23 September correction, whose verdicts are now derived, are dropped.
# The last paragraphs of the notes restore, verbatim, sentences of the record before it was
# written as arguments that no argument keeps (5 October 2026).
notes: >-
  Promoted on 22 September 2026 for the pure package, which the source establishes; the earlier
  conjectured status concerned an expansion to the map’s signature Σ. That expansion exists
  exactly when Σ has at most one individual constant: with two, the unique root individual would
  have to be carried to two different interpretations in a component where they differ, which no
  arrow can do. So the signature principles are not listed; for a signature with individual
  constants see the constant-indexed root.

  Actuality holds by the singleton root proposition; Infinity at type e fails at the root, where
  there is one individual, although infinitely many are possible. Atomicity fails at type t: C
  is complete for the components, so some component $M$ refutes Atomicity at its root, by a
  proposition $p_M$ with no atom below it in $M$’s domain; the root proposition that is $p_M$ on
  $M$, empty on every other component and false at the root has as its root lower bounds exactly
  the root propositions that are lower bounds of $p_M$ on $M$ and empty elsewhere, so it has no
  atom below it either. Boolean Completeness fails, at type $e\to t$, for the same reason: a
  component $M$ refutes it by a property $X_M$ of propositions without a greatest lower bound in
  $M$’s domain, and the root property holding of a root proposition iff $X_M$ holds of its
  $M$-component has no greatest lower bound at the root, since such a bound’s $M$-component
  would be one for $X_M$. Relational Choice holds at the root, contrary to a first guess: the
  functionality of a subrelation is evaluated at the root’s identity arrow only, while the
  subrelation condition is boxed; so for a serial root relation take the subrelation whose root
  component is a functional choice from the root component, by choice in the metatheory, and
  whose component parts are empty. □Relational Choice fails, as the notes on Relational Choice
  explain: some component refutes Relational Choice at its root, which is accessible from the
  root. Correction of 23 September 2026: the components are only known to refute Boolean
  Completeness at type $e\to t$ (Classicism, n. 92, conjectures failures at type $t$ but has
  none), so the transfer argument refutes the type schema of Boolean Completeness at the root,
  not its type-$t$ instance, which is left unknown; the same transfer, applied to the countable
  family of haecceities that witnesses the component failure, refutes Countable Boolean
  Completeness. Boolean Completeness fails at type $t$ (restoring the claim corrected earlier in
  the day): the truncation model of Appendix D, part 6, refutes it at type $t$, as its record
  now shows, and the components are complete for C, so one of them does; the root propositions
  false at every arrow except those into that component form a copy of its propositional domain
  under the root’s entailment order, and a root property of propositions holding exactly of the
  copies of the members of that component’s counterexample family has no least upper bound at
  the root. □Transversal fails as well, by the same argument: the negation of the type-$e$
  instance of Transversal is a pure sentence consistent with C, since it holds in
  symmetric-infinite-classes, so it is possible at the root. Observation of Claude Opus 5.5
  (Anthropic), 28 September 2026.

