id: stitched-countably-closed-collapse
name: Stitched collapse preserving the reals and changing CH
certificate:
  source_id: barton-goodsell-continuum-contingency
  produced_by: Neil Barton and Zachary Goodsell (the stitching construction and the bare CH-reversing collapse); OpenAI Codex (GPT-6), prompted by Daniel Kodsi (all-type Analytic Necessitism and the verdicts at the type of sets of reals).
  recorded_by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
