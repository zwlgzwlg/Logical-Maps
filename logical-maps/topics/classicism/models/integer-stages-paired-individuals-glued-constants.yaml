sources:
- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, translated stages, countable pins and free-word gluing, 26 November 2026; see the write-up.
- Cian Dorr and Claude Fable 5.1 (Anthropic), the block-respecting two-object separation of two-hat necessity and 5-necessity, 14 October 2026; see paired-individuals-two-object.
