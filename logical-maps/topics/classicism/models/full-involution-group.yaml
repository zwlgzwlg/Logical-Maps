# migration: the first two sentences restate the old description, "Change the two-arrow
# multiplication to k²=1; evaluate at the sole object.", as the proposal's Appendix B does;
# the third is copied from the 20 September change. In the Σ paragraph, moved from the notes,
# "$\{1\}$" replaces "described above", since nothing above described the actual-world
# proposition.
group: full-action-models
# migration (2 October): the old definition is the group's, completed by these settings: `construction`
# is its first paragraph, verbatim; its interpretation of Σ is one of the group's values.
# migration (3 October): recorded at the group's defaults, one individual and Σ top; the source
# leaves the individuals open, and Σ true atom, until then the record's, is now a variant.
settings:
  construction: >-
    The full action model on the two-element group $\{1,k\}$ with $k^2=1$: the construction of
    Classicism p. 59 (record full-idempotent-monoid) with the two-arrow multiplication changed
    to $k^2=1$. Evaluate at the sole object. The propositions at the evaluation object are the
    subsets of the two arrows out of it, four in all, and every intension of a full model is
    present.
  individuals: singleton
  sigma: top
meets:
  returning-arrow: >-
    $k$, its own inverse.
  coherent-retractions: >-
    $r_g:=g^{-1}$: then $r_{x\circ g}\circ x=g^{-1}\circ x^{-1}\circ x=g^{-1}$.
  nonidentity-arrow: >-
    The involution $k$.
  invertible-arrows: >-
    The arrows form a group.
  epic-arrows: >-
    Every arrow is invertible; and on the individuals every arrow is the identity.
  finitely-many-propositions-everywhere: >-
    There is one object, with four propositions, the sets of the two arrows.
  sigma-apart: The construction does not mention Σ.
  one-object-action-model: >-
    It has one object.
  finitely-many-propositions: >-
    The propositions at the evaluation object are the subsets of the two arrows out of it, four in
    all.

arguments: []

# 6 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): verdicts now given by the topic's
# general arguments (full-atomicity, full-rigid-comprehension, full-epic-barcan, invertible-arrows,
# retractions, unretracted-arrow, nonidentity-arrow, infinitely-many-propositions,
