# migration: sentences of the old notes that no argument holds, verbatim. The last one followed
# the Σ argument (sigma-true-atom) and refers to its failures.

notes: >-
  The cited construction is a model of the map’s relational-type framework. The description
  identifies its evaluation point; construction and verification are given at the PDF locations
  in References. Everything that implies these fails with them.

was_conjectured: true
# The old `changes` log, verbatim and frozen.
history:
- date: '2026-09-17'
  by: OpenAI Codex (GPT-6)
  summary: Adopted the source’s relational type system at the user’s request. The cited construction now
    directly supplies the recorded model; the former type-extension obligation is removed.
  satisfies:
  - necessary-rigid-comprehension-r
  - necessary-atomicity-r
  - necessary-actuality
  - necessary-distinctness-necessary-r
  - no-pure-contingency-r
  violates:
  - fregean-axiom
- date: '2026-09-20'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Added Relational Choice at Cian Dorr''s direction. With choice in the metatheory a serial
    relation has a functional subrelation, and a full model contains every intension, so that subrelation
    is in the domain; see Classicism, p. 61, on the principles common to full models. The propositions
    at the evaluation object are the subsets of the two arrows out of it, four in all, and every intension
    of a full model is present, so the numerals are the finite cardinalities and the fourth holds of the
    universal property of propositions: the Axiom of Infinity at type t fails, as does the fifth instance
    of the schema.'
  satisfies:
  - relational-choice-r
  violates:
  - axiom-of-infinity-t
  - infinity-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Fixed an interpretation of Σ (relational constants as top, individual constants as one fixed
    individual) and recorded the signature schemata it refutes, at Cian Dorr’s request.
  violates:
  - witnessed-possibility-r
  - separated-structure-r
  - independence-signature-r
  - distinctness-signature-r
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Added □Strong Leibniz Biconditionals (type t): every singleton of an arrow is a strong world
    in a propositionally full one-object model; see the notes.'
  satisfies:
  - necessary-strong-leibniz-t
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Boxed the Relational Choice claim; see the notes.
  satisfies:
  - necessary-relational-choice-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: Re-fixed the interpretation of Σ so as to settle No Contingency (signature Σ) and B for sentences
    of Σ, at Cian Dorr’s request; see the notes.
  violates:
  - no-contingency-signature-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Corrected the reason given for the failures of Independence (signature Σ) and Distinctness
    (signature Σ): the true atom is denoted by no closed pure term, since such terms denote entities fixed
    by every arrow; the failures come from the other relational constants, which denote top. No verdict
    changes.'
- date: '2026-09-25'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Added Transversal Choice, by the argument recorded for Relational Choice: a full model contains
    every intension, in particular one whose extension at the evaluation point is a transversal, chosen
    in the metatheory, of the extension there of an equivalence relation; the equivalence and transversal
    conditions are unboxed. Recorded on a question of Zachary Goodsell, after an observation of Christopher
    Sun.'
  satisfies:
  - transversal-choice-r
- date: '2026-09-23'
  by: Claude Fable 5.1 (Anthropic)
  summary: 'Corrected the justification of □Strong Leibniz Biconditionals (type t): the 22 September argument
    tacitly used that the monoid is right-cancellative, which holds here; no verdict changes.'

