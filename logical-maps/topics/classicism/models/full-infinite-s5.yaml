id: full-infinite-s5
name: 'Full action model: infinite S5'
certificate:
  source_id: misc
  produced_by: Cian Dorr, 7 October 2026
  recorded_by: Claude Opus 5.5 (Anthropic), 7 October 2026
  checked_by: []
  date: '2026-10-07'
sources:
- Cian Dorr, suggestion of 7 October 2026, as a basic reference model.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, pp. 58–61 (full action models).
source_names:
- Dorr 7 Oct
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, pp. 58–61
  note: Full action models; on this category the construction is the standard full S5 model.

group: full-action-models
settings:
  construction: >-
    The category whose objects are the members of an infinite set $W$, with exactly one arrow from
    each object to each object, evaluated at any object. The arrows out of an object correspond to
    the members of $W$, so this is the full S5 model with world set $W$ and a constant domain of
    individuals.
  individuals: singleton
  sigma: top
meets:
  numbered-returning-arrows: >-
    Where it matters (the variant without countable choice), $W$ is $\mathbb N$: $h_n$ is the arrow to world $n$ and $r_n$ the arrow back.
  invertible-arrows: >-
    The unique arrow from $u$ to $v$ is inverted by the unique arrow from $v$ to $u$.
  epic-arrows: >-
    Every arrow is invertible; and on the individuals every arrow is the identity.
  retractions: >-
    Each arrow out of the evaluation object is retracted by the arrow back.
  unique-retractions-everywhere: >-
    Between two objects there is only one arrow, so an arrow has exactly one retraction.
  returning-arrow: >-
    The arrow to any other object, retracted by the arrow back.
  coherent-retractions: >-
    $r_g$ is the unique arrow back; any two arrows with the same ends are equal, so
    $r_{x\circ g}\circ x=r_g$.
  nonidentity-arrow: >-
    The arrow to any other object.
  infinitely-many-propositions: >-
    The propositions are all the sets of arrows out of the evaluation object, one for each subset
    of $W$.
  sigma-apart: The construction does not mention Σ.

arguments:

- holds: [no-pure-contingency-r]
  choice: free
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-07'
  text: >-
    Any two objects are isomorphic, by the unique arrow between them, and composing with it carries
    the model based at one to the model based at the other. So a closed sentence has the same truth
    value at every object, and a true one is necessary. (The engine also derives this verdict, but
    the general argument for the Σ-schemata needs it recorded.)


notes: >-
  A basic reference model, recorded at Cian Dorr's request: the full S5 model with infinitely many
  worlds. Nothing depends on which infinite set $W$ is. In the variant with infinitely many
  individuals the group fixes them as the natural numbers; any infinite set gives the same verdicts
  under choice. Its verdicts are those of the full permutation group model, whose arrows are
  likewise all invertible. Without choice in the metatheory, the same construction over a family of nonempty
  sets with no choice function refutes Intensional Choice; that variant is not recorded.
