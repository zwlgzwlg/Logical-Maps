# --- later additions ---

- holds: [distinctness-preserving-collapse]
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-23'
  text: >-
    For a true proposition $p$ pinned down by a finite set take as the witness $q$ the
    actual-world proposition $\{1_{\mathbb N}\}$: under any other arrow $h$, $\Diamond q$ would
    need $k\circ h=1_{\mathbb N}$, impossible since $h$ is not injective.

- fails: [boolean-completeness-t]
  # migration: the first sentence rewrites "Boolean Completeness fails at type $t$ as well, which
  # the source (n. 92) conjectures but does not show."; the closing "Observation of Claude Fable 5.1
  # (Anthropic), 25 September 2026; not in the source." becomes `by` and `date`. The argument before
  # it in the old notes, for Atomicity (type $t$), now derived, is dropped, and so is the repeated
  # closing "Observations of Claude Fable 5.1 (Anthropic), 25 September 2026; not in the source."
  by: Claude Fable 5.1 (Anthropic)
  date: '2026-09-25'
  text: >-
    The source (n. 92) conjectures this but does not show it. Any set $F$ of propositions is the
    extension at the identity of an element of the domain at type $t\to t$, namely the profile
    $\langle h,p\rangle\mapsto\{i : i\cdot p\in F\}$: it is natural, independent of $h$ and so
    pinned down by the empty set, and each of its values is pinned down by the pinning set of $p$,
    since $i\cdot p$ depends only on the values of $i$ there. A least upper bound of $F$ under
    entailment is a least finitely pinned superset of $\bigcup F$, and it exists only if the least
    $S$-pinned superset of $\bigcup F$ stops shrinking as the finite set $S$ grows. Here let $A_m$
    ($m\ge1$) be the proposition, pinned down by $\{2m,2m+1\}$, that the arrow sends $2m$ to $0$
    and $2m+1$ to $1$, so that its first step is at the odd position $2m+1$; the identity belongs
    to no $A_m$. The least superset of $\bigcup_mA_m$ pinned down by $\{0,\ldots,N\}$ consists of
    the non-identity arrows whose first step is at an odd position or beyond $N$, and it strictly
    shrinks as $N$ grows. So $F$ has no least upper bound, and, taking pointwise negations, the
    family of complements has no greatest lower bound.

- fails: [boolean-completeness-t]
  # migration: "Review of 25 September 2026." becomes `date`; `by` condenses the record's second
  # source. A second, independent argument for the same verdict.
  by: DeepSeek (deepseek-flash), trawl; reviewed and corrected by OpenAI Codex (GPT-6)
  date: '2026-09-25'
  writeup: finite-support-identity-or-collapse-surjections
  provenance: admission-c0a37bbe6b6c45cc985428b174812564
  text: >-
    The dated write-up supplies the accepted BC-t witness using alternating differences of
    agreement classes and Definition D.3's extensional-fullness lemma. It replaces the trawl's
    invalid inference from an unavailable intersection to an unavailable greatest lower bound.
    Atomicity-t also fails, as already specified by the source's footnote 92 and checked by
    splitting any nonempty finitely pinned subproposition of the false proposition h(0)=h(1)=0.

