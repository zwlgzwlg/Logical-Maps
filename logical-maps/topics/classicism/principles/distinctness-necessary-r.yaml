id: distinctness-necessary-r
name: ND
category: coarse
statement: Distinct things of any type are necessarily distinct.
formal: $\forall x y^\sigma\, .\,x\ne y\to\Box(x\ne y)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–22.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–22
notes: ''
aliases:
- Necessity of distinctness
variants:
- id: polyadic
  name: Polyadic form
  statement: Distinct tuples of entities are necessarily distinct.
  formal: $\forall\bar x\,\bar y^{\bar\sigma}\, .\,\bar x\ne\bar y\to\Box(\bar x\ne\bar y)$
  equivalence: The original form is the case of a one-element tuple. Conversely, if $\bar x\ne\bar y$
    then $x_i\ne y_i$ for some $i$, and ND at $\sigma_i$ gives $\Box(x_i\ne y_i)$, hence $\Box(\bar x\ne\bar
    y)$. For the empty tuple, $\bar x\ne\bar y$ is false.
