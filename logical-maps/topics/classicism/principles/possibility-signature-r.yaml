id: possibility-signature-r
name: Possibility Maximalism (signature Σ)
category: signature
statement: The Possibility Maximalism schema for the fixed nonlogical signature Sigma.
formal: $\Diamond P\quad(P\text{ closed in }\mathcal L(\Sigma);\ C(\Sigma)+P\text{ consistent})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 37–39.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, pp. 37–39
notes: ''
variants:
- id: dual
  name: Dual form
  statement: 'Only theorems of C(Σ) are necessary: every closed sentence of the signature not provable
    in C(Σ) is not necessary.'
  formal: $\neg\Box P\quad(P\text{ closed in }\mathcal L(\Sigma);\ C(\Sigma)\nvdash P)$
  equivalence: $C(\Sigma)+\neg P$ is consistent iff $C(\Sigma)\nvdash P$, and $\Diamond\neg P$ is $\neg\Box
    P$; so the instance of the official form at $\neg P$ is the instance of this form at $P$, and conversely.
