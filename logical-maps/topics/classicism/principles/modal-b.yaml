  name: Dual form
  statement: Whatever is possibly necessary is true.
  formal: $\forall p\, .\,\Diamond\Box p\to p$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back.
