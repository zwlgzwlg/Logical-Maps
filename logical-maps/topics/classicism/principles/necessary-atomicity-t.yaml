id: necessary-atomicity-t
name: □Atomicity (type t)
category: lattice
statement: Every closed instance of Atomicity (type t) is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Atomicity (type t)}$
date: '2026-10-02'
sources:
- Cian Dorr, suggestion of 2 October 2026.
source_names:
- Dorr 2 Oct
references: []
notes: Box each fully closed instance of Atomicity (type t). Type quantifiers and formula side conditions remain
  outside the box.
variants:
- id: dual
  name: Dual form
  statement: Every closed instance of the dual form of Atomicity (type t) is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of Atomicity (type
    t)}$
  equivalence: Each instance of the dual form of Atomicity (type t) is derivable in C from finitely many
    instances of the official form, and conversely; the derivation is on the page of Atomicity (type t).
    Necessitating it and applying K carries the equivalence to the boxed forms.
