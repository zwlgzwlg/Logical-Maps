id: necessary-modal-five
name: □5
category: coarse
statement: "Necessarily, every possible proposition is necessarily possible."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of 5}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of 5. Type quantifiers and formula side conditions remain outside
  the box.
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
variants:
