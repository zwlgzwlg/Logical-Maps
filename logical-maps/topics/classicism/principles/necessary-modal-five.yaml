    status: verified
  name: Dual form
  statement: Every closed instance of the dual form of 5 is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of 5}$
  equivalence: Each instance of the dual form of 5 is derivable in C from finitely many instances of the
    official form, and conversely; the derivation is on the page of 5. Necessitating it and applying K
    carries the equivalence to the boxed forms.
