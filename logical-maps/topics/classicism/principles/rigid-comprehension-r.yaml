id: rigid-comprehension-r
name: Rigid Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a rigid one.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Rigid}(Y)\land(\forall\bar
  z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 28–30.
source_names:
- Classicism
references:
