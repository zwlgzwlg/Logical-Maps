id: necessary-strong-leibniz-t
name: □Strong Leibniz Biconditionals (type t)
category: lattice
statement: "Necessarily, every possible proposition is entailed by a strong world proposition, one that is possible and necessarily entails every proposition or its negation."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Strong Leibniz Biconditionals (type
  t)}$
date: '2026-09-22'
sources:
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.2, pp. 164–166.
source_names:
- Philosophical Introduction to HOL
references:
