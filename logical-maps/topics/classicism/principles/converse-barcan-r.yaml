id: converse-barcan-r
name: CBF
category: base
statement: The Converse Barcan Formula at every type.
formal: $\forall X^{\sigma t}\, .\,\Box(\forall x^\sigma\, .\,Xx)\to(\forall x^\sigma\, .\,\Box Xx)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.5, p. 19
notes: ''
variants:
- id: polyadic
  lean:
    ref: Classicism.P.ConverseBarcan.listSchemaIn
    equivalence_ref: Classicism.Map.converse_barcan_r.polyadic
    status: verified
  name: Polyadic form
  statement: The Converse Barcan Formula for relations with any finite number of arguments.
  formal: $\forall X^{\bar\sigma t}\, .\,\Box(\forall\bar x^{\bar\sigma}\, .\,X[\bar x])\to(\forall\bar
    x^{\bar\sigma}\, .\,\Box X[\bar x])$
  equivalence: Both forms are theorems of C, so they are equivalent there. The polyadic form also follows
    from the original by instantiating one variable at a time.
- id: dual
  lean:
    ref: Classicism.P.ConverseBarcanDual.schemaIn
    equivalence_ref: Classicism.Map.converse_barcan_r.dual
    status: verified
  name: Dual form
  statement: If something possibly has a property, then possibly something has it.
  formal: $\forall X^{\sigma t}\, .\,(\exists x^\sigma\, .\,\Diamond Xx)\to\Diamond(\exists x^\sigma\,
    .\,Xx)$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back.
- id: dual-polyadic
  lean:
    ref: Classicism.P.ConverseBarcanDual.listSchemaIn
    equivalence_ref: Classicism.Map.converse_barcan_r.dual_polyadic
    status: verified
  name: Dual polyadic form
  statement: If some tuple possibly stands in a relation, then possibly some tuple stands in it.
  formal: $\forall X^{\bar\sigma t}\, .\,(\exists\bar x^{\bar\sigma}\, .\,\Diamond X[\bar x])\to\Diamond(\exists\bar
    x^{\bar\sigma}\, .\,X[\bar x])$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back. Combined with the polyadic form, this gives the
    equivalence with the official form.
lean_def: Classicism.P.ConverseBarcan.schemaIn
