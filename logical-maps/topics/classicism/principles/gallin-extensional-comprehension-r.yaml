id: gallin-extensional-comprehension-r
name: Gallin Extensional Comprehension
category: comprehension
statement: Every relation is coextensive with one that is persistent and has a persistent pointwise negation.
  This is the source’s comparison with Gallin’s different rigidity convention.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Persistent}(Y)\land\operatorname{Persistent}(\neg
  Y)\land(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 37, p. 28.
