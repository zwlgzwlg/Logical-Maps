notes: The full schema is $\{F_n:n\in\mathbb N\}$. Its height-zero fragment entails Arithmetic Necessitism,
  Necessity of Arithmetic and Necessity of Analysis; its height-one fragment is equivalent to Second-Order
  Analytic Necessitism. Each exact height is independent of all the others, so the full schema is strictly
  stronger than every finite collection of heights. No separate existence assumption is imposed. See [the
  finite-type guide](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/writeups/finite-type-non-contingency-guide.md).
