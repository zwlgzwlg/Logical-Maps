id: finite-type-necessitism
name: Finite-Type Necessitism
category: mathematical-contingency
statement: Every possibly realizable finite arithmetic hierarchy has a rigid realization at the same carrier
  type, with a full rigid represented power of its last stage.
formal: $\Diamond\exists\mathcal A\,\operatorname{Arith}^{\tau}_n(\mathcal A)\ \to\ \exists\mathcal A\,[\operatorname{Arith}^{\tau}_n(\mathcal
  A)\land\operatorname{RigidStr}(\mathcal A)\land\operatorname{RepPower}_1(\mathsf P(X_n),X_n)]\qquad(n\ge0)$
definitions: $\operatorname{Arith}^{\tau}_n(\mathcal A):=\operatorname{Peano}(X_0,z,S)\land\bigwedge_{i<n}\operatorname{Pow}(X_i,X_{i+1},E_i)$.
  All $X_i$ have type $\tau t$, $z$ has type $\tau$, and $S,E_i$ have type $\tau\tau t$. $\operatorname{Pow}(X,Y,E)$
  says that $E$ is supported on $X\times Y$ and $\forall F^{\tau t}\exists!y\in Y\,\forall x\in X\,(E(x,y)\leftrightarrow
  Fx)$. The levels may overlap. $\operatorname{RigidStr}$ requires rigid carriers and relations, and necessary
  distinctness of carrier members. $\mathsf P(X):=\lambda B\,(\operatorname{Rigid}(B)\land B\le X)$, with
  necessary inclusion. $\operatorname{RepPower}_1(Q,X)$ is the existing full rigid represented-power formula.
  The extra power has its native predicate type and need not fit into $\tau$. Types and finite heights
  are metalinguistic schema indices. Necessary correctness of the hierarchy is a consequence (Lemma 2.3),
  not an added hypothesis or conjunct.
date: '2026-10-30'
