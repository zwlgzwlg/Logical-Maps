id: no-contingency-signature-r
name: No Contingency (signature Σ)
category: signature
statement: Each closed sentence of the language of the fixed signature Sigma, if true, is necessary. A
  sentence schema, standing to No Pure Contingency as Possibility Maximalism (signature Σ) stands to Possibility Maximalism
  (pure).
formal: $P\to\Box P\quad(P\text{ a closed sentence of }\mathcal L(\Sigma))$
date: '2026-09-22'
sources:
- Cian Dorr, suggestion of 22 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 27 (No Pure Contingency).
source_names:
- Dorr 22 Sep
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 27
  note: The pure schema of which this is the signature version.
notes: 'Holds in every one-world model whatever the constants denote, so it is consistent; but it is incompatible
  with Witnessed Possibility and hence with Logical Necessity, Separated Structure and Maximalist Classicism
  for Σ: a constant of relational type is possibly top and possibly not top under Witnessed Possibility,
  while this schema makes whichever obtains necessary.'
variants:
- id: dual
  name: Dual form
  statement: Each closed sentence of the signature, if possible, is true.
  formal: $\Diamond P\to P\quad(P\text{ a closed sentence of }\mathcal L(\Sigma))$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
