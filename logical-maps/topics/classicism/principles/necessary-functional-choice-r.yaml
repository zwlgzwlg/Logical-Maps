id: necessary-functional-choice-r
name: □Functional Choice
category: choice
statement: Every closed instance of Functional Choice is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Functional Choice}$
date: '2026-09-22'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–33.
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.4, pp. 175–176.
source_names:
- Classicism
- Philosophical Introduction to HOL
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.3, pp. 31–33
- paper: bacon-2024-book
  role: related
  locator: §8.4, pp. 175–176
  note: □Functional Choice is the principle valid in the Gallin and Williamson models, from which Bacon
    and Dorr derive S5, the Strong Leibniz Biconditionals, Rigid Comprehension and Boolean Completeness.
notes: Added with □Relational Choice; the Gallin–Williamson principle in the map’s vocabulary.
variants:
- id: polyadic
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Functional Choice is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Functional
    Choice}$
  equivalence: Each instance of the polyadic form of Functional Choice is derivable in C from finitely
    many instances of the original form, and conversely; the derivations are on the page of the unboxed
    principle. Necessitating them and applying K carries the equivalence to the boxed forms.
