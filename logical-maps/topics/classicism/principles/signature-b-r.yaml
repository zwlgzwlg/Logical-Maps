id: signature-b-r
name: B for sentences of Σ
category: signature
statement: The B instance for every closed sentence of the language of the fixed signature Sigma.
formal: $P\to\Box\Diamond P\quad(P\text{ a closed sentence of }\mathcal L(\Sigma))$
date: '2026-09-22'
sources:
- Cian Dorr, suggestion of 22 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, n. 81, p. 59 (B for pure sentences).
- Andrew Bacon, Logical Combinatorialism, Philosophical Review 129 (2020), §3, n. 32, p. 556.
source_names:
- Dorr 22 Sep
- Classicism
- Logical Combinatorialism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, n. 81, p. 59
- paper: bacon-2020
  role: related
  locator: §3, n. 32, p. 556
  note: Bacon’s observation that B for sentences with a nonlogical predicate is undermined by Witnessed
    Possibility independently of contingent distinctness.
notes: Sits between B and B for pure sentences. Incompatible with Witnessed Possibility, unlike its pure
  counterpart, which Witnessed Possibility tolerates.
variants:
- id: dual
  name: Dual form
  statement: Each closed sentence of the signature that is possibly necessary is true.
  formal: $\Diamond\Box P\to P\quad(P\text{ a closed sentence of }\mathcal L(\Sigma))$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
