id: necessary-modal-b
name: □B
category: coarse
statement: "Necessarily, every true proposition is necessarily possible."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of B}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of B. Type quantifiers and formula side conditions remain outside
  the box.
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
variants:
- id: dual
  lean:
    ref: Classicism.P.NecModalBDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_modal_b.dual
    status: verified
  name: Dual form
  statement: Every closed instance of the dual form of B is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of B}$
  equivalence: Each instance of the dual form of B is derivable in C from finitely many instances of the
    official form, and conversely; the derivation is on the page of B. Necessitating it and applying K
    carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecModalB.schemaIn
