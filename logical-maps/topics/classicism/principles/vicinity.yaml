id: vicinity
name: Vicinity
category: lattice
statement: There is a true proposition that entails the possibility of each true proposition.
formal: $\exists p\, .\,p\land\forall q\, .\,q\to p\le\Diamond q$
date: '2026-09-27'
sources:
- Christopher Sun, 27 September 2026, who recognised the principle's interest by showing that together
  with Weakly Inextensible Comprehension it implies Actuality.
- Cian Dorr, formulation and name, 27 September 2026.
source_names:
- Sun 27 Sep
- Dorr 27 Sep
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 25
  note: Source of Actuality, of which this is the weakening that asks the witness to entail only the
    possibility of each truth.
notes: >-
  Weakens Actuality by replacing $p\le q$ with $p\le\Diamond q$. Its interest was recognised by
  Christopher Sun, who showed that it recovers Actuality from Weakly Inextensible Comprehension, so
  that Actuality is equivalent to Vicinity together with Weakly Inextensible Comprehension. ND at type
  $t$ gives it trivially, with $\top$ as witness.
variants:
- id: dual
  name: Dual form
  statement: Some falsehood is entailed by the necessity of every falsehood.
  formal: $\exists p\, .\,\neg p\land\forall q\, .\,\neg q\to\Box q\le p$
  equivalence: 'If $p$ witnesses one form, $\neg p$ witnesses the other: substitute $\neg q$ for $q$ and
    use $\neg p\le\Diamond\neg q\leftrightarrow\Box q\le p$.'
