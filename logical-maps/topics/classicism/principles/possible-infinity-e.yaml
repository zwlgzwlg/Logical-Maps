id: possible-infinity-e
name: Possible Infinity (type e)
category: infinity
statement: >-
  Possibly there are not finitely many individuals: the Axiom of Infinity at this type, under a diamond.
formal: $\Diamond\neg\exists Z^{(e t)t}\, .\,\operatorname{FiniteCardinality}_e(Z)\land Z(\lambda u^e\, .\,\top)$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
source_names:
- Dorr 20 Sep
notes: >-
  Weaker than the Axiom of Infinity at this type by T. Since the Axiom of Infinity at type $e$ is
  consistent with C, Possibility Maximalism (pure) implies this principle. With No Pure Contingency, or with BF, it
  gives the Axiom back; whether it does so in C alone is recorded as an open question. See Background for
  $\mathbf{0}$, $\operatorname{Suc}$ and $\operatorname{FiniteCardinality}$.
lean_def: Classicism.P.PossibleInfinityE.schemaIn
