id: church-numeral-infinity
name: Church Numeral Infinity
statement: Zero is not the successor of a Church natural, and successor is injective on the Church naturals
  at each relational iteration carrier α.
formal: $\operatorname{ChInf}_\alpha:=\bigl(\forall n^{\nu^C_\alpha}\, .\,N^C_\alpha n\to s^C_\alpha n\ne0^C_\alpha\bigr)\land\forall
  m^{\nu^C_\alpha}n^{\nu^C_\alpha}\, .\,N^C_\alpha m\land N^C_\alpha n\land s^C_\alpha m=s^C_\alpha n\to
  m=n\qquad(\alpha\ne e)$
definitions: 'See Background, Church numerals and sequences: $\nu^C_\alpha=(\alpha\to\alpha)\to\alpha\to\alpha$,
  with the least inductive property $N^C_\alpha$.'
notes: This is a schema of Peano separation sentences for Church numerals, not the existing Infinity schema,
  cardinality-based Axiom of Infinity, or I* for Fregean numerical quantifiers. No equivalence with those
  principles is asserted. The restriction α ≠ e is required by the fixed relational type system.
