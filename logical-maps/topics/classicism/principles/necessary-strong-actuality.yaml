id: necessary-strong-actuality
name: □Strong Actuality
category: lattice
statement: 'Necessarily, there is a true strong world proposition: a true proposition that necessarily
  entails every proposition or its negation.'
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Strong Actuality}$
date: '2026-10-06'
sources:
- Cian Dorr, formulation and name, 6 October 2026.
source_names:
- Dorr 6 Oct
notes: Strong Actuality has no type parameters, so its necessitation is the single sentence $\Box\exists
  p\, .\,p\land\Box\forall q\, .\,p\le q\lor p\le\neg q$.
lean_def: Classicism.P.NecStrongActuality.schemaIn
