id: functionality-r
name: Functionality
category: extensionality
statement: Operations with the same value on every argument are identical. The output type is relational.
formal: $\forall X Y^{\sigma\tau}\, .\,(\forall z^\sigma\, .\,Xz=Yz)\to X=Y\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16, especially n. 18.
source_names:
- Classicism
