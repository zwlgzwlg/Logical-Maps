id: functionality-r
name: Functionality
category: extensionality
statement: Operations with the same value on every argument are identical. The output type is relational.
formal: $\forall X Y^{\sigma\tau}\, .\,(\forall z^\sigma\, .\,Xz=Yz)\to X=Y\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16, especially n. 18.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.4, pp. 15–16, especially n. 18
notes: ''
variants:
- id: polyadic
  lean:
    ref: Classicism.P.Functionality.listSchemaIn
    equivalence_ref: Classicism.Map.functionality_r.polyadic
    status: verified
  name: Polyadic form
  statement: Operations of several arguments with the same value on every tuple of arguments are identical.
  formal: $\forall X Y^{\bar\sigma\tau}\, .\,(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]=Y[\bar z])\to
    X=Y\qquad(\tau\ne e)$
  equivalence: The original form is the case of a one-element tuple. Conversely, by induction on the length
    of the tuple, one argument at a time. If $X[z_1\bar z']=Y[z_1\bar z']$ for all $z_1,\bar z'$, then
    for each $z_1$ the operations $Xz_1$ and $Yz_1$, of type $\sigma_2\cdots\sigma_n\tau$, agree on every
    tuple, so they are identical by the induction hypothesis. Functionality at $\sigma_1$ then gives $X=Y$.
    For the empty tuple the condition is $X=Y$ itself.
