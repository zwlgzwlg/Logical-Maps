id: actuality
name: Actuality
category: lattice
statement: There is a true proposition that entails every true proposition.
formal: $\exists p\, .\,p\land\forall q\, .\,q\to p\le q$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 25.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.2, p. 25
notes: ''
variants:
- id: dual
  name: Dual form
  statement: Some falsehood is entailed by every falsehood.
  formal: $\exists p\, .\,\neg p\land\forall q\, .\,\neg q\to q\le p$
  equivalence: 'If $p$ witnesses one form, $\neg p$ witnesses the other: substitute $\neg q$ for $q$ and
    use $q\le r\leftrightarrow\neg r\le\neg q$.'
