id: necessary-church-numeral-infinity
name: □Church Numeral Infinity
statement: Church Numeral Infinity holds necessarily at each relational iteration carrier α.
formal: $\Box\operatorname{ChInf}_\alpha\qquad(\alpha\ne e)$
definitions: $\operatorname{ChInf}_\alpha$ is [[church-numeral-infinity]]. The box encloses both universally
  closed clauses; α remains a schematic type parameter.
notes: This supplies necessary functionality of the least recursion relation. It must not be replaced
  by unboxed Church Numeral Infinity merely by necessitating a derivation with an undischarged assumption.
