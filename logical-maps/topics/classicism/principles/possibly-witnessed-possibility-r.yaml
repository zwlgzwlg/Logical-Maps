id: possibly-witnessed-possibility-r
name: Possibly Witnessed Possibility
category: signature
statement: For pure formulas P with free variables among a finite tuple x and distinct matching constants
  c, a possible witness to P entails that P at those constants is possible. Equivalently, P necessary
  at the constants is necessary universally.
formal: $\Diamond(\exists\bar x\, .\,P)\to\Diamond P[\bar c/\bar x]\quad(P\text{ pure, free variables
  among }\bar x;\ \bar c\text{ distinct constants of }\Sigma)$
date: '2026-09-22'
sources:
- Cian Dorr, suggestion of 22 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 38–39 and n. 57.
source_names:
- Dorr 22 Sep
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.5, pp. 38–39 and n. 57
  note: Separated Structure and Witnessed Possibility, between which this principle sits.
- paper: bacon-2020
  role: background
  locator: §4, pp. 561–562
  note: Separated Structure, to which this principle is equivalent in C.
notes: Strengthens Witnessed Possibility by weakening its antecedent from an actual to a possible witness;
  its contrapositive is □P[c̄/x̄] → □∀x̄ P, the left-to-right direction of Logical Necessity with a box
  on the right. Equivalent in C to Separated Structure by the recorded results, so Logical Necessity is
  Separated Structure together with No Pure Contingency.
aliases:
- Necessity transfer
variants:
- id: dual
  name: Dual form
  statement: If a pure formula is necessary of distinct constants, it is necessary that it holds of everything.
  formal: $\Box P[\bar c/\bar x]\to\Box(\forall\bar x\, .\,P)\quad(P\text{ pure, free variables among
    }\bar x;\ \bar c\text{ distinct constants of }\Sigma)$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
