id: ordinary-comprehension-r
name: Ordinary Comprehension
category: base
statement: Every well-typed formula P with distinguished variables y defines a coextensive relation; X
  is fresh, and any other free object variables are universally closed.
formal: $\exists X\, .\,\forall\bar y\, .\,X[\bar y]\leftrightarrow P\quad(P\text{ a formula in which
  }X\text{ is not free})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, p. 27.
source_names:
- Classicism
references:
