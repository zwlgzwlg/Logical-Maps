id: intensionality-r
name: Intensionality
category: base
statement: Necessarily coextensive relations are identical.
formal: $\forall X Y^{\bar\sigma t}\, .\,\Box(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow
  Y[\bar z])\to X=Y$
