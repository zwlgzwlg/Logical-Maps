id: logical-necessity-r
name: Logical Necessity
category: signature
statement: 'The Logical Necessity schema: necessity at distinct matching constants is equivalent to universal
  truth of the pure-formula. Preserve the side conditions of Witnessed Possibility.'
formal: $\Box P[\bar c/\bar x]\leftrightarrow(\forall\bar x\, .\,P)\quad(P\text{ pure, free variables
  among }\bar x;\ \bar c\text{ distinct constants of }\Sigma)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, n. 57, p. 38
- paper: bacon-2020
  role: origin
  locator: Logical Necessity, cited in Classicism n. 57
  note: Stated for a fundamental language; Bacon’s restatements with fundamentality and purity predicates
    (pp. 546–547) are not on the map.
- paper: bacon-2020
  role: origin
