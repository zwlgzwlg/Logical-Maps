variants:
- id: dual
  name: Dual form
  statement: A pure formula is possible of distinct constants iff it holds of something.
  formal: $\Diamond P[\bar c/\bar x]\leftrightarrow(\exists\bar x\, .\,P)\quad(P\text{ pure, free variables
    among }\bar x;\ \bar c\text{ distinct constants of }\Sigma)$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
