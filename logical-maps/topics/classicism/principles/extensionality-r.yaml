id: extensionality-r
name: Extensionality
category: extensionality
statement: At each relational type, coextensive relations are identical; include the nullary propositional
  case.
formal: $\forall X Y^{\bar\sigma t}\, .\,(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar
  z])\to X=Y$
date: '2026-09-17'
