id: church-numeral-functional-recursion
name: Church Numeral Functional Recursion
statement: For each initial value and operation on a relational output type there is a function on the
  Church numeral type satisfying the zero equation and the successor equation on the inductively generated
  naturals.
formal: $\forall a^\tau g^{\tau\to\tau}\,\exists f^{\nu^C_\alpha\to\tau}\, .\,f0^C_\alpha=a\land\forall
  n^{\nu^C_\alpha}\, .\,N^C_\alpha n\to f(s^C_\alpha n)=g(fn)\qquad(\alpha,\tau\ne e)$
definitions: See Background, Church numerals and sequences, for $\nu^C_\alpha$, $0^C_\alpha$, $s^C_\alpha$
  and $N^C_\alpha$.
notes: A named principle schema, with Infinity kept as an explicit premise of the connecting result [[necessary-church-numeral-infinity-implies-church-numeral-functional-recursion]].
  The function is defined on the whole ambient type; its successor equation is asserted only for Church
  naturals. No uniqueness outside that property is claimed.
