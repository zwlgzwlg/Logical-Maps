id: atomlessness
name: Atomlessness
category: instances
statement: Atomlessness in the displayed closed propositional formulation.
formal: $\forall p\, .\,\Diamond p\to\exists q\, .\,\Diamond q\land q\le p\land q\ne p$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix D, p. 76.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: Appendix D, p. 76
notes: ''
variants:
- id: dual
  name: Dual form
  statement: Every proposition that is not necessary entails a strictly weaker proposition that is not
    necessary.
  formal: $\forall p\, .\,\neg\Box p\to\exists q\, .\,\neg\Box q\land p\le q\land q\ne p$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back.
