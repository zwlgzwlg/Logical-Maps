id: necessary-tractarianism-r
name: □Tractarianism
category: coarse
statement: "Necessarily, a proposition entailing every instance of a property entails its universal generalization."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Tractarianism}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Tractarianism. Type quantifiers and formula side conditions remain
  outside the box.
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecTractarianism.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_tractarianism_r.polyadic
    status: verified
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Tractarianism is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Tractarianism}$
  equivalence: Each instance of the polyadic form of Tractarianism is derivable in C from finitely many
    instances of the original form, and conversely; the derivations are on the page of the unboxed principle.
    Necessitating them and applying K carries the equivalence to the boxed forms.
