id: necessary-tractarianism-r
name: □Tractarianism
category: coarse
statement: "Necessarily, a proposition entailing every instance of a property entails its universal generalization."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Tractarianism}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Tractarianism. Type quantifiers and formula side conditions remain
  outside the box.
changes:
