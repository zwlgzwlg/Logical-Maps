id: necessary-functionality-r
name: □Functionality
category: extensionality
statement: Every closed instance of Functionality is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Functionality}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Functionality. Type quantifiers and formula side conditions remain
  outside the box.
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecFunctionality.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_functionality_r.polyadic
    status: verified
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Functionality is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Functionality}$
  equivalence: Each instance of the polyadic form of Functionality is derivable in C from finitely many
    instances of the original form, and conversely; the derivations are on the page of the unboxed principle.
    Necessitating them and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecFunctionality.schemaIn
