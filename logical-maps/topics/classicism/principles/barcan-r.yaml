id: barcan-r
name: BF
category: coarse
statement: The Barcan Formula at every type. The predicate formulation closes the formula schema using
  lambda abstraction.
formal: $\forall X^{\sigma t}\, .\,(\forall x^\sigma\, .\,\Box Xx)\to\Box(\forall x^\sigma\, .\,Xx)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Proposition 2.1, pp. 20–21.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: Proposition 2.1, pp. 20–21
- paper: barcan-1946
  role: origin
  locator: pp. 1–16; attribution in Classicism p. 21
notes: ''
aliases:
- Barcan Formula
variants:
- id: polyadic
  lean:
    ref: Classicism.P.Barcan.listSchemaIn
    equivalence_ref: Classicism.Map.barcan_r.polyadic
    status: verified
  name: Polyadic form
  statement: BF for relations with any finite number of arguments.
  formal: $\forall X^{\bar\sigma t}\, .\,(\forall\bar x^{\bar\sigma}\, .\,\Box X[\bar x])\to\Box(\forall\bar
    x^{\bar\sigma}\, .\,X[\bar x])$
  equivalence: The original form is the case of a one-element tuple. Conversely, apply BF one variable
    at a time from the innermost. From $\forall x_1\ldots x_n\, .\,\Box X[\bar x]$, BF at $\sigma_n$,
    applied to $\lambda x_n\, .\,X[x_1\ldots x_n]$, gives $\forall x_1\ldots x_{n-1}\, .\,\Box\forall
    x_n\, .\,X[\bar x]$; repeat $n$ times. For the empty tuple both sides are $\Box X$.
- id: dual
  lean:
    ref: Classicism.P.BarcanDual.schemaIn
    equivalence_ref: Classicism.Map.barcan_r.dual
    status: verified
  name: Dual form
  statement: If possibly something has a property, then something possibly has it.
  formal: $\forall X^{\sigma t}\, .\,\Diamond(\exists x^\sigma\, .\,Xx)\to\exists x^\sigma\, .\,\Diamond
    Xx$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back.
- id: dual-polyadic
  lean:
    ref: Classicism.P.BarcanDual.listSchemaIn
    equivalence_ref: Classicism.Map.barcan_r.dual_polyadic
    status: verified
  name: Dual polyadic form
  statement: If possibly some tuple stands in a relation, then some tuple possibly stands in it.
  formal: $\forall X^{\bar\sigma t}\, .\,\Diamond(\exists\bar x^{\bar\sigma}\, .\,X[\bar x])\to\exists\bar
    x^{\bar\sigma}\, .\,\Diamond X[\bar x]$
  equivalence: Instantiate either form at the negations of its propositional or relational variables,
    contrapose, and rewrite with $\Diamond=\neg\Box\neg$ and $q\le r\leftrightarrow\neg r\le\neg q$. This
    yields the other form, and the same steps lead back. Combined with the polyadic form, this gives the
    equivalence with the official form.
lean_def: Classicism.P.Barcan.schemaIn
