id: necessary-plenitude-r
name: □Plenitude
category: choice
statement: Every closed instance of Plenitude is necessary. Box the entire object-variable closure; retain
  the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Plenitude}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Plenitude. Type quantifiers and formula side conditions remain
  outside the box.
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecPlenitude.listSchemaIn
    equivalence_ref: Classicism.Map.necessary_plenitude_r.polyadic
    status: verified
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Plenitude is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Plenitude}$
  equivalence: Each instance of the polyadic form of Plenitude is derivable in C from finitely many instances
    of the original form, and conversely; the derivations are on the page of the unboxed principle. Necessitating
    them and applying K carries the equivalence to the boxed forms.
