id: necessary-weak-rigid-comprehension-r
name: □Weak Rigid Comprehension
category: comprehension
statement: Every closed instance of Weak Rigid Comprehension is necessary. Box the entire object-variable
  closure; retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Weak Rigid Comprehension}$
date: '2026-10-02'
sources:
