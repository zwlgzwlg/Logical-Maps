id: plenitude-r
name: Plenitude
category: choice
statement: Every total single-valued binary relation is represented by an operation. Its output type is
  relational, as required by the type system.
formal: $\forall U^{\sigma\tau t}\, .\,\operatorname{Functional}(U)\to\exists X^{\sigma\tau}\, .\,\forall
  y\, .\,(Uy)(Xy)\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–33.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.3, pp. 31–33
notes: ''
variants:
- id: polyadic
  lean:
    ref: Classicism.P.Plenitude.listSchemaIn
    equivalence_ref: Classicism.Map.plenitude_r.polyadic
    status: verified
  name: Polyadic form
  statement: Every total single-valued relation from tuples is represented by an operation of several
    arguments.
  formal: $\forall U^{\bar\sigma\tau t}\, .\,\operatorname{Functional}(U)\to\exists X^{\bar\sigma\tau}\,
    .\,\forall\bar y^{\bar\sigma}\, .\,(U[\bar y])(X[\bar y])\qquad(\tau\ne e)$
  equivalence: The original form is the case of a one-element tuple. Code tuples by their haecceities
    (Background, Polyadic forms). Given a functional $U$, put $U':=\lambda A\,y\, .\,(\exists\bar x\,
    .\,A=H_{\bar x}\land(U[\bar x])y)\lor(\neg\exists\bar x\, .\,A=H_{\bar x}\land y=\bot_\tau)$, which
    is functional by injectivity of coding; $\tau$ is relational, so $\bot_\tau$ exists. The original
    form at $\bar\sigma t$ gives $X'$ representing $U'$, and $X:=\lambda\bar y\, .\,X'(H_{\bar y})$ represents
    $U$.
lean_def: Classicism.P.Plenitude.schemaIn
