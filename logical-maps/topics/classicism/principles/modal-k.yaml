id: modal-k
name: K
category: base
statement: Necessity distributes over implication.
formal: $\forall p q\, .\,\Box(p\to q)\to(\Box p\to\Box q)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 16.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.5, p. 16
notes: ''
variants:
- id: dual
  name: Dual form
  statement: If a conditional is necessary, the possibility of its antecedent brings the possibility of
    its consequent.
  formal: $\forall p q\, .\,\Box(p\to q)\to(\Diamond p\to\Diamond q)$
  equivalence: Instantiate either form at $\neg q,\neg p$ and contrapose the inner conditional, using
    $\Box(\neg q\to\neg p)\leftrightarrow\Box(p\to q)$ and $\Diamond=\neg\Box\neg$. This yields the other
    form.
