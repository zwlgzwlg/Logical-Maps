id: necessity-of-arithmetic
name: Necessity of Arithmetic
category: schematic
statement: Every arithmetical sentence is either necessarily true or necessarily false, given that possibly
  zero is not a successor and successor is injective on numbers. One sentence for each arithmetical
  sentence.
formal: $\Box(I\to A)\lor\Box(I\to\neg A)\quad(A\text{ an arithmetical sentence})$
date: '2026-09-20'
sources:
- Zachary Goodsell, Arithmetic is Necessary, draft of 5 June 2024, eq. (1), p. 2; Definition 8 and Theorem 9,
  pp. 19–21.
source_names:
- Arithmetic is Necessary
references:
- paper: goodsell-arithmetic-necessary
  role: formulation
  locator: eq. (1), p. 2; Definition 8 and Theorem 9, pp. 19–21
  note: The source's necessity schema, with its parameters $\nu$, $0$ and successor taken to be $(et)t$,
    $\mathbf{0}_e$ and $\operatorname{Suc}_e$, so that its natural numbers are the finite cardinalities of
    individuals.
notes: >-
  See Background for $I$ and for arithmetical sentences. The antecedent $I$ is needed because the axioms of
  arithmetic are not theorems of C: with one individual the second numeral is the empty cardinality, so
  successor is not injective. In C the first conjunct of $I^*$ is a theorem, so $I$ amounts to the possible
  injectivity of $\operatorname{Suc}_e$ on finite cardinalities, which Possibility Maximalism (pure) grants. Each
  instance is a closed pure sentence, so the schema follows from No Pure Contingency; it follows in C from
  Countable Boolean Completeness, and it is incompatible with Possibility Maximalism (pure) by Gödel's first
  incompleteness theorem.
lean_def: (Classicism.Meta.AxiomSet.ofPure Classicism.Meta.AxiomSet.necessityOfArithmetic)
