id: strong-possibility-r
name: Strong Possibility (pure)
category: schematic
statement: Each closed pure sentence consistent with Maximalist Classicism is possible under the distinctness-preserving
  modality.
formal: $\Diamond_{\ne}P\quad(P\text{ closed and pure; }\operatorname{Max}(C)+P\text{ consistent})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 42.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.6, p. 42
notes: The paper leaves consistency open. The definition of Box_ne and its dual is given in Background.
  Whatever is consistent with Max(C) is already possible by Possibility Maximalism (pure), which this principle implies;
  what it adds is possibility under the distinctness-preserving modality. So incompatibilities of the
  form Strong Possibility + □Y are recorded at Possibility Maximalism (pure) and inherited, and the collapse is the
  one recorded principle refuted by the stronger modality alone.
