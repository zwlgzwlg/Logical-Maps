id: strong-actuality
name: Strong Actuality
category: lattice
statement: 'There is a true strong world proposition: a true proposition that necessarily entails every
  proposition or its negation.'
formal: $\exists p\, .\,p\land\Box\forall q\, .\,p\le q\lor p\le\neg q$
date: '2026-10-06'
sources:
- Cian Dorr, formulation and name, 6 October 2026.
source_names:
- Dorr 6 Oct
references:
- paper: bacon-2024-book
  role: background
  locator: §8.2, pp. 165–166
  note: Strong worlds; the principle says that some strong world at type $t$ is true, as Actuality says
    that some weak world (atom) is.
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 25
  note: Source of Actuality, which this strengthens.
notes: >-
  Equivalently $\exists w\, .\,w\land\operatorname{SWorld}_t(w)$, since a true proposition is possible.
  It stands to Actuality as the Strong Leibniz Biconditionals (type $t$) stand to Atomicity (type $t$):
  Actuality asks for a true proposition that settles every proposition, Strong Actuality for one that
  necessarily settles every proposition, including propositions that do not actually exist. In a full
  action model it holds at an object $W$ iff every arrow out of $W$ has at most one retraction.
