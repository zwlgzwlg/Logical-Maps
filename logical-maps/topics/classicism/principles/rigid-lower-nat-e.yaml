  role: background
  note: The mathematical forcing argument and finite-instance assumptions; Lean checkpoint 140 provides
    the certified conditional endpoint.
notes: Derived from [[bounded-ch-forcing-setup]] by [[bounded-ch-forcing-setup-implies-rigid-lower-nat-e]].
  It is not an extra premise of the strengthened CH arrow. It must not be identified with successor injectivity,
  actual infinity of individuals, or possible infinity of individuals.
