id: necessary-strong-leibniz-r
name: □Strong Leibniz Biconditionals
category: lattice
statement: Every closed instance of the Strong Leibniz Biconditionals is necessary. Box the entire object-variable
  closure; retain the type range.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Strong Leibniz Biconditionals}$
date: '2026-09-22'
sources:
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.2, pp. 166, 169–170.
source_names:
- Philosophical Introduction to HOL
references:
- paper: bacon-2024-book
  role: formulation
  locator: §8.2, pp. 166, 169–170
notes: The boxed form is the one Theorem 8.2 of the book connects with □BF and □Atomicity. Since strong
  worlds are only required to be possible, not necessarily possible, the unboxed form does not yield 5;
  Exercise 8.13 shows that requiring necessarily weak worlds does.
aliases:
- □SL
variants:
- id: dual
  lean:
    ref: Classicism.P.NecStrongLeibnizDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_strong_leibniz_r.dual
    status: verified
  name: Dual form
  statement: Every closed instance of the dual form of Strong Leibniz Biconditionals is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of Strong Leibniz
    Biconditionals}$
  equivalence: Each instance of the dual form of Strong Leibniz Biconditionals is derivable in C from
    finitely many instances of the official form, and conversely; the derivation is on the page of Strong
    Leibniz Biconditionals. Necessitating it and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecStrongLeibniz.schemaIn
