id: tractarianism-r
name: Tractarianism
category: coarse
statement: A proposition entailing every instance of a property entails its universal generalization.
formal: $\forall p^t X^{\sigma t}\, .\,(\forall x^\sigma\, .\,p\le Xx)\to p\le(\forall x^\sigma\, .\,Xx)$
