id: necessary-weakly-inextensible-comprehension-r
name: □Weakly Inextensible Comprehension
category: comprehension
statement: Every closed instance of Weakly Inextensible Comprehension is necessary. Box the entire object-variable
  closure; retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Weakly Inextensible Comprehension}$
date: '2026-09-27'
sources:
- Cian Dorr, suggestion of 27 September 2026.
source_names:
- Dorr 27 Sep
references:
- paper: dorr-bc-not-rc
  role: background
  locator: Proposition 1, p. 2; p. 12
  note: Source of weak inextensibility.
notes: >-
  Box each fully closed instance of Weakly Inextensible Comprehension. Type quantifiers and formula side
  conditions remain outside the box. This differs from Inextensible Comprehension, which asks for a
  single actual witness that is weakly inextensible at every world; here the witness may vary from
  world to world.
lean_def: Classicism.P.NecWeaklyInextensibleComprehension.schemaIn
