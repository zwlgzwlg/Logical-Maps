id: persistent-comprehension-r
name: Persistent Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a persistent one.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Persistent}(Y)\land(\forall\bar
  z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 38, p. 29.
