id: strong-leibniz-r
name: Strong Leibniz Biconditionals
category: lattice
statement: 'At each relational type, every possible entity (one distinct from bottom) is entailed by a
  strong world: a possible entity that necessarily entails every entity of the type or its negation. The
  right-to-left direction is a theorem of C; the principle records the substantive direction.'
formal: $\forall X^\sigma\, .\,\Diamond_\sigma X\to\exists W^\sigma\, .\,\operatorname{SWorld}_\sigma(W)\land
  W\le_\sigma X\qquad(\sigma\ne e)$
date: '2026-09-22'
sources:
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.2, pp. 164–166.
source_names:
- Philosophical Introduction to HOL
references:
- paper: bacon-2024-book
  role: formulation
  locator: §8.2, pp. 164–166
notes: Bacon’s higher-order rendering of the possible-worlds thesis that a proposition is possible iff
  true at some world, with worlds required to settle merely possible propositions too. Definitions in
  Background. The book presents the connection between the Strong Leibniz Biconditionals and BF at relational
  types as new to it (§8.4, p. 177).
aliases:
- SL
