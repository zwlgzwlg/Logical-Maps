notes: Over C this is equivalent to FTN together with the schema $\Diamond\exists\mathcal A\,\operatorname{Arith}^{\tau}_0(\mathcal
  A)\to\Box\mathsf5$. Consequently, under possible Peano realization at some type, it is equivalent to
  FTN plus C5. Without that activation it need not imply C5. It strictly strengthens FTN and does not
  imply modal collapse. See [the finite-type guide](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/writeups/finite-type-non-contingency-guide.md).
