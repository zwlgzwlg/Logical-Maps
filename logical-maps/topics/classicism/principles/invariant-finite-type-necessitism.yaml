id: invariant-finite-type-necessitism
name: Invariant Finite-Type Necessitism
category: mathematical-contingency
statement: The variant of Finite-Type Necessitism obtained by requiring invariance and inextensibility,
  rather than persistence and inextensibility, throughout the witnesses and represented powers.
formal: $\mathrm{FTN}^{\diamond}:=\mathrm{FTN}\text{ with }\operatorname{Rigid}^{\diamond}\text{ substituted
  throughout}$
definitions: $\operatorname{Invariant}(X):=\Box\forall x(\Diamond Xx\to\Box Xx)$ and $\operatorname{Rigid}^{\diamond}(X):=\operatorname{Invariant}(X)\land\operatorname{Inextensible}(X)$.
  Substitute this predicate in rigid structure, represented powers and $\mathsf P(X)$. All other definitions
  and the possibility antecedent are unchanged.
date: '2026-10-30'
sources:
- 'Daniel Kodsi, with assistance from GPT-6 Astra (OpenAI), Finite-Type Necessitism: Arithmetic, analysis,
  and mathematical non-contingency, 30 October 2026, 12-page revision including Appendix A. Appendix A,
  Theorem A.1'
