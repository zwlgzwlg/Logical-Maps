notes: $F_2$ is independent of every other exact height jointly. The $j=2$ model satisfies $F_0\land F_1$,
  and hence the seven existing mathematical non-contingency principles, but fails $F_2$. See [the finite-type
  guide](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/writeups/finite-type-non-contingency-guide.md).
