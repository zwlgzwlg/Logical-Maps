id: necessary-transversal-choice-r
name: □Transversal Choice
category: choice
statement: Every closed instance of Transversal Choice is necessary. Box the entire object-variable
  closure; retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Transversal Choice}$
date: '2026-09-26'
sources:
- Christopher Sun, 26 September 2026, in connection with Transversal.
source_names:
- Sun 26 Sep
references: []
notes: >-
  Box each fully closed instance of Transversal Choice. Type quantifiers remain outside the box. Unlike
  Transversal Choice itself, this makes the transversal condition hold at every accessible world, for
  every relation that is an equivalence relation there.
