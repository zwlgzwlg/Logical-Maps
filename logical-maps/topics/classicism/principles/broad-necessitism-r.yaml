id: broad-necessitism-r
name: Broad Necessitism
category: base
statement: Every entity of an type is necessarily identical to something.
formal: $\forall x^\sigma\, .\,\Box(\exists y^\sigma\, .\,y=x)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 19.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.5, p. 19
notes: ''
variants:
- id: polyadic
  lean:
    ref: Classicism.P.BroadNecessitism.listSchemaIn
    equivalence_ref: Classicism.Map.broad_necessitism_r.polyadic
    status: verified
  name: Polyadic form
  statement: Every tuple of entities is necessarily identical to some tuple.
  formal: $\forall\bar x^{\bar\sigma}\, .\,\Box(\exists\bar y^{\bar\sigma}\, .\,\bar y=\bar x)$
  equivalence: Both forms are theorems of C, so they are equivalent there. Take $\bar y:=\bar x$ coordinatewise.
lean_def: Classicism.P.BroadNecessitism.schemaIn
