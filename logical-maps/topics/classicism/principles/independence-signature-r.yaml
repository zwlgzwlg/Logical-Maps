id: independence-signature-r
name: Independence (signature Σ)
category: signature
statement: 'No constant of Sigma is a pure operation applied to other constants: for a closed pure term
  A and distinct constants c, d_1,…,d_n with n ≥ 0, c differs from A applied to the d’s. With n = 0, no
  constant denotes a pure entity.'
formal: $c\ne A\,d_1\cdots d_n\quad(A\text{ closed and pure};\ c,d_1,\ldots,d_n\text{ distinct constants};\
  n\ge0)$
date: '2026-09-22'
sources:
- Andrew Bacon, Logical Combinatorialism, Philosophical Review 129 (2020), §4, p. 568 and n. 53.
source_names:
- Logical Combinatorialism
references:
- paper: bacon-2020
  role: formulation
  locator: §4, p. 568 and n. 53
notes: Bacon’s independence of the fundamental, read for the constants of a fundamental language; his
  n. 53 derives it from Logical Necessity. The constant c has a relational type, since the applied term
  does.
lean_def: (Classicism.Meta.AxiomSet.independence _)
