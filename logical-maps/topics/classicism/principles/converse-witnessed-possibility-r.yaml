id: converse-witnessed-possibility-r
name: Converse Witnessed Possibility
category: signature
statement: The converse of Witnessed Possibility, with precisely the same formula, type and constant side
  conditions.
formal: $\Diamond P[\bar c/\bar x]\to(\exists\bar x\, .\,P)\quad(P\text{ pure, free variables among }\bar
  x;\ \bar c\text{ distinct constants of }\Sigma)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, n. 57, p. 38.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, n. 57, p. 38
notes: ''
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Displayed the schema’s side conditions inside the math block, at Cian Dorr’s request; the statement
    is unchanged.
variants:
- id: dual
  name: Dual form
  statement: If a pure formula holds of everything, it is necessary of any distinct constants.
  formal: $(\forall\bar x\, .\,P)\to\Box P[\bar c/\bar x]\quad(P\text{ pure, free variables among }\bar
    x;\ \bar c\text{ distinct constants of }\Sigma)$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
lean_def: (Classicism.Meta.AxiomSet.converseWitnessedPossibility _)
