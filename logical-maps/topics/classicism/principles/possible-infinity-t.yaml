id: possible-infinity-t
name: Possible Infinity (type t)
category: infinity
statement: >-
  Possibly there are not finitely many propositions: the Axiom of Infinity at this type, under a diamond.
formal: $\Diamond\neg\exists Z^{(t t)t}\, .\,\operatorname{FiniteCardinality}_t(Z)\land Z(\lambda u^t\, .\,\top)$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
source_names:
- Dorr 20 Sep
notes: >-
  Weaker than the Axiom of Infinity at this type by T. Since the Axiom of Infinity at type $t$ is
  consistent with C, Possibility Maximalism (pure) implies this principle, and indeed the Axiom itself by a longer
  route. With No Pure Contingency, or with BF (type $t$), this principle gives the Axiom back; whether it
  does so in C alone is recorded as an open question. See Background for $\mathbf{0}$,
  $\operatorname{Suc}$ and $\operatorname{FiniteCardinality}$.
lean_def: Classicism.P.PossibleInfinityT.schemaIn
