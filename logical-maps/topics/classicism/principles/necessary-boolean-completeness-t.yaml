id: necessary-boolean-completeness-t
name: □Boolean Completeness (type t)
category: lattice
statement: Every closed instance of Boolean Completeness (type t) is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Boolean Completeness (type t)}$
date: '2026-10-02'
sources:
- Cian Dorr, suggestion of 2 October 2026.
source_names:
- Dorr 2 Oct
references: []
notes: Box each fully closed instance of Boolean Completeness (type t). Type quantifiers and formula side conditions remain
  outside the box.
variants:
- id: lub
  name: Least-upper-bound form
  statement: Every closed instance of the least-upper-bound form of Boolean Completeness (type t) is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the least-upper-bound form of Boolean
    Completeness (type t)}$
  equivalence: Each instance of the least-upper-bound form of Boolean Completeness (type t) is derivable
    in C from finitely many instances of the official form, and conversely; the derivation is on the page
    of Boolean Completeness (type t). Necessitating it and applying K carries the equivalence to the boxed
    forms.
lean_def: Classicism.P.NecBooleanCompletenessT.schemaIn
