id: necessary-distinctness-necessary-t
name: □ND (type t)
category: coarse
statement: "Necessarily, ND (type t) holds, in the displayed closed propositional formulation."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of ND (type t)}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of ND (type t). Type quantifiers and formula side conditions remain
  outside the box.
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
variants:
- id: dual
  lean:
    ref: Classicism.P.NecNecessityOfDistinctnessTDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_distinctness_necessary_t.dual
    status: verified
  name: Dual form
  statement: Every closed instance of the dual form of ND (type t) is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of ND (type t)}$
  equivalence: Each instance of the dual form of ND (type t) is derivable in C from finitely many instances
    of the official form, and conversely; the derivation is on the page of ND (type t). Necessitating
    it and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecNecessityOfDistinctnessT.schemaIn
