id: necessary-gallin-extensional-comprehension-r
name: □Gallin Extensional Comprehension
category: comprehension
statement: Every closed instance of Gallin Extensional Comprehension is necessary. Box the entire object-variable
  closure; retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Gallin Extensional Comprehension}$
date: '2026-09-20'
sources:
- Cian Dorr, suggestion of 20 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 37, p. 28 (the unboxed principle).
source_names:
- Dorr 20 Sep
- Classicism
notes: Box each fully closed instance of Gallin Extensional Comprehension. Type quantifiers and formula side
  conditions remain outside the box. Recorded to match the boxed forms of the other comprehension principles.
lean_def: Classicism.P.NecGallinExtensionalComprehension.schemaIn
