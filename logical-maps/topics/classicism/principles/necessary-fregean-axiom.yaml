id: necessary-fregean-axiom
name: □Fregean Axiom
category: extensionality
statement: "Necessarily, materially equivalent propositions are identical."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Fregean Axiom}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Fregean Axiom. Type quantifiers and formula side conditions remain
  outside the box.
lean_def: Classicism.P.NecFregeanAxiom.schemaIn
changes:
- date: '2026-10-03'
  by: Claude Opus 5.5 (Anthropic)
  summary: Restated the statement as the necessitation of the base principle's statement, in place of
    a generic description of necessitation; the formal statement is unchanged.
