id: necessary-extensionality-r
name: □Extensionality
category: extensionality
statement: "Necessarily, at each relational type, coextensive relations are identical, including in the nullary propositional case."
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Extensionality}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Extensionality. Type quantifiers and formula side conditions
  remain outside the box.
lean_def: Classicism.P.NecExtensionality.schemaIn
