id: distinctness-preserving-collapse
name: Distinctness-preserving collapse
category: schematic
statement: Every truth is necessary under the distinctness-preserving modality.
formal: $\forall p\, .\,p\to\Box_{\ne}p$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, Appendix E, p. 83.
source_names:
- Classicism
