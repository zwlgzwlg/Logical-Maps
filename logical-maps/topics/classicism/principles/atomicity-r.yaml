notes: ''
aliases:
- Weak Leibniz Biconditionals (Bacon 2024)
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added the alias Weak Leibniz Biconditionals and a reference to Bacon’s 2024 book; the statement
