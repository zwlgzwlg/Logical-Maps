id: atomicity-r
name: Atomicity
category: lattice
statement: Every non-bottom entity of each relational type has an atom below it.
formal: $\forall x^\tau\, .\,x\le_\tau\neg_\tau x\lor\exists y^\tau\, .\,\operatorname{Atom}_\tau(y)\land
  y\le_\tau x\qquad(\tau\ne e)$
definitions: |-
  where $\operatorname{Atom}_\tau(y):=\forall z^\tau\, .\,(z\le_\tau y\land z\ne y)\leftrightarrow z\le_\tau\neg_\tau z$:
  the entities strictly below $y$ are exactly the bottom elements of $\tau$. In particular an atom is
  not itself bottom. Here $x\le_\tau\neg_\tau x$ says that $x$ is bottom.
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.2, p. 24
- paper: bacon-2024-book
  role: related
  locator: §8.2, p. 166
  note: Bacon states the same principle as the Weak Leibniz Biconditionals, with weak worlds in place
