id: no-pure-contingency-r
name: No Pure Contingency
category: schematic
statement: Each closed sentence of the pure language, if true, is necessary. This is a sentence schema,
  not a quantifier over propositions.
formal: $P\to\Box P\quad(P\text{ a closed pure }\text{sentence})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 27.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.2, p. 27
- paper: goodsell-yli-vakkuri-unpublished
  role: origin
  locator: Logical Foundations of Philosophy; cited in Classicism p. 27
- paper: bacon-2020
  role: related
  locator: §2, pp. 546–547
  note: The empty-tuple instance of Logical Necessity.
notes: ''
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added a reference to Logical Combinatorialism; the statement is unchanged.
variants:
- id: dual
  name: Dual form
  statement: Each closed pure sentence, if possible, is true.
  formal: $\Diamond P\to P\quad(P\text{ a closed pure sentence})$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
lean_def: (Classicism.Meta.AxiomSet.pureVersion Classicism.Meta.AxiomSet.noContingency)
