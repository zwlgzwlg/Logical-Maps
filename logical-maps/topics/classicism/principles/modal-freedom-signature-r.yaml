id: modal-freedom-signature-r
name: Modal Freedom (signature Σ)
category: signature
statement: For pure formulas P and Q with free variables among the disjoint tuples x and y, and distinct
  constants c and d of matching types, if P is possible at c and Q is possible at d then P and Q are jointly
  possible there.
formal: $\Diamond P[\bar c/\bar x]\land\Diamond Q[\bar d/\bar y]\to\Diamond(P[\bar c/\bar x]\land Q[\bar
  d/\bar y])\quad(P,Q\text{ pure, free variables among }\bar x\text{ resp. }\bar y;\ \bar c\bar d\text{
  distinct constants of }\Sigma)$
date: '2026-09-22'
sources:
- Andrew Bacon, Logical Combinatorialism, Philosophical Review 129 (2020), §3, pp. 556–557, principle
  (5) and its generalization.
source_names:
- Logical Combinatorialism
references:
- paper: bacon-2020
  role: formulation
  locator: §3, pp. 556–557, principle (5) and its generalization
notes: Bacon’s formalization of Schaffer’s Modal Freedom, stated for two distinct constants R and S of
  a fundamental language. The instance with no constants is equivalent to No Pure Contingency.
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Displayed the schema’s side conditions inside the math block, at Cian Dorr’s request; the statement
    is unchanged.
variants:
- id: dual
  name: Dual form
  statement: If a disjunction of pure formulas about disjoint constants is necessary, one of the disjuncts
    is necessary.
  formal: $\Box(P[\bar c/\bar x]\lor Q[\bar d/\bar y])\to\Box P[\bar c/\bar x]\lor\Box Q[\bar d/\bar y]\quad(P,Q\text{
    pure, free variables among }\bar x\text{ resp. }\bar y;\ \bar c\bar d\text{ distinct constants of
    }\Sigma)$
  equivalence: The instance of either form at $\neg P,\neg Q$ is, after contraposition and $\Diamond=\neg\Box\neg$,
    the instance of the other at $P,Q$.
lean_def: (Classicism.Meta.AxiomSet.modalFreedom _)
