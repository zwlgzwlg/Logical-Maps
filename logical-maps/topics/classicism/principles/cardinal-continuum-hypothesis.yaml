id: cardinal-continuum-hypothesis
name: Cardinal Continuum Hypothesis
category: mathematical-contingency
statement: Every subcarrier of the rigid power of the natural-number carrier either injects into that
  number carrier or is equinumerous with its entire rigid power.
formal: $C_N:=\forall X^{(\nu t)t}\, .\,X\subseteq S\to(X\precsim N\lor X\approx S)$
definitions: Here $\nu=(et)t$, $N$ is the least successor-closed property containing $z:=\lambda A^{et}.\top$,
  and $S:=\lambda U^{\nu t}.\operatorname{Rigid}(U)\land U\subseteq N$. This is the formalization's LowerNat
  and RigidPower, using at-least cardinalities. It is not definitionally the exact-cardinality carrier
  used elsewhere in the map. Inclusion, injections and bijections are evaluated currently, and maps are
  represented by relations. See Background for the full definition of N. No real-number structure is part
  of this definition.
date: '2026-10-27'
sources:
- Andrew Bacon, CH contingency formalization and repository proposal, 27 October 2026, with OpenAI Codex;
  checkpoint 140, natural_CH_contingency_closedBounds.
source_names:
- Bacon / Codex CH project
references:
- paper: bacon-ch-general-forcing
  role: formulation
  note: The inaccessible-bound version and carrier conventions used in the accompanying formalization.
notes: This node asserts $C_N$, not its necessity or non-contingency. The modal principle is [[non-contingency-of-cardinal-ch]].
  The formalization also proves contingency of $S\approx H(N)$, with H(N) the Hartogs carrier of order
  types of well-orders on subcarriers of N. Their equivalence needs the appropriate well-ordering and
  cardinal-comparison assumptions; it is not asserted as a theorem of bare C.
