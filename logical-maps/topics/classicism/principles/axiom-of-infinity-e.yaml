id: axiom-of-infinity-e
name: Axiom of Infinity (type e)
category: infinity
statement: >-
  There are not finitely many individuals. No finite cardinality holds of the universal property, so the
  domain of the type cannot be exhausted by finitely many steps from the empty property.
formal: $\neg\exists Z^{(e t)t}\, .\,\operatorname{FiniteCardinality}_e(Z)\land Z(\lambda u^e\, .\,\top)$
date: '2026-09-19'
sources:
- Cian Dorr, suggestion of 19 September 2026.
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, n. 47, p. 32.
source_names:
- Dorr 19 Sep
- Classicism
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, n. 47, p. 32
  note: The draft's informal infinity claim, which the map had recorded only in its schematic form.
notes: >-
  See Background for $\mathbf{0}$, $\operatorname{Suc}$ and $\operatorname{FiniteCardinality}$. The quantified form
  is what is normally meant by an axiom of infinity. It implies the schema of the same name, and the
  converse fails by a compactness argument, so the two are kept as separate principles.
  Possible Infinity (type e), this axiom under a diamond, is recorded as a separate principle.
