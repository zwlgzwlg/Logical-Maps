id: possibility-plus-r
name: Possibility+ (pure)
category: schematic
statement: The strengthened Possibility Maximalism schema for pure C-consistent formulas whose only free variables
  are the displayed individual variables; include the empty tuple.
formal: $\forall x_1^e\cdots x_n^e\, .\,(\bigwedge_{i<j}x_i\ne x_j)\to\Diamond P\quad(P\text{ pure, free
  variables among }x_1\ldots x_n;\ C+P\text{ consistent};\ n\ge0)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.6, p. 41 and n. 60; Appendix E, p.
  83.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.6, p. 41 and n. 60; Appendix E, p. 83
notes: The consistency and purity restrictions are inherited from Possibility Maximalism, which the surrounding text
  says this strengthens; the shortened display on p. 41 must not be read as admitting contradictory P.
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Displayed the schema’s side conditions inside the math block, at Cian Dorr’s request; the statement
    is unchanged. Renamed from “Possibility+” to mark it as the pure-language version, now that Possibility+
    (signature Σ) is recorded; id and connections unchanged.
variants:
- id: dual
  name: Dual form
  statement: If a pure formula is necessary of some individuals and its negation is consistent with C,
    two of those individuals are identical.
  formal: $\forall x_1^e\cdots x_n^e\, .\,\Box P\to\bigvee_{i<j}x_i=x_j\quad(P\text{ pure, free variables
    among }x_1\ldots x_n;\ C+\neg P\text{ consistent};\ n\ge0)$
  equivalence: The instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$,
    the instance of the other at $P$; $\neg P$ is pure with the same free variables. For $n=0$ the disjunction
    is $\bot$.
