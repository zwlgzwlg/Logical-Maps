id: necessary-intensional-choice-r
name: □Intensional Choice
category: choice
statement: Every closed instance of Intensional Choice is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Intensional Choice}$
date: '2026-10-03'
sources:
- Cian Dorr, suggestion of 3 October 2026.
source_names:
- Dorr 3 Oct
references:
- paper: bacon-mathematical-contingency
  role: background
  locator: §6, p. 27
  note: Formulation of the unboxed principle.
notes: Box each fully closed instance of Intensional Choice. Type quantifiers remain outside the box.
variants:
- id: polyadic
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Intensional Choice is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Intensional
    Choice}$
  equivalence: Each instance of the polyadic form of Intensional Choice is derivable in C from finitely
    many instances of the original form, and conversely; the derivations are on the page of the unboxed
    principle. Necessitating them and applying K carries the equivalence to the boxed forms.
