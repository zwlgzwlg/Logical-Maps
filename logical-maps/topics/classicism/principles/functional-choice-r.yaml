id: functional-choice-r
name: Functional Choice
category: choice
statement: Every serial binary relation admits a selecting operation. Its output type is relational, as
  required by the type system.
formal: $\forall U^{\sigma\tau t}\, .\,\operatorname{Serial}(U)\to\exists X^{\sigma\tau}\, .\,\forall
  y\, .\,(Uy)(Xy)\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.3, pp. 31–33.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.3, pp. 31–33
notes: ''
variants:
- id: polyadic
  name: Polyadic form
  statement: Every serial relation from tuples admits a selecting operation of several arguments.
  formal: $\forall U^{\bar\sigma\tau t}\, .\,\operatorname{Serial}(U)\to\exists X^{\bar\sigma\tau}\, .\,\forall\bar
    y^{\bar\sigma}\, .\,(U[\bar y])(X[\bar y])\qquad(\tau\ne e)$
  equivalence: The original form is the case of a one-element tuple. Code tuples by their haecceities
    (Background, Polyadic forms). Given a serial $U$, put $U':=\lambda A\,y\, .\,(\exists\bar x\, .\,A=H_{\bar
    x}\land(U[\bar x])y)\lor\neg\exists\bar x\, .\,A=H_{\bar x}$, of type $(\bar\sigma t)\tau t$, which
    is serial. The original form gives $X'$ selecting from $U'$, and $X:=\lambda\bar y\, .\,X'(H_{\bar
    y})$ selects from $U$.
