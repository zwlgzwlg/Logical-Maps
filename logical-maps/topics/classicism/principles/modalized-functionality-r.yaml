id: modalized-functionality-r
name: Modalized Functionality
category: base
statement: Necessarily co-functional operations of function types are identical.
formal: $\forall X Y^{\sigma\tau}\, .\,\Box(\forall z^\sigma\, .\,Xz=Yz)\to X=Y\qquad(\tau\ne e)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.5, p. 18 and n. 22.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.5, p. 18 and n. 22
notes: ''
variants:
- id: polyadic
  name: Polyadic form
  statement: Necessarily co-functional operations of several arguments are identical.
  formal: $\forall X Y^{\bar\sigma\tau}\, .\,\Box(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]=Y[\bar z])\to
    X=Y\qquad(\tau\ne e)$
  equivalence: Both forms are theorems of C, so they are equivalent there. The polyadic form also follows
    from the original one argument at a time, as for Functionality, with the box carried through.
