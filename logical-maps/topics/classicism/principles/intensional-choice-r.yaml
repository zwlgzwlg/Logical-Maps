id: intensional-choice-r
name: Intensional Choice
category: choice
statement: If a property is necessarily instantiated, then some property entailing it is necessarily
  uniquely instantiated.
formal: $\forall F^{\sigma t}\, .\,\Box(\exists x^\sigma\, .\,Fx)\to\exists G^{\sigma t}\, .\,G\le F\land\Box\exists
  x^\sigma\, .\,(Gx\land\forall y^\sigma\, .\,Gy\to y=x)$
date: '2026-10-03'
sources:
- Andrew Bacon, Could the truths of mathematics have been different?, draft of 9 October 2025, §6, p. 27.
source_names:
- Could mathematics have been different?
references:
- paper: bacon-mathematical-contingency
  role: formulation
  locator: §6, p. 27
  note: Introduced as a modal version of choice, used with □Rigid Comprehension and Mathematical Possibilism
    for the contingency of CH (Theorem 6.1).
notes: >-
  The source motivates it as a modalized generalization of interworld choice, which selects at each world
  one instance of a property instantiated at every world; the modal formulation needs no world propositions.
  The type $\sigma$ may be $e$. The selected property is unboxed: it exists at the evaluation point, but
  its unique instance may vary from world to world.
