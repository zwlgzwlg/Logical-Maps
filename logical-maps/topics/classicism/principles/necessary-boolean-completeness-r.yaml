id: necessary-boolean-completeness-r
name: □Boolean Completeness
category: lattice
statement: Every closed instance of Boolean Completeness is necessary. Box the entire object-variable
  closure; retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Boolean Completeness}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of Boolean Completeness. Type quantifiers and formula side conditions
  remain outside the box.
variants:
- id: lub
  name: Least-upper-bound form
  statement: Every closed instance of the least-upper-bound form of Boolean Completeness is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the least-upper-bound form of Boolean
    Completeness}$
  equivalence: Each instance of the least-upper-bound form of Boolean Completeness is derivable in C from
    finitely many instances of the official form, and conversely; the derivation is on the page of Boolean
    Completeness. Necessitating it and applying K carries the equivalence to the boxed forms.
