id: necessary-transversal-r
name: □Transversal
category: choice
statement: Every closed instance of Transversal is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Transversal}$
date: '2026-09-26'
sources:
- Christopher Sun, 26 September 2026.
source_names:
- Sun 26 Sep
references: []
notes: Box each fully closed instance of Transversal. Type quantifiers remain outside the box.
variants:
- id: polyadic
  lean:
    ref: Classicism.P.NecTransversal.listSchemaIn
    status: stated
  name: Polyadic form
  statement: Every closed instance of the polyadic form of Transversal is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the polyadic form of Transversal}$
  equivalence: Each instance of the polyadic form of Transversal is derivable in C from finitely many
    instances of the original form, and conversely; the derivations are on the page of the unboxed principle.
    Necessitating them and applying K carries the equivalence to the boxed forms.
