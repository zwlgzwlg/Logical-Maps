id: very-weak-rigid-comprehension-r
name: Very Weak Rigid Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a very weakly rigid one, that
  is, with one that is weakly persistent and weakly inextensible.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{VeryWeaklyRigid}(Y)\land(\forall\bar
  z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-19'
sources:
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, p. 12.
- Cian Dorr, suggestion of 19 September 2026.
source_names:
- BC does not imply RC
- Dorr 19 Sep
references:
- paper: dorr-bc-not-rc
  role: formulation
  locator: p. 12
  note: The draft's unqualified "weakly rigid" is this map's very weakly rigid, the whole matrix of Rigid
    shorn of its leading box.
notes: >-
  Very weak rigidity drops the leading box from both conjuncts of Rigid. See Background for the definitions.
  This is equivalent to Weak Rigid Comprehension, although very weak rigidity is strictly weaker than weak
  rigidity as a condition on a given relation.
