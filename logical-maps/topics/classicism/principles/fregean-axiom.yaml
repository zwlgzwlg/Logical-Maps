id: fregean-axiom
name: Fregean Axiom
category: extensionality
statement: Materially equivalent propositions are identical.
formal: $\forall p q\, .\,(p\leftrightarrow q)\to p=q$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.4, pp. 15–16.
