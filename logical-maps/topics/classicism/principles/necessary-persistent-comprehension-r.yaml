id: necessary-persistent-comprehension-r
name: □Persistent Comprehension
category: comprehension
statement: Every closed instance of Persistent Comprehension is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Persistent Comprehension}$
