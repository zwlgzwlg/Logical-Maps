id: strong-leibniz-t
name: Strong Leibniz Biconditionals (type t)
category: instances
statement: 'The type-t instance of the Strong Leibniz Biconditionals: every possible proposition is entailed
  by a strong world proposition, one that is possible and necessarily entails every proposition or its
  negation.'
formal: $\forall p\, .\,\Diamond p\to\exists w\, .\,\operatorname{SWorld}_t(w)\land w\le p$
date: '2026-09-22'
sources:
- Andrew Bacon, A Philosophical Introduction to Higher-Order Logics, Routledge, 2024, §8.2, pp. 164–165.
source_names:
- Philosophical Introduction to HOL
references:
- paper: bacon-2024-book
  role: formulation
  locator: §8.2, pp. 164–165
- paper: bacon-dorr-classicism
  role: background
  locator: Definition 3.19 and satisfaction clauses, pp. 55–57; idempotent model, p. 59
  note: Semantics used to correct the supplementary singleton claim on 25 September 2026; the defining
    SL formula is unchanged.
notes: 'Broken out as its own principle, like Atomicity (type t), at Cian Dorr’s request, because the
  type-t case can be settled in many models where the higher types have not been checked. A singleton
  need not be a strong world in a one-object action model.

  At an arrow h its shift is the precomposition fibre, but a proposition newly quantified

  inside the box ranges over the entire target domain, not just shifted root propositions.

  For the full monoid {1,k} with k²=k≠1, the singleton {k} shifts under k to {1,k},

  which the target proposition {k} splits. Group actions do send singletons to singletons.

  Correction found by the DeepSeek deepseek-flash trawl and informally checked against

  Classicism pp. 55–57 by OpenAI Codex (GPT-6), 25 September 2026; see the handwritten

  strong-worlds-one-object-action-models proof and the full-idempotent-monoid change history.'
aliases:
- SL (type t)
variants:
- id: dual
  name: Dual form
  statement: Whatever is entailed by every strong world is necessary.
  formal: $\forall p\, .\,(\forall w\, .\,\operatorname{SWorld}_t(w)\to w\le p)\to\Box p$
  equivalence: The argument for the dual form of the Strong Leibniz Biconditionals, at type $t$.
