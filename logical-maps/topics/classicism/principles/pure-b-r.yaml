id: pure-b-r
name: B for pure sentences
category: schematic
statement: The B instance for every closed sentence in the pure language.
formal: $P\to\Box\Diamond P\quad(P\text{ a closed pure }\text{sentence})$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §3.5, n. 81, p. 59.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §3.5, n. 81, p. 59
notes: ''
variants:
- id: dual
  name: Dual form
  statement: Each closed pure sentence that is possibly necessary is true.
  formal: $\Diamond\Box P\to P\quad(P\text{ a closed pure sentence})$
  equivalence: Pure sentences (resp. sentences of $\mathcal L(\Sigma)$) are closed under negation, so
    the instance of either form at $\neg P$ is, after contraposition and $\Diamond=\neg\Box\neg$, the
    instance of the other at $P$.
