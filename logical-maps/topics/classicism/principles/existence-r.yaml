id: existence-r
name: Existence
category: base
statement: Every type is inhabited.
formal: $\exists x^\sigma\, .\,x=x$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §1.1, p. 7.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §1.1, p. 7
notes: ''
variants:
- id: polyadic
  name: Polyadic form
  statement: Every finite tuple of types is jointly inhabited.
  formal: $\exists\bar x^{\bar\sigma}\, .\,\bar x=\bar x$
  equivalence: Both forms are theorems of C, so they are equivalent there. The polyadic form is the conjunction
    of the original at each $\sigma_i$; for the empty tuple it is $\top$.
