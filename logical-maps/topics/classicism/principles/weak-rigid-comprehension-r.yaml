id: weak-rigid-comprehension-r
name: Weak Rigid Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a weakly rigid one, that is, with
  one that is weakly persistent and weakly inextensible.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{WeaklyRigid}(Y)\land(\forall\bar
  z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-19'
sources:
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, Proposition
  1, p. 2; p. 12.
- Cian Dorr, suggestion of 19 September 2026.
source_names:
- BC does not imply RC
- Dorr 19 Sep
references:
- paper: dorr-bc-not-rc
  role: formulation
  locator: Proposition 1, p. 2; p. 12
  note: The draft's unqualified "weakly rigid" is this map's, the whole matrix of Rigid shorn of its
    leading boxes.
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, pp. 28–30
  note: Source of Rigid Comprehension, of which this is the un-necessitated weakening.
notes: >-
  Weak rigidity drops the leading boxes from both conjuncts of Rigid. A weakly rigid relation is
  nevertheless persistent, so the principle is equivalent to its persistent form. See Background for
  the definitions. The draft that introduces the principle is a work in progress. Until 8 October 2026
  the map's "weakly rigid" meant persistent and weakly inextensible, the persistent form below was this
  principle's official statement, and the present statement was a separate principle, Very Weak Rigid
  Comprehension, retired then at Cian Dorr's direction.
variants:
- id: persistent
  lean:
    ref: Classicism.P.WeakRigidComprehensionPersistent.schemaIn
    equivalence_ref: Classicism.Map.weak_rigid_comprehension_r.persistent
    status: verified
  name: Persistent form
  statement: Every relation, including a proposition, is coextensive with one that is persistent and
    weakly inextensible.
  formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{Persistent}(Y)\land
    \operatorname{WeaklyInextensible}(Y)\land(\forall\bar z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow
    Y[\bar z])$
  equivalence: >-
    Persistence implies weak persistence by T, so the persistent form implies the official one. The
    interesting direction: a weakly rigid $Y$ is persistent. Apply its weak inextensibility to
    $X:=\lambda\bar x\, .\,\Box Y[\bar x]$. The hypothesis $\forall\bar x\, .\,Y[\bar x]\to\Box
    X[\bar x]$, that is $Y[\bar x]\to\Box\Box Y[\bar x]$, holds by weak persistence and 4; so
    $Y\le\lambda\bar x\, .\,\Box Y[\bar x]$, which is $\operatorname{Persistent}(Y)$. The same $Y$
    therefore witnesses both forms.
