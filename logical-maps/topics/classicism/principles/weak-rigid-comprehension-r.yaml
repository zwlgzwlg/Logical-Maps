id: weak-rigid-comprehension-r
name: Weak Rigid Comprehension
category: comprehension
statement: Every relation, including a proposition, is coextensive with a weakly rigid one, that is, with
  one that is persistent and weakly inextensible.
formal: $\forall X^{\bar\sigma t}\, .\,\exists Y^{\bar\sigma t}\, .\,\operatorname{WeaklyRigid}(Y)\land(\forall\bar
  z^{\bar\sigma}\, .\,X[\bar z]\leftrightarrow Y[\bar z])$
date: '2026-09-19'
sources:
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, Proposition
  1, p. 2; p. 12.
source_names:
- BC does not imply RC
references:
- paper: dorr-bc-not-rc
  role: formulation
  locator: Proposition 1, p. 2; p. 12
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, pp. 28–30
  note: Source of Rigid Comprehension, of which this is the un-necessitated weakening.
notes: >-
  Weak rigidity drops the leading box from the inextensibility conjunct of Rigid but keeps persistence
  in its necessitated form. See Background for the definitions. The draft that introduces the principle
  is a work in progress.
