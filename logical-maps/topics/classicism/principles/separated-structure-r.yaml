id: separated-structure-r
name: Separated Structure
category: signature
statement: For each typed nonlogical constant c and closed same-typed terms F,G not containing c, equality
  after application to c implies equality of F and G.
formal: $Fc=Gc\to F=G\quad(c\text{ a constant of }\Sigma;\ F,G\text{ closed, not containing }c)$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.5, pp. 38–39.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.5, pp. 38–39
- paper: bacon-2020
  role: origin
  locator: §4, cited in Classicism p. 38
- paper: bacon-2020
  role: origin
  locator: §4, pp. 561–562 and n. 40
  note: Derived from Quantified Separated Structure and the assumptions Purity and Fundamentality; General
    Separated Structure on p. 565.
notes: >-
  Until 8 October 2026 the general form below was a separate principle, General Separated Structure,
  equivalent in C by two recorded results; it became a form of this principle at Cian Dorr's direction.
  Bacon's instances of it: Rab = Sba implies R and S are converses; Rab = Fb implies R forgets its first
  argument; Raa = Fa implies F is the reflexivization of R.
changes:
- date: '2026-09-22'
  by: Claude Fable 5.1 (Anthropic)
  summary: Added direct locators in Logical Combinatorialism; the statement is unchanged.
- date: '2026-09-22'
