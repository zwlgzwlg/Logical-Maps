id: atomicity-t
name: Atomicity (type t)
category: instances
statement: Atomicity (type t) in the displayed closed propositional formulation.
formal: $\forall p\, .\,p\le\neg p\lor\exists q\, .\,\operatorname{Atom}_t(q)\land q\le p$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.2, p. 24.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.2, p. 24
notes: ''
variants:
- id: dual
  name: Dual form
  statement: Whatever is entailed by every atom is necessary.
  formal: $\forall p\, .\,(\forall q\, .\,\operatorname{Atom}_t(q)\to q\le p)\to\Box p$
  equivalence: The argument for the dual form of Atomicity, at type $t$, where $\neg p\le p$ says that
    $p$ is necessary.
