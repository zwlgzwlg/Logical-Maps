id: necessary-barcan-t
name: □BF (type t)
category: instances
statement: Every closed instance of BF (type t) is necessary. Box the entire object-variable closure;
  retain the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of BF (type t)}$
date: '2026-09-17'
sources:
- Andrew Bacon and Cian Dorr, Classicism, draft of 16 May 2023, §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34.
source_names:
- Classicism
references:
- paper: bacon-dorr-classicism
  role: formulation
  locator: §2.1, pp. 21–23; §§2.2–2.3, pp. 25–34
notes: Box each fully closed instance of BF (type t). Type quantifiers and formula side conditions remain
  outside the box.
variants:
- id: dual
  lean:
    ref: Classicism.P.NecBarcanTDual.schemaIn
    equivalence_ref: Classicism.Map.necessary_barcan_t.dual
    status: verified
  name: Dual form
  statement: Every closed instance of the dual form of BF (type t) is necessary.
  formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of the dual form of BF (type t)}$
  equivalence: Each instance of the dual form of BF (type t) is derivable in C from finitely many instances
    of the official form, and conversely; the derivation is on the page of BF (type t). Necessitating
    it and applying K carries the equivalence to the boxed forms.
lean_def: Classicism.P.NecBarcanT.schemaIn
