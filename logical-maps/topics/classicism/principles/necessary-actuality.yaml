id: necessary-actuality
name: □Actuality
category: lattice
statement: Every closed instance of Actuality is necessary. Box the entire object-variable closure; retain
  the same type range and other schema side conditions.
formal: $\Box\phi\quad\text{for each closed instance }\phi\text{ of Actuality}$
date: '2026-09-17'
sources:
