  note: Formulation of the Gallin convention. The draft compares the two rigidity conventions but does
    not draw this consequence.
notes: >-
  Only persistence of the coextension and of its pointwise negation is used, and only at the actual world,
  so no modal axiom beyond the background is needed. Persistence alone would not do. What forces the
  necessary distinctness is that the negation is persistent too, which pins the non-instances down as
  firmly as the instances.
