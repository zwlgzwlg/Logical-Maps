proof: >-
  Fix the type tuple, and write $P_X:=\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)\land Y\le X$. Suppose
  $\operatorname{WeaklyRigid}(X)$. Since $X\le X$, $P_XX$. Weakly Rigid Power at the same type makes $P_X$
  weakly rigid, so in particular weakly persistent, so $\Box P_XX$ and hence
  $\Box\operatorname{WeaklyRigid}(X)$. Rigidity is necessary weak rigidity (Background), so $X$ is rigid.
