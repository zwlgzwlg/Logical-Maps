notes: One direction of the proposed equivalence of the two non-contingency principles under the displayed
  candidate assumptions. These assumptions have not yet been proved sufficient. For the forward direction
  one needs, at every carrier type, necessary comparison of every real structure's natural-number carrier
  and continuum with N and S. For the converse one also needs a necessarily available real structure at
  some specified sufficiently high type; otherwise the structural universal quantifiers can be vacuous.
  Current-world bijections alone do not transfer modal claims. Goodsell's arithmetic rigidity result addresses
  the number carrier, not the real-structure construction. See Background, Cardinal CH and bounded forcing.
