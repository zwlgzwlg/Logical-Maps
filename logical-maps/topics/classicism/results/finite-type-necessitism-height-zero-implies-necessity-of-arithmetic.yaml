proof: The possible canonical-arithmetic guard activates F0. Rigid recursion supplies addition and multiplication
  on its reference. Goodsell’s arithmetic interpretation lemma, Peano matching and the reference argument
  fix arithmetic truth; when the possibility guard fails it fails necessarily. [Paper (PDF)](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.pdf);
