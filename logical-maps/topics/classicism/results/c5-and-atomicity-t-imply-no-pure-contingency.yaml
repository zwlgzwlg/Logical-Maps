proof: The proof written up for c5-and-atomicity-imply-no-pure-contingency uses Atomicity only at type
  $t$, to find an atom below $P$ and one below $\neg P$ for a true closed pure $P\ne\top$; every other
  step uses $\Box$ND, through ND and BF at the types occurring in $P$. So the same write-up proves this
  sharper statement.
