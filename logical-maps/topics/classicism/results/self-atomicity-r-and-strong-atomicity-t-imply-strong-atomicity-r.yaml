proof: >-
  Below any nonbottom relation choose a self-atom X. Its instance proposition p is nonzero, so choose a strong scalar atom w below p. Restrict X by w pointwise. Its instance proposition is w. Wherever the restriction is inhabited it is a nonzero subrelation of the then-atom X and equals X there. Thus the restriction is a self-atom with strong instance proposition, hence strong. It lies below the original relation.
notes: >-
  The interval argument is given in [[atoms-are-self-atoms-r-and-atoms-are-strong-atoms-t-imply-atoms-are-strong-atoms-r]], using the local observation in [[self-atoms-are-strong-atoms-t-implies-self-atoms-are-strong-atoms-r]].
