proof: >-
  Every closed instance of Weakly Rigid Power is a closed sentence of the pure language, since the
  principle is stated with object-language quantifiers and contains no nonlogical constant. Given Weakly
  Rigid Power, each of those instances is true, and No Pure Contingency makes a true closed pure sentence
  necessary.
