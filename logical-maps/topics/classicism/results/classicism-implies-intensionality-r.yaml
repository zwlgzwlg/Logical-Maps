proof: Logical Equivalence identifies the lambda abstractions of $X[\bar z]\land\forall\bar u\, .\,X[\bar
  u]\leftrightarrow Y[\bar u]$ and the analogous expression with Y in the first conjunct, with the quantified
  biconditional parenthesized as the second conjunct. If that biconditional is necessary, substitute its
  identity with $\top$ into the abstraction identity. Boolean identities and beta-eta conversion leave
  X=Y, exactly as on p. 17.
