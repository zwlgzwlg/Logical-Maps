  note: Strong Possibility and the observation that the coalesced-sum roots validate the collapse.
notes: >-
  The original proof treats the signature schema directly. The two recorded Possibility Maximalism
  (signature Σ) roots witness that Max(C(Σ)) decides neither $Z$ nor $\neg Z$. Their signatures
  have infinitely many individual names and a relational name. The collapse holds at both roots
  and excludes a distinctness-preserving visit to a current falsehood. The full signature result
  also follows from [[strong-possibility-signature-r-inconsistent]].
