proof: >-
  Distinctness Maximalism (pure) is equivalent to Possibility Maximalism (pure). Rigid Comprehension implies Boolean Completeness,
  which restricts to Countable Boolean Completeness, which gives the Necessity of Arithmetic (the source's
  Theorem 9). Possibility Maximalism (pure) is incompatible with the Necessity of Arithmetic (the source's Theorem 11):
  Gödel's first incompleteness theorem supplies an arithmetical sentence $A$ with $I\land A$ and
  $I\land\neg A$ both consistent with C, both are then possible, and the necessity schema forbids that. The
  source draws exactly this consequence for Rigid Comprehension in the remark after Theorem 11.
