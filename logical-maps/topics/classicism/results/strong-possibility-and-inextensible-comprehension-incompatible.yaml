proof: >-
  Pure Strong Possibility alone gives the contradiction by [[strong-possibility-r-inconsistent]].

  Add an exit into a Maximalist point to the reduced-power retraction. Its
  moving-tuple test forces the present extension of every inextensible relation
  to be externally finite. Weak inextensibility then bounds that relation by the
  finite union of its actual tuple-haecceities, making every future extension
  Frege-finite. Thus the closed assertion that every inextensible relation is
  necessarily Frege-finite is consistent with Max at each arity. Under Strong
  Possibility an inextensible relation with infinite current extension could
  return to that infinitude through the assertion. Its boxed inextensibility
  persists at the intermediate point, giving finiteness at the return. Hence
  every current inextensible relation has a Frege finite count. Inextensible
  Comprehension would then give a finite coextension of the universal property
  of propositions, contradicting the quantified Axiom of Infinity at t from Max.
notes: >-
  The single comprehension instance for the universal property of propositions
  suffices. No persistence of an inextensible bound is assumed.
