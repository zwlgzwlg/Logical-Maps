sources:
- Original argument of 3 October 2026, in response to Cian Dorr's question about Rigid Power.
source_names:
- Claude Opus 5.5 3 Oct
proof: >-
  See the write-up. At any world, a counterexample to the weak inextensibility of the power property
  yields an atom $a$ entailing that some rigid $X\le F$ lacks a property $\mathcal X$. Rigid Comprehension
  pulls $X$ back to a rigid $X'$ coextensive with $\lambda z\, .\,Fz\land\Diamond(a\land Xz)$. Using the
  rigidity of $F$ and $X'$ below the atom, $a$ entails that $X$ and $X'$ are coextensive, and coextensive
  weakly rigid relations are identical; so $a$ entails $\mathcal XX$.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, pp. 28–33
  note: Rigidity and Rigid Comprehension.
notes: >-
  No B is used, so this covers settings that the C5 route does not reach. The argument uses BF,
  Atomicity and Rigid Comprehension at every world where weak inextensibility is checked, hence the boxed
  premises; it is a C-proof from those boxed premises, so the conclusion is boxed too.
