id: necessary-bf-atomicity-and-rigid-comprehension-imply-necessary-rigid-power
premises:
- necessary-barcan-r
- necessary-atomicity-r
- necessary-rigid-comprehension-r
conclusion: necessary-rigid-power-r
status: proved
