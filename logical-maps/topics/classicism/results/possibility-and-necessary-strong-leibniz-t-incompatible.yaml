proof: The Strong Leibniz Biconditionals at type $t$ form a closed pure sentence. It fails at the root
  of the recorded coalesced sums (for instance coalesced-maximalist-root), where Atomicity (type t) fails
  and the Strong Leibniz Biconditionals (type t) entail it; these are action models, so models of C by
  Theorem 3.23. Possibility Maximalism (pure) therefore makes the negation possible, while $\Box$Strong Leibniz Biconditionals
  (type t) says the sentence is necessary.
references:
