proof: >-
  Let $\tau=\bar\rho\to t$, which covers $\tau=t$ with the empty tuple, and fix $U^{\sigma\tau t}$. Write
  $\varphi(x,y):=(Ux)y\land\forall z\, .\,(Ux)z\to y=z$ and define the operation
  $F:=\lambda x^\sigma\, .\,\lambda\bar u\, .\,\forall y^\tau\, .\,(Ux)y\to y[\bar u]$; for $\tau=t$ this
  is $\lambda x\, .\,\forall p\, .\,(Ux)p\to p$. (1) Lemma, a theorem of C: $\varphi(x,y_0)\to\forall\bar
  u\, .\,y_0[\bar u]\leftrightarrow(Fx)[\bar u]$. Assume $\varphi(x,y_0)$. If $y_0[\bar u]$ and $(Ux)y$,
  then $y=y_0$ by uniqueness, so $y[\bar u]$; hence $(Fx)[\bar u]$. Conversely, if $(Fx)[\bar u]$,
  instantiate $y:=y_0$ and use $(Ux)y_0$. (2) Necessitate the lemma and apply K: $\Box\varphi(x,y_0)$ gives
  $\Box\forall\bar u\, .\,y_0[\bar u]\leftrightarrow(Fx)[\bar u]$, and Intensionality gives $y_0=Fx$.
  (3) Let $H:=\forall x\, .\,\exists y\, .\,\Box\varphi(x,y)$ and $G:=\forall x\, .\,\forall y\,
  .\,(Ux)y\leftrightarrow y=Fx$. Then $H\to G$ is a theorem of C. Given $x$ and $y$, take $y_0$ with
  $\Box\varphi(x,y_0)$; by (2) $y_0=Fx$, and by T $\varphi(x,y_0)$. If $(Ux)y$ then $y=y_0=Fx$ by
  uniqueness. If $y=Fx$ then $y=y_0$, and $(Ux)y_0$ gives $(Ux)y$. (4) Necessitate $H\to G$ and apply K:
  $\Box H\to\Box G$. Existential generalization on the closed term $F$ (with parameter $U$) gives
  $\Box H\to\exists X\, .\,\Box\forall x\, .\,\forall y\, .\,(Ux)y\leftrightarrow y=Xx$. Only necessitation
  of theorems of C is used, so the theoremhood side condition is respected.
references:
- paper: bacon-dorr-classicism
