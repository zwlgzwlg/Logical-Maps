  note: Necessitation, T and Intensionality (necessarily coextensive relations are identical).
notes: >-
  The operation is definable from $U$, so no choice is involved. The outer box of the hypothesis is used
  only to get the boxed conclusion: the same proof shows, as a theorem of C, the unboxed variant
  $H\to\exists X\, .\,\forall x\, .\,\forall y\, .\,(Ux)y\leftrightarrow y=Xx$. The inner box is essential;
  it is what licenses the identity $y_0=Fx$ in step (2). A natural target for a Lean proof, at every
  relational output type.
