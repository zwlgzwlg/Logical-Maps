notes: >-
  The direct argument, using BF once and at the world of evaluation. The claim strengthens: the same
  witness is fully rigid, since Gallin Extensional Comprehension gives ND, ND with BF gives □ND, □ND gives
  □BF, and with BF at every world the same argument runs inside the box of inextensibility; that is the
  recorded gallin-comprehension-and-bf-imply-rigid-comprehension, of which this record is therefore a
  consequence. It is kept because it isolates what BF at the evaluation world alone buys.
