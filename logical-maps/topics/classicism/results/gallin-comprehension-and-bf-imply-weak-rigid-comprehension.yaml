proof: >-
  Let $X$ be given and let $Y$ be the coextension that Gallin Extensional Comprehension supplies, with $Y$
  and $\neg Y$ persistent. Persistence of $Y$ gives, by T, its weak persistence, the first conjunct of weak rigidity. For weak
  inextensibility, let $Z$ satisfy $\forall\bar x\, .\,Y[\bar x]\to\Box Z[\bar x]$. For any $\bar x$,
  either $Y[\bar x]$, and then $\Box Z[\bar x]$, or $\neg Y[\bar x]$, and then $\Box\neg Y[\bar x]$ by
  persistence of $\neg Y$ (with T); in both cases $\Box(Y[\bar x]\to Z[\bar x])$ by K. So
  $\forall\bar x\, .\,\Box(Y[\bar x]\to Z[\bar x])$, and BF, applied to the abstract
  $\lambda\bar x\, .\,Y[\bar x]\to Z[\bar x]$ one argument at a time, gives
  $\Box\forall\bar x\, .\,Y[\bar x]\to Z[\bar x]$, which is $Y\le Z$. Hence $Y$ is weakly rigid and
  coextensive with $X$.
