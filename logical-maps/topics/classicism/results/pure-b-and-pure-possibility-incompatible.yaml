proof: 'Let $F$ be the Fregean Axiom, a closed pure sentence. Both $F$ and $\neg F$ are consistent with
  C (a two-valued Henkin model and the two-element-group model), so Possibility Maximalism (pure) gives $\Diamond
  F$ and $\Diamond\neg F$. In C, $\Box(F\to\Box F)$: the Fregean Axiom, if true, makes every truth identical
  to $\top$, and this reasoning is a theorem, so it holds necessarily. If $F$ then $\Box F$, contradicting
  $\Diamond\neg F$. If $\neg F$, B for the pure sentence $\neg F$ gives $\Box\Diamond\neg F$; but at the
  possibility where $F$ holds, $\Box F$ holds, so $\neg\Diamond\neg F$ holds there, a contradiction.'
references:
- paper: bacon-2024-book
  role: proof
  locator: §8.3, Exercise 8.19, p. 172
  note: 'Set as an exercise: prove □(F → □F) and derive a contradiction with B from the broad contingency
    of the Fregean Axiom.'
- paper: bacon-dorr-classicism
  role: background
  locator: §3.5, n. 81, p. 59
notes: 'Sharpens the recorded incompatibility of Possibility Maximalism (pure) with No Pure Contingency and with
  ND: even B restricted to pure sentences is excluded.'
