notes: >-
  Does Relational Choice alone give a transversal for every equivalence relation? Christopher Sun
  observed that the literature claims this without proof. The converse is recorded. The quotient argument chooses from each cell $\lambda z\, .\,(Rx)z$ and needs the cells of two
  members of one class to be the same property; in C that is necessary coextension, and the hypothesis
  gives actual coextension only. No definable substitute for the cell helps, since an operation
  definable from $R$ identifies $x$ with $x'$ only when they are necessarily indiscernible with respect
  to $R$. A Zermelo-style well-ordering argument breaks at the same point: coextensive but distinct
  stages receive different chosen elements. The expectation is that the implication fails. What would
  settle it: a proof that uses the chosen relation to break the symmetry between coextensive cells, or
  a model of C with Relational Choice that is not extensionally full at its evaluation point. Every
  recorded model of Relational Choice is extensionally full there, in that every set of tuples from the
  domains is the extension of a rigid element, and that fullness verifies Transversal Choice by the same
  metatheoretic choice, so none separates the two. Symmetric Henkin models in the Fraenkel–Mostowski
  style cannot separate them either; see the write-up.

  Update of 28 September 2026: Christopher Sun showed on 26 September that Transversal Choice is
  equivalent to Relational Choice together with Transversal (transversal-and-relational-choice-imply-transversal-choice),
  so this question is equivalent to whether Relational Choice implies Transversal. Anything that
  implies Transversal, such as Actuality, closes the gap.
