proof: Every closed instance of Strong Leibniz Biconditionals (type t) is a closed sentence of the pure
  language, since the principle is stated with object-language quantifiers and contains no nonlogical
  constant. Given Strong Leibniz Biconditionals (type t), each of those instances is true, and No Pure
  Contingency makes each necessary, which is □Strong Leibniz Biconditionals (type t).
