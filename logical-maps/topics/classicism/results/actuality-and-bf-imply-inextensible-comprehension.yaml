notes: >-
  BF is used only at the actual world, at the type $\bar\sigma t$ of $X$ and at the argument types
  $\bar\sigma$, to bring the quantifiers in the negated leading box of inextensibility out to the actual
  world, where Actuality can be applied to the chosen instances. This strengthens the earlier result
  from □BF and Actuality, which now follows from it. The identifier was first used on 26 September 2026
  for this claim as a conjecture, which was withdrawn the same day because the recorded argument then
  needed □BF.
