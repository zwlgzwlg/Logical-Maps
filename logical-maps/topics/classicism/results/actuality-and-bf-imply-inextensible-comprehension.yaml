proof: >-
  Let $w$ witness Actuality, fix $F$ of type $\bar\sigma t$ and put $C:=\lambda\bar z\, .\,\Diamond(w\land
  F[\bar z])$, which is coextensive with $F$ by Actuality. Suppose $\neg\operatorname{Inextensible}(C)$:
  $\Diamond\exists X\, .\,A(X)\land\Diamond\exists\bar z\, .\,C[\bar z]\land\neg X[\bar z]$, with
  $A(X):=\forall\bar y\, .\,C[\bar y]\to\Box X[\bar y]$. BF at type $\bar\sigma t$ gives an $X$ with
  $\Diamond(A(X)\land\Diamond\exists\bar z\, .\,C[\bar z]\land\neg X[\bar z])$. So $\Diamond\exists\bar
  z(\ldots)$ by 4, and BF at the types $\bar\sigma$ gives $\bar z$ with $\Diamond(C[\bar z]\land\neg
  X[\bar z])$. Then $C[\bar z]$ by 4, so $F[\bar z]$, and $\Diamond\neg X[\bar z]$. By Actuality, $w\le
  F[\bar z]$ and $w\le\Diamond\neg X[\bar z]$; by 4 and K these give $\Box(\Diamond w\to C[\bar z])$ and
  $\Box(\Diamond w\to\Diamond\neg X[\bar z])$. At the world where $A(X)$ holds, $\Diamond w$ also holds
  (it follows from $\Diamond\exists\bar z\, .\,C[\bar z]\land\ldots$ by 4), so $C[\bar z]$, so $\Box
  X[\bar z]$ by $A(X)$, and also $\Diamond\neg X[\bar z]$: a contradiction. So $C$ is inextensible.
  Full details are in the write-up.
