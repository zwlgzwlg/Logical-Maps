proof: >-
  Every closed instance of Atomicity is a closed sentence of the pure language, since the principle is stated
  with object-language quantifiers and contains no nonlogical constant. Given Atomicity, each of those instances
  is true, and No Pure Contingency makes a true closed pure sentence necessary. So every closed instance
  is necessary, which is what the boxed principle asserts. Any type range and side conditions stay outside
  the box, as the Modal scope convention requires.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 27
  note: Formulation of No Pure Contingency. The draft does not draw this consequence.
notes: >-
  One of a uniform family. No Pure Contingency carries any pure principle of the map to its boxed form,
  because a boxed principle here says exactly that each closed instance of the base is necessary. The
  argument turns on the base being stated with quantifiers rather than as a schema over arbitrary formulas,
  since an instance carrying a nonlogical constant would fall outside No Pure Contingency.
