sources:
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, pp. 2 and
  12, for the definitions; connecting argument original to this record.
source_names:
- BC does not imply RC
proof: >-
  A rigid $Y$ is persistent by definition, and so, by T, weakly persistent. Its other conjunct, $\operatorname{Inextensible}(Y)$, is a
  necessitated conditional, so T strips the leading box and yields $\operatorname{WeaklyInextensible}(Y)$.
  Hence every rigid relation is weakly rigid, and the rigid coextension supplied by Rigid Comprehension
  already witnesses Weak Rigid Comprehension at the same type.
