proof: >-
  See the write-up. Choose, for each atom $w$, an $x$ with $w\le Fx$; restrict the choice to atoms and
  take a weakly rigid coextension $R$; put $G:=\lambda x\, .\,\exists w\, .\,w\land Rwx$. Weak
  inextensibility shows that every instance of $R$ that an atom makes true is, according to that atom,
  identical to an actual instance, and uniqueness follows by reasoning below atoms.
