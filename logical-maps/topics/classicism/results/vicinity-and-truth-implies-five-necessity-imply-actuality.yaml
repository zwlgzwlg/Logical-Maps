proof: >-
  By Sun's recorded 5-necessity form of Vicinity, take a true $v$ with
  $\forall q\, .\,\Box_5q\to v\le q$. The other current premise gives $q\to\Box_5q$
  for every proposition $q$. Hence $\forall q\, .\,q\to v\le q$, and the same true $v$
  witnesses Actuality. No optional premise is necessitated.
