proof: >-
  By [[strong-possibility-signature-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Possibility+ (signature Σ).

  For a fixed signature Possibility+ instance put
  $A=\forall\bar x\, .\,D(\bar x)\to\Diamond P(\bar x)$, where $D$
  says that the displayed individuals are pairwise distinct and differ from the
  individual constants occurring in $P$. The closed sentence $A$ is consistent
  with $\operatorname{Max}(C(\Sigma))$, since [[coalesced-definable-root-signature]]
  satisfies both. Signature Strong Possibility gives $\Diamond_{\ne}A$.
  A countertuple $\bar a$ to $A$ would satisfy $D(\bar a)\land\Box\neg P(\bar a)$.
  Testing $\Diamond_{\ne}A$ with $D(\bar a)$ gives an accessible point where
  $A\land\Diamond D(\bar a)$ holds. Necessity of identity gives $D(\bar a)$
  there, including the disequalities with the named individuals. By 4 the
  transported tuple still satisfies $\Box\neg P(\bar a)$, contradicting $A$.
  With an empty guard the same test is $\top$.
notes: >-
  The argument applies to every signature, including the first-order signatures
  for which consistency of signature Strong Possibility remains open.
