notes: >-
  Lemma 3 of the source is the persistence of being a finite cardinality, Lemma 1 of the write-up for
  pure-possibility-implies-axiom-of-infinity-t. Lemma 8 says that natural numberhood is a rigid property in
  the source's sense, the Barcan direction; the converse Barcan direction is Lemma 3. The source's logic
  lacks T, 4 and Logical Equivalence, so the proof transfers to C unchanged.
