- Arithmetic is Necessary
proof: >-
  Theorem 9 of the source, proved in HKC, which C extends. Natural numberhood is necessary (Lemma 3, an
  induction using the converse Barcan formula), distinct numbers are necessarily distinct given $I^*$
  (Lemma 4, a double induction), $I$ implies $I^*$ (Lemma 5), so distinctness and, by tedious inductions,
  Sum and Prod are necessary or necessarily false given $I$ (Lemmas 6–7). Countable Boolean Completeness is
  used once, in Lemma 8: the property of being a singleton of a number is countable, so it has a least upper
  bound $B$; $B$ necessarily holds of every number, so the property of being the successor of a $B$ is also an
  upper bound, hence $B$ necessitates it, and induction gives that necessarily every number is a $B$; thus
  any property necessarily had by each number is necessarily had by every number. Theorem 9 then proceeds by
  induction on arithmetical formulas, Lemma 8 handling the restricted universal quantifier. See the write-up.
references:
- paper: goodsell-arithmetic-necessary
