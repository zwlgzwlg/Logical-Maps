proof: >-
  Under the necessary Peano guard, code each Frege number by its haecceity and
  represent every current set of such numbers by the unique transversal representative
  of its pullback to the Frege numbers, empty on nonnumbers. This gives a possible
  real number structure. Analytic Necessitism supplies a rigid necessarily real
  structure. The least relation matching its zero and successors with the Frege
  zero and successors is a bijection at every world. Induction and persistence of
  the given successor graph make each matched pair persist. For a tester necessarily
  covering all old Frege numbers, every old number of the rigid structure therefore
  necessarily has all its matches in that tester. Weak inextensibility of the rigid
  numbers and future surjectivity of the match give weak inextensibility of the
  Frege numbers throughout the cone. Matched distinct numbers remain distinct.
notes: >-
  For each counting type it suffices that the requisite coextension transversal
  exist at some accessible point. In particular, possible Actuality suffices in
  combination with first-order Analytic Necessitism.
