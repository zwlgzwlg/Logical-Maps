proof: See the write-up. Fix a source sigma and assume its necessary Peano guard. At the current point,
  the canonical arithmetic is genuine. Transversal at nu_sigma=(sigma t)t supplies one literal representative
  of every current coextension class of predicates on the canonical number host. Restrict its representatives
  to rational Dedekind cuts. Comprehension gives the relational field operations and arbitrary admitted
  bounded unions, hence a current real number structure at rho_sigma=nu_sigma t. ANA gives a fixed necessarily-real
  structure at that same host. Its fixed Peano substructure and the source's necessary matching/range
  lemma imply Arithmetic Necessitism at sigma under the unchanged guard. Since sigma was arbitrary, the
  full conclusion follows.
notes: No unconditional arithmetic existence, boxed Transversal, Functional Choice, or new type-quantified
  existence assertion is used. The cut construction uses current literal representatives and current fullness;
  rigidity is supplied only after applying ANA. The current cut construction and its composition with
  the fixed-reference lemma are due to OpenAI Codex, prompted by Daniel Kodsi, 30 October 2026. With the
  existing SOAN-to-ANA result it derives Transversal's failure in the symmetric Cohen arithmetic-growth
  model.
