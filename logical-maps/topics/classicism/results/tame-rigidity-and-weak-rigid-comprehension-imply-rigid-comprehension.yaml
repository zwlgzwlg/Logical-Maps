proof: >-
  Fix the type tuple. Given $X$, Weak Rigid Comprehension supplies a weakly rigid $Y$ coextensive with
  $X$. Tame Rigidity at the same type makes $Y$ rigid, so $Y$ witnesses Rigid Comprehension for $X$.
