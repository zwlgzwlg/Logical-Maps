proof: Extensionality implies the Fregean Axiom at the nullary case. A true proposition is then materially
  equivalent to $\top$, hence identical to $\top$, which gives $p\to\Box p$. Apply that to the proposition
  expressed by each closed instance of Extensionality. The type quantifier and the schema's side conditions
  stay outside the box, as the principle requires.
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §1.4, pp. 15–16
notes: The same step already recorded for the Fregean Axiom and its box, and for No Pure Contingency.
  Recorded as a connecting derivation, not an additional Bacon–Dorr theorem.
