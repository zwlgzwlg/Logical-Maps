proof: >-
  Let $R^{\sigma\sigma t}$ be an equivalence relation and write $[x]$ for the cell $\lambda z\, .\,(Rx)z$.
  The relation $U^{(\sigma t)\sigma t}$ with $(UC)y:=Cy\lor\neg\exists z\, .\,Cz$ is serial, so Relational
  Choice gives a functional $S$ with $(SC)y\to(UC)y$. Put $Fy:=\exists x\, .\,(S[x])y$. Existence: given
  $x$, functionality gives $y$ with $(S[x])y$; the cell $[x]$ has the instance $x$, so $(U[x])y$ gives
  $(Rx)y$, and $Fy$ holds. Uniqueness: suppose $(Rx)y$, $Fy$, $(Rx)y'$ and $Fy'$, with witnesses $x_1$ and
  $x_2$, so that $(S[x_1])y$ and $(S[x_2])y'$. As before $(Rx_1)y$ and $(Rx_2)y'$, so $x_1$, $y$, $x$, $y'$
  and $x_2$ lie in one cell and $\forall z\, .\,(Rx_1)z\leftrightarrow(Rx_2)z$. Extensionality at type
  $\sigma t$ gives $[x_1]=[x_2]$, and functionality of $S$ gives $y=y'$.
references: []
notes: >-
  The only use of Extensionality is to identify the coextensive cells $[x_1]$ and $[x_2]$. In C alone
  properties are identical only when necessarily coextensive, which the hypothesis does not supply; see
  the recorded question relational-choice-r-implies-transversal-choice-r. The arrow is also derivable
  through Extensionality implies Rigid Comprehension and the arrow from Relational Choice with Weak Rigid
  Comprehension; it is recorded directly because it is the argument usually given.
