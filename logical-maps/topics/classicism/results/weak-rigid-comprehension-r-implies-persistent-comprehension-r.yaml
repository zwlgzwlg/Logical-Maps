sources:
- Cian Dorr, Boolean Completeness does not imply Rigid Comprehension, draft of 30 July 2026, footnote
  on p. 12.
source_names:
- BC does not imply RC
proof: >-
  A weakly rigid relation $Y$ is persistent: apply its weak inextensibility to $\lambda\bar x\,
  .\,\Box Y[\bar x]$, whose hypothesis $Y[\bar x]\to\Box\Box Y[\bar x]$ holds by weak persistence and
  4; this gives $Y\le\lambda\bar x\, .\,\Box Y[\bar x]$, which is $\operatorname{Persistent}(Y)$. So a
  weakly rigid coextension is already a persistent coextension.
references:
- paper: dorr-bc-not-rc
  role: proof
  locator: footnote on p. 12
  note: The footnote's opening observation, that weakly rigid properties are persistent, from which it
    obtains Actuality through Persistent Comprehension.
notes: >-
  With the recorded implication from Persistent Comprehension to Actuality, this completes the converse
  of the implication from Boolean Completeness and Actuality, so Weak Rigid Comprehension is equivalent
  to their conjunction.
changes:
- date: '2026-10-08'
