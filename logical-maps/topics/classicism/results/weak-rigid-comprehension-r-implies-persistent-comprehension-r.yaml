  summary: >-
    "Weakly rigid" now means weakly persistent and weakly inextensible (until then, persistent and
    weakly inextensible; Very Weak Rigid Comprehension retired); the proof's wording is adjusted to match.
    A weakly rigid relation is still persistent, so the mathematical content is unchanged.
