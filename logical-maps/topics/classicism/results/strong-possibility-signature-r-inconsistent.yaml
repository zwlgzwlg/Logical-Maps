proof: >-
  Use exactly the two pure sentences of [[strong-possibility-r-inconsistent]].
  In a finite language with an individual name, an ordinary Maximalist root
  licenses the assertion K that any current distinction between individuals
  can become permanent. A second root gives each individual name two
  representatives. They merge at every proper exit, where both still have
  the same closed descriptor. The unary Russell argument licenses H(K) at
  that root. A purported refutation of either licence in any larger signature
  uses only finitely many names and Maximalist axioms. Keep those names and
  add one fresh individual name. A proof of a public equality using the extra
  name would give a proof without it by substituting a variable and using the
  existence of individuals. Thus both licences hold in the full signature.
  Strong Possibility entails K by the first and its negation by the second.
