proof: >-
  By c5-and-persistent-comprehension-imply-gallin and rigid-comprehension-r-implies-persistent-comprehension-r,
  each closed instance of Gallin Extensional Comprehension follows in C from the corresponding closed
  instances of □ND and of Rigid Comprehension, so the conditional is a theorem of C and necessitates. K
  then needs the boxes of the antecedents: the boxed Rigid Comprehension premise supplies one, and □ND
  supplies the other by 4. Hence every closed instance of Gallin Extensional Comprehension is necessary.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.1, p. 22; §2.3, n. 37, p. 28; §1.5, p. 17
  note: The equivalence of ND with B, the Gallin convention, and the 4 axiom. The draft does not draw this
    consequence.
notes: The necessitation of the recorded unboxed arrow from C5 and Persistent Comprehension, taken with the
  boxed form of Rigid Comprehension since the map has no boxed Persistent Comprehension.
