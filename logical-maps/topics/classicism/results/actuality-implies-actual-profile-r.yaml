proof: Let w witness Actuality. At a tuple $\bar x$, use the relation $\lambda\bar y\, .\,w\land\bigwedge_i
  x_i=y_i$. It holds at $\bar x$. If $Z[\bar x]$ is true, w entails that truth; NI preserves the tuple
  identities, so the proposed relation entails Z. This gives the required profile for every type tuple.
