proof: 'Let $c$ be a constant of type $\sigma$ and $F,G$ closed terms of type $\sigma\tau$ not containing
  $c$, with $Fc=Gc$. Enumerate the constants occurring in $F$ or $G$ as $\bar d$, all distinct from $c$,
  and abstract them: $F=F^\circ\bar d$, $G=G^\circ\bar d$ with $F^\circ,G^\circ$ closed and pure, by $\beta$.
  Let $P:=F^\circ\bar y\,x=G^\circ\bar y\,x$, pure with free variables $\bar y,x$. NI gives $\Box P[\bar
  d,c/\bar y,x]$, so Logical Necessity, left to right, gives $\forall\bar y x\, .\,P$. This closed pure
  truth is necessary by the empty-tuple instance of Logical Necessity, so $\Box\forall\bar y x\, .\,F^\circ\bar
  y x=G^\circ\bar y x$. CBF gives $\forall\bar y\, .\,\Box\forall x\, .\,F^\circ\bar yx=G^\circ\bar yx$
  and Modalized Functionality, a theorem of C, gives $\forall\bar y\, .\,F^\circ\bar y=G^\circ\bar y$.
  Instantiating $\bar y:=\bar d$ yields $F=G$.'
references:
- paper: bacon-2020
