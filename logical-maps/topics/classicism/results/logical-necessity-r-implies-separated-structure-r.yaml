notes: 'Bacon derives the quantified form from Quantified Logical Necessity and Modalized Functionality
  and says the schematic form follows in the same way. Both directions of Logical Necessity are used:
  the witnessed direction to pass from the necessary identity at the constants to the universal claim,
  and No Pure Contingency to necessitate that claim before applying Modalized Functionality.'
