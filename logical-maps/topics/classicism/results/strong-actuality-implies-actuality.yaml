proof: 'Let $w$ be true with $\Box\forall q\, .\,w\le q\lor w\le\neg q$. By T, $w\le q\lor w\le\neg q$ for every $q$. If $q$ is true, $w\le\neg q$ would give $\neg q$ by T, since $w$ is true; so $w\le q$. Thus $w$ is a true proposition entailing every truth, a witness for Actuality.'
