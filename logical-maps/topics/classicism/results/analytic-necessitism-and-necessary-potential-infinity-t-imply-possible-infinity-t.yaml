- OpenAI Codex (GPT-6), prompted by Daniel Kodsi, applying finite conjunctions at an accessible point to the possible-Actuality criterion for Arithmetic Necessitism.
- Zachary Goodsell's implication from Potential Infinity with weakly inextensible numbers to Possible Infinity at propositional type.
