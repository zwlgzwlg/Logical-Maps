proof: >-
  We prove the stronger $\Box\Diamond\operatorname{AxInf}_t$. First, whenever the
  propositions are Frege-finite there is Actuality. By Frege induction on $n$, for
  each family $X$ counted by $n$ there is a true proposition $q$ entailing every
  currently true member of $X$. For zero take top. For successor take a removed member
  $a$ and apply induction to the remaining family. If $a$ is true, meet the resulting
  $q$ with $a$; otherwise keep $q$. Apply this to the universal family to obtain
  Actuality. Now suppose some accessible point has no possibility of the Axiom of
  Infinity at $t$. Its propositions are Frege-finite there, so Actuality is possible
  from the starting point. The possible-Actuality argument in
  [[analytic-necessitism-and-transversal-imply-arithmetic-necessitism]] supplies
  Arithmetic Necessitism at that starting point. Its necessary Peano antecedent at
  $t$ holds by [[potential-infinity-forms]]. The Frege numbers at $t$ are therefore
  rigid, in particular weakly inextensible at every accessible point. Potential Infinity
  holds at each of those points by hypothesis. Goodsell's argument
  [[potential-infinity-and-possible-infinity]] gives Possible Infinity at the very
  point assumed to lack it. This proves the stronger conclusion and hence the stated one.
notes: >-
  The model [[increasing-hyperfinite-stages]] separates necessary Potential Infinity
  from Possible Infinity in C alone. More generally any counterexample to Analytic
  Necessitism implying Arithmetic Necessitism must satisfy the necessary Axiom of
  Infinity at propositional type, since even one reachable Frege-finite scalar domain
  supplies possible Actuality.
