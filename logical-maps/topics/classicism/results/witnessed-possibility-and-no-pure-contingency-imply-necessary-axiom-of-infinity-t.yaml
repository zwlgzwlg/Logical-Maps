proof: >-
  Suppose there is a realized number $h$ of exact truth-value alternations of a current proposition for
  which no current proposition has exact rank $\operatorname{Suc}h$. A bounded initial segment of the
  realized Frege numbers is weakly
  inextensible. This lets No Pure Contingency choose such an $h$ small enough to fit inside every later
  terminal rank. Witnessed Possibility then gives a single signature proposition that possibly has a
  terminal rank beginning with either truth value. Its set of points permitting $h+1$ alternations is
  closed under predecessors. Giving that set a constant truth value, opposite to one accessible exact
  rank-$h$ point outside it, produces a current proposition of exact rank $h+1$. The layers supply a
  property with that many instances, contradicting the choice of $h$. The argument defines iteration by
  one higher-order formula for every internal number. Hence the realized exact ranks are closed under
  successor. They include zero, so they include every internal finite number, with either prescribed
  initial bit. No Pure Contingency makes that pure claim necessary. A finite count $a$ of all
  propositions would make $\operatorname{Suc}a$ unrealized, which proves the stated conclusion.
notes: >-
  In particular Converse Witnessed Possibility and Possibly Witnessed Possibility imply necessary
  Potential Infinity at type $t$, by [[converse-witnessed-possibility-r-implies-no-pure-contingency-r]],
  [[possibly-witnessed-possibility-r-implies-witnessed-possibility-r]] and [[necessary-axiom-of-infinity-t-implies-necessary-potential-infinity-t]]. Logical Necessity likewise supplies the two premises. Evaluation at a fixed tuple extends the infinity
  conclusion to every relational type. At type $e$, [[full-free-monoid-glued-constants-singleton]]
  satisfies Logical Necessity with one individual.
