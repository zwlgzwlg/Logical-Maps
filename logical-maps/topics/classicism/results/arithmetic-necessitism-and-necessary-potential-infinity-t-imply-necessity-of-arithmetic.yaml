proof: >-
  The necessarily Peano Frege numbers at the indicated type are rigid with necessarily
  distinct current instances. The positive sum and product graphs persist. For a false
  operation equation transport the true output and use necessary distinctness and Peano
  functionality. Induct through guarded quantification using weak inextensibility for a
  true universal and a transported old counterexample for a false one. This fixes the
  truth of every arithmetical sentence at the indicated type throughout the cone. At
  any other counting type with the local Peano guard, the least zero- and successor-matching
  relation gives an internal Peano isomorphism with those numbers, preserving the sentence.
notes: >-
  Any one necessarily Peano counting type suffices. This instance uses type t.
