proof: Let $c$ be a constant of $\Sigma$ of some relational type $\tau$. The pure formulas $x=\top_\tau$
  and $x\ne\top_\tau$ have witnesses, so Witnessed Possibility gives $\Diamond(c=\top_\tau)$ and $\Diamond(c\ne\top_\tau)$.
  By excluded middle one of the closed $\Sigma$-sentences $c=\top_\tau$, $c\ne\top_\tau$ is true, and
  No Contingency (signature Σ) makes it necessary, contradicting the possibility of the other.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 27; §2.5, n. 57, p. 38
notes: Hence No Contingency (signature Σ) excludes Logical Necessity, Separated Structure, Possibly Witnessed
  Possibility and Maximalist Classicism for Σ, while it is consistent with No Pure Contingency and holds
  in every one-world model.
