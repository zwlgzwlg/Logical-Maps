  note: The soundness results that make the cited countermodels models of C, hence witnesses to the consistency
    of the negated instance.
notes: 'Instance of a general pattern: Possibility Maximalism (pure) yields $\Diamond\neg Y$ for every closed pure
  $Y$ whose negation is consistent with C, so it refutes $\Box Y$ whenever a model of C refutes $Y$. For
  the other boxed principles on the map the incompatibility with Possibility Maximalism (pure) is already derivable,
  through the recorded equivalence of Possibility Maximalism (pure) with Distinctness Maximalism (pure) and the Distinctness Maximalism
  incompatibilities; this record covers a case that was not. Both Strong Possibility principles inherit
  it, the pure one through Possibility Maximalism (pure) and the Σ one through Possibility Maximalism (signature Σ). Cian Dorr
  observed on 23 September 2026 that anything consistent with Maximalist Classicism is made possible by
  Strong Possibility; since it is already made possible by Possibility Maximalism itself, the arrows are recorded
  here, at the weaker premise. Relational Choice itself holds at the recorded coalesced roots, which satisfy
  Possibility Maximalism (pure) and refute its necessitation, as the record requires.'
