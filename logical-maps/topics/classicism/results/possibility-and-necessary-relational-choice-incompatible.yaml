proof: Relational Choice fails, at some pair of types, in the Henkin model recorded as henkin-without-relational-choice,
  a model of C; so the negation of that closed pure instance, $\neg\forall U\, .\,\operatorname{Serial}(U)\to\exists
  S\, .\,\operatorname{Functional}(S)\land\forall xy\, .\,(Sx)y\to(Ux)y$ at those types, is consistent
  with C, and Possibility Maximalism (pure) makes it possible. $\Box$Relational Choice says that the instance is
  necessary.
