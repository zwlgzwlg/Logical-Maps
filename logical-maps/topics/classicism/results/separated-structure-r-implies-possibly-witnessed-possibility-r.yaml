proof: Iterating Separated Structure, as in the recorded proof of General Separated Structure, gives $F\bar
  c=G\bar c\to F=G$ for closed pure $F,G$ and distinct constants $\bar c$. Let $P$ be pure with free variables
  among $\bar x$ and put $F:=\lambda\bar x\, .\,\neg P$, $G:=\lambda\bar x\, .\,\top$, both closed and
  pure. Suppose $\Box\neg P[\bar c/\bar x]$, that is $\neg P[\bar c/\bar x]=\top$. By $\beta$, $F\bar
  c=\top=G\bar c$, so $F=G$. By NI, $\Box(F=\lambda\bar x\, .\,\top)$, and $F=\lambda\bar x\, .\,\top\to\forall\bar
  x\, .\,F\bar x$ is a theorem, so K gives $\Box\forall\bar x\, .\,\neg P$. Contraposing, $\Diamond\exists\bar
  x\, .\,P\to\Diamond P[\bar c/\bar x]$.
