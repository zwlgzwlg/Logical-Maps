proof: 'See [the common proof](../writeups/necessary-world-atomicity.md), §3. Boxed Plenitude gives C5 and Atomicity. Under C5, propositional ND preserves an atom’s nonzeroness; NI preserves each Boolean decision and BF collects the decision quantifier. Thus each current atom is necessarily an atom. The atom below any given nonzero proposition supplied by Atomicity is therefore the required witness.'
notes: No uniform choice of atoms is made. The assertion is at propositional type t; its boxed-Plenitude and boxed-Gallin equivalents remain their full native schemata.
