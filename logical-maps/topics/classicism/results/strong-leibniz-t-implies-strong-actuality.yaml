proof: 'The Strong Leibniz Biconditionals (type $t$) imply □Actuality (recorded), hence Actuality by T; let $a$ witness it. Since $a$ is true it is possible, so the Strong Leibniz Biconditionals supply a strong world $w\le a$. Suppose $w$ false. Then $\neg w$ is true, so $a\le\neg w$, i.e. $w\le\neg a$; with $w\le a$ this gives $w\le\bot$, so $w=\bot$, contradicting $\Diamond w$. So $w$ is a true strong world.'
notes: 'Cian Dorr proposed Actuality and the Strong Leibniz Biconditionals (type $t$) as premises; the first follows from the second by the recorded strong-leibniz-t-implies-necessary-actuality, so it is dropped.'
