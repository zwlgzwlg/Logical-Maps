proof: For a property X of relations, put $U=\lambda\bar z\, .\,\forall Z\, .\,XZ\to Z[\bar z]$. When
  XV holds, the Fregean Axiom makes XV necessary and the displayed universal sentence entails $V[\bar
  z]$; Extensionality gives $U\le V$. Conversely, any lower bound Y pointwise entails the displayed defining
  condition for U, so Extensionality gives $Y\le U$. Thus U is a GLB.
