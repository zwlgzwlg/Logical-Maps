proof: >-
  NecessaryLowerPeano implies LowerPeano by T. The theorem exactPeano_of_lowerPeano derives ExactPeano
  without any further hypothesis. Apply the previously established exactLowerBijection_of_peano.
  The witness is the synchronous inductive relation ExactLowerPair. It has total projections in both
  directions, is functional and one-to-one, relates exact zero to at-least zero, and relates successors
  of every pair. The stronger unboxed implication LowerPeano implies ExactLowerBijection is proved as
  exactLowerBijection_of_lowerPeano; its necessitation and K give necessary existence of a bijection
  from NecessaryLowerPeano as well.
notes: >-
