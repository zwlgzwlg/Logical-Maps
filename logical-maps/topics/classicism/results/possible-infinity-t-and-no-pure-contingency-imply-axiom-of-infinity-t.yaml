proof: >-
  The negation of the Axiom of Infinity at type $t$ is a closed sentence of the pure language. If the Axiom
  failed, No Pure Contingency would make its negation necessary, contradicting Possible Infinity at type
  $t$, which is the Axiom's diamond.
