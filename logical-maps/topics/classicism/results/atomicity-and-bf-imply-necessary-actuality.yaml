proof: 'If w is a propositional atom, it entails every conditional $q\to(w\le q)$: either it entails q,
  in which case the entailment is necessary, or it entails its negation. Tractarianism, equivalent to
  BF, combines these into the universal claim that w entails every truth. Hence w entails Actuality. Atomicity
  says every possible proposition has an atom below it, so no possible proposition can entail the negation
  of Actuality. Thus that negation is $\bot$ and Actuality is necessary.'
