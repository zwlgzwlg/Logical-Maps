proof: >-
  By [[strong-possibility-signature-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Atomlessness.

  Let $U$ say that there are no strong atoms of type $t$. The proof of
  [[signature-strong-possibility-and-strong-actuality-incompatible]] establishes $U$ itself.
  In every admitted signature there is an atomless model of signature Maximalism,
  so Strong Possibility in that signature gives $\Diamond_{\ne} U$. The universal
  identity reflection lemma gives $U$ at the evaluation point. By the second
  premise every propositional atom there would be strong. Thus there are no
  propositional atoms. Equivalently, every nonzero proposition has a nonzero
  proper part, which is Atomlessness.
