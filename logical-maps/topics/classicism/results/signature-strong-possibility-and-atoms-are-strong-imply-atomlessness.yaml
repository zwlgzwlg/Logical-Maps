notes: >-
  [[atomlessness-implies-atoms-are-strong-atoms-r]] and
  [[atoms-are-strong-atoms-r-implies-atoms-are-strong-atoms-t]] give the converse
  implications. Hence under signature Strong Possibility, Atomlessness and the
  type-$t$ and all-relational-type strong-atom bridges are equivalent. In the
  pure case the finite cell in [[strong-possibility-incompatible-with-atoms-are-self-atoms-t]]
  already supplies a propositional atom that fails to be a self-atom.
