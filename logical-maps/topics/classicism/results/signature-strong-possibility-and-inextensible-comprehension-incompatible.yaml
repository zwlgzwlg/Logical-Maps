proof: >-
  Signature Strong Possibility alone gives the contradiction by [[strong-possibility-signature-r-inconsistent]].

  For the given signature use a reduced-power retraction with an exit into a
  signature-Maximalist point, sending each named entity to its old interpretation.
  The resulting signature-Maximalist root satisfies the same pure sentence
  asserting that every current inextensible relation is necessarily Frege-finite.
  Test signature Strong Possibility for this sentence with the present infinitude
  of a purported inextensible counterexample. Inextensibility persists to the
  intermediate point, whose bound contradicts the return. The universal property
  of propositions has no inextensible coextension by the quantified Axiom of
  Infinity at t from pure Maximalism.
notes: >-
  Applies to every admitted fixed signature. The construction and return are
  detailed in [[strong-possibility-and-inextensible-comprehension-incompatible]].
