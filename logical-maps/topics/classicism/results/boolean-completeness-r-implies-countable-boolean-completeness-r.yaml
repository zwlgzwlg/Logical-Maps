proof: >-
  Countable Boolean Completeness is the restriction of Boolean Completeness to countable properties. The
  map's Boolean Completeness supplies greatest lower bounds; the least upper bound of $X$ is the pointwise
  negation of the greatest lower bound of $\lambda y\, .\,X(\neg y)$, by the Boolean laws that Logical
  Equivalence makes identities, so every property, countable or not, has a least upper bound.
