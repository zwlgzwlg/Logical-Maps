proof: >-
  Let K say that any two distinct individuals can become permanently distinct.
  Strong possibility of K implies K. Ask for the present distinction to be
  restored after a visit to K. The two individuals must still differ at the
  visit, so K supplies a continuation where they remain distinct forever.
  An ordinary Maximalist root whose individuals are names satisfies K.
  Now give every name two representatives that merge on every proper exit.
  This root is still Maximalist and satisfies a second pure sentence H(K).
  It says that a tester sharing the Russell tester's unary output must accept
  that output wherever K holds. A second copy of an individual records a
  false predicate value, letting one distinguish any closed tester that would
  violate the law from Russell's tester. Strong possibility of the law brings
  it back to the starting world. Since some tester shares the output and
  rejects it there, the law gives the negation of K.
