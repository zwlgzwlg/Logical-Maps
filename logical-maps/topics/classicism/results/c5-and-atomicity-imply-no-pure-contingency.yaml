proof: 'Fix two distinct atoms $w,w^{\prime}$ of type $t$ and let $F:=\lambda p\, .\,(\neg(w\lor w^{\prime})\land
  p)\lor(w\land(w^{\prime}\le p))\lor(w^{\prime}\land(w\le p))$, which exchanges the two atoms: $w\le
  Fp$ iff $w^{\prime}\le p$. Under $\Box$ND identity propositions are rigid, so $F$ is an involution commuting
  with the connectives, with $\forall$ (by BF) and with identity, as identities, not just materially:
  the hypothesis that $w,w^{\prime}$ are distinct atoms is rigid, so material equivalences proved under
  it lift to identities by the Modalized Fregean Axiom and pass under $\lambda$ by Modalized Functionality.
  Extend $F$ by conjugation to every type, $F^*_{\sigma\tau}X:=\lambda y\, .\,F^*_\tau(X(F^*_\sigma y))$;
  $F^*$ is an involution fixing every logical constant, so by induction on terms $F^*A=A[F^*\bar x/\bar
  x]$ for pure $A$, and $FP=P$ for closed pure $P$. Hence $w\le P$ iff $w^{\prime}\le P$. If $P$ is true
  and not $\top$, Atomicity at type $t$ gives atoms $w\le P$ and $w^{\prime}\le\neg P$, necessarily distinct,
  and the agreement puts $w^{\prime}$ below $\bot$. Full proof in the write-up.'
