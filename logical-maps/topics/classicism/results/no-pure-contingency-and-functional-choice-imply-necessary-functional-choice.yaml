proof: Every closed instance of Functional Choice is a closed sentence of the pure language, since the
  principle is stated with object-language quantifiers and contains no nonlogical constant. Given Functional
  Choice, each of those instances is true, and No Pure Contingency makes each necessary, which is □Functional
  Choice.
