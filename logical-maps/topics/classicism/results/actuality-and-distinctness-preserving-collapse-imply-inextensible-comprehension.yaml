proof: >-
  Let $a$ witness Actuality and write $L(a)$ for $a\land\forall q\, .\,q\to a\le q$. Applying
  Distinctness-preserving collapse to the truth $L(a)$ gives a true $q^*$ with $\Box(\Diamond q^*\to
  L(a))$; since $a\le q^*$, 4 and K give $\Box(\Diamond a\to\Diamond q^*)$, hence $\Box(\Diamond a\to
  L(a))$. Now fix $X$ and put $Y:=\lambda\bar z\, .\,a\land X[\bar z]$, coextensive with $X$. Two
  theorems of C: (i) $L(a)$ implies that $Y$ is weakly inextensible, by the recorded argument from
  Actuality; (ii) $\Box\neg a$ implies that $Y$ is weakly inextensible, since then $Y\le\bot\le Z$. So
  $(\Diamond a\to L(a))\to\operatorname{WeaklyInextensible}(Y)$ is a theorem; necessitating it and using
  $\Box(\Diamond a\to L(a))$ gives $\Box\operatorname{WeaklyInextensible}(Y)$, which is
  $\operatorname{Inextensible}(Y)$.
