  note: The witness is the one note 38 uses for Actuality; the distinctness-preserving modality is that
    of §2.6, and the collapse principle is from Appendix E.
notes: >-
  The collapse principle is used only to obtain that the Actuality witness is, necessarily, the least
  truth wherever it is so much as possible. That is exactly what the recorded action models with
  Actuality have: their witness is a set of arrows, typically a symmetry group or the identity alone, that no arrow
  outside it composes back into. So Inextensible Comprehension holds in every recorded model with
  Actuality and Distinctness-preserving collapse, including the symmetric models and the finite-support
  models in which Rigid Comprehension, Boolean Completeness or Weak Rigid Comprehension fail. A
  countermodel to Actuality alone implying Inextensible Comprehension would have to make the witness
  possible at some world where it is false, which the collapse principle forbids and C5 renders harmless;
  none is recorded, and the question is open.
