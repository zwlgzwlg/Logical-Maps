proof: Choose a rigid property R coextensive with N. Persistence gives necessary R-zero; inextensibility and successor closure give necessary successor closure of R. Necessitated induction gives N≤R. Conversely, persistence of N and inextensibility of R give R≤N. Antisymmetry yields N=R, hence strong rigidity. RC itself is unboxed. See the write-up.
notes: No claim of a new mathematical result. The native Lean proof is uniform in every admitted σ; it needs no Infinity, Choice, BF or necessary distinctness. Mathematical attribution is separate from this transcription and formalization.
