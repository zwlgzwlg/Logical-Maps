proof: Assume $\Diamond P[\bar c/\bar x]$ and $\Diamond Q[\bar d/\bar y]$ for distinct constants $\bar
  c\bar d$. Logical Necessity for $\neg P$ at $\bar c$, contraposed, gives $\exists\bar x\, .\,P$, and
  likewise $\exists\bar y\, .\,Q$; so $\exists\bar x\bar y\, .\,P\land Q$. Logical Necessity for $\neg(P\land
  Q)$ at the constants $\bar c\bar d$, contraposed, gives $\Diamond(P[\bar c/\bar x]\land Q[\bar d/\bar
  y])$.
