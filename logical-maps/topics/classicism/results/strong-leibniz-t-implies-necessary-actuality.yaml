notes: >-
  The map already had □Actuality from Atomicity and BF (Proposition 2.7) and from □Plenitude and □Rigid
  Comprehension. This record is stronger in one direction: only the type-$t$ instance of the Strong
  Leibniz Biconditionals is used, so with the recorded derivation of that instance from Atomicity (type
  $t$) and BF (type $t$), □Actuality now follows from those two type-$t$ principles without BF at other
  types. Every model in the map that satisfies the Strong Leibniz Biconditionals already satisfied
  □Actuality, so no recorded verdict changes.
