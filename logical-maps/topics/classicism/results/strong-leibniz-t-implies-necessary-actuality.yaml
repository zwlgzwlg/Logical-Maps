proof: >-
  Write $A$ for Actuality, $\exists p\, .\,p\land\forall q\, .\,q\to p\le q$. Every strong world
  proposition entails $A$. For any $w$, $(\forall q\, .\,w\le q\lor w\le\neg q)\to(w\to A)$ is a theorem
  of H: given $w$ and a true $q$, $w\le\neg q$ would give $\neg q$ by T, so $w\le q$; thus $w$ is true and
  entails every truth, and is itself the witness for $A$. Necessitate the universal closure in $w$,
  distribute by CBF, and apply K to the second conjunct of $\operatorname{SWorld}_t(w)$, which is
  $\Box\forall q\, .\,w\le q\lor w\le\neg q$: this gives $\Box(w\to A)$, i.e. $w\le A$. Now suppose
  $\Diamond\neg A$. The Strong Leibniz Biconditionals at type $t$ supply a strong world $w$ with $w\le\neg
  A$. Together with $w\le A$ this gives $w\le A\land\neg A=\bot$, so $w=\bot$, contradicting $\Diamond w$.
  Hence $\neg\Diamond\neg A$, which is $\Box A$. Actuality has no type parameters, so $\Box A$ is its only
  closed instance.
