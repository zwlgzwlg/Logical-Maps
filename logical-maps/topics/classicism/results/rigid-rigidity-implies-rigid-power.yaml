notes: >-
  Cian Dorr proposed it on 10 October 2026, with an argument that assumed rigidity is closed under
  conjunction. It is not, in C: if $x\ne y$ but possibly $x=y$, the conjunction of their haecceities is
  persistent but not weakly inextensible, since weak inextensibility would require $\Box\,x\ne y$. Under
  □ND conjunctions of rigid relations are rigid and the argument goes through, but C5 already gives □Rigid
  Power. A countermodel must therefore have contingent identity at some accessible world: a rigid $Y$ not
  below a rigid $X$ that comes below it at an accessible world by identifications, without becoming
  identical there to any rigid subrelation of $X$ at the evaluation point. With the recorded results, the
  conjecture would make Rigid Rigidity equivalent to □BF + Rigid Power, and Weakly Rigid Weak Rigidity
  equivalent to BF + Weakly Rigid Power. Since Rigid Rigidity implies its necessitation, the conjecture is
  equivalent to Rigid Rigidity ⇒ □Rigid Power.
