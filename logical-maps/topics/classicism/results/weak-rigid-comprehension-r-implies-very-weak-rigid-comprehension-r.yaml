proof: >-
  $\operatorname{Persistent}(Y)$ is $Y\le\lambda\bar x\, .\,\Box Y[\bar x]$, which unpacks as
  $\Box\forall\bar x\, .\,Y[\bar x]\to\Box Y[\bar x]$; T gives $\operatorname{WeaklyPersistent}(Y)$. The
  inextensibility conjunct is the same in both conditions. So every weakly rigid relation is very weakly
  rigid, and a weakly rigid coextension is already a very weakly rigid one.
