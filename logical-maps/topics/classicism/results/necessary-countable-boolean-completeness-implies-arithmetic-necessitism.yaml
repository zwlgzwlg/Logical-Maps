proof: >-
  Fix $\sigma$. Lemma 3 gives persistence of the numbers in C. At each point, Lemma 8 gives
  weak inextensibility from Countable Boolean Completeness at the counting type $\sigma$ and
  the relation type $\nu_\sigma t$, where $\nu_\sigma=(\sigma t)t$. Necessitating this implication
  and applying K to the boxed premise gives inextensibility. Thus the numbers are rigid.
  Lemma 4 gives $m\ne n\to\Box(I^*_\sigma\to m\ne n)$ on numbers, so the principle's
  own antecedent $\Box I^*_\sigma$ gives their necessary distinctness.
notes: >-
  This settles the question whether Necessary Actuality and Necessary Boolean Completeness
  together imply Arithmetic Necessitism. Only the countable instances of the latter are used.
  The related [[countable-boolean-completeness-implies-necessity-of-arithmetic]] concerns
  the modal status of arithmetic sentences. Here the target concerns the property of being a number.
