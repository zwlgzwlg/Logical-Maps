notes: >-
  The source's theorem is general: the maximalization of any recursively enumerable extension of HK
  consistent with $I$ refutes some instance of the necessity schema. The record uses Possibility Maximalism (pure)
  directly; the equivalent Distinctness Maximalism form gives the same through the recorded equivalence. The
  argument is metatheoretic in two places, the recursive enumerability of C and Gödel's theorem, like the
  consistency side condition of Possibility Maximalism itself.
