proof: >-
  Theorem 11 of the source, applied to C. The theorems of C are recursively enumerable, and C is consistent
  with $I$, since $I^*$ and hence $I$ hold in the full Henkin model with a countably infinite individual
  domain. So the arithmetical sentences $A$ with $C\vdash I\to A$ form a consistent, recursively
  enumerable extension of Peano arithmetic (the source's Lemma 1 supplies the axioms). By Gödel's first
  incompleteness theorem there is an arithmetical sentence $A$ for which neither $I\to A$ nor $I\to\neg A$
  is a theorem of C, so $I\land A$ and $I\land\neg A$ are both consistent with C. Both are closed pure
  sentences, so Possibility Maximalism (pure) gives $\Diamond(I\land A)$ and $\Diamond(I\land\neg A)$. But the
  instance of the Necessity of Arithmetic at $A$ says $\Box(I\to A)$ or $\Box(I\to\neg A)$, and by K each
  disjunct contradicts one of the two possibilities.
references:
- paper: goodsell-arithmetic-necessary
