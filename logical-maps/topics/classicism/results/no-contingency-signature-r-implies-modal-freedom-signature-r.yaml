proof: Applying the schema to the closed sentences $\neg P[\bar c/\bar x]$ and $\neg Q[\bar d/\bar y]$
  and contraposing gives $\Diamond P[\bar c/\bar x]\to P[\bar c/\bar x]$ and likewise for $Q$. So the
  antecedent of Modal Freedom (signature Σ) yields $P[\bar c/\bar x]\land Q[\bar d/\bar y]$, and T gives
  its possibility.
