proof: By [[strong-possibility-signature-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Rigid Power. The signature-Maximalist descriptor root with a true strong atom has standard finite proper transports
  of every rigid relation. At signature Strong Possibility, Strong Actuality fails by universal reflection.
  A nonfinite current rigid relation would therefore require a return witnessing both failures through
  the closed sentence describing those proper transports. Its persistent rigidity forces the opposite
  finite verdict at the return. The internal finite-power theorem applies at every arity.
notes: The consistency condition throughout is Maximalist Classicism in the same fixed signature. [Construction
  and proof](strong-possibility-signature-and-finite-rigid-bounds.html)
