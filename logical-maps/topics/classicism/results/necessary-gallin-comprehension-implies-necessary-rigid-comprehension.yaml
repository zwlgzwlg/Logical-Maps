proof: >-
  The boxed premise gives □ND, by necessary-gallin-comprehension-implies-necessary-nd, and □ND gives
  □BF, by necessary-distinctness-necessary-r-implies-necessary-barcan-r. By
  gallin-comprehension-and-bf-imply-rigid-comprehension, each closed instance of Rigid Comprehension
  follows in C from the corresponding closed instances of Gallin Extensional Comprehension and of BF, so
  the conditional is a theorem of C and necessitates; K then needs the boxes of the antecedents, which the
  boxed premise and □BF supply. Hence every closed instance of Rigid Comprehension is necessary.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.3, n. 37, p. 28; §1.5, p. 17
  note: The Gallin convention and the 4 axiom. The draft does not draw this consequence.
notes: >-
  No BF premise is needed at all in the boxed setting: the box of Gallin Extensional Comprehension
  already yields □ND, hence □BF. The unboxed arrow needs BF as a premise because Gallin Extensional
  Comprehension alone gives only ND, not its box.
