  Maximalism and local Boolean Completeness can be extended to a new point with the same
  two principles and a true proposition that fails 5-necessity, if such a starting point
  exists. The stronger unboxed result
  [[pure-maximalism-and-boolean-completeness-t-incompatible]] now excludes
  such a starting point even under pure Maximalism.
