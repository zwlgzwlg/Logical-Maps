proof: The Fregean Axiom gives $p\to\Box p$ for every proposition p, by comparison with $\top$. Apply
  it to each distinctness claim, then universally close x,y to obtain ND at a chosen type. Apply the same
  Fregean Axiom to that whole true closed ND sentence. This yields boxed ND at each type.
