proof: >-
  Let $w$ witness Vicinity; we show that $w$ itself witnesses Actuality. Let $p$ be true. Distinctness-preserving
  collapse gives $\Box_{\ne}p$, that is, a true $q$ with $\Box(\Diamond q\to p)$, i.e. $\Diamond q\le p$.
  Since $q$ is true, Vicinity gives $w\le\Diamond q$. So $w\le p$.
references:
- paper: bacon-dorr-classicism
  role: background
