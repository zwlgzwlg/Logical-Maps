  note: Definition of $\Box_{\ne}$ and formulation of Distinctness-preserving collapse.
notes: >-
  The witness is the same proposition. With Actuality ⇒ Vicinity, Actuality is equivalent to Vicinity
  under Distinctness-preserving collapse, as it is under Weakly Inextensible Comprehension.
