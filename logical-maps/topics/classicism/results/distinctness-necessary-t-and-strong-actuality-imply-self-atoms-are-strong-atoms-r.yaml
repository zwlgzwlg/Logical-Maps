proof: >-
  Let $a$ be a true strong proposition and $X$ a self-atom of any relational
  type. Both $a$ and the proposition that $X$ is instantiated differ from
  bottom. Propositional ND preserves these differences at every successor.
  Suppose a tester $Y$ splits $X$ somewhere. There are continuations
  instantiating $X\land Y$ and $X\land\neg Y$, respectively. At each $X$ is
  an atom by selfhood, so the first continuation satisfies $X\le Y$ and the
  second satisfies $X\le\neg Y$. Each order judgment persists to a further
  continuation where $a$ is true. Since $X$ remains nonzero, these two
  continuations disagree on $X\le Y$. At the place where $Y$ was chosen,
  the transported strong $a$ decides that very proposition. This contradiction
  proves strong atomhood. In particular the result applies under Gallin
  Extensional Comprehension by its recorded implications to ND and Strong Actuality.
