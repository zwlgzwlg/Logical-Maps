proof: >-
  The argument of Tame Rigidity + Weak Rigid Comprehension ⇒ Rigid Comprehension uses the premises only
  at the conclusion's type tuple and nothing beyond C. So for each closed instance, C proves the
  conditional from the corresponding instances of Tame Rigidity and Weak Rigid Comprehension to the
  instance of Rigid Comprehension. Necessitate that theorem and apply K with the boxed premise instances.
  Generalization over the admitted types is metalinguistic; no type quantifier is placed inside the box.
