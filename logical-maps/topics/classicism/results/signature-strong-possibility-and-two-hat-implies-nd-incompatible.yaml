proof: Signature Strong Possibility alone gives the contradiction by [[strong-possibility-signature-r-inconsistent]]. Let U be the universal identity sentence excluding strong propositional atoms. The atomless Cantor
  model and universal reflection make U true. The necessitated reflection principle makes U its own true
  guard for two-hat necessity. Signature Maximalism also has a Strong Actuality model, so signature Strong
  Possibility makes the negation of U ND-possible. Thus U is two-hat necessary and fails ND-necessity.
notes: The consistency condition throughout is Maximalist Classicism in the same fixed signature. [Construction
  and proof](strong-possibility-signature-and-finite-rigid-bounds.html)
