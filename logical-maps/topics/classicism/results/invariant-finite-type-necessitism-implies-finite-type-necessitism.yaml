proof: Whenever an instance is activated, the invariant representative carrier and Boolean-cancellation
  argument yield necessary 5. Under necessary 5 ordinary and invariant rigidity coincide; the invariant
  witness is therefore an ordinary FTN witness. If no hierarchy is possible the instance is vacuous. [Paper
  (PDF)](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.pdf);
  [source](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.tex).
notes: The proof does not infer that ordinary represented powers follow by simply weakening the carrier
  definition; it uses the equivalence under necessary 5.
