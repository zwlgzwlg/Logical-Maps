proof: >-
  The argument of Boolean Completeness + Actuality ⇒ Weak Rigid Comprehension uses, for a relational
  type $\tau$, only the least-upper-bound instance of Boolean Completeness at $\tau$ for the property of
  being a haecceity of some $X$ things, the instance of Actuality, and C (4, and the necessity of a true
  entailment). So for each closed instance, C proves the conditional from the corresponding instances of
  Boolean Completeness and Actuality to the instance of Weak Rigid Comprehension at $\tau$. Necessitate
  that theorem and apply K with the boxed premise instances. Generalization over the admitted types is
  metalinguistic; no type quantifier is placed inside the box.
