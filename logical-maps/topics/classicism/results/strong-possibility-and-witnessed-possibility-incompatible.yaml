proof: >-
  Pure Strong Possibility alone gives the contradiction by [[strong-possibility-r-inconsistent]].

  Fix a nonindividual constant $c$ as in the map's signature convention,
  and let $b$ be any nonzero closed pure proposition.
  For a variable $X$ of its type put $T(X)=\forall\bar z\, .\,X[\bar z]$,
  with $T(X)=X$ at type $t$. The two pure formulas
  $\Diamond(b\land T(X))$ and $\Diamond(b\land\neg T(X))$ have current
  witnesses, respectively the constant top and bottom relations of that type,
  since $\Diamond b$. Applying Witnessed Possibility to each formula with
  the same $c$, and then applying 4, gives both $\Diamond(b\land T(c))$
  and $\Diamond(b\land\neg T(c))$. Thus $T(c)$ splits every such $b$ into
  two nonzero parts. But pure Strong Possibility makes the conjunction of
  the Fregean Axiom with exactly one individual a nonzero Boolean atom,
  by the finite Fregean cell argument in
  [[maximalism-signature-incompatible-with-strong-possibility-pure]]. This
  contradicts the splitting assertion.
notes: >-
  The splitting argument applies to every nonzero closed pure proposition.
  It uses just Witnessed Possibility, whose antecedent requires a current witness.
