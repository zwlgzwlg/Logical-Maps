proof: >-
  In an S5 model of finitely supported relations on a countably infinite
  set of individuals, a world is an ordered partition into finitely many
  infinite blocks. Its block count is the greatest size of a finite family
  of disjoint infinite unary rows. This gives a closed pure guard G and
  disjoint labels J(n) for which every number's label is possible throughout
  each G-cone. If the family of G-and-J(n) propositions indexed by the
  source Frege numbers had a supremum, its leastness and induction at a
  G-point would force that supremum to cover the cells of every number
  newly available there. Testing the same supremum with an arbitrary
  numerically indexed predicate yields the Barcan inference for numerical
  quantifiers restricted to G-points. Goodsell's induction then fixes
  every arithmetic sentence throughout the accessible G-points. The
  consistent effective theory of C under G interprets PA, so Rosser's
  theorem gives opposite G-consistent arithmetic signs. Ordinary pure
  Maximalism makes both possible. The accompanying write-up gives the
  pure label, both upper bounds, and the calculation for nonstandard numbers.
notes: >-
  Already the supremum of one closed, internally countably indexed family
  of propositions is impossible. The incompatibility with signature
  Maximalism follows because it includes the pure possibility instances.
  The stated Boolean Completeness is local. An external strengthening gives a single sequence of closed pure
  propositions for which every infinite subsequence lacks a supremum.
