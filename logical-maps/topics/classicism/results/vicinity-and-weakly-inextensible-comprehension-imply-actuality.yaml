notes: >-
  Only the type-$(t\to t)$ instance of Weakly Inextensible Comprehension at $X=\lambda p\, .\,p$ is used.
  Unlike the derivation of Weakly Inextensible Comprehension from Actuality, the argument uses the box
  in the antecedent of weak inextensibility, and Vicinity is what supplies it. With that derivation and
  Actuality ⇒ Vicinity, Actuality is equivalent to Vicinity together with Weakly Inextensible
  Comprehension. Since the implication is a theorem of C, its necessitation also holds, but the map has
  no record of necessary Weakly Inextensible Comprehension.
