proof: >-
  Let $w$ witness Vicinity. Weakly Inextensible Comprehension at type $t\to t$, applied to $X:=\lambda
  p\, .\,p$, gives a weakly inextensible $F$ with $\forall p\, .\,Fp\leftrightarrow p$. Put $a:=w\land\forall
  p\, .\,p\leftrightarrow Fp$, which is true. Fix a true $q$; we show $a\le q$. Let $Z_q:=\lambda p\,
  .\,w\to\Diamond(q\land p)$. If $Fp$ then $p$ is true, so $q\land p$ is true and Vicinity gives $w\le\Diamond(q\land
  p)$, which is $\Box Z_q\,p$. Hence $\forall p\, .\,Fp\to\Box Z_q\,p$, and weak inextensibility gives
  $F\le Z_q$, that is $\Box\forall p\, .\,Fp\to(w\to\Diamond(q\land p))$. Instantiate at $p:=\neg q$:
  since $\Diamond(q\land\neg q)=\Diamond\bot=\bot$, this is $\Box\neg(w\land F\neg q)$. The formula $a\land\neg
  q\to w\land F\neg q$ is a theorem, so by necessitation and K, $\Box\neg(a\land\neg q)$, which is $a\le
  q$. So $a$ witnesses Actuality.
