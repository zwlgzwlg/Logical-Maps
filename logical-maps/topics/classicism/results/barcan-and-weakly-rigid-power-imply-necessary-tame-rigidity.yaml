proof: >-
  Fix the type tuple $\bar\sigma$ and put $T:=\lambda\bar x\, .\,\top$. $T$ is weakly persistent
  trivially. It is weakly inextensible: if $\forall\bar x\, .\,\Box Z\bar x$, then BF (iterated over the
  tuple) gives $\Box\forall\bar x\, .\,Z\bar x$, that is $T\le Z$; for the empty tuple ($T=\top$) no BF is
  needed. By Weakly Rigid Power, $P_T:=\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)\land Y\le T$ is weakly
  rigid, and Tame Rigidity at type $(\bar\sigma t)t$, which Weakly Rigid Power implies (recorded), makes
  it rigid, hence persistent: $\Box\forall Y\, .\,P_TY\to\Box P_TY$. Since $Y\le T$ holds necessarily for
  every $Y$, this is $\Box\forall Y\,
  .\,\operatorname{WeaklyRigid}(Y)\to\Box\operatorname{WeaklyRigid}(Y)$, the instance of □Tame Rigidity at
  $\bar\sigma$.
references: []
notes: 'At type $t$ (the empty tuple) the argument needs no BF, so Weakly Rigid Power alone gives □Tame Rigidity for propositions.'
