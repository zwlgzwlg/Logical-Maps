proof: >-
  The argument of C5 ⇒ Tame Rigidity (c5-implies-tame-rigidity) is a proof in C, for each closed
  instance, of the conditional from the instances of $\Box$ND it uses to the instance of Tame
  Rigidity. Necessitate that theorem and apply K: $\Box\Box$ND gives $\Box$Tame Rigidity. And
  $\Box$ND gives $\Box\Box$ND by 4, a theorem of C. Generalization over the admitted types is
  metalinguistic; no type quantifier is placed inside the box.
