  note: The same least upper bound of haecceities is the witness there; with Actuality added it is also
    persistent and coextensive with X by itself. Here Actuality is not assumed and the join is cut down
    to X.
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, pp. 23–25
  note: Boolean Completeness; its least-upper-bound form is equivalent to the stated greatest-lower-bound
    form in C.
notes: >-
  Only the least upper bound of the haecceities of the $X$-instances is used. Together with the recorded
  implication from Actuality this places Weakly Inextensible Comprehension below two principles that
  the recorded models separate in both directions, so it is strictly weaker than each: the symmetric
  all-surjections and range-gap-without-Actuality models have Boolean Completeness without Actuality,
  and the finite-support models with Actuality lack Boolean Completeness. In particular Weakly
  Inextensible Comprehension does not imply Actuality.
