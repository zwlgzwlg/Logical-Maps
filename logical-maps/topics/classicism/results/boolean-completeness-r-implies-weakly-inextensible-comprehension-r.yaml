proof: >-
  Fix $X^\tau$ with $\tau=\bar\sigma t$ and let $H$ be the property of being the haecceity
  $\operatorname{Haec}_{\bar y}:=\lambda\bar z\, .\,\bigwedge_i z_i=y_i$ of some $\bar y$ with $X[\bar y]$.
  By Boolean Completeness in its least-upper-bound form, let $S$ be a least upper bound of $H$ and put
  $Y:=\lambda\bar z\, .\,S[\bar z]\land X[\bar z]$. If $X[\bar y]$ then $\operatorname{Haec}_{\bar y}\le
  S$, so $S[\bar y]$ by T at $\bar y=\bar y$; hence $Y$ is coextensive with $X$. For weak inextensibility
  suppose $\forall\bar z\, .\,Y[\bar z]\to\Box Z[\bar z]$. For $\bar y$ with $X[\bar y]$ we get
  $\Box Z[\bar y]$, and $\forall\bar z\, .\,\bigwedge_i z_i=y_i\to Z[\bar z]$ is H-equivalent to $Z[\bar
  y]$, so $\operatorname{Haec}_{\bar y}\le Z$. Thus $Z$ is an upper bound of $H$, so $S\le Z$, and
  $Y\le S\le Z$.
references:
