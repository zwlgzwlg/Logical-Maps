proof: >-
  Every closed instance of Rigid Power is a closed sentence of the pure language, since the principle is
  stated with object-language quantifiers and contains no nonlogical constant. Given Rigid Power, each of
  those instances is true, and No Pure Contingency makes a true closed pure sentence necessary.
