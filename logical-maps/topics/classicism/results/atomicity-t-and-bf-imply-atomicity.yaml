proof: 'Let $X^{\bar\sigma t}\ne\bot$. Intensionality’s contrapositive gives $\Diamond\exists\bar y\,
  .\,X\bar y$, and BF at the argument types gives $\bar x$ with $\Diamond X\bar x$. Atomicity at type
  $t$ gives an atom $w\le X\bar x$. Then $A:=\lambda\bar y\, .\,w\land\bar y=\bar x$ is below $X$, since
  $\Box(w\to X\bar x)$ and Leibniz’s law give $\Box\forall\bar y\, .\,A\bar y\to X\bar y$; and $A$ is
  an atom: $A\bar x=w\ne\bot$, and for $Z\le A$ the proposition $Z\bar x\le w$ is $w$ or $\bot$, giving
  $Z=A$ or $Z=\bot$ by Intensionality. Details in the write-up.'
