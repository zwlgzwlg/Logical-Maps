notes: Closes the gap between the type-t instance of Atomicity and the full principle under BF. With the
  recorded results, Atomicity (type t) and BF now give □Actuality, the Strong Leibniz Biconditionals,
  and under □ND the full C5 + Atomicity package from its type-t instance. Without BF the passage from
  a possible relation to a possible instance can fail, so the premise is not idle.
