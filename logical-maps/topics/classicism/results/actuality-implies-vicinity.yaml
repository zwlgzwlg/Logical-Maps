proof: >-
  Let $w$ witness Actuality and let $q$ be true. Then $w\le q$, i.e. $\Box(w\to q)$. By T, $q\to\Diamond
  q$ is a theorem of C, so by necessitation $\Box(q\to\Diamond q)$, and K gives $\Box(w\to\Diamond q)$,
  i.e. $w\le\Diamond q$. So $w$ witnesses Vicinity.
notes: The implication Actuality → Vicinity is a theorem of C, which is what the boxed version uses.
