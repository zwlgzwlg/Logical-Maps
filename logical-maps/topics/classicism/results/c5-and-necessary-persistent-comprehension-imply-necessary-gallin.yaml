proof: >-
  The proof of c5-and-persistent-comprehension-imply-gallin uses its premises only at finitely many closed instances and nothing beyond C.
  So for each closed instance of the conclusion, C proves the conditional from the corresponding premise
  instances to it. Necessitate that theorem and apply K with the boxed premise instances. C5 is itself boxed, and 4 gives $\Box\Box$ND from $\Box$ND, which is what K needs here.
  Generalization over the admitted types is metalinguistic; no type quantifier is placed inside the box.
