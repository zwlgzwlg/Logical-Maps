proof: For each closed sentence $P$ of $\mathcal L(\Sigma)$, if $P$ is true it is materially equivalent
  to $\top$, hence identical to $\top$ by the Fregean Axiom. Thus $P\to\Box P$. Purity of $P$ plays no
  role.
