proof: Let $c_1,\ldots,c_k$ be the distinct constants among $a_1\ldots a_n,b_1\ldots b_m$, none occurring
  in $F$ or $G$, with $\pi x_j=c_j$. Put $F^{\prime}:=\lambda x_1\ldots x_k\, .\,F(\pi a_1)\cdots(\pi
  a_n)$ and $G^{\prime}:=\lambda x_1\ldots x_k\, .\,G(\pi b_1)\cdots(\pi b_m)$. Neither contains any $c_j$,
  and by $\beta$, $F^{\prime}c_1\cdots c_k=Fa_1\cdots a_n$ and $G^{\prime}c_1\cdots c_k=Gb_1\cdots b_m$.
  Assume the antecedent. Then $(F^{\prime}c_1\cdots c_{k-1})c_k=(G^{\prime}c_1\cdots c_{k-1})c_k$ and
  $c_k$ does not occur in the two applied terms, so Separated Structure gives $F^{\prime}c_1\cdots c_{k-1}=G^{\prime}c_1\cdots
  c_{k-1}$. After $k$ such steps, $F^{\prime}=G^{\prime}$, which is the consequent. If $k=0$ the schema
  is trivial.
