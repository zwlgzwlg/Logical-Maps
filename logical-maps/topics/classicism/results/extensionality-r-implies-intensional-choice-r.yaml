proof: >-
  Extensionality at type $t$ identifies every truth with $\top$, so $p\to\Box p$ for every
  proposition $p$. Let $F$ be necessarily instantiated. By T it is instantiated, say by $a$, and then
  $\Box Fa$. Put $G:=\lambda x\, .\,x=a$. Then $\Box\forall x\, .\,Gx\to Fx$, that is $G\le F$, and
  $\exists x\, .\,(Gx\land\forall y\, .\,Gy\to y=x)$ is a theorem, hence necessary.
