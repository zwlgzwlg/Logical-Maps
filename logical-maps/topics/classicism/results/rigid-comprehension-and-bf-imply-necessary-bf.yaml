proof: Choose a rigid property F coextensive with self-identity. Persistence gives $\forall x\, .\,\Box
  Fx$ and BF gives $\Box\forall x\, .\,Fx$. The inextensibility of F supplies boxed BF with its quantifiers
  restricted to F. Inside the box everything is F, so the restrictions can be removed. This is the boxed,
  universally closed BF instance at the chosen type.
