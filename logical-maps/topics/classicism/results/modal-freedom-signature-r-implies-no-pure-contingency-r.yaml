proof: 'Take both constant tuples empty and $Q:=\neg P$ for a closed pure $P$: the instance reads $\Diamond
  P\land\Diamond\neg P\to\Diamond(P\land\neg P)$, whose consequent is $\Diamond\bot$, false. So $\neg(\Diamond
  P\land\Diamond\neg P)$, i.e. $\Box P\lor\Box\neg P$, and with T, $P\to\Box P$.'
