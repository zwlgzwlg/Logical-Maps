notes: Records the observation, previously only in the principle’s notes, that the constant-free instance
  of Modal Freedom (signature Σ) is No Pure Contingency. With the recorded converse-direction facts, Modal
  Freedom (signature Σ) sits between No Contingency (signature Σ) and No Pure Contingency, and every model
  refuting No Pure Contingency refutes it.
