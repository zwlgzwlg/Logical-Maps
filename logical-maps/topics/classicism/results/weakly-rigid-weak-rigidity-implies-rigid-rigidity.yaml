proof: >-
  Fix the type tuple $\bar\sigma$, with $W:=\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)$ and $R:=\lambda
  Y\, .\,\operatorname{Rigid}(Y)$. By weakly-rigid-weak-rigidity-implies-necessary-tame-rigidity at
  $\bar\sigma$, and T for the converse, $W$ and $R$ are necessarily coextensive, hence identical; so $R$
  is weakly rigid. The same result at the one-element tuple $(\bar\sigma t)$ gives Tame Rigidity for
  properties of type $(\bar\sigma t)t$, so $R$ is rigid. The argument uses the principle at two types.
