notes: >-
  The induction stays inside the presentation that $\operatorname{Suc}_t$ supplies, applying the hypothesis
  to the abstract $\lambda u\, .\,Xu\land u\ne y$ itself rather than to a coextensive property. That is
  what makes it go through without Extensionality. The recorded implication to the Infinity schema is a
  consequence of this one and is left in place as the shorter argument.
