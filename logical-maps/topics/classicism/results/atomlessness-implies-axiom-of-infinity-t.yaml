proof: >-
  Call $q$ a floor of $X^{tt}$ when $Xq$, $\Diamond q$, and no possible instance of $X$ lies strictly
  below $q$. Let $W$ be the property of cardinalities holding of $Z$ when every instance of $Z$ that has
  a possible instance has a floor.


  $W$ holds of $\mathbf{0}_t$, since its only instance has no instances at all, so the condition is vacuous.


  $W$ is closed under $\operatorname{Suc}_t$. Let $WY$ and $(\operatorname{Suc}_t Y)X$, and take the
  witness $y$ with $Xy$ and $Y(\lambda u\, .\,Xu\land u\ne y)$; write $X^-$ for that abstract, whose
  instances are exactly the instances of $X$ other than $y$. Suppose $X$ has a possible instance. If
  $X^-$ has none then $y$ is the only one, and is a floor. Otherwise the hypothesis on $Y$, applied to
  $X^-$ as $\operatorname{Suc}_t$ presents it, gives a floor $q$ of $X^-$. If $y$ is not possible, or
  is not strictly below $q$, then $q$ is a floor of $X$, since a possible instance of $X$ strictly below
  $q$ is either an instance of $X^-$, against the choice of $q$, or is $y$, which this case excludes.
  If instead $y$ is possible and strictly below $q$, then $y$ is a floor of $X$. For a possible instance
  $r$ of $X$ strictly below $y$ is not $y$, hence is an instance of $X^-$, and $r\le y\le q$. If $r=q$
  then $q\le y\le q$ makes $y=q$, against $y\ne q$; so $r$ is an instance of $X^-$ strictly below $q$,
  again against the choice of $q$.


  So every finite cardinality has the property. Now suppose some finite $Z$ held of $\lambda p\, .\,\top$.
  That property has the possible instance $\top$, since $\top\ne\bot$ in C, so it would have a floor $q$.
  Atomlessness applied to $q$ supplies a possible $q'$ with $q'\le q$ and $q'\ne q$, and $q'$ is an instance
  of $\lambda p\, .\,\top$, contradicting the floor. Hence no finite cardinality holds of $\lambda p\, .\,\top$.
