notes: >-
  Tame Rigidity applied to the top relation: weak inextensibility of $\top$ is BF and its
  inextensibility is $\Box$BF. With it the map derives the failure of Tame Rigidity in
  finite-support-two-object-all-maps, where BF holds and $\Box$BF fails.
