proof: The map’s C5 preset is necessary all-type necessary distinctness, equivalent over C to necessary
  5. Under it persistence implies invariance, so the rigidity predicates, their canonical representative
  carriers and their represented-power clauses coincide. Apply FTN. [Paper (PDF)](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.pdf);
  [source](https://github.com/dkodsi/Logical-Maps/blob/classicism-next-batch-2026-10-30/logical-maps/topics/classicism/papers/finite-type-necessitism.tex).
notes: There is deliberately no unguarded converse from invariant FTN to C5. The exact guarded characterization
  is in Appendix A.
