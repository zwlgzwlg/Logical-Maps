proof: The cited source construction makes a closed instance of Boolean Completeness false, so its negation
  is C-consistent. Pure Possibility Maximalism, equivalent to pure Distinctness Maximalism, says that negation is possible.
  The corresponding boxed instance of the second premise says it is impossible.
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §2.6, p. 41; Appendix D, Proposition D.5(1), pp. 74–76
notes: >-
  Goodsell, Arithmetic is Necessary, answers the question left open at the source's p. 41: the unboxed
  principle is already incompatible with Maximalist Classicism, and so is its countable restriction. See
  possibility-and-countable-boolean-completeness-incompatible.
