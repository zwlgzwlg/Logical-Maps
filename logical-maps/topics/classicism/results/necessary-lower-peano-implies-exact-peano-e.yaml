proof: >-
  Write R(q,l) for the least relation pairing the two zeros and closed under simultaneous successor.
  By induction R(q,l) implies, for every X, that l(X) holds iff some subproperty Y of X satisfies q(Y).
  R is persistent, by induction using the necessitated zero and successor introduction theorems.
  Thus two partners l,l' of the same q are necessarily coextensive and hence identical by Intensionality.
  This right-uniqueness result uses no Peano premise. Exact zero cannot be a successor: evaluate on the
  empty property. For finite exact m,n with Suc m = Suc n, take lower partners l,k. Right uniqueness
  gives Suc l = Suc k; LowerPeano gives l = k; the earlier left-uniqueness theorem gives m = n.
  This proves the stronger unboxed implication LowerPeano implies ExactPeano; modal T gives the recorded
  implication from NecessaryLowerPeano. Necessitating the implication and applying K also gives necessary
  ExactPeano from necessary LowerPeano.
