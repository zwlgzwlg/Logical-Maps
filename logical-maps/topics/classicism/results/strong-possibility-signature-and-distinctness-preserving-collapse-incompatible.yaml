proof: 'Let $Z$ be the closed pure sentence $\forall xy\, .\,x\ne y\to\Diamond(x\ne y\land E_2)$, where
  $E_2$ says that there are exactly two individuals: a closed instance of Possibility+ (pure). Both $Z$
  and $\neg Z$ are consistent with Max(C(Σ)): the constant-indexed coalesced root satisfies Possibility Maximalism
  (signature Σ) and Possibility+ (pure), hence $Z$, and the maximalist coalesced root satisfies Possibility Maximalism
  (signature Σ) and refutes exactly this instance of Possibility+ (pure). Since $Z$ is pure it is a sentence
  of $\mathcal L(\Sigma)$. Let $P$ be whichever of $Z$, $\neg Z$ is false. Strong Possibility (signature
  Σ) gives $\Diamond_{\ne}P$. Distinctness-preserving collapse applied to the truth $\neg P$ gives $\Box_{\ne}\neg
  P$, which is $\neg\Diamond_{\ne}P$.'
