notes: 'The Σ counterpart of the recorded incompatibility of Strong Possibility (pure) with the collapse.
  It cannot be derived from that record while the arrow from Strong Possibility (signature Σ) to Strong
  Possibility (pure) is conjectured, so it is proved directly, with the two recorded Possibility Maximalism (signature
  Σ) roots as the witnesses that Max(C(Σ)) settles neither $Z$ nor $

  eg Z$. The witnesses fix Σ as the constant-indexed root does, with infinitely many individual constants
  and a relational constant; the collapse holds at both roots. This is the one place where Strong Possibility
  bites beyond Possibility Maximalism: it makes $P$ possible under the distinctness-preserving modality, and the
  collapse denies exactly that of every falsehood.'
