proof: 'Use the functional relation taking each true proposition to itself and each false proposition
  to $\top$: $(p\land p=q)\lor(\neg p\land q=\top)$. Plenitude supplies Z with those values. The proposition
  $\forall p\, .\,Zp$ is true and entails Zp for every p, hence entails every true p. It witnesses Actuality.'
references:
- paper: bacon-dorr-classicism
