proof: 'Write $D=\Box_{\ne}$ and $S=\Box_5$. Current ND at $t$ gives $Dp\to\Box p$: a witness $q$ to $Dp$
  is true and satisfies $\Box(\Diamond q\to p)$; hence $q\ne\bot$, and ND gives $\Box(q\ne\bot)$, equivalently
  $\Box\Diamond q$. Normal modal reasoning yields $\Box p$. The assumed $Sp\to Dp$ therefore gives current
  $Sp\to\Box p$. The unconditional implications $\Box p\to Sp$ and [[box5-barcan]] now yield, at every
  admitted type, $\forall x\,\Box Rx\to\forall x\,S Rx\to S\forall x\,Rx\to\Box\forall x\,Rx$. Thus ordinary
  BF holds, in particular at $t$. Apply [[nd-t-and-bf-t-imply-necessary-nd-t]], then [[necessary-distinctness-necessary-t-implies-necessary-distinctness-necessary-r]].
  All applications of the local-collapse premise are current; no optional hypothesis is necessitated or
  substituted underneath a box.'
notes: Only the type-t instance of current ND is needed. The converse follows from existing results, so
  no reverse arrow is added. This is a short consequence of the credited 5-necessity Barcan theorem.
