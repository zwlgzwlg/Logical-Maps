notes: >-
  The right-to-left half of Theorem 8.2 is the recorded implication from □Atomicity and □BF
  (relational types) to □SL, which needs no Rigid Comprehension. The type-$t$ case, which the book proves in full, is derived
  through □BF (relational types) ⇒ □BF (type t).
