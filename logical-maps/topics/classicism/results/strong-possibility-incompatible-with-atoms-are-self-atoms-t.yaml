proof: >-
  Pure Strong Possibility alone gives the contradiction by [[strong-possibility-r-inconsistent]].

  Take the closed pure sentence $B$ used in [[strong-possibility-incompatible-with-barcan-t]]:
  $\Box\mathrm{ND}_t$, exactly one individual and exactly four propositions. Steps (1)–(3) of
  that proof establish $\vdash_C B\to\Box B$ and show that Strong Possibility (pure) gives
  $\operatorname{Atom}_t(B)$. At every $B$-point $B=\top$ and the four-element propositional
  algebra has a proper nonzero element. Hence $\vdash_C B\to\neg\operatorname{Atom}_t(B)$.
  A self-atom must be possible and necessarily an atom wherever true, so C proves
  $\neg\operatorname{SelfAtom}_t(B)$. The atom $B$ therefore refutes the proposed bridge.
