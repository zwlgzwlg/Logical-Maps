proof: For a fixed pure formula P, either P has a witness consistently with the reference C theory or
  it does not. In the first case interpreting the fresh constants as witnesses makes P[c/x] consistent,
  and signature Possibility Maximalism supplies its possibility. In the second case the reference theory proves there
  is no witness, so the required conditional has a false antecedent.
