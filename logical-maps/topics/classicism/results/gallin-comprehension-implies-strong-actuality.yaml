proof: >-
  Gallin Extensional Comprehension at type $t\to t$ gives $Y$ coextensive with $\lambda q\, .\,q$
  such that $Y$ and $\neg Y$ are both persistent. Put $p:=\forall q\, .\,Yq\leftrightarrow q$, which
  is true. Necessarily, every $q$ is settled by $p$: if $Yq$, persistence of $Y$ gives $\Box Yq$, so
  $\Box(p\to q)$, that is $p\le q$; if $\neg Yq$, persistence of $\neg Y$ gives $\Box\neg Yq$, so
  $p\le\neg q$. Both persistence conditions are boxed, so this holds at every world, giving
  $\Box\forall q\, .\,p\le q\lor p\le\neg q$. So $p$ is a true strong world.
references: []
notes: >-
  Only the type-$t\to t$ instance is used. With separated-retractions-strong-actuality this refutes
  Gallin Extensional Comprehension in every model with separated retractions, such as
  full-two-object-double-retraction, which has ND and □Rigid Comprehension; so neither ND with
  Weak Rigid Comprehension nor ND with □Rigid Comprehension gives it.
