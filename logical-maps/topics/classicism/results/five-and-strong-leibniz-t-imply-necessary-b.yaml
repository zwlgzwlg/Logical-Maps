proof: >-
  Strong worlds are necessarily strong: if $\operatorname{SWorld}(w)$, then 5 gives $\Box\Diamond w$
  and 4 gives $\Box\Box\forall Y\,(w\le Y\lor w\le\neg Y)$, so $\Box\operatorname{SWorld}(w)$. Let
  $q:=\exists w\, .\,\Box\operatorname{SWorld}(w)\land w$. Then $\Box q$: if $\Diamond\neg q$, the
  Strong Leibniz Biconditionals give a strong world $w\le\neg q$, and $\Box\Box\operatorname{SWorld}(w)$
  by the above and 4, so at a world where $w$ holds, as one does since $\Diamond w$, $q$ holds too,
  contradicting $w\le\neg q$. Next, $q\to\forall p\, .\,p\to\Box\Diamond p$ is a theorem of C: given
  $\Box\operatorname{SWorld}(w_0)\land w_0$ and a true $p$, T twice gives $w_0\le p$ or $w_0\le\neg p$,
  and the second contradicts $w_0\land p$; and $\Box\operatorname{SWorld}(w_0)$ gives $\Box\Diamond
  w_0$, so $w_0\le p$ gives $\Box\Diamond p$. Necessitating this theorem and applying K to $\Box q$
  gives $\Box\forall p\, .\,p\to\Box\Diamond p$, which yields each closed instance of $\Box$B.
