notes: >-
  5 is equivalent to ND in C, by the recorded results, so this gives □ND from ND and the Strong
  Leibniz Biconditionals (type t). 5 is used only to make the strong worlds necessarily possible. Weak
  worlds do not suffice: ND with □Atomicity (type t) does not give □ND, by the recorded models.
