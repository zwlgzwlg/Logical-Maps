source_names:
- Classicism
proof: >-
  In C, $\Diamond q$ is $q\ne\bot$. Let $q$ be true. By T, $q\ne\bot$, so ND at type $t$ gives $\Box(q\ne\bot)$,
  i.e. $\Box\Diamond q$, which is $\top\le\Diamond q$. So $\top$ witnesses Vicinity.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §1.5, pp. 15–17; Proposition 2.2, p. 22
notes: With Vicinity and Weakly Inextensible Comprehension ⇒ Actuality, this gives Actuality from ND (type
  $t$) and Weakly Inextensible Comprehension, in particular under C5.
