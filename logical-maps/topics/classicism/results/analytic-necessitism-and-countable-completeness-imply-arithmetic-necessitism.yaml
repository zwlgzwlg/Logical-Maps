proof: Fix sigma, nu=(sigma t)t and rho=nu t, and assume the Arithmetic Necessitism guard Box I*_sigma.
  Current CBC at counting type sigma and join type rho gives a unique algebraic join of the numerical
  haecceities belonging to each current rational cut. Number persistence bounds that join by N; necessary
  numerical distinctness bounds it by the complement of each omitted singleton. Thus it has exactly the
  cut extension. Equal current cuts have the same literal join, so one lambda-defined family supplies
  literal cut representatives and a current complete ordered field at rho. Current AN at rho supplies
  a rigid necessarily-real reference field, and the fixed-reference theorem makes the canonical numbers
  rigid and necessarily distinct. The accompanying proof treats the exact counting instance, arbitrary
  admitted bounded families, and the stronger current-I* field-existence lemma.
notes: Only the current CBC instance joining rho-entities, where rho=((sigma t)t)t, is needed for each
  sigma. No Transversal, boxed CBC, or propositional-only CBC premise is substituted. Current CBC already
  implies Necessity of Arithmetic; that truth consequence is not an additional new result.
