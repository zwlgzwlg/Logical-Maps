proof: >-
  Let $a$ witness Actuality and write $L(a)$ for $a\land\forall q\, .\,q\to a\le q$. As in the recorded
  derivation of Inextensible Comprehension from the same premises, Distinctness-preserving collapse
  applied to the truth $L(a)$ gives a true $q^*$ with $\Box(\Diamond q^*\to L(a))$, and since $a\le
  q^*$, 4 and K give $\Box(\Diamond a\to L(a))$. Two theorems of C: (i) $L(a)\to\forall q\, .\,a\le
  q\lor a\le\neg q$, since one of $q$ and $\neg q$ is true and $a$ entails it; (ii) $\neg\Diamond
  a\to\forall q\, .\,a\le q\lor a\le\neg q$, since then $a=\bot\le q$. So $(\Diamond a\to
  L(a))\to\forall q\, .\,a\le q\lor a\le\neg q$ is a theorem; necessitating it and applying K gives
  $\Box\forall q\, .\,a\le q\lor a\le\neg q$. With $a$ true, $a$ witnesses Strong Actuality.
