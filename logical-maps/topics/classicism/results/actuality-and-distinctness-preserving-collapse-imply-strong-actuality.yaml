notes: >-
  Given the collapse principle, the Actuality witness is necessarily either the least truth or
  impossible, and either way necessarily settles every proposition (Cian Dorr's observation). Every
  action model whose actual world is isolated satisfies the collapse principle, so this settles
  Strong Actuality in all of them.
