notes: >-
  Equivalent to the claim that a finite count of propositions is necessary whenever it is true. It holds
  with No Pure Contingency and with BF (type $t$), by the recorded results. If some finite $Z$ holds of
  $\lambda p\, .\,\top$ then every proposition is one of finitely many, and NI carries each identity
  across, but collecting them under a box is an instance of BF at type $t$, which C does not prove. A
  proof would need to bypass that; a countermodel would need a world with finitely many propositions that
  can see one with more, and must violate both BF (type $t$) and No Pure Contingency.
