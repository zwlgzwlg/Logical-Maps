proof: 'See [the common proof](../writeups/necessary-world-atomicity.md), §§1–2. Coverage makes a true necessarily atomic proposition necessarily available. Such a proposition witnesses Actuality and forces current propositional ND. Necessitating the closed implication yields necessary Actuality and necessary propositional ND. The recorded type-transfer theorem gives C5; the native C5 plus necessary Actuality theorem gives Atomicity, and C5 plus Atomicity gives boxed Plenitude.'
notes: No optional premise is necessitated. Necessary nonzeroness is used in deriving ND; strong atomhood alone does not suffice. The all-type boxed Gallin consequence follows through existing results.
