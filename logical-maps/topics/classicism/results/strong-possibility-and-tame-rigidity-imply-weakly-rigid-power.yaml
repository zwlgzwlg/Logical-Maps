proof: >-
  By [[strong-possibility-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Weakly Rigid Power.

  By [[strong-possibility-implies-rigid-power]], every current rigid relation
  has Frege-finite extension at a pure Strong Possibility point. Under local
  Tame Rigidity this applies to every current weakly rigid relation. The
  [[internally-finite-rigid-power|internally finite bound theorem]] identifies
  its weak and full power predicates as entire entities and shows that they
  are rigid. The weak predicate is therefore weakly rigid.
notes: >-
  The converse from Weakly Rigid Power to Tame Rigidity already holds in C.
