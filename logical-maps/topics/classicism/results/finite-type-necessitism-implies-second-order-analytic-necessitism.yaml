proof: Full FTN contains the height-one instance at every carrier type. By Theorem 4.3 this is equivalent
  to SOAN at that type. The proof uses same-carrier Dedekind cuts in one direction, Cantor subset codes
  in the other, and unary-to-finite-arity represented powers (Lemma 4.1). See the linked paper, Definition
  1.1 and Theorem 4.3.
notes: Schema restriction; no new existence assumption.
