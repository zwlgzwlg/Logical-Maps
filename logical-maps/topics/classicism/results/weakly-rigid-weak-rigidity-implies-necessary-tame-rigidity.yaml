proof: >-
  Fix the type tuple and let $W:=\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)$. A weakly rigid relation is
  persistent (Background: apply weak inextensibility to $\lambda\bar x\, .\,\Box W[\bar x]$, using weak
  persistence and 4). So $\Box\forall Y\,
  .\,\operatorname{WeaklyRigid}(Y)\to\Box\operatorname{WeaklyRigid}(Y)$, and
  $\Box\operatorname{WeaklyRigid}(Y)$ is $\operatorname{Rigid}(Y)$. This is the instance of □Tame Rigidity
  at the same tuple.
