proof: >-
  Fix the type tuple. □Tame Rigidity, with T for the converse, makes $\lambda Y\,
  .\,\operatorname{WeaklyRigid}(Y)$ and $\lambda Y\, .\,\operatorname{Rigid}(Y)$ necessarily coextensive,
  hence identical. Rigid Rigidity makes the latter rigid, so by T weakly rigid.
