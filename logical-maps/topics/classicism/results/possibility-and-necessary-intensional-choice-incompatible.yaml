proof: >-
  The type-$e$ instance of Intensional Choice fails in symmetric-all-surjections, a model of C. Let $a$ be
  an individual and $F:=\lambda x\, .\,x\ne a$, which is necessarily instantiated since every world has
  infinitely many individuals. Suppose $G\le F$ is necessarily uniquely instantiated, pinned down by a
  finite $N\ni a$. Let $h$ be a surjection sending all of $N$ to one individual $p$; at $h$, $G$ has a
  single instance $y\neq p$, since $G\le F$ and $h(a)=p$. A permutation $\sigma$ fixing $p$ and moving $y$
  gives an arrow $\sigma\circ h$ agreeing with $h$ on $N$, so by pinning $G$ has the same extension at both
  arrows, while by symmetry its extension at $\sigma\circ h$ is $\{\sigma(y)\}$. Contradiction. So the
  negation of that closed pure instance is consistent with C, Possibility Maximalism (pure) makes it
  possible, and □Intensional Choice says the instance is necessary.
