notes: >-
  The lemma uses only the unboxed persistence of $F$ and $G$, so Rigid Comprehension makes every very
  weakly rigid relation rigid as well. With Rigid Comprehension ⇒ Weak Rigid Comprehension, this gives
  Sun's equivalence of Rigid Comprehension with Tame Rigidity plus Weak Rigid Comprehension.
