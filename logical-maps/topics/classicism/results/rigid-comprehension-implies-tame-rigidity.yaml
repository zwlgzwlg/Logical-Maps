proof: >-
  Lemma: coextensive weakly rigid relations are identical. Let $F$ and $G$ be weakly rigid with
  $\forall\bar x\, .\,F[\bar x]\leftrightarrow G[\bar x]$. If $F[\bar x]$ then $G[\bar x]$, and T
  applied to $\operatorname{Persistent}(G)$ gives $\Box G[\bar x]$. So
  $\forall\bar x\, .\,F[\bar x]\to\Box G[\bar x]$, and the weak inextensibility of $F$, instantiated at
  $G$, gives $F\le G$. Symmetrically $G\le F$. Together these say
  $\Box\forall\bar x\, .\,F[\bar x]\leftrightarrow G[\bar x]$, and necessarily coextensive relations are
  identical in C (Intensionality), so $F=G$. Now let $F$ be weakly rigid. Rigid Comprehension at the
  same type supplies a rigid $G$ coextensive with $F$. A rigid relation is weakly rigid, since T strips
  the leading box from $\operatorname{Inextensible}(G)$. By the lemma $F=G$, so $F$ is rigid.
