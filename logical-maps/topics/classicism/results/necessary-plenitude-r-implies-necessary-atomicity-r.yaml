notes: 'The general pattern: a theorem whose premise is already boxed yields the boxed conclusion from
  the same premise, by 4 and K. With □ND ⇒ □BF and □Atomicity + □BF ⇒ □SL this recovers the book’s remark
  (p. 176) that □Functional Choice yields the Strong Leibniz Biconditionals.'
