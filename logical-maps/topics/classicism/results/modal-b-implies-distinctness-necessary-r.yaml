proof: Assume $x\ne y$. B gives $\Box\neg\Box(x=y)$. The necessitation of NI gives $\Box(x=y\to\Box(x=y))$.
  Within the box, contraposition yields $\neg(x=y)$, and K therefore yields $\Box(x\ne y)$. The argument
  is uniform at each type.
