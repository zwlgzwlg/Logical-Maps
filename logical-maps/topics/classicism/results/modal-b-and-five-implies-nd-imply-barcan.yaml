proof: >-
  Given $\Box_{\ne}p$, choose a true $q$ with $\Box(\Diamond q\to p)$.
  Modal B yields $\Box\Diamond q$, so K gives $\Box p$. For a relation $F$
  of any input type, suppose every current $x$ satisfies $\Box Fx$.
  Then each satisfies $\Box_5Fx$ by the ordering of the operators in C.
  The [[box5-barcan|Barcan formula for 5-necessity]] gives $\Box_5\forall x\,Fx$.
  The second premise gives $\Box_{\ne}\forall x\,Fx$ and the first step
  yields $\Box\forall x\,Fx$.
notes: >-
  Both premises are local. Modal B is equivalent in C to ND at type $t$:
  follow [[modal-b-implies-distinctness-necessary-r]],
  [[distinctness-necessary-r-implies-distinctness-necessary-t]],
  [[distinctness-necessary-t-implies-modal-five]] and [[modal-five-implies-modal-b]].
  Thus Plenitude also suffices as the first premise by
  [[plenitude-r-implies-distinctness-necessary-r]], and Functional Choice suffices by
  [[functional-choice-r-implies-plenitude-r]].
