proof: >-
  Signature Strong Possibility alone gives the contradiction by [[strong-possibility-signature-r-inconsistent]].

  For first-order signatures use the pure tester on operators Y which says
  that every necessarily Boolean involution fixing all current scalars under
  necessary individual Barcan also fixes Y by conjugation. Such involutions
  respect quantifiers by Prior’s Barcan argument and fix all first-order names,
  hence all closed descriptors. At a finite point over a four-world S5 clique,
  the admitted scalar traces are unions of two pairs. A swap inside one pair
  fixes all these traces, but moves the operator that exchanges the pairs
  under conjugation. At the signature-definable Maximalist root
  every current operator therefore passes the test necessarily, although the
  tester is not top. These universal identity conditions reflect from ND
  possibility to the signature Strong Possibility point, refuting Barcan at
  input type tt. Signatures with a higher-order constant fall under the
  established Russell–Myhill inconsistency.
notes: >-
  The first-order argument allows arbitrarily many individual names,
  propositional names and predicates on individuals, of unbounded finite
  arity. The scalar-input Barcan question remains distinct.
