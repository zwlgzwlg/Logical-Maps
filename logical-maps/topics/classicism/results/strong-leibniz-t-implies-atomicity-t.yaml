proof: 'A strong world proposition is an atom: from $\Box\forall q\, .\,w\le q\lor w\le\neg q$, T gives
  $\forall q\, .\,w\le q\lor w\le\neg q$, and with $w\ne\bot$ this is $\operatorname{Atom}_t(w)$. A possible
  $p$ is a non-bottom $p$. So the strong world below $p$ is an atom below it.'
