proof: If the closed Sigma-sentence P is consistent with C(Sigma), Max(C(Sigma)) proves $\Diamond P$.
  The source consistency theorem for that maximalization therefore makes $\Diamond P$ consistent with
  it. Strong Possibility yields $\Diamond_{\ne}\Diamond P$, hence $\Diamond\Diamond P$ and $\Diamond P$
  by 4. The signature and reference theory remain fixed throughout.
