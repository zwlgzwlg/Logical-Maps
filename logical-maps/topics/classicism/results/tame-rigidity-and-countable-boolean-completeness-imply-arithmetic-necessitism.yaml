proof: >-
  Fix $\sigma$. By Goodsell's Lemma 3 every current number is necessarily a number.
  By Lemma 8, Countable Boolean Completeness at the counting type $\sigma$ and relation
  type $\nu_\sigma t$, where $\nu_\sigma=(\sigma t)t$, gives weak inextensibility of
  $\mathbb N_\sigma$. Its weak persistence and weak inextensibility give weak rigidity.
  Tame Rigidity at $\nu_\sigma t$ makes $\mathbb N_\sigma$ rigid. Lemma 4 makes
  distinct current numbers necessarily distinct under the principle's own antecedent
  $\Box I^*_\sigma$.
notes: >-
  Consequently Rigid Comprehension at the evaluation point suffices, by
  [[rigid-comprehension-implies-tame-rigidity]],
  [[rigid-comprehension-r-implies-boolean-completeness-r]], and
  [[boolean-completeness-r-implies-countable-boolean-completeness-r]].
