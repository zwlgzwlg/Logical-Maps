notes: >-
  Recorded from Possibility Maximalism because the proof applies its consistency side condition to one sentence,
  $\Pi$, which quantifies over every finite cardinality at once. That is what reaches the domain over
  which $\operatorname{FiniteCardinality}$ quantifies, where the numeral-by-numeral argument recorded for
  the Infinity schema could not. The equivalent Distinctness Maximalism form gives the same result through the
  recorded equivalence, so Pure Maximalist Classicism implies the Axiom of Infinity at type $t$. ND is
  never used. The sentence $\Pi$ is not implied by the Axiom of Infinity at type $e$, by the model
  full-henkin-infinite-base. The argument can also be run entirely at type $t$, using the powers of two as
  the possible numbers of propositions; the write-up sketches this variant without carrying it out.
