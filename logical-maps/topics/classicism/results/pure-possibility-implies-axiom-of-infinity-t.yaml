proof: >-
  Write $g(Z)$ for $(\operatorname{Suc}_e Z)(\lambda x^e\, .\,\top)$ and let $\Pi$ be the closed pure
  sentence $\forall Z^{(et)t}\, .\,\operatorname{FiniteCardinality}_e(Z)\to\Diamond g(Z)$: there could be
  any positive number of individuals. Zero must be left out, since Existence makes
  $\mathbf{0}_e(\lambda x\, .\,\top)$ identical to $\bot$. $\Pi$ is true at the root of the model
  coalesced-all-finite-individual-domains, so it is consistent with C and Possibility Maximalism gives $\Diamond\Pi$.
  Being a finite cardinality is persistent, and the defined necessity satisfies 4, so $\Diamond\Pi$ yields
  $\Pi$ itself. Under $\Pi$ the map $g$ is injective on finite cardinalities: two finite cardinalities are
  either identical or necessarily share no instance, by an induction that stays inside the presentation
  $\operatorname{Suc}_e$ supplies, and the second disjunct is excluded when the two values of $g$ coincide
  and are possible. Hence the propositions $g(Z)$, $Z$ finite, carry a copy of the successor structure:
  the relation taking $g(Z)$ to $g(\operatorname{Suc}_e Z)$, and every other proposition to itself, is
  total and injective on $\lambda p\, .\,\top$ and misses $g(\mathbf{0}_e)$. A property with such a
  relation has no finite cardinality, by induction on the cardinality. So no finite cardinality of type
  $(tt)t$ holds of $\lambda p\, .\,\top$. The full proof, with the six lemmas, is in the write-up.
