proof: With accumulator Num(α) → t, positional observations separate generated sequences and prove cons
  injective and disjoint from the empty sequence using unboxed Church Numeral Infinity. These constructor
  laws give functionality of the least recursion relation. Boxed Infinity gives necessary functionality;
  persistence follows from minimality without Infinity. Pointwise universal projection gives the desired
  function by Intensionality. See the full write-up.
