proof: >-
  Let $w$ witness Actuality and fix $F$ of type $\bar\sigma t$. Put $C:=\lambda\bar z\, .\,\Diamond(w\land
  F[\bar z])$. $C$ is coextensive with $F$: if $F[\bar z]$ then $w\land F[\bar z]$ is true, hence possible;
  if $\neg F[\bar z]$ then $w\le\neg F[\bar z]$ by Actuality, so $\neg\Diamond(w\land F[\bar z])$. For
  inextensibility, two theorems of C: (i) $\neg C[\bar z]$ is $\Box(w\to\neg F[\bar z])$, so by 4
  $\neg C[\bar z]\to\Box\neg C[\bar z]$, and hence $(C[\bar z]\to\Box X[\bar z])\to\Box(C[\bar z]\to
  X[\bar z])$; (ii) therefore $(\forall\bar z\, .\,C[\bar z]\to\Box X[\bar z])\to\forall\bar z\,
  .\,\Box(C[\bar z]\to X[\bar z])$. The closed instance of BF for the property $\lambda\bar z\, .\,C[\bar
  z]\to X[\bar z]$, universally closed in $X$, turns the consequent of (ii) into $\Box\forall\bar z\,
  .\,C[\bar z]\to X[\bar z]$, which is $C\le X$. So BF (this instance) implies $\forall X\, .\,(\forall\bar
  z\, .\,C[\bar z]\to\Box X[\bar z])\to C\le X$ in C; necessitating and using the necessity of that
  instance gives $\Box\forall X\, .\,(\forall\bar z\, .\,C[\bar z]\to\Box X[\bar z])\to C\le X$, which
  is $\operatorname{Inextensible}(C)$. The box on BF is used exactly once, to discharge the instance
  under the leading box of inextensibility.
