notes: >-
  Actuality alone gives the coextensive witness and its weak inextensibility at the actual world;
  □BF is what makes the same witness inextensible at every world. The map records that BF alone does not
  give □BF (the two-object all-maps model), so the argument does not establish the claim from Actuality
  and unboxed BF; whether Actuality and BF give □BF, or Inextensible Comprehension by another witness,
  is open.
  Together with the recorded routes, Inextensible Comprehension now follows from Actuality with any of
  □BF, Distinctness-preserving collapse, or C5 (through Rigid Comprehension); the □BF route explains the
  verdict in the full permutation-group, involution-group and surjection-monoid models, which have
  Actuality and □BF but not Distinctness-preserving collapse.
