proof: 'Under the Fregean Axiom a true $p$ is materially equivalent to $\top$, hence identical to it,
  so $\Box p$. And $\Box p$ gives $\Box_{\ne}p$: take $q:=\top$, which is true, and $\Box(\Diamond\top\to
  p)$ is $\Box p$.'
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.6, p. 42; §1.4, pp. 15–16
notes: 'With the converse record, the collapse is equivalent to the Fregean Axiom in the presence of ND,
  while without ND it is weaker: the coalesced-sum roots satisfy it with infinitely many propositions.'
