proof: $\neg\exists\bar x\, .\,P$ is a closed pure sentence, so No Pure Contingency gives $\neg\exists\bar
  x\, .\,P\to\Box\neg\exists\bar x\, .\,P$; contraposing, $\Diamond\exists\bar x\, .\,P\to\exists\bar
  x\, .\,P$. Witnessed Possibility then gives $\Diamond P[\bar c/\bar x]$.
