proof: >-
  Gallin supplies a current truth evaluator E with necessarily endpoint-valued outputs and gives
  current ND. A current self-atom Q is therefore an ordinary atom. Its normalized order-character
  J(X)=E(Q<=X) is currently Boolean, necessarily endpoint-valued, and sends Q to top. A future
  counterexample to a finite Boolean law would be a disagreement between fixed endpoints and
  remain a counterexample thereafter. Current B applied to the whole universally quantified law
  rules this out, so the character is necessarily Boolean even on new future inputs. At a future
  point its endpoint value on Z persists. At any later instance of Q, self-atomhood makes Q an
  atom; the Boolean character forces its decision of Z to agree with that endpoint. Thus Q
  necessarily decides every future Z, making it strong. The accompanying write-up proves each
  step with full future-domain quantification.
notes: >-
  One current all-type implication, including type t. The added step applies the earlier evaluator
  method to an atom's order-character; it is not a new evaluator-existence theorem or a claim that
  all ordinary atoms are strong. The quantifier over self-atoms remains current. No boxed
  self-atoms-strong conclusion follows here from current Gallin, and the boxed-Gallin consequence
  was already recorded. No future truth correctness for E, Barcan assumption, or necessitation
  of an optional premise is used.
