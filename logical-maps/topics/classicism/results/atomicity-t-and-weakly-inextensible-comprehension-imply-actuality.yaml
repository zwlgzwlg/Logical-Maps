proof: >-
  By Weakly Inextensible Comprehension at type $t\to t$, let $X^*$ be weakly inextensible and coextensive
  with $\lambda p\, .\,\top$. That is: (i) $\forall q\, .\,X^*q$; and (ii) for every $Y$, if $\forall
  p\, .\,X^*p\to\Box Yp$, then $X^*\le Y$, i.e. $\Box\forall q\, .\,X^*q\to Yq$. It suffices to prove
  (C) $\exists p\, .\,p\land\forall q\, .\,X^*q\to(p\le q\lor p\le\neg q)$, since Actuality follows from
  (C) together with (i): by (i), a witness $p$ for (C) is true and satisfies $p\le q\lor p\le\neg q$
  for every $q$, and when $q$ is true $p\le\neg q$ is impossible, so $p\le q$.


  Proof of (C). Atomicity (type $t$) implies that a proposition entailed by every atom is necessary: if
  $\neg$(C) were not $\bot$, it would have an atom below it, and that atom would entail both (C) and
  $\neg$(C). So it suffices to show that every atom $w$ entails (C). Since $w$ is an atom, $w\le q\lor
  w\le\neg q$ for every $q$. Entailments are necessary if true, so $\forall q\, .\,\Box(w\le q\lor w\le\neg
  q)$, and a fortiori $\forall q\, .\,X^*q\to\Box(w\le q\lor w\le\neg q)$. By (ii) with $Y:=\lambda q\,
  .\,w\le q\lor w\le\neg q$, $\Box\forall q\, .\,X^*q\to(w\le q\lor w\le\neg q)$. So $\Box(w\to w\land\forall
  q\, .\,X^*q\to(w\le q\lor w\le\neg q))$, and by existential generalization $w\le$(C).
