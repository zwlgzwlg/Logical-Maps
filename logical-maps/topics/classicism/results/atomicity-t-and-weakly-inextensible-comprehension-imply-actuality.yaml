notes: >-
  Only one instance of Weakly Inextensible Comprehension is used: at type $t\to t$, for $X=\lambda p\,
  .\,\top$. The weakly inextensible $X^*$ does the work that BF does in the derivation of Actuality from
  Atomicity and BF: it lets the pointwise necessities $\forall q\, .\,\Box(w\le q\lor w\le\neg q)$ be
  combined into a necessitated universal, restricted to $X^*$, while (i) restores every proposition at
  the actual world. Since Boolean Completeness implies Weakly Inextensible Comprehension, Atomicity (type
  $t$) and Boolean Completeness also imply Actuality. This settles the step of Classicism, Proposition
  2.11, n. 42, part (ii), which derives Actuality from the proposition's premises by appeal to a result
  stated only for C5. It also explains why finite-support-truncations, which has Atomicity without Actuality,
  fails Weak Inextensible Comprehension. Compare vicinity-and-weakly-inextensible-comprehension-imply-actuality,
  which uses the instance for $X=\lambda p\, .\,p$. The argument came out of an attempt, on 1 October
  2026, to build a model of Atomicity and Boolean Completeness without Actuality.
