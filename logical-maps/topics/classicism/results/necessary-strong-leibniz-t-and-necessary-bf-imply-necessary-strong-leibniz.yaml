notes: 'The unboxed form, Strong Leibniz Biconditionals (type t) + BF ⇒ Strong Leibniz Biconditionals,
  is already derivable on the map through Atomicity: SL (t) gives Atomicity (t), Atomicity (t) + BF gives
  Atomicity, and Atomicity + BF gives SL. The direct construction above proves it in one step and is what
  is necessitated here; the boxed form was not derivable, since no record boxes the type-t instance of
  Atomicity. Only BF at the argument types of the target type is used, as in atomicity-t-and-bf-imply-atomicity.'
