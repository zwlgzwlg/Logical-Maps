proof: >-
  See the write-up. Suppose a preorder $R$ has upper bounds for all its chains and no maximal
  element. Relational Choice, which follows from Transversal Choice, gives a functional relation
  choosing, for each chain $C$, something strictly above all of $C$. Composing it with a transversal
  of coextensiveness at $\sigma t$, which Transversal Choice also gives, makes it extensional:
  coextensive chains receive the same value. Lewin's argument then translates step by step, with
  properties for sets and existential quantification for unions: the union of the conforming
  properties is conforming, and extending it by its chosen value gives a conforming property not
  included in it, a contradiction.
references:
- paper: lewin-1991
  role: proof
  locator: pp. 353–354
  note: >-
    Lewin proves Zorn's Lemma for partial orders on sets from a choice function. The translation
    replaces sets by properties and the choice function by a functional relation, adapts the
    argument to preorders, and uses Transversal Choice to make the relation extensional, which Lewin
    uses at four steps without comment.
notes: >-
  Only extensionality of the choice relation goes beyond Relational Choice: at four steps two
  properties are shown to be coextensive and must receive the same value. Since Zorn's Lemma
  implies Well-Ordering and so Transversal Choice, proving it from Relational Choice alone would
  settle whether Relational Choice implies Transversal Choice, which is open.
