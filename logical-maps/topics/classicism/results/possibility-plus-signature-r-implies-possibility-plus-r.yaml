proof: A pure $P$ is a formula of $\mathcal L(\Sigma)$ containing no constants, so the clause distinguishing
  the $x_i$ from named individuals is the empty conjunction, and $P$ consistent with C is consistent with
  $C(\Sigma)$, since adjoining uninterpreted constants is conservative. The instance of the signature
  schema is the instance of the pure one.
