proof: >-
  Fix the type tuple $\bar\sigma$ and put $T:=\lambda\bar x\, .\,\top$. $T$ is weakly persistent
  trivially, and weakly inextensible by BF at each type in the tuple: if $\forall\bar x\, .\,\Box Z\bar x$
  then $\Box\forall\bar x\, .\,Z\bar x$, that is $T\le Z$. For the empty tuple no BF is needed. Weakly
  Rigid Power makes $\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)\land Y\le T$ weakly rigid, and since
  $Y\le T$ is a theorem of C that property is identical to $\lambda Y\, .\,\operatorname{WeaklyRigid}(Y)$.
