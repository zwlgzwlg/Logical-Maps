notes: >-
  Equivalent to the claim that a finite count of individuals is necessary whenever it is true. It holds
  with No Pure Contingency and with BF, by the recorded results. A countermodel would need a world with
  finitely many individuals that can see one with more, and must violate both BF at type $e$ and No Pure
  Contingency; the coalesced sums on the map do not supply one, since their roots have infinitely many
  individuals.
