proof: >-
  For any relational atom X its instance proposition is an atom, hence strong by the scalar premise. The other premise makes X a self-atom. The interval below a self-atom is isomorphic to the scalar interval below its instance proposition, and this persists wherever X is nonzero. Consequently X is itself strong.
