proof: >-
  For an arithmetical sentence $A$, both $I\to A$ and $I\to\neg A$ are closed sentences of the pure language,
  since $I$, $\mathbb N$, $\operatorname{Sum}$ and $\operatorname{Prod}$ are defined from logical vocabulary.
  Classically one of them is true, and No Pure Contingency makes a true closed pure sentence necessary, so
  $\Box(I\to A)\lor\Box(I\to\neg A)$.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 27
notes: Immediate, and consistent with the recorded incompatibility of No Pure Contingency with Possibility Maximalism
  (pure), which the Necessity of Arithmetic is also incompatible with.
