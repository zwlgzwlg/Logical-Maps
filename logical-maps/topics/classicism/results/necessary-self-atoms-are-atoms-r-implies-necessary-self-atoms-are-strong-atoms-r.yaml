proof: >-
  At each accessible point take any self-atom X. The boxed clause saying it is an atom wherever instantiated persists by 4. At every further point X is therefore either bottom or still a self-atom, and in the latter case the boxed premise makes it an atom there. It follows that X is nonbottom and necessarily decides every relation, precisely strongness. The argument applies at each type and to the new entities of each accessible point.
