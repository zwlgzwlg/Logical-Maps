notes: >-
  The collapse principle ensures that wherever the Actuality witness is possible it is the least truth.
  This step can fail under Actuality alone. In [[one-new-individual-upper-point]], even Strong Actuality
  holds at the root, yet no inextensible property is coextensive there with all individuals.
