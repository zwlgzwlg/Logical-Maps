proof: >-
  Every closed instance of Atomicity (type t) is a closed sentence of the pure language, since the principle is
  stated with object-language quantifiers and contains no nonlogical constant. Given Atomicity (type t), each of
  those instances is true, and No Pure Contingency makes a true closed pure sentence necessary. So every
  closed instance is necessary, which is what the boxed principle asserts. Any type range and side
  conditions stay outside the box, as the Modal scope convention requires.
