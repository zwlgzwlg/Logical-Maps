proof: Iterating Separated Structure gives the corresponding conditional for a finite tuple of distinct
  constants. Abstract the constants occurring in a closed A,B to write them as iterated applications of
  pure closed F,G. If A=B is not a theorem, F=G cannot be a theorem either. Pure Distinctness Maximalism gives F≠G;
  contraposition of the iterated Separated Structure conditional gives A≠B.
