proof: 'Define the relation R by simultaneous induction: R(e,l) if every binary relation containing (exact-zero,
  at-least-zero) and closed under (Suc,Suc) contains (e,l). Both projections of R lie in their respective finite-cardinality
  carriers. By induction over the exact and at-least carriers, R is total in each direction. Under the exact
  Peano zero/successor conditions, induction over R proves that each exact count has a unique at-least partner;
  under the at-least Peano conditions, the dual induction proves the exact partner is unique. Since □LowerPeano
  implies LowerPeano by modal T, R is the desired bijection. The written Lean proofs are ExactLower.exactLowerBijection_of_necessary_lower_peano
  and MathematicalContingency.exactLowerBijection_of_draft_box_infinity.'
