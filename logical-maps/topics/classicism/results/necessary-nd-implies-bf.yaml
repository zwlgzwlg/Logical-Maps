proof: From $\forall x\, .\,\Box Fx$, B gives $\Box\Diamond(\forall x\, .\,\Box Fx)$. CBF gives the implication
  from the possible universal statement to $\forall x\, .\,\Diamond\Box Fx$; necessitate that logical
  implication to use it inside the leading box. The necessitated B dual gives $\Diamond\Box Fx\to Fx$
  there. The result is $\Box(\forall x\, .\,Fx)$. The required B and boxed-B instances follow from boxed
  ND as explained with Proposition 2.2.
