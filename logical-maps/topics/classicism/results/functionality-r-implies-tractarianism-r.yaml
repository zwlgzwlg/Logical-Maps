proof: Assume $p\le Fx$ for every x. Functionality identifies $F$ with $\lambda x\, .\,Fx\lor p$. Distribution
  of the constant disjunct through the universal quantifier identifies $\forall x\, .\,Fx$ with $(\forall
  x\, .\,Fx)\lor p$, which is the required entailment.
