proof: Let $c$ be a constant of relational type $\tau$, $\bar d$ distinct constants other than $c$, and
  $A$ closed and pure, and suppose $c=A\bar d$. By $\beta$, $(\lambda\bar y x\, .\,x)\bar d c=(\lambda\bar
  y x\, .\,A\bar y)\bar d c$. The two abstracts are closed and pure, so they contain neither $c$ nor $\bar
  d$. Peeling off $c$ and then each $d_i$ with Separated Structure, as in the proof of General Separated
  Structure, gives $\lambda\bar yx\, .\,x=\lambda\bar yx\, .\,A\bar y$. Applying both sides to $\bar d$
  and then to $\top_\tau$ and to $\bot_\tau$ gives $\top_\tau=A\bar d=\bot_\tau$, contradicting $\top_\tau\ne\bot_\tau$
  in C.
