proof: >-
  Write $E_j^b(p)$ for the finite modal formula saying that $p$ has exactly $j$ truth-value
  alternations from present color $b$. Induct externally on $j$. Constants give rank zero.
  From local witnesses for both colors, Witnessed Possibility makes both exact colors possible
  for one proposition obtained by universally closing a relational signature constant. Its
  actual color and the opposite accessible witness give $j+1$ possible alternations. On the
  predecessor-closed region permitting this many alternations, set the color constant and
  opposite to a possible exact rank-$j$ point outside. All later points outside retain their
  prior ranks. This new coloring has exact rank $j+1$ here, and complementation gives the
  opposite color. From any point of exact rank $j$, each lower exact layer is possible.
  These $j+1$ layers are pairwise disjoint nonzero propositions, establishing every fixed
  instance of the Infinity Schema.
notes: >-
  Uses the map's standing assumption of a relational signature constant. Even Possibly Witnessed
  Possibility permits internal finiteness at every future in [[ultraproduct-finite-binary-trees]].
