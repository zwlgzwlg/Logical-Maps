proof: >-
  Fix the type tuple, with $P_F$ and $R_F$ as in weakly-rigid-power-implies-rigid-power. □Tame Rigidity at
  this type gives, necessarily, that every weakly rigid relation is rigid; with T the converse holds at
  every world. So $\operatorname{WeaklyRigid}$ and $\operatorname{Rigid}$ are necessarily coextensive at
  this type, $P_F$ and $R_F$ are necessarily coextensive, and they are identical in C. Now suppose
  $\operatorname{WeaklyRigid}(F)$. Tame Rigidity (by T) makes $F$ rigid; Rigid Power makes $R_F$ rigid, so
  by T weakly rigid; so $P_F=R_F$ is weakly rigid. Without the box the argument fails at weak
  inextensibility: $Z:=R_F$ satisfies $\forall X\, .\,P_FX\to\Box ZX$ at the evaluation point, so the weak
  inextensibility of $P_F$ requires $P_F\le R_F$, which is Tame Rigidity below $F$ at every accessible
  world.
