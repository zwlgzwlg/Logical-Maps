proof: >-
  Fix a counting type and an arithmetical sentence. At each accessible point satisfying the
  Peano guard, send each Frege number to its haecceity. The local coextension transversal
  supplies exactly one code for each property of these numbers, giving a real number structure
  at the same fixed higher type at every such point. The number map preserves zero, successor,
  sum and product. The arithmetical sentence therefore agrees with its fixed number-only
  analytical translation there. Necessity of Analysis gives one sign of this translation
  throughout the cone, hence that sign of the arithmetical sentence wherever the guard holds.
notes: The two schemata here concern the truth of sentences. Necessary Actuality also suffices for the Transversal premise.
