proof: >-
  By [[strong-possibility-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Possibility+ (pure).

  Fix an instance $A=\forall\bar x\, .\,D(\bar x)\to\Diamond P(\bar x)$ of pure
  Possibility+, with $D$ the conjunction of the pairwise disequalities. This is a closed
  pure sentence consistent with pure Maximalism, since both hold in
  [[coalesced-single-individual-root]]. Strong Possibility therefore gives
  $\Diamond_{\ne}A$. If $A$ failed, some current tuple $\bar a$ would satisfy
  $D(\bar a)\land\Box\neg P(\bar a)$. Test $\Diamond_{\ne}A$ with the true
  proposition $D(\bar a)$, taking it to be $\top$ for an empty conjunction.
  This gives an accessible point satisfying $A\land\Diamond D(\bar a)$.
  By necessity of identity, possible joint distinctness entails current joint
  distinctness there. By 4, $\Box\neg P(\bar a)$ still holds there, contradicting
  $A$ at the transported tuple.
notes: >-
  The October argument uses the singleton-individual consequence of pure Strong
  Possibility in [[strong-possibility-and-infinity-e-incompatible]], together
  with the unary Possibility+ consequence of pure Maximalism. The argument above
  also works with signatures under their own consistency condition.
