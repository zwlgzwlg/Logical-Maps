proof: 'The Fregean Axiom A is a closed pure sentence. Both A and its negation are C-consistent: an ordinary
  two-valued Henkin model satisfies A, whereas the source’s full two-element-group model has four propositions
  and falsifies A. Possibility Maximalism gives $\Diamond A$ and $\Diamond\neg A$. By excluded middle either A or
  its negation is true. No Pure Contingency applied to the true one makes it necessary, contradicting
  the possibility of the other.'
