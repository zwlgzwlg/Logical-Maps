proof: It suffices to prove $F\bar c=G\bar c\to F=G$ for closed pure $F,G$ of a type $\bar\sigma\tau$
  and distinct constants $\bar c$; Separated Structure follows by abstracting the other constants, as
  in the recorded proof from Quantified Separated Structure. Let $H:=\lambda\bar x\, .\,(F\bar x=G\bar
  x)$, closed and pure. If $F\bar c=G\bar c$ then NI gives $\Box(F\bar c=G\bar c)$, i.e. $\Box H\bar c$
  by $\beta$. The contrapositive form of Possibly Witnessed Possibility, $\Box P[\bar c/\bar x]\to\Box\forall\bar
  x\, .\,P$ with $P:=(F\bar x=G\bar x)$, gives $\Box\forall\bar x\, .\,F\bar x=G\bar x$, and Modalized
  Functionality at the relevant arity, a theorem of C, gives $F=G$.
