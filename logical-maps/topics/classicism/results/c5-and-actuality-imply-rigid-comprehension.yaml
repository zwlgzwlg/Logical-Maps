proof: Actuality supplies persistent coextensions as in note 38. In C5, persistence implies inextensibility.
  To see this, suppose Y is persistent and each Y-instance necessarily satisfies X. B makes a failure
  of Y necessarily incompatible with necessary Y; by persistence this gives necessary non-Y. Therefore
  each argument necessarily satisfies the conditional from Y to X, and BF combines these into entailment.
  Boxed ND makes the reasoning available throughout the modal range, as required by Inextensible. The
  persistent coextension is consequently rigid.
