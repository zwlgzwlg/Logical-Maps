proof: Given distinct x,y of any type, use the functional relation taking x to $\top$ and every other
  argument to $\bot$. Plenitude gives an operation Z with $Zx=\top$ and $Zy=\bot$. Since those values
  are necessarily distinct, Leibniz’s Law yields the necessary distinctness of x and y.
