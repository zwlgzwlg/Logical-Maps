proof: >-
  Every closed instance of Vicinity is a closed sentence of the pure language, since the principle
  is stated with object-language quantifiers and contains no nonlogical constant. Given Vicinity,
  each instance is true, and No Pure Contingency makes it necessary. Type ranges stay outside the box.
