proof: >-
  Under the necessary Peano guard, distinct current Frege numbers remain distinct.
  Their haecceities are therefore disjoint in the Boolean order. The haecceities
  selected by any current property of numbers form an internally countable family.
  Its least upper bound codes exactly those numbers, and two properties with the
  same current number instances give the same least upper bound. These codes and
  the haecceities carry a real number structure. Analytic Necessitism supplies a
  rigid necessarily real structure at the same type. Matching its zero and successors
  to the Frege numbers transfers rigidity, as in
  [[analytic-necessitism-and-transversal-imply-arithmetic-necessitism]].
