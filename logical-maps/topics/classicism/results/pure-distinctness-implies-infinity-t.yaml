notes: >-
  Recorded from Distinctness Maximalism because the proof uses its non-theoremhood side condition directly. The
  equivalent Possibility Maximalism form gives the same result through the recorded equivalence. The witnesses need
  not be possible propositions, and at most one of them is true. What Distinctness Maximalism supplies is that C
  proves no identity among them. Only the type-$t$ instance follows, since the witnesses are propositions
  about how many individuals there are, not individuals.


  The argument does not lift to the Axiom of Infinity at type $t$, and it is worth recording how far it
  does reach. For each fixed $k$ it refutes the claim that there are exactly $k$ propositions. If there
  were, then among the $k+1$ sentences $E_1,\ldots,E_{k+1}$ two would have to coincide, so C proves the
  finite disjunction of those identities, and Distinctness Maximalism refutes every disjunct. That is the schema
  over again, one sentence at a time. The axiom asks for the same of every cardinality falling under
  $\operatorname{FiniteCardinality}$, including ones that no closed term names, and Distinctness Maximalism bears only on
  identities between closed pure terms, so it says nothing about the domain over which
  $\operatorname{FiniteCardinality}$ quantifies. Any one derivation uses finitely many of its instances, and those
  are satisfiable while the universal property still carries a cardinality that the induction clause
  admits. The route through Atomlessness is closed too, since the map carries a model of the signature
  Distinctness Maximalism schema that satisfies Actuality, and Actuality excludes Atomlessness.


  Added 20 September 2026: a different argument does reach the axiom. Applying the consistency side
  condition once, to the single sentence that every finite cardinality has a possibly instantiated
  successor, gives that sentence outright by persistence, and from it the Axiom of Infinity at type $t$
  follows in C; see pure-possibility-implies-axiom-of-infinity-t. The limits described above concern the
  numeral-by-numeral argument recorded here.
