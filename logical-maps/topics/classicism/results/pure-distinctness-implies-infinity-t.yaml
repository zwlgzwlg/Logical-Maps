source_names:
- Classicism
proof: >-
  For $k\ge1$ let $E_k$ be the closed pure sentence saying that there are exactly $k$ individuals,
  $\exists x_1^e\cdots x_k^e\, .\,(\bigwedge_{i<j}x_i\ne x_j)\land\forall y^e\, .\,\bigvee_i y=x_i$.
  Fix $n$ and take $E_1,\ldots,E_n$. For $i\ne j$ the identity $E_i=E_j$ is closed and pure, and C does
  not prove it. A full Henkin model whose individual domain has exactly $i$ members is a model of C in
  which $E_i$ is true and $E_j$ is false, and at type $t$ that model's propositions are its two truth
  values, so the two sentences denote different things there. Distinctness Maximalism therefore gives $E_i\ne E_j$.
  So $E_1,\ldots,E_n$ are $n$ pairwise distinct propositions, which is the $n$-th instance of Infinity
  at type $t$.
