proof: >-
  The Axiom of Infinity at type $t$ is a closed pure sentence. It is consistent with C, since it holds at the
  root of the coalesced sum of the full Henkin models with $1,2,3,\ldots$ individuals, where the propositions
  are the sets of worlds and the root-finite cardinalities are the numerals (see the model record).
  Possibility Maximalism (pure) therefore gives its diamond, which is Possible Infinity at type $t$.
references: []
notes: >-
  Possibility Maximalism (pure) also gives the Axiom of Infinity at type $t$ itself, through
  pure-possibility-implies-axiom-of-infinity-t; this record is the short route to the weaker diamond form.
