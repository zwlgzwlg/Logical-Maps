proof: 'A strong world is a weak world: $\operatorname{SWorld}_\sigma(W)$ has the conjunct $\Box\forall
  Y\, .\,W\le Y\lor W\le\neg Y$, and T gives $\forall Y\, .\,W\le Y\lor W\le\neg Y$. So a strong world
  below a possible $X$ is an atom below it; and a non-bottom $X$ is possible in the sense $X\ne\bot_\sigma$,
  which is how Atomicity’s antecedent reads.'
