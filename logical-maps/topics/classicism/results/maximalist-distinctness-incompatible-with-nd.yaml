proof: Choose a closed pure identity A=B such that both it and its negation are C-consistent, as the paper
  explains. Distinctness Maximalism gives $A\ne B$ while its equivalent Possibility Maximalism schema gives $\Diamond(A=B)$.
  ND applied at the common type gives $\Box(A\ne B)$, a contradiction.
