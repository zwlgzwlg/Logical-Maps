proof: >-
  Let $w$ witness Actuality and put $Y:=\lambda\bar z\, .\,w\land X[\bar z]$. Since $w$ is true, $Y$ is
  coextensive with $X$. For weak inextensibility, suppose $\forall\bar z\, .\,Y[\bar z]\to\Box Z[\bar z]$.
  By T, $\forall\bar z\, .\,w\land X[\bar z]\to Z[\bar z]$ is true, so $w$ entails it:
  $\Box(w\to\forall\bar z\, .\,w\land X[\bar z]\to Z[\bar z])$. The formula in the box is H-equivalent
  to $\forall\bar z\, .\,w\land X[\bar z]\to Z[\bar z]$, so by Logical Equivalence they are the same
  proposition, and $\Box\forall\bar z\, .\,Y[\bar z]\to Z[\bar z]$, which is $Y\le Z$. The box in the
  antecedent is not used: every relation that actually includes $Y$ is entailed by $Y$.
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §2.3, n. 38, p. 29
notes: >-
  The argument establishes weak inextensibility at the world of evaluation only. It does not give
  Inextensible Comprehension, whose witness must be weakly inextensible at every world: at a world where
  $w$ is false but still possible, $\lambda\bar z\, .\,w\land X[\bar z]$ has no instances, so
  inextensibility there would need it to entail $\bot$, which fails whenever $w\land\exists\bar z\,
  .\,X[\bar z]$ is possible there. Under C5 the gap closes by Proposition 2.10, and it also closes under
  Distinctness-preserving collapse; see the recorded results. Whether Actuality alone implies
  Inextensible Comprehension is open.
