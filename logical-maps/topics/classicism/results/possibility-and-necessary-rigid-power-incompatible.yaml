proof: >-
  Rigid Power fails at type $e\to t$ in finite-support-pair-injections-or-collapses, a model of C, so the
  negation of that closed pure instance is consistent with C. Possibility Maximalism (pure) makes the
  negation possible, while □Rigid Power says the instance is necessary.
