proof: >-
  Let $X$ be given and let $Y$ be a persistent coextension, which Persistent Comprehension supplies.
  Only persistence of $Y$ is used. What has to be added is that $\neg Y$ is persistent, which is the
  necessitation of a pointwise implication, so the argument must run at every world; that is what the
  boxed premise supplies. At any world, take $\bar x$ with $\neg Y[\bar x]$ and suppose
  $\Diamond Y[\bar x]$. Persistence of $Y$ is itself necessary, so $\Diamond Y[\bar x]$ yields
  $\Diamond\Box Y[\bar x]$. Boxed ND gives B at every world, and B in the form
  $\Diamond\Box p\to p$ then yields $Y[\bar x]$, against the assumption. So $\Box\neg Y[\bar x]$, which
  is persistence of $\neg Y$. Hence $Y$ is Gallin-extensional and coextensive with $X$.
references:
