  note: The equivalence of ND with B, and the Gallin convention.
notes: >-
  Rigid Comprehension implies Persistent Comprehension, so this covers the reading on which rigidity
  yields Gallin-extensionality. The boxed form of ND is needed rather than the plain form, because
  persistence of the negation is itself a boxed claim and the argument has to be available at every
  world. In the other direction the draft's note uses BF, which is doing separate work: it stops a
  world from having instances that the base world does not supply, and no amount of ND replaces it.
