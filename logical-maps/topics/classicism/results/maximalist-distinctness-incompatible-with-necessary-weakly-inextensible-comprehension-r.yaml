proof: >-
  Weakly Inextensible Comprehension fails in finite-support-permutations, a model of C, so some closed pure instance of it is not a theorem of C
  and its negation is consistent with C. The possibility form of Maximalism (pure) makes that
  negation possible, and the boxed principle makes the instance necessary.
