notes: >-
  With the converse arrows from Transversal Choice to Transversal and to Relational Choice, Transversal
  Choice is equivalent to Transversal together with Relational Choice. The argument is the quotient
  argument of relational-choice-and-extensionality-imply-transversal-choice, with the $F$-representative
  of each cell in place of the cell itself; this is the step Relational Choice alone does not supply.
  Consequently Relational Choice implies Transversal Choice if and only if it implies Transversal.
