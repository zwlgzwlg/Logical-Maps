proof: >-
  Let $R^{\sigma\sigma t}$ be an equivalence relation, and write $[x]$ for its cell $\lambda z\, .\,(Rx)z$.
  Transversal at $\sigma$ gives $F^{(\sigma t)t}$ such that each property is coextensive with exactly one
  $F$-property. Relational Choice at types $(\sigma t,\sigma)$, applied to the serial relation
  $(UC)y:=Cy\lor\neg\exists z\, .\,Cz$, gives a functional $S$ with $(SC)y\to(UC)y$. Put
  $Gy:=\exists Y\, .\,FY\land(\forall z\, .\,Yz\leftrightarrow(Ry)z)\land(SY)y$. Existence: given $x$, let
  $Y_x$ be the $F$-property coextensive with $[x]$. It has the instance $x$, so the $y$ with $(SY_x)y$
  satisfies $Y_xy$, hence $(Rx)y$. Then $[y]$ is coextensive with $[x]$ and so with $Y_x$, and $Gy$ holds
  through $Y_x$. Uniqueness: suppose $(Rx)y$ and $(Rx)y'$, with $Gy$ through $Y$ and $Gy'$ through $Y'$.
  Then $Y$ is coextensive with $[y]$, $[y]$ with $[x]$, $[x]$ with $[y']$, and $[y']$ with $Y'$; so $Y$
  and $Y'$ are $F$-properties coextensive with $[x]$, and $Y=Y'$ by the uniqueness clause of Transversal.
  Now $(SY)y$ and $(SY)y'$, so $y=y'$ by functionality of $S$. Thus $G$ is a transversal of $R$.
