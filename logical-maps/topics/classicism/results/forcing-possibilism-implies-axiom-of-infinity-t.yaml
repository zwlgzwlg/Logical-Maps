  note: Stated there for the axiom of infinity in the form that the finite numerical quantifiers over
    propositions form a natural number structure; the map's Axiom of Infinity (type t) says that no finite
    cardinality holds of the universal property of propositions.
proof: 'Suppose some finite cardinality holds of the universal property of propositions, say there are
  exactly $N$ propositions, $q_1,\dots,q_N$ (with $N\ge2$, as $\top\ne\bot$). At type $tt$ the properties
  $\lambda p\, .\,p=q_{i_1}\lor\dots\lor p=q_{i_k}$, one for each subset of $\{q_1,\dots,q_N\}$, are pairwise
  distinct, since two of them differ at some $q_i$, and under inclusion they form a complete Boolean algebra
  with $2^N$ elements: a finite Boolean algebra is complete, and its carrier, order, meets and joins are
  given by abstraction. It is finite, hence small. Forcing Possibilism gives a proposition $p\ne\top$
  whose entailment algebra is isomorphic to it, so there are at least $2^N>N$ propositions, those entailing
  $p$. Contradiction. Hence no finite cardinality holds of the universal property of propositions.'
notes: 'The one general consequence of Forcing Possibilism the map records: the principle is about the
  propositions there could be below some proposition, so any model with finitely many propositions refutes
  it, and through this result every such model on the map does, which settles the questions whether principles
  true in finite models, Atomicity, ND or BF for instance, imply it. Its other verdicts on the map come
  from Bacon''s lottery model, which has it with □Rigid Comprehension and □Intensional Choice and without
  Atomicity. A separately credited internal-finiteness proof, valid without an external finite enumeration,
  is given in the proof supplement on this result’s page. The original proof and its certificate are retained.'
