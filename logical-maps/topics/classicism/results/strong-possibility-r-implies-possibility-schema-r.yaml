proof: If P is C-consistent, then $\Diamond P$ is a theorem of Max(C). The source’s consistency theorem
  for Max(C) therefore makes $\Diamond P$ consistent with that theory. Strong Possibility gives $\Diamond_{\ne}\Diamond
  P$, which implies $\Diamond\Diamond P$ and hence $\Diamond P$ by 4.
