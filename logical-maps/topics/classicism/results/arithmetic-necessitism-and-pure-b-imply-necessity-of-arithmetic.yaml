proof: >-
  At each counting type, $I$ is equivalent in C to both $\Diamond I$ and $I^*$.
  The B instance on the closed pure sentence $I$ therefore gives $I\to\Box I^*$.
  If $I$ is impossible the arithmetic schema is immediate. Otherwise Arithmetic
  Necessitism supplies rigid numbers and necessarily distinct current number
  values. True sum and product instances persist, and a wrong proposed output
  stays distinct from the necessarily correct one. In the arithmetic formula
  induction, weak inextensibility of the numbers lifts every universally true
  matrix on the old numbers to all future numbers, while a current counterexample
  persists. This gives either sign of each closed arithmetic sentence necessarily.
notes: >-
  Only the B instance for the closed pure Peano guard is used at each counting
  type. The actual Arithmetic Necessitism schema suffices.
