proof: Let $P$ be a closed pure sentence consistent with C. By the completeness half of Classicism, Theorem
  3.23, some action model makes $P$ true. An action model carries an interpretation of the nonlogical
  constants (Definition 3.25 refers to it), and the frame with any interpretation of the constants of
  Σ in the domains of their types, nonempty by Existence, is again an action model, in which $P$ remains
  true, $P$ containing no constants. By the soundness half of the same theorem, applied to the language
  $\mathcal L(\Sigma)$, every theorem of C(Σ) is true in it. So $P$ is consistent with C(Σ), and Possibility Maximalism
  (signature Σ) gives $\Diamond P$.
references:
- paper: bacon-dorr-classicism
