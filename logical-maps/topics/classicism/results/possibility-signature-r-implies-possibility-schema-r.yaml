  note: Soundness and completeness of action models, and the action-model interpretation of nonlogical
    constants.
notes: 'Records that the signature-expanded reference theory is conservative over C for pure sentences,
  which is what the arrow from the Σ form of Possibility Maximalism to the pure form needs. The analogous arrow between
  the two Strong Possibility principles remains conjectured, since it needs the conservativity of Max(C(Σ))
  over Max(C), which this argument does not give: a model of Max(C) with the constants interpreted arbitrarily
  need not satisfy the possibility of every C(Σ)-consistent Σ-sentence.'
