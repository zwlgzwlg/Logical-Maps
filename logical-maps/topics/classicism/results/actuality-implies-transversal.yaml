notes: >-
  Two coextensive $F$-properties are necessarily coextensive. The dual witness
  $FY:=\Box\forall z\, .\,w\lor Yz$, with representative $\lambda z\, .\,Xz\lor\neg w$, works equally
  well. With Transversal and Relational Choice implying Transversal Choice, Actuality and Relational Choice
  together imply Transversal Choice.
