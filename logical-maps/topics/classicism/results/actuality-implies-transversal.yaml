proof: >-
  Let $w$ witness Actuality: $w$ is true and $w\le q$ for every true $q$. Fix $\sigma$ and put
  $FY:=\Box\forall z^\sigma\, .\,Yz\to w$, the property of being a property that can be instantiated only
  if $w$ obtains. Existence: given $X$, let $Y:=\lambda z\, .\,Xz\land w$. Since $w$ is true, $Y$ is
  coextensive with $X$, and $FY$ holds because $\forall z\, .\,(Xz\land w)\to w$ is a theorem, hence
  necessary. Uniqueness: let $Y_1$ and $Y_2$ satisfy $F$ and be coextensive with $X$. Then
  $\forall z\, .\,Y_1z\leftrightarrow Y_2z$ is true, so Actuality gives $\Box(w\to\forall z\, .\,Y_1z\leftrightarrow
  Y_2z)$. Together with $\Box\forall z\, .\,Y_1z\to w$ and $\Box\forall z\, .\,Y_2z\to w$, K gives
  $\Box\forall z\, .\,Y_1z\leftrightarrow Y_2z$: at any $z$, if either side holds then $w$ does, and then
  the two sides agree. Necessarily coextensive properties are identical in C (Intensionality), so
  $Y_1=Y_2$.
