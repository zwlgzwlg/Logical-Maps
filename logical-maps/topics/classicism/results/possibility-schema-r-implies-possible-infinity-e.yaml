proof: >-
  The Axiom of Infinity at type $e$ is a closed pure sentence. It is consistent with C, since it holds in
  the full Henkin model with a countably infinite individual domain (see the model record). Possibility Maximalism
  (pure) therefore gives its diamond, which is Possible Infinity at type $e$.
