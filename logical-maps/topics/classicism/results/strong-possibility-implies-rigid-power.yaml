proof: >-
  By [[strong-possibility-r-inconsistent]], any theory satisfying the premises proves $\bot$ and hence every instance of Rigid Power.

  At the Maximalist point with finite descriptor support, each proper transport
  of any current rigid relation has a standard finite extension. Strong Actuality
  holds at the identity. Thus for each arity the closed pure sentence asserting
  that every current rigid relation is necessarily Frege-finite wherever Strong
  Actuality fails is consistent with Max. At a pure Strong Possibility point,
  Strong Actuality fails. Given an infinite current rigid relation, require a
  return to that failure and to its infinitude through the displayed sentence.
  Rigidity persists at the intermediate point, giving finiteness at the return.
  The resulting contradiction proves current Frege-finiteness. The internally
  finite rigid-power theorem now applies at every arity.
notes: >-
  Frege-finiteness counts tuple-haecceity codes. Its witness can be a nonstandard
  number. Pure Strong Possibility alone remains conjecturally inconsistent.
