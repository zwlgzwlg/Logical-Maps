proof: >-
  Apply Intensional Choice at the type $\sigma\sigma t$ to $F:=\lambda R\, .\,\operatorname{WO}(R)$,
  which is necessarily instantiated by $\Box$Well-Ordering. This gives $G\le F$ that is necessarily
  uniquely instantiated. Put $R':=\lambda x\,y\, .\,\exists R\, .\,GR\land(Rx)y$. At any world the
  unique instance $R_0$ of $G$ there is a well-order, since $G\le F$, and $R'$ is coextensive with
  $R_0$ there. WO depends only on the extension of its argument at the evaluation point (Background),
  so $\operatorname{WO}(R')$ holds there. Hence $\Box\operatorname{WO}(R')$.
references: []
notes: Intensional Choice is used at the type $\sigma\sigma t$ to obtain Modal Well-Ordering at $\sigma$.
