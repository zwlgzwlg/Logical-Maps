proof: 'Under ND the two necessities coincide. If $\Box_{\ne}p$, there is a true $q$ with $\Box(\Diamond
  q\to p)$; $q$ true gives $q\ne\bot$, and ND at type $t$ gives $\Box(q\ne\bot)$, that is $\Box\Diamond
  q$; K then gives $\Box p$. So the collapse yields $\forall p\, .\,p\to\Box p$: every truth is $\top$.
  Then materially equivalent propositions are identical: if both are true both are $\top$; if both are
  false their negations are $\top$, so both are $\bot$. That is the Fregean Axiom.'
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.6, p. 42; §1.4, pp. 15–16
notes: 'The converse of the first step holds without ND: $\Box p$ gives $\Box_{\ne}p$ with $q:=\top$.
  So ND makes $\Diamond$ and $\Diamond_{\ne}$ coextensive, and with it the collapse is Extensionalism.
  This settles the collapse as false in every model with ND and more than two propositions.'
