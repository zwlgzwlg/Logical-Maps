proof: >-
  Let $\operatorname{WO}(R)$ at $\sigma$, write $x\preccurlyeq y$ for $(Rx)y$, and let $E$ be an equivalence
  relation on $\sigma$. Put $Fy:=\forall z\, .\,(Ey)z\to y\preccurlyeq z$. Given $x$, the cell $\lambda z\,
  .\,(Ex)z$ is instantiated by $x$, so it has an $R$-minimal instance $m$, which is its least instance:
  for $z$ in the cell, Total gives $m\preccurlyeq z$ or $z\preccurlyeq m$, and in the second case
  minimality gives $z=m$. Since $(Em)z$ implies $(Ex)z$, $Fm$ holds, and $(Ex)m$. If also $(Ex)z$ and
  $Fz$, then $(Em)z$ and $(Ez)m$, so $m\preccurlyeq z$ and $z\preccurlyeq m$, and Antisymm gives $z=m$.
references: []
notes: Each cell's chosen instance is its least element in the well-order. Well-Ordering is used only at $\sigma$.
