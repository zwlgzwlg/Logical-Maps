proof: 'C5 supplies BF and ND throughout the relevant modal range. BF and ND imply that a possibly atomic
  entity is already atomic: move the tests of entailment or incompatibility outward with BF, then use
  ND to turn possible identities into identities. Given a non-bottom proposition, boxed Actuality supplies
  a possible actual atom compatible with it; BF brings that atom into the current domain, and its compatibility
  makes it lie below the proposition. At a relation type the same argument uses the possible true profile
  of an instance, pairing the actual atom with the tuple’s haecceity. BF imports its tuple and ND preserves
  its identities. This is the type-uniform direction of the proposition stated by the source.'
