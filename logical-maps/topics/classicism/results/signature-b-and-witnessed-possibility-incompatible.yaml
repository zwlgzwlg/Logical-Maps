  note: 'Bacon: B is undermined by the analogy with logical truth independently of contingent distinctness,
    since for a nonlogical predicate F neither ◇∃xFx nor ◇¬∃xFx is a logical truth, while B would make
    one of them necessary.'
notes: Formalizes Bacon’s n. 32 with the top element in place of his interpretations of F, so that only
  one constant of relational type is needed. Compare the recorded incompatibility of Witnessed Possibility
  with ND, which uses B at the level of propositions through Prior’s argument; here only the sentence
  instances for Σ are used.
