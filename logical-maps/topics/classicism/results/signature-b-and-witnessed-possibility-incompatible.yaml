proof: Let $c$ be a constant of $\Sigma$ of relational type $\tau$. Witnessed Possibility gives $\Diamond(c=\top_\tau)$
  and $\Diamond(c\ne\top_\tau)$. If $c=\top_\tau$, NI gives $\Box(c=\top_\tau)$, contradicting $\Diamond(c\ne\top_\tau)$.
  If $c\ne\top_\tau$, B for the closed $\Sigma$-sentence $c\ne\top_\tau$ gives $\Box\Diamond(c\ne\top_\tau)$;
  but $\Diamond(c=\top_\tau)$ supplies a possibility at which $c=\top_\tau$, hence by NI $\Box(c=\top_\tau)$
  there, so $\neg\Diamond(c\ne\top_\tau)$ there, contradicting $\Box\Diamond(c\ne\top_\tau)$.
references:
- paper: bacon-dorr-classicism
  role: background
  locator: §2.2, p. 27; §2.5, n. 57, p. 38
