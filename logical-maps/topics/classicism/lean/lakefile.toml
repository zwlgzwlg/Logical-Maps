name = "Classicism"
defaultTargets = ["Classicism"]

# Mathlib is a dependency for the metalogical layer's model theory only
# (`Classicism.Meta.Action*`). The shallow and strict layers never import it:
# they live in base Lean so that nothing classical (propext, Quot.sound,
# Classical.choice) is available except where the Classicism prelude admits
# it. See README.md.
#
# Dependencies are checked out into one directory shared by every Lean project
# on this machine, outside Dropbox and outside this repository, so that there
# is a single copy of Mathlib. Pinned to the tag matching `lean-toolchain`.
packagesDir = "/Users/cd50/lean-packages"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "Classicism"
