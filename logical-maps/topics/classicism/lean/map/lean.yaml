  actuality: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.Actuality.schema)"
  atomicity-r: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.Atomicity.schema)"
  atomicity-t: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.AtomicityT.schema)"
  atomlessness: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.Atomlessness.schema)"
  barcan-r: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.Barcan.schema)"
  barcan-t: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.BarcanT.schema)"
  boolean-completeness-r: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.BooleanCompleteness.schema)"
  boolean-completeness-t: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.BooleanCompletenessT.schema)"
  broad-necessitism-r: "(Classicism.Meta.AxiomSet.ofPure Classicism.P.BroadNecessitism.schema)"
