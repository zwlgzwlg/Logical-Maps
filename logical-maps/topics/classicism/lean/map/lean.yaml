# The Lean side of the map, as the map's own fields would record it.
#
# A proposal for topics/classicism in zwlgzwlg/Logical-Maps: `lean_lib` and `lean` go in
# topic.yaml, each `lean_def` and each principle's `forms` in its principle's YAML, each
# `lean_ref` in its result's certificate. `generate.py` runs the map's own generator
# (pmap's generate_lean_statements, with the change in map/pmap.patch) on the map with
# these fields added, writing Classicism/Statements.lean; `Classicism/Map.lean` proves
# those statements.
#
# Each principle is a schema at every signature (Certified/Signatures.lean). A result's
# statement reads: for every signature and every schema Ax over it, if Ax entails each
# premise then it entails the conclusion; for an incompatibility, Ax is inconsistent.
# That is the entailment between the schemas, or their inconsistency. A form's statement:
# Ax entails the principle iff it entails the form.

lean_lib: Classicism
lean:
  imports: [Classicism.Certified.Signatures]
  namespace: Classicism
  definition_check: |-
    example {Sig : Classicism.Meta.Signature} : Classicism.Meta.AxiomSet Sig :=
      {def}
  result:
    binder: "∀ {Sig : Classicism.Meta.Signature} (Ax : Classicism.Meta.AxiomSet Sig),"
    principle: "Classicism.Meta.AxiomSet.Entails Ax {def}"
    falsum: "¬ Classicism.Meta.AxiomSet.Consistent Ax"
  model:
    binder: "∃ (Sig : Classicism.Meta.Signature) (Ax : Classicism.Meta.AxiomSet Sig), Classicism.Meta.AxiomSet.Consistent Ax ∧"
    principle: "Classicism.Meta.AxiomSet.Entails Ax {def}"

