# The Lean side of the map, as the map's own fields would record it.
#
# A proposal for topics/classicism in zwlgzwlg/Logical-Maps: `lean_lib` and `lean` go in
# topic.yaml, each `lean_def` in its principle's YAML, each `lean_ref` in its result's
# certificate. `generate.py` runs the map's own generator (pmap's
# generate_lean_statements) on the map with these fields added, writing
# Classicism/Statements.lean; `Classicism/Map.lean` proves those statements.
#
# A statement reads: for every signature and every consistent schema Ax over it, if Ax
# entails each premise then it entails the conclusion (or, for an incompatibility, False).
# That is equivalent to the entailment between the schemas, and makes an incompatibility
# the inconsistency of the premises. A principle of the pure language is read in the
# signature by `ofPure`; a signature-relative principle is at the signature itself.

lean_lib: Classicism
lean:
  imports: [Classicism.Certified.Schemas, Classicism.Syntax.SentenceSchemas, Classicism.Syntax.Pure]
  namespace: Classicism
  definition_check: |-
    example {Sig : Classicism.Meta.Signature} : Classicism.Meta.AxiomSet Sig :=
      {def}
  result:
    binder: "∀ {Sig : Classicism.Meta.Signature} (Ax : Classicism.Meta.AxiomSet Sig), Classicism.Meta.AxiomSet.Consistent Ax →"
    principle: "Classicism.Meta.AxiomSet.Entails Ax {def}"
  model:
    binder: "∃ (Sig : Classicism.Meta.Signature) (Ax : Classicism.Meta.AxiomSet Sig), Classicism.Meta.AxiomSet.Consistent Ax ∧"
    principle: "Classicism.Meta.AxiomSet.Entails Ax {def}"

