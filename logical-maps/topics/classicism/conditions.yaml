# Conditions a model may meet, stated once for the topic. A general argument (arguments/<id>.yaml)
# requires some of them; a model record meets one by its own `meets`, by its group's `meets`, or by
# the value of one of its group's parameters, each with the reason it holds there. Introduced by
# Claude Opus 5.5 at Cian Dorr's direction, 2 October 2026.
conditions:
- id: one-object-action-model
  text: >-
    The model is an action model (Classicism, Appendix D), or an intensional action model in the
    sense of Dorr's draft (Boolean Completeness does not imply Rigid Comprehension), with a single
    object.
- id: extensionally-full
  text: >-
    The model is extensionally full at every object: every set of tuples from the domains at an
    object is the extension, at the identity arrow, of an element of the domain of the matching
    relational type there.
- id: d6-surjective
  text: >-
    The model is an ideally full action model in which every arrow out of the evaluation object
    acts surjectively both on the individuals and on the pinning sets (Proposition D.6's
    hypothesis).
- id: sigma-top
  text: >-
    Every constant of Σ is relational, and each denotes the top element of its type.
- id: one-individual
  text: >-
    There is exactly one individual, at every world.
- id: metatheory-choice
  text: >-
    The model is constructed in a metatheory with the axiom of choice.
- id: full-model
  text: >-
    The model is full: at each object, the domain of each relational type contains every intension
    of that type.
- id: full-action-model
  text: >-
    The model is a full action model: an action model (Classicism, Appendix D) that is full at
    every object.
- id: codomain-intensions
  text: >-
    At every object reachable from the evaluation point, the domain contains every intension
    whose value at an arrow depends only on the arrow's codomain.
- id: fixed-infinite-individuals
  text: >-
    At every object the individuals are the same infinite set, and every arrow acts on them as the
    identity.
- id: homogeneous-individuals
  text: >-
    The model's automorphisms carry every individual to every other.
- id: finitely-many-propositions
  text: >-
    There are finitely many propositions at the evaluation world.
- id: sigma-true-atom
  text: >-
    Σ has a designated relational constant $c$ of type $\tau=\bar\sigma t$ denoting
    $\lambda\bar x\, .\,a$, where $a$ is the actual-world proposition, the unique true atom; every
    other constant, of which there is at least one, is relational and denotes the top element of
    its type.
- id: actuality-contingent
  text: >-
    The actual-world proposition $a$, the strongest truth, is in the domain; it is necessary at no
    world, and some arrow does not fix it.
- id: irreversible-arrow
  text: >-
    Some world sees no world at which the actual-world proposition is true.
- id: actual-world-isolated
  text: >-
    The actual-world proposition $a$ is in the domain and entails every truth, and no world outside
    $a$ sees a world in $a$.
- id: transport-gap
  text: >-
    The model is a one-object action model whose entities are finitely pinned, and there are a
    finite set $N$, an arrow $i$ and a proposition $q$ in the domain such that $q$ separates two
    arrows that agree on the range of every arrow agreeing with $i$ on $N$, and the intension
    $\{\langle r,j\rangle : r\ne q\text{ or }j\text{ disagrees with }i\text{ on }N\}$ is in the
    domain.
