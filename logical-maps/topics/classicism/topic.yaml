id: classicism
title: Classicism
require_sources: true
framework: 'The fixed base is Bacon and Dorr’s Classicism (C) in their relational type system. Types are
  generated from e and t by forming sigma→tau when tau is not e; every non-base type therefore ends in
  t. C is the smallest H-theory containing Logical Equivalence (Classicism, §1.3): lambda abstractions
  of H-equivalent formulas are identical. Preserve the theoremhood side condition; equivalence under optional
  assumptions does not satisfy it.'
