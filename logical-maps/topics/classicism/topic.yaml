lean_lib: Classicism
lean:
  index:
    script: scripts/MapIndex.lean
    file: map/index.json
  source_url: https://github.com/zwlgzwlg/Logical-Maps/blob/{commit}/logical-maps/topics/classicism/lean/{file}#L{start}-L{end}
  imports:
  - Classicism.Certified.Signatures
  - Classicism.Certified.Arithmetic
  namespace: Classicism
  definition_check: "example {Sig : Classicism.Meta.Signature} : Classicism.Meta.AxiomSet Sig :=\n  {def}"
  result:
    binder: '∀ {Sig : Classicism.Meta.Signature} (_ : Sig.Admitted) (Ax : Classicism.Meta.AxiomSet Sig),'
    principle: Classicism.Meta.AxiomSet.Entails Ax {def}
    falsum: ¬ Classicism.Meta.AxiomSet.Consistent Ax
  model:
    binder: '∃ (Sig : Classicism.Meta.Signature) (_ : Sig.Admitted) (Ax : Classicism.Meta.AxiomSet Sig), Classicism.Meta.AxiomSet.Consistent Ax ∧ Classicism.Meta.AxiomSet.Complete Ax ∧'
    principle: Classicism.Meta.AxiomSet.Entails Ax {def}
  verdict:
    imports:
    - Classicism.Semantics.IntensionalTheory
    - Classicism.Models.Permutations
    - Classicism.Models.Monoids
    - Classicism.Models.ContingentBarcan
    - Classicism.Semantics.IntensionalExamples
    - Classicism.Models.Conditions
    - Classicism.Models.FullActionModels
    - Classicism.Semantics.Interpretations
    - Classicism.Models.SymmetricFull
    - Classicism.Models.SymmetricIdeal
    - Classicism.Models.PairInjCollapse
    holds: ({model}).IsModel ∧ ({model}).HoldsAx {def}
    fails: ({model}).IsModel ∧ ¬ ({model}).HoldsAx {def}
    relative_categories: [signature]
    relative: ({model}).Admitted
    # A model with Σ interpreted, built from the record's model of the pure language by its
    # setting `sigma` (Semantics/Interpretations.lean).
    relative_models:
      setting: sigma
      values:
        top:
          model: Classicism.Meta.Intensional.Premodel.withTop ({model}) ({is_model})
          is_model: Classicism.Meta.Intensional.Premodel.withTop_isModel ({is_model})
          relative: Classicism.Meta.Signature.sigmaTop_admitted
          meets:
            sigma-top: Classicism.Meta.Intensional.Premodel.withTop_sigmaTop ({is_model})
          given: Classicism.Meta.Intensional.Premodel.holdsAx_interp_ofPure.2 ({proof})
  argument:
    binder: '∀ {Sig : Classicism.Meta.Signature} {C : Type} [CategoryTheory.SmallCategory C] (A : Classicism.Meta.Intensional.Premodel Sig C), A.IsModel →'
    model: A
    condition: '{cond} {model}'
    holds: ({model}).HoldsAx {def}
    fails: ¬ ({model}).HoldsAx {def}
    relative: ({model}).Admitted
