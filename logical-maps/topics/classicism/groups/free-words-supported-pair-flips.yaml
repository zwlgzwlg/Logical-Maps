id: free-words-supported-pair-flips
name: Free words with supported flips of individual pairs
definition: >-
  Individuals form $\omega_1$ disjoint pairs. The one-object arrow monoid is a free monoid of
  words and acts trivially on individuals. Separately let the group of all independent pair
  flips act on the individuals and fix every word. A relational entity assigns each word an
  arbitrary row on admitted tuples, subject to the whole profile having a countable atom support
  under the flips. Arrow transport is suffix precomposition, commuting with the group. At the
  empty word interpret the relational constants by gluing chosen tuples of pure witnesses at
  distinct final letters. Every purely relational signature is allowed, and one individual name
  can be added. One propositional constant already witnesses the separation; that version works
  with ordinary finite supports and countably many individual pairs. {{alphabet}}
parameters:
  alphabet:
    text: Cardinality of the word alphabet with countable atom supports and $\omega_1$ individual pairs.
    values:
      unrestricted: Use any infinite alphabet with enough letters for the named instances.
      countable: Take countably infinitely many letters and a countable signature.
      uncountable: Take an uncountable alphabet with enough letters for the named instances.
arguments:
- id: logical-necessity
  holds: [logical-necessity-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    Pure truth is constant across arrows because there is one object. Choose a witness tuple per
    realizable pure matrix and type list. Assign each instance with distinct matching names a
    final letter. Stripping that letter realizes their witness tuple simultaneously; the union
    of countably many atom supports supports each interpreted relational constant.
- id: rigid-comprehension
  holds: [necessary-rigid-comprehension-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    For the actual row $E$ of a relation, take the profile whose row at $h$ is the direct
    image $h[E]$ under componentwise transport. It has the same atom support. At a later word
    $vh$ its instances are exactly the $v$-images of its instances at $h$. This gives both
    persistence and inextensibility at every word.
- id: rigid-power
  holds: [necessary-rigid-power-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    Every rigid relation equals the direct-image profile of its current row by uniqueness of
    rigid coextensions. A rigid subrelation with row $U\subseteq h[E]$ at $h$ lifts to the
    rigid profile on the supported row $E\cap h^{-1}[U]$. Its entire transport at $h$ is the
    original rigid subrelation. Thus the power property itself is generated by direct images.
- id: barcan
  holds: [necessary-barcan-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    Each transport is onto. The suffix lift of a profile $F$ along $h$ prescribes $F_v$ on
    words $vh$ and an empty row elsewhere. Right cancellation makes it well defined and atom
    support is preserved. Individual transport is identity.
- id: strong-atoms
  holds: [necessary-strong-atomicity-r, necessary-strong-actuality]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    A singleton tuple at a single word has a countable atom support. Every transport is a
    singleton of the same form or bottom, hence decides every subrelation or its complement.
    These strong atoms cover each nonzero relation. The singleton of the identity word is a
    true strong proposition atom.
- id: infinity
  holds: [necessary-axiom-of-infinity-e, necessary-axiom-of-infinity-t]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    The standard numerals form an equivariant inductive current property. No standard numeral
    counts all individuals or all propositions; both carriers are infinite.
- id: unsupported-pair
  fails: [relational-choice-r, transversal-choice-r, well-ordering-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    Flip the two individuals of a pair outside a proposed choice relation's support.
    The constant profile of their pair is unchanged, but neither possible output of the
    membership selector is fixed. For a transversal of the pair equivalence the same
    flip rules out single occupancy. It also rules out an antisymmetric total ordering.
- id: countable-word-choice
  when: {alphabet: countable}
  holds: [necessary-intensional-choice-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    Choose one member of each nonempty word row of a necessarily instantiated property.
    A countable union of the chosen members' countable supports supports the whole profile
    of singleton rows. The same argument applies at every word and every input type.
- id: uncountable-word-choice
  when: {alphabet: uncountable}
  fails: [intensional-choice-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    At distinct one-letter words prescribe distinct two-element individual pairs, using
    every one of the $\omega_1$ pairs. Use the full individual domain at all remaining
    words. Every row is invariant under every flip. The support of a proposed selector
    misses some pair, so flipping that pair fixes the selector and exchanges its
    two possible values at the designated word.
- id: rowwise-unions
  holds: [necessary-boolean-completeness-r]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: free-words-supported-pair-flips
  text: >-
    If a common atom support fixes the current family of relations, it also fixes the
    union of their rows at every word. These rows therefore form an admitted relation.
    Since entailment is inclusion at each word, this relation is the least upper bound.
- id: small-atomless-regular-open-algebra
  fails: [forcing-possibilism]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: mathematics-in-the-pair-flip-word-models
  text: >-
    All current subsets and graphs among scalar codes have empty atom
    support. Represent the full atomless regular-open algebra of Cantor
    space on such codes. Every countable subcarrier injects into the
    inexact ordinal benchmark through its distinct fixed finite-order
    thresholds. An uncountable subcarrier has size at most continuum and
    contains a countably infinite set whose powers need continuum many
    representatives, ruling out power closure in the revised test.
    Thus the algebra is small. Every actual propositional interval is a
    power set and has atoms whenever nontrivial.
- id: necessary-rigid-powers-of-real-structures
  holds: [second-order-analytic-necessitism]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: mathematics-in-the-pair-flip-word-models
  text: >-
    At each relational type encode numbers and reals by group-fixed labels
    testing the first letter of a nonempty word. They remain distinct after
    every suffix. Relations on these tuples and their full powers have
    group-fixed exact-image profiles, hence are rigid. At the individual
    type, a support for a real structure would fix each standard iterate
    of zero, their admitted inductive set, and every real by membership
    extensionality. The stabilizer fixes only countably many individuals,
    whereas all subsets of the number row are admitted.
