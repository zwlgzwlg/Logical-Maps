id: stone-terminal-roots
name: Coalesced roots with homogeneous Stone terminals
definition: >-
  Add a root to the specified old components and a full singleton-individual terminal for each
  ultrafilter of the product of representatives of the nontrivial complete Boolean algebras of
  size below μ. Choose the strong limit μ after fixing the old components, individual carrier
  and root loops, as in the construction proof. At each relational type take independent loop
  rows, whole old-component values, and a locally constant family of terminal values.
  Every exit absorbs precomposition by a root loop. The designated root symmetry group and
  the action of the loops on root individuals are trivial. Evaluate at the identity of the root.
  {{loops}} {{core}} {{names}}
parameters:
  loops:
    text: Root endomorphisms and their admitted relation rows.
    values:
      identity: Only the identity loop is present. Its extension is unrestricted.
      involution: The root has a two-element group of loops and an unrestricted row at each loop.
      left-inverses: The loops are the transformation monoid generated by successor on the naturals and its two left inverses which send zero to zero and one respectively. Every loop row is unrestricted.
      cantor: The loops form the product of countably many two-element groups. The entire table of root rows for any one relation depends on a finite prefix of the loop.
  core:
    text: Old pointed components, with one entrance into each.
    values:
      named: Use the signature-definable coalesced root for a signature with a proposition name and no individual names. Its root individual carrier is a singleton.
      paired: Use that signature-definable point and an independent copy of the pure definable root that fails propositional Barcan. Its signature expansion sends the proposition name to top. Both entrances preserve the sole individual.
      abundant: Use the signature-definable coalesced point with infinitely many free constants of every admitted type. Take its individuals as the new root individuals, with identity entrance.
      finite-support-rigid: Use the signature-Maximalist coalesced point where every weakly rigid bound has finite descriptor support. Take its individuals as root individuals, with identity entrance.
      permutation: Use the one-object finite-support permutation model on the naturals with its given signature interpretation. Take its individuals as root individuals, with identity entrance.
  names:
    text: Interpretation of the free constants in the assembled model.
    values:
      inherited: Use the prescribed old coordinates for the signature constants, constant loop tables, and homogeneous terminal interpretations. Send individuals to the sole terminal individual.
      top: Take the pure reduct of the indicated two-branch model and interpret the proposition name as logical top everywhere.
arguments:
- id: small-algebra-intervals
  holds: [forcing-possibilism]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: >-
    Rigid-family limits preserve constancy across the homogeneous terminals. The admitted
    ordinal closure test bounds the root inexact ordinals before the terminal space is chosen.
    Every revised-small algebra then has size below μ and occurs as its own principal interval.
- id: current-graphs
  holds: [well-ordering-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: The current graph of an external well-order at any type is admitted with constant loop table and empty exit coordinates.
- id: terminal-self-atom
  fails: [self-atoms-are-atoms-t, atomicity-t]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: The proposition supported on the regular-open Cantor algebra factor has no atom below it. Wherever it is true it is the top of a two-valued terminal, so it is a self-atom.
- id: old-missing-join
  when: {loops: [identity, involution, left-inverses]}
  fails: [boolean-completeness-t]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: An old propositional algebra lacking a join is a principal interval of the root algebra. Its offending family is admitted as a current property.
- id: old-signature-witnesses
  when: {core: [named, paired, abundant, finite-support-rigid], names: inherited}
  holds: [possibility-plus-signature-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: The entrance into the signature-definable point preserves the individuals and their named values. Each eligible tuple there retains its Possibility+ witness by composition.
- id: one-current-individual
  when: {core: [named, paired]}
  fails: [infinity-e]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  text: There is exactly one individual at the root.
- id: lifted-barcan-failure
  when: {core: paired}
  fails: [barcan-t]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: Lift the old dual Barcan counterexample on the second branch with every other coordinate empty. Its possible instance survives and no new current argument can witness it possibly.
- id: isolated-identity
  when: {loops: [identity, involution]}
  holds: [strong-actuality]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: The proposition supported at the identity loop is true and a strong atom. Along each loop it remains a singleton and on every exit it becomes bottom.
- id: isolated-truths
  when: {loops: identity}
  holds: [truths-are-nd-necessary]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  text: The identity-only proposition witnesses the distinctness-preserving necessity of each current truth. Outside the root it cannot return to truth.
- id: returning-loop
  when: {loops: [involution, cantor]}
  fails: [truths-are-nd-necessary]
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-cantor
  text: Choose a truth false at another loop. Every proposed true guard becomes possibly true there, by returning along the inverse loop.
- id: cantor-neighbourhood
  when: {loops: cantor}
  holds: [vicinity]
  fails: [actuality, countable-boolean-completeness-r, boolean-completeness-t]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-cantor
  text: The whole loop region entails the possibility of every truth. Every neighbourhood of the identity splits at a fresh bit, and alternating first-one cylinders have no least clopen upper bound.
- id: onto-permutation-branch
  when: {core: permutation}
  holds: [necessary-barcan-r, necessary-atoms-are-strong-atoms-r, necessary-rigid-rigidity-r, necessary-tame-rigidity-r, necessary-weakly-rigid-power-r]
  fails: [necessary-actuality]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-permutation
  text: >-
    The old group has invertible transports and fails Actuality. All entrances are onto.
    Exact old images of rigid rows and clopen closures of their terminal images give the
    rigid lifts and the power property. Atoms transport to atoms or to bottom.
- id: finite-terminal-carriers
  holds: [axiom-of-infinity-t]
  fails: [necessary-potential-infinity-e, necessary-potential-infinity-t, pure-b-r]
  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-26'
  writeup: stone-terminal-maximalist
  text: >-
    Current rows admit the standard-numeral cut, and the Stone algebra gives
    infinitely many root propositions. At an ordinary terminal there is one
    individual and there are two propositions. The second and third Frege
    numerals respectively count nothing even possibly. A contingent truth exists
    at the root, but its existence is impossible at that terminal.
