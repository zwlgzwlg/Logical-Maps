id: full-action-models
name: 'Full action models'
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models, and the principles they all satisfy (p. 61).

# Action models full at every object: every intension of every relational type is present. Each
# member keeps its own file, id and the arguments that are its alone; what the members share
# because they are full lives in the topic's general arguments (Relational Choice and its boxed
# form, Transversal Choice, Distinctness-Preserving Collapse, Σ), which the group's `meets` brings
# to every member. Built on 2 October 2026 by Claude Opus 5.5 at Cian Dorr's direction; texts are
# the members' unless a revision says otherwise. The two free-monoid models are full action models
# whose interpretation of Σ is part of the construction (Bacon's glued constants), so they have no
# generated variants.

definition: >-
  {{construction}}


  {{sigma}}

parameters:
  construction:
    text: The category, its action on the individuals, and the evaluation point, as the member's
      source gives them.
  sigma:
    text: The interpretation of Σ. Each member fixes one; its variants with the others are
      generated, except where the construction itself interprets Σ.
    generate: true
    values:
      top:
        text: >-
          Interpretation of Σ, fixed for this record: each relational constant denotes the top
          element of its type and each individual constant denotes one fixed individual.
        label: Σ top
        requires: [sigma-apart]
        meets:
          sigma-top: This is the interpretation.
      single-top:
        text: >-
          Interpretation of Σ, fixed for this record: Σ is a single relational constant $c$ of type
          $t$, which denotes $\top$.
        label: Σ one constant for ⊤
        requires: [sigma-apart]
        meets:
          sigma-top: Its one relational constant denotes the top element of type $t$.
          sigma-single-top: This is the interpretation.
      true-atom:
        text: >-
          Interpretation of Σ, fixed for this record: one designated relational constant $c$ of
          type $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom
          of the model, the actual-world proposition $\{1\}$; every other relational constant
          denotes the top element of its type and every individual constant one fixed individual.
        label: Σ true atom
        requires: [sigma-apart, actuality-contingent]
        meets:
          sigma-true-atom: This is the interpretation.

# Conditions of the topic that every member meets.
meets:
  full-model: >-
    Every intension of every relational type is present at every object (Classicism, §3.5,
    p. 59).
  full-action-model: >-
    An action model, full at every object (Classicism, §3.5, p. 59; Appendix D).
  extensionally-full: >-
    A full model contains every intension, so in particular one with any given extension at the
    identity.
  metatheory-choice: The constructions are carried out in ZFC.
  actuality-contingent: >-
    The singleton $a$ of the identity arrow is in the domain, the model being full. It is necessary
    at no world: a world other than the identity sees itself, which lies outside $a$, and the
    identity sees an arrow other than itself. And a non-identity arrow $k$ does not fix it, since
    $1\in k\cdot a$ would need $1\circ k=1$.

conditions:
- id: sigma-apart
  text: >-
    The construction does not itself interpret Σ, so any of the group's interpretations can be
    added to it.

arguments: []
