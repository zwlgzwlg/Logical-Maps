id: full-action-models
name: 'Full action models'
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models, and the principles they all satisfy (p. 61).

# Action models full at every object: every intension of every relational type is present. Each
# member keeps its own file, id and the arguments that are its alone; what the members share
# because they are full lives in the topic's general arguments (Relational Choice and its boxed
# form, Transversal Choice, Truths are ND-necessary, Σ), which the group's `meets` brings
# to every member. Built on 2 October 2026 by Claude Opus 5.5 at Cian Dorr's direction; texts are
# the members' unless a revision says otherwise.
#
# Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction). The two free-monoid models,
# whose construction interprets Σ, moved to their own group, glued-free-monoid. Every member is now
# recorded at the same settings, one individual and Σ top, with the others generated, so that the
# group's grid shows how the constructions differ and its variants show what the settings change.
# Where the source gave a member an individual action of its own (the natural actions of the
# permutation and surjection models), its record says so in its notes: on the map's principles that
# action gives what the infinitely many fixed individuals give.

definition: >-
  {{construction}}


  {{individuals}}


  {{sigma}}


  {{metatheory}}

parameters:
  construction:
    text: The category, its action on the individuals, and the evaluation point, as the member's
      source gives them.
  individuals:
    text: What the individuals are. Each member is recorded with one individual; its variant with
      infinitely many individuals, which every arrow fixes, is generated. The infinite set of
      individuals is any infinite set, except under the metatheory `socks`, which takes every
      unspecified infinite set to be a union of pairs with no choice function.
    generate: true
    default: singleton
    values:
      singleton:
        text: >-
          Individuals, fixed for this record: there is a single individual at every object, and
          every arrow sends it to the single individual at its target.
        label: one individual
        brief: a single individual at every object, fixed by every arrow
        meets:
          one-individual: There is a single individual at every object.
          finitely-many-individuals-everywhere: There is a single individual at every object.
          homogeneous-individuals: There is only one individual.
      fixed-infinite:
        text: >-
          Individuals, fixed for this record: at every object the individuals are the members of an
          infinite set $D$, the same at every object, and every arrow acts on them as the identity.
        label: infinitely many fixed individuals
        brief: the same infinite set of individuals at every object, fixed by every arrow
        meets:
          fixed-infinite-individuals: This is the choice of individuals.
          arbitrary-infinite-set: $D$ is any infinite set.
          infinitely-many-individuals: $D$ is infinite.
          infinitely-many-individuals-everywhere: $D$ is infinite and the individuals at every object.
          homogeneous-individuals: >-
            A permutation of $D$ commutes with every arrow's action, the identity,
            so it is an automorphism at type $e$ and extends, by conjugation, to the full domains
            of the other types, carrying each individual to its image.
  sigma:
    text: The interpretation of Σ. Each member is recorded with Σ top; its variants with the
      others are generated.
    generate: true
    default: top
    values:
      # Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): Σ has no individual
      # constants. The value "Σ one constant for ⊤" went, its verdicts never differing from these;
      # the individual constants that `top` and `true-atom` had left verdicts unknown where the
      # individuals are not homogeneous, and settled none differently.
      top:
        text: >-
          Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
          denotes the top element of its type.
        label: Σ top
        brief: every constant of Σ denotes the top element of its type
        requires: [sigma-apart]
        meets:
          sigma-top: This is the interpretation.
      true-atom:
        text: >-
          Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
          $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of
          the model, the actual-world proposition $\{1\}$; every other constant of Σ, of which there
          is at least one, is relational and denotes the top element of its type.
        label: Σ true atom
        brief: one constant denotes the true atom (as a constant relation), the others top
        requires: [sigma-apart, actuality-contingent]
        meets:
          sigma-true-atom: This is the interpretation.
      opposite-singletons:
        text: The free signature has two propositional constants. They denote respectively the singleton of the identity arrow and the singleton of the other group arrow.
        label: two opposite proposition names
        brief: the two names denote the two complementary singleton propositions
        requires: [two-element-arrow-group]
  metatheory:
    text: The metatheory in which the construction is carried out. Each member is recorded with
      the axiom of choice; its variants under the other values are generated where their
      conditions are met. A value without choice gives a model only the arguments reviewed as
      choice-free.
    generate: true
    default: choice
    values:
      choice:
        text: >-
          Metatheory, fixed for this record: the axiom of choice is used freely, as in ordinary
          mathematics in ZFC, or in Lean's classical type theory for the verdicts certified there.
        label: with choice
        brief: built in ZFC
      no-countable-choice-reals:
        text: >-
          Metatheory, fixed for this record: the construction is carried out in ZF together with
          the hypothesis that some countable family $(A_n)_{n\in\omega}$ of nonempty sets of sets of
          natural numbers has no choice function ($\neg\mathrm{AC}_\omega(\mathbb R)$), which holds in
          Cohen's basic model. An infinite set the construction leaves unspecified is $\mathbb N$.
          ZF with this hypothesis is consistent if ZF is, so the verdicts of this record are
          relative-consistency claims of the same standing as those of a record in ZFC.
        label: ZF + ¬AC_ω(ℝ)
        brief: built in ZF with a countable family of sets of reals that has no choice function
        choiceless: true
        requires: [numbered-returning-arrows]
        meets:
          countable-choice-reals-fails: This is the hypothesis.
      cohen-basic:
        text: >-
          Work in Cohen's first symmetric model of ZF, which contains an infinite
          Dedekind-finite set of reals. Some countable family of nonempty sets of
          reals has no choice function. Take an unspecified infinite set to be the naturals.
        label: Cohen's first model
        brief: built in Cohen's first symmetric model of ZF
        choiceless: true
        requires: [numbered-returning-arrows]
        meets:
          countable-choice-reals-fails: An infinite Dedekind-finite set of reals gives a countable family of nonempty sets of reals with no choice function.
      sageev:
        text: >-
          Work in Sageev's 1975 model of ZF in which every infinite cardinal equals
          twice itself and some countable family of nonempty sets of reals has no
          choice function. Take an unspecified infinite set to be the naturals.
        label: Sageev's idemmultiple model
        brief: every infinite cardinal equals twice itself and countable choice for sets of reals fails
        choiceless: true
        requires: [numbered-returning-arrows]
        meets:
          countable-choice-reals-fails: Sageev's model contains a countable family of nonempty sets of reals with no choice function.
      socks:
        text: >-
          Metatheory, fixed for this record: the construction is carried out in ZF together with
          a countable family $(P_n)_{n\in\omega}$ of pairwise disjoint two-element sets that has no
          choice function (Russell's socks), which is consistent with ZF (Fraenkel's second
          permutation model, transferred to ZF by the Jech–Sochor theorem). Every infinite set the
          construction leaves unspecified (the individuals, the worlds, a carrier) is their union.
          The verdicts of this record are relative-consistency claims of the same
          standing as those of a record with choice.
        label: ZF + socks
        brief: built in ZF with countably many disjoint pairs that have no choice function (Russell’s socks)
        choiceless: true
        requires: [arbitrary-infinite-set]
        meets:
          socks-sets: This is the hypothesis.

# Conditions of the topic that every member meets.
meets:
  rigid-haecceity-disjunctions: >-
    Every intension is present, so for any set $E$ the intension $k\mapsto k\cdot E$ is in the
    domain, and a relation is weakly inextensible at a world iff it lies below that intension over
    its extension there, since that is the smallest intension satisfying the hypothesis; with
    persistence, a rigid relation equals it (the argument deferred in extraction.md, 3 October 2026).
  codomain-intensions: >-
    The domains are full at every object.
  full-model: >-
    Every intension of every relational type is present at every object (Classicism, §3.5,
    p. 59).
  full-action-model: >-
    An action model, full at every object (Classicism, §3.5, p. 59; Appendix D).
  extensionally-full: >-
    A full model contains every intension, so in particular one with any given extension at the
    identity.
  finite-extension-properties-everywhere: >-
    The domains are full at every object, so they contain the haecceities, making identity literal,
    and an intension with any given extension at each identity arrow.
  identity-singletons: >-
    The singleton of the identity arrow at any object is in the domain, the model being full.
  actuality-contingent: >-
    The singleton $a$ of the identity arrow is in the domain, the model being full. It is necessary
    at no world: a world other than the identity sees itself, which lies outside $a$, and the
    identity sees an arrow other than itself. And a non-identity arrow $k$ does not fix it, since
    $1\in k\cdot a$ would need $1\circ k=1$.

conditions:
- id: two-element-arrow-group
  text: The pointed category has one object and its arrows form a group of order two.
- id: sigma-apart
  text: >-
    The construction does not itself interpret Σ, so any of the group's interpretations can be
    added to it.

arguments:
- id: cohen-basic-small-cylinder-algebra
  when: {metatheory: cohen-basic}
  fails: [forcing-possibilism]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: mathematical-possibilism-in-full-action-models
  text: >-
    An infinite Dedekind-finite set of reals yields an atomless complete Boolean
    algebra of finite-coordinate cylinders whose carrier is Dedekind-finite and
    hence revised-small. As long as there are infinitely many arrows, their finite
    cardinality classes code all reals at a fixed type. The cylinder algebra thus
    has a typed presentation. Every nonzero scalar interval is a powerset with atoms.
- id: sageev-finite-benchmark
  when: {metatheory: sageev, individuals: singleton}
  holds: [forcing-possibilism]
  choice: free
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: mathematical-possibilism-in-full-action-models
  text: >-
    The singleton individual bounds the inexact ordinal benchmark by at most three
    thresholds. Sageev's cardinal-doubling principle supplies a countably infinite
    subset of each infinite carrier. This subset is power-closed with full current
    rows and exceeds the benchmark. Thus every revised-small algebra is finite.
    Infinitely many singleton-arrow atoms supply all finite Boolean intervals.
