id: full-action-models
name: 'Full action models'
references:
- paper: bacon-dorr-classicism
  role: proof
  locator: §3.5, pp. 58–61; Appendix D, pp. 73–74
  note: Full action models, and the principles they all satisfy (p. 61).

# Action models full at every object: every intension of every relational type is present. Each
# member keeps its own file, id and the arguments that are its alone; what the members share
# because they are full lives in the topic's general arguments (Relational Choice and its boxed
# form, Transversal Choice, Distinctness-Preserving Collapse, Σ), which the group's `meets` brings
# to every member. Built on 2 October 2026 by Claude Opus 5.5 at Cian Dorr's direction; texts are
# the members' unless a revision says otherwise.
#
# Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction). The two free-monoid models,
# whose construction interprets Σ, moved to their own group, glued-free-monoid. Every member is now
# recorded at the same settings, one individual and Σ top, with the others generated, so that the
# group's grid shows how the constructions differ and its variants show what the settings change.
# Where the source gave a member an individual action of its own (the natural actions of the
# permutation and surjection models), its record says so in its notes: on the map's principles that
# action gives what the infinitely many fixed individuals give.

definition: >-
  {{construction}}


  {{individuals}}


  {{sigma}}

parameters:
  construction:
    text: The category, its action on the individuals, and the evaluation point, as the member's
      source gives them.
  individuals:
    text: What the individuals are. Each member is recorded with one individual; its variant with
      infinitely many individuals, which every arrow fixes, is generated.
    generate: true
    default: singleton
    values:
      singleton:
        text: >-
          Individuals, fixed for this record: there is a single individual at every object, and
          every arrow sends it to the single individual at its target.
        label: one individual
        meets:
          one-individual: There is a single individual at every object.
          homogeneous-individuals: There is only one individual.
      fixed-infinite:
        text: >-
          Individuals, fixed for this record: at every object the individuals are the natural
          numbers, and every arrow acts on them as the identity.
        label: infinitely many fixed individuals
        meets:
          fixed-infinite-individuals: This is the choice of individuals.
          infinitely-many-individuals: The individuals are the natural numbers.
          homogeneous-individuals: >-
            A permutation of the natural numbers commutes with every arrow's action, the identity,
            so it is an automorphism at type $e$ and extends, by conjugation, to the full domains
            of the other types, carrying each individual to its image.
  sigma:
    text: The interpretation of Σ. Each member is recorded with Σ top; its variants with the
      others are generated.
    generate: true
    default: top
    values:
      # Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): Σ has no individual
      # constants. The value "Σ one constant for ⊤" went, its verdicts never differing from these;
      # the individual constants that `top` and `true-atom` had left verdicts unknown where the
      # individuals are not homogeneous, and settled none differently.
      top:
        text: >-
          Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
          denotes the top element of its type.
        label: Σ top
        requires: [sigma-apart]
        meets:
          sigma-top: This is the interpretation.
      true-atom:
        text: >-
          Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
          $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of
          the model, the actual-world proposition $\{1\}$; every other constant of Σ, of which there
          is at least one, is relational and denotes the top element of its type.
        label: Σ true atom
        requires: [sigma-apart, actuality-contingent]
        meets:
          sigma-true-atom: This is the interpretation.

# Conditions of the topic that every member meets.
meets:
  rigid-haecceity-disjunctions: >-
    Every intension is present, so for any set $E$ the intension $k\mapsto k\cdot E$ is in the
    domain, and a relation is weakly inextensible at a world iff it lies below that intension over
    its extension there, since that is the smallest intension satisfying the hypothesis; with
    persistence, a rigid relation equals it (the argument deferred in extraction.md, 3 October 2026).
  codomain-intensions: >-
    The domains are full at every object.
  full-model: >-
    Every intension of every relational type is present at every object (Classicism, §3.5,
    p. 59).
  full-action-model: >-
    An action model, full at every object (Classicism, §3.5, p. 59; Appendix D).
  extensionally-full: >-
    A full model contains every intension, so in particular one with any given extension at the
    identity.
  metatheory-choice: The constructions are carried out in ZFC.
  actuality-contingent: >-
    The singleton $a$ of the identity arrow is in the domain, the model being full. It is necessary
    at no world: a world other than the identity sees itself, which lies outside $a$, and the
    identity sees an arrow other than itself. And a non-identity arrow $k$ does not fix it, since
    $1\in k\cdot a$ would need $1\circ k=1$.

conditions:
- id: sigma-apart
  text: >-
    The construction does not itself interpret Σ, so any of the group's interpretations can be
    added to it.

arguments: []
