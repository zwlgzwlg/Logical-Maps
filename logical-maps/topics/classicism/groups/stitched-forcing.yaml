- id: continuum-hypothesis-preserved
  requires:
  - preserves-ch
  holds:
  - non-contingency-of-ch
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-25'
  text: 'At each object, every real number structure satisfies the continuum hypothesis iff the universe
    that object is built in does: at the root $V$, at $C_0$ $V[G]$. At $C_0$ this is because $C_0$ is
    the full extensional model of $V[G]$ over the natural numbers: a real number structure there is a
    complete ordered field of $V[G]$, with every subproperty and every relation of $V[G]$ available, so
    it has $V[G]$''s continuum, and its satisfying CH is CH in $V[G]$. At the root it is because every
    set in $V$ of root tuples is the root extension of a root relation, whatever its $C_0$-extension:
    so the root, read at the root, is the full hierarchy of $V$ over its domains, and the same reasoning
    applies in $V$. Real number structures exist at both objects, at type $et$ (see the argument for the
    failure of Analytic Necessitism, or take any complete ordered field on $\mathcal P(\mathbb N)$ at
    $C_0$). When $P$ leaves CH unchanged, every real number structure, of any type, satisfies CH at both
    objects, or every one falsifies it at both; since the root sees exactly the two objects, one of the
    two disjuncts holds there.'
- id: continuum-hypothesis-changed
  requires:
  - changes-ch
  fails:
  - non-contingency-of-ch
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Opus 5.5 (Anthropic), prompted by
    Cian Dorr
  date: '2026-10-25'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Theorem 20
  text: 'Theorem 20 of the source. At each object, every real number structure satisfies the continuum
    hypothesis iff the universe that object is built in does: at the root $V$, at $C_0$ $V[G]$. At $C_0$
    this is because $C_0$ is the full extensional model of $V[G]$ over the natural numbers: a real number
    structure there is a complete ordered field of $V[G]$, with every subproperty and every relation of
    $V[G]$ available, so it has $V[G]$''s continuum, and its satisfying CH is CH in $V[G]$. At the root
    it is because every set in $V$ of root tuples is the root extension of a root relation, whatever its
    $C_0$-extension: so the root, read at the root, is the full hierarchy of $V$ over its domains, and
    the same reasoning applies in $V$. Real number structures exist at both objects, at type $et$ (see
    the argument for the failure of Analytic Necessitism, or take any complete ordered field on $\mathcal
    P(\mathbb N)$ at $C_0$). When $P$ changes CH, at type $et$ some real number structure satisfies CH
    at one object and some falsifies it at the other, and the root sees both, so neither disjunct holds
    at the root.'
- id: necessity-of-analysis-constructible
  when:
    universe: constructible
  requires:
  - adds-a-real
  fails:
  - necessity-of-analysis
  by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
  date: '2026-10-25'
  text: 'At type $et$, for the analytical sentence $\Phi$ saying that every real is constructible: membership
    of a real in $L$ is $\Sigma^1_2$ (Shoenfield), so $\Phi$ is $\Pi^1_3$, a first-order analytical sentence
    in any real number structure, whose natural numbers code sets of naturals by its reals. Real number
    structures exist at type $et$ at both objects (see the argument for the failure of Analytic Necessitism).
    At $C_0$, the full extensional model of $L[G]$, every real number structure has the reals of $L[G]$,
    among them a real not in $L$, and Shoenfield absoluteness makes the $\Sigma^1_2$ definition of constructibility
    mean the same in $L[G]$; so $\Phi$ fails in every real number structure there. At the root every set
    in $L$ of root tuples is the root extension of a root relation, whatever its $C_0$-extension, so the
    root read at the root is the full hierarchy of $L$ over its domains, and $\Phi$ holds in every real
    number structure there, as it does in $L$. The root sees both objects, so neither disjunct of the
    instance holds there.'
