- id: intensional-choice-new-real
  requires:
  - adds-a-real
  fails:
  - intensional-choice-r
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-19'
  text: At type $(et)t$. Let $F$ be the root property of properties of individuals whose root extension
    is a single root property and whose $C_0$-extension is the reals of $V[G]$ not in $V$. It is necessarily
    instantiated. A property $G\le F$ that is necessarily uniquely instantiated would have a one-element
    $C_0$-extension $\{c\}$, definable from parameters in $V$, with $c$ a new real, which the $V$-decisiveness
    of $P$ forbids.
