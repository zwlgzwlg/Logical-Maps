- id: analytic-necessitism-new-real
  requires:
  - adds-a-real
  fails:
  - analytic-necessitism
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  text: 'At type $et$, at the root. A real number structure exists there: the rigid properties of individuals
    are the pairs $(E,E)$ with $E\subseteq\mathbb N$ in $V$, the reals of $V$ as sets of naturals, and
    the field relations on them, defined from membership by arithmetical formulas, are root relations
    (a function in $V$ with the corresponding definable $C_0$-relation); completeness at the root holds
    because every root property of these is a set in $V$. Now let $\mathfrak R$ be any rigid real number
    structure at $et$ with necessarily distinct elements. At the root it is a complete ordered field,
    so by categoricity its domain $X$ is in bijection with the reals of $V$ and its rationals are a countable
    dense subfield. Its root extension is a set $E$ in $V$ and, $X$ being rigid, its $C_0$-extension is
    $h[E]=E$, the same reals. At $C_0$ every property is available, in particular the cut in the rationals
    of $X$ of a real of $V[G]$ not in $V$, a bounded subproperty of $X$ with no least upper bound in $E$,
    a least upper bound being a real of $V$ equal to that new real. So $X$ is not complete at $C_0$, $\Box\operatorname{Real}_{et}(\mathfrak
    R)$ fails, and the instance fails: a real number structure is possible, indeed actual, and no rigid
    one is necessarily a real number structure.'
  revisions:
  - date: '2026-10-25'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: Moved from stitched-cohen-extension into the group, for every member whose forcing adds a real;
