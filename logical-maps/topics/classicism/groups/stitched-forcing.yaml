id: stitched-forcing
name: Stitched forcing models
references:
- paper: barton-goodsell-continuum-contingency
  role: proof
  locator: §8, Definition 1, Lemmas 11–19, Theorems 20–21; §7.1; §7.2.5
- paper: bacon-dorr-classicism
  role: background
  locator: §3, pp. 44–61
  note: Action models, of which the stitched models are; see §7.2 of the draft.
definition: 'The stitching construction of Barton and Goodsell (Continuum Contingency, §8). Work in a
  generic extension $V[G]$ of a ground model $V$ of ZFC by a weakly homogeneous, hence $V$-decisive, forcing
  $P$ (§7.1): a set of ordinals definable in $V[G]$ from parameters in $V$ lies in $V$.


  {{forcing}}


  {{universe}}


  Let $C_0$ be the canonical extensional model of $V[G]$ (§7.2.5): one object with its identity arrow,
  the natural numbers as individuals, two propositions, and at each relational type every function of
  $V[G]$ between the lower domains, so that its relations of a type are, up to extension, all the subsets
  in $V[G]$ of the tuples of that type. Call an element of $C_0$ definable when it is definable in $V[G]$
  from parameters in $V$. The root $\hat M$ is built in $V$ (§8.3, Definition 1, with the group $W$ trivial):
  its individuals are the natural numbers; its propositions are the pairs $\langle a,b\rangle$ of a truth
  value $a$ at the root and a truth value $b$ at $C_0$; and an element of a relational type at the root
  is a pair of a function in $V$ on the root domains, which gives its extension at the root, and a definable
  element of $C_0$ of the same type, which gives its extension at $C_0$, the two compatible in that the
  $C_0$-coordinate of the function''s value at an argument is the definable element applied to the argument''s
  $C_0$-component. Every such pair is in the domain, so a root relation may be any set in $V$ of root
  tuples together with any definable relation of $C_0$. The action model $M$ (§8.4) has the two objects
  $\hat M$ and $C_0$, their identities, and one arrow $h\colon\hat M\to C_0$, the identity on the individuals,
  which sends every other element to its $C_0$-component. Truth at the root is the first coordinate, so
  at the root $\Box p$ holds iff $p$ is true at both objects, and $C_0$ sees only itself. The source works
  in the full simple type hierarchy; the restriction of its model to the map''s relational types is an
  action model of the same kind. Evaluation point: $\hat M$, at its identity arrow.


  Interpretation of Σ, fixed for these records: every constant of Σ is relational, and each denotes the
  top element of its type.'
parameters:
  forcing:
    text: The forcing $P$, as the member gives it.
  universe:
    text: The ground model. Each member is recorded over an arbitrary ground model of ZFC; its variant
      over $L$ is generated.
    generate: true
    default: zfc
    values:
      zfc:
        text: 'Ground model, fixed for this record: $V$ is an arbitrary model of ZFC.'
        label: over any ground model
        brief: forcing over an arbitrary ground model of ZFC
      constructible:
        text: 'Ground model, fixed for this record: $V$ is Gödel''s constructible universe, so that $V[G]=L[G]$;
          that is, the construction is carried out over $L$, which ZFC proves to be a model of ZFC + $V=L$,
          so this adds nothing to what the construction presupposes. In particular $V\models\mathrm{CH}$.'
        label: over L
        brief: forcing over L, where CH holds
conditions:
- id: adds-a-real
  text: 'The forcing $P$ adds a real: some subset of $\mathbb N$ in $V[G]$ is not in $V$.'
- id: preserves-ch
  text: The continuum hypothesis has the same truth value in $V[G]$ as in $V$.
- id: changes-ch
  text: The continuum hypothesis has different truth values in $V[G]$ and in $V$.
meets:
  sigma-top: This is the interpretation the definition fixes.
  finitely-many-propositions-everywhere: The root has four propositions and $C_0$ two.
  fewer-propositions-after: The root has four propositions; $C_0$, after which there is only itself, has
    two.
arguments:
- id: self-atoms-and-strong-atoms
  holds:
  - necessary-atoms-are-self-atoms-r
  - necessary-atoms-are-strong-atoms-r
  - necessary-self-atoms-are-atoms-r
  - necessary-self-atoms-are-strong-atoms-r
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: The root sees itself and $C_0$ through one arrow each, and $C_0$ sees only itself. An entity at
    the root of a relational type is a pair $(E,D)$ of a root extension $E$ and a definable element $D$
    of $C_0$, with transport $D$ along the arrow to $C_0$. It is an atom iff $E$ is a singleton and $D=\bot$,
    or $E=\varnothing$ and $D$ is a definable singleton of $C_0$; a self-atom likewise, since its transport
    along the identity is itself and along the arrow to $C_0$ is $D$, each of which must be an atom where
    the entity is instantiated. Each such entity is a strong atom, its two transports being an atom or
    bottom. At $C_0$, a one-world model with full extensional domains, the atoms are the singletons, which
    are self-atoms and strong atoms. So all four bridge principles hold at both worlds, at every type.
- id: rigid-comprehension
  holds:
  - necessary-rigid-comprehension-r
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Fable 5.1 (Anthropic), prompted by
    Zachary Goodsell
  date: '2026-10-19'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Lemma 16
  text: 'Lemma 16 of the source, in the map''s terms. Write a root relation as the pair of its root extension
    $E$, a set in $V$ of root tuples, and its $C_0$-extension $g$, a definable relation of $C_0$; transport
    along $h$ sends it to $g$, and $h[E]$, the set of $C_0$-components of the members of $E$, is definable
    from the set in $V$ of their names. The relation is persistent iff $h[E]\subseteq g$. It is weakly
    inextensible iff $g\subseteq h[E]$: the root relation with root extension $E$ and $C_0$-extension
    $h[E]$ necessarily holds of every member of $E$, so weak inextensibility gives $g\subseteq h[E]$;
    conversely, a root relation that necessarily holds of each member of $E$ has root extension including
    $E$ and $C_0$-extension including $h[E]$. So a root relation is weakly rigid iff $g=h[E]$, and then
    rigid, since at $C_0$, which sees only itself, every relation is rigid. Hence $(E,g)$ is coextensive
    with the rigid $(E,h[E])$, and Rigid Comprehension holds at the root; at $C_0$ it holds trivially.'
- id: relational-choice
  holds:
  - necessary-relational-choice-r
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Fable 5.1 (Anthropic), prompted by
    Zachary Goodsell
  date: '2026-10-19'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Lemma 17
  text: Lemma 17 of the source. A serial root relation $U$ has, by choice in $V$, a functional subrelation
    $E_S$ of its root extension; the root relation with root extension $E_S$ and the $C_0$-extension of
    $U$ is in the domain, lies within $U$ at the root and is functional there, which is all the unboxed
    principle asks. At $C_0$, $V[G]$ supplies a functional subrelation of any serial relation, and the
    full domain contains it.
- id: axiom-of-infinity-e
  holds:
  - axiom-of-infinity-e
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Fable 5.1 (Anthropic), prompted by
    Zachary Goodsell
  date: '2026-10-19'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Lemma 15
  text: 'The individuals are the natural numbers at both objects (Lemma 15 of the source). At the root
    the finite cardinalities of type $(et)t$ are the numerals $\operatorname{Suc}^k\mathbf 0$: the root
    property of cardinalities whose root extension is the set of numerals, with the corresponding definable
    property at $C_0$, holds of $\mathbf 0$ and is closed under successor, so every finite cardinality
    is a numeral; and the $k$-th numeral holds of a root property of individuals iff its root extension
    has exactly $k$ members, which the universal property has not.'
- id: atomicity-t
  holds:
  - necessary-atomicity-t
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Fable 5.1 (Anthropic), prompted by
    Zachary Goodsell
  date: '2026-10-19'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Theorem 21
  text: Theorem 21 of the source, with the trivial group. The root has four propositions, the pairs of
    a truth value at the root and one at $C_0$, ordered coordinatewise, and $C_0$ has two; both algebras
    are finite, hence atomic.
- id: barcan-t
  holds:
  - necessary-barcan-t
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-19'
  text: Both propositions of $C_0$ are transports of root propositions, so a property of propositions
    at the root that necessarily holds of every root proposition holds at $C_0$ of both propositions there;
    at $C_0$, which sees only itself, BF is trivial.
- id: distinctness-preserving-collapse
  holds:
  - necessary-distinctness-preserving-collapse
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-19'
  text: At the root let $q$ be the proposition true at the root alone. $\Diamond q$ is true at the root
    and false at $C_0$, so for any truth $p$, $\Box(\Diamond q\to p)$ holds, and $q$ witnesses $\Box_{\ne}p$.
    At $C_0$, where necessity is truth, $\top$ witnesses $\Box_{\ne}p$ for every truth $p$.
- id: infinity-t
  fails:
  - infinity-t
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-19'
  text: The root has four propositions, so the instance of the schema asking for five pairwise distinct
    ones fails.
- id: rigid-power-new-real
  requires:
  - adds-a-real
  fails:
  - rigid-power-r
  - rigid-rigidity-r
  by: Neil Barton and Zachary Goodsell; in the map's terms by Claude Fable 5.1 (Anthropic), prompted by
    Zachary Goodsell
  date: '2026-10-19'
  source:
    paper: barton-goodsell-continuum-contingency
    locator: Lemma 19
  text: 'Lemma 19 of the source, with the universal property of individuals in place of the natural numbers.
    Let $F:=\lambda x^e\, .\,\top$; it is rigid, its root extension being $\mathbb N$ and its $C_0$-extension
    $h[\mathbb N]=\mathbb N$. Its power property $P:=\lambda X^{et}\, .\,\operatorname{Rigid}(X)\land
    X\le F$ is $\lambda X\, .\,\operatorname{Rigid}(X)$, as $X\le F$ is a theorem. By the criterion in
    the argument for Rigid Comprehension, the rigid root properties of individuals are the pairs $(E,E)$
    with $E\subseteq\mathbb N$ in $V$, whose $C_0$-components are the reals of $V$, while at $C_0$ every
    property is rigid, so the $C_0$-extension of $P$ is the whole power set of $\mathbb N$ in $V[G]$.
    The root property of properties with the root extension of $P$ and $C_0$-extension $\mathcal P(\mathbb
    N)^V$, definable from that parameter, necessarily holds of every root instance of $P$, but not, at
    $C_0$, of a real of $V[G]$ not in $V$, which is rigid there. So $P$ is not weakly inextensible: Rigid
    Power fails at type $(et)t$ and, $P$ being rigidity itself, Rigid Rigidity fails at type $et$.'
  revisions:
  - date: '2026-10-25'
    by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr
    note: Moved from stitched-cohen-extension into the group, for every member whose forcing adds a real;
      the Cohen real of the original text is now any real of $V[G]$ not in $V$, and the appeal to the
      weak homogeneity of Cohen forcing is to the $V$-decisiveness of $P$.
- id: barcan-new-real
  requires:
  - adds-a-real
  fails:
  - barcan-relational
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-19'
  text: 'By the $V$-decisiveness of $P$, a real of $V[G]$ definable there from parameters in $V$ lies
    in $V$; so the $C_0$-components of the root properties of individuals are exactly the reals of $V$,
    and a real $c$ of $V[G]$ not in $V$ is the component of none. The root property of properties of individuals
    whose root extension is everything and whose $C_0$-extension is $\mathcal P(\mathbb N)^V$ necessarily
    holds of every root property of individuals, but $c$ does not fall under it at $C_0$: BF fails at
    type $et$.'
  revisions:
