- id: arithmetic-necessitism-complete-components
  requires:
  - complete-components
  holds:
  - arithmetic-necessitism
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: free
  text: 'Vacuously, at every type $\sigma$. The negation of $I^*_\sigma$, that zero is a successor or
    successor is not injective on the numbers at $\sigma$, is a pure sentence consistent with C: it holds
    in the full model with one world, one individual and two propositions, where every type is finite
    and the finite cardinalities beyond the size of the type coincide. So it is possible at the root (pure-sentences-possible),
    the antecedent $\Box I^*_\sigma$ fails there, and the instance of Arithmetic Necessitism at $\sigma$
    is true.'
- id: necessity-of-analysis-complete-components
  requires:
  - complete-components
  fails:
  - necessity-of-analysis
  by: Claude Fable 5.1 (Anthropic), prompted by Zachary Goodsell
  date: '2026-10-23'
  choice: uses
  text: 'The negation of an instance of the Necessity of Analysis is a closed pure sentence consistent
    with C: at the root of coalesced-two-extensional-arithmetics-root, with $\sigma$ and $A$ as in that
    model''s argument, both $\Diamond\exists\mathfrak R\,.\,(\operatorname{Real}_\sigma(\mathfrak R)\land
    A(\mathfrak R))$ and $\Diamond\exists\mathfrak R\,.\,(\operatorname{Real}_\sigma(\mathfrak R)\land\neg
    A(\mathfrak R))$ hold. So it is possible at the root (pure-sentences-possible), and since arrows compose,
    what is possibly possible is possible: both conjuncts hold at the root, and the instance fails.'
- id: self-atom-of-two-actual-components
  requires:
  - two-actual-components
  fails:
  - self-atoms-are-atoms-t
  - self-atoms-are-strong-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: 'Let $N$ and $M$ be two components whose roots satisfy Actuality, with true atoms $a_N$ and $a_M$,
    and let $P$ be the root proposition false at the root, with component $a_N$ at $N$, $a_M$ at $M$ and
    bottom elsewhere. $P$ is possible, and it is a self-atom: under the distinguished arrow into $N$ it
    becomes $a_N$, and a true atom is a self-atom, as it entails every truth, including the truth that
    it entails every truth; likewise at $M$; and at the root it is false. It is not an atom, since the
    root proposition with component $a_N$ alone lies strictly below it. So Self-atoms are atoms (type
    t) fails at the root, and with it Self-atoms are strong atoms (type t).'
- id: self-atomicity-component
  requires:
  - complete-components
  - distinguished-arrows
  fails:
  - self-atomicity-t
  - atoms-are-self-atoms-t
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, 25 October 2026
  date: '2026-10-25'
  choice: free
  text: Atoms are self-atoms (type t) fails in a model of C, the full idempotent monoid, where the atom
    $\{k\}$ becomes $\{1,k\}$ under $k$; so some component $N$ refutes it at its root with an atom $q$.
    The root proposition with component $q$ at $N$ and bottom elsewhere, false at the root, is an atom
    at the root, is possible, and under the distinguished arrow into $N$ becomes $q$, which is true at
    a world of $N$ without being an atom there. So it is an atom that is not a self-atom, and as nothing
    possible lies below it but itself, Self-Atomicity (type t) fails at the root too.
