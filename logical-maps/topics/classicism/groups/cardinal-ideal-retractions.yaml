id: cardinal-ideal-retractions
name: Retractions over cardinal ideals
definition: >-
  Start with a countable elementary substructure of $H_{(\beth_\omega)^+}$.
  {{bound}} Set $I=\lambda^+$ and identify sequences of entire entrance rows
  agreeing off at most $\lambda$ indices, computed internally. Each root
  relation pairs an arbitrary current row with such a sequence germ. For
  every generic ultrapower by the corresponding quotient of $\mathcal P(I)$,
  the entrance takes the row at the generic index and retains the elementary
  image of the entire original entity as its return coordinate. A return
  projects to a fresh root in the ultrapower. Iterate along finite histories.
  Both kinds have individual domain the internal natural numbers. The sole
  propositional name has an entrance germ with both its support and its
  complement positive.
parameters:
  bound:
    text: The largest size of a null set of entrance indices.
    generate: true
    default: countable
    values:
      countable:
        text: Take $\lambda=\aleph_0$.
        label: countable sets
      continuum:
        text: Take $\lambda=2^{\aleph_0}$.
        label: sets of size at most the continuum
      power-of-continuum:
        text: Take $\lambda=2^{2^{\aleph_0}}$.
        label: sets of size at most the cardinality of the power set of the continuum
arguments: []
