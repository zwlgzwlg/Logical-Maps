- id: finite-atoms-in-the-pure-reduct
  when:
    source: [boolean-valued-collapse-without-new-reals, full-boolean-valued-atom-and-cohen-real-universe-constructible, four-proposition-entrance-to-paired-stages, symmetric-collapse-pair, symmetric-entrance-qualitative-links, symmetric-old-new-individuals, symmetric-qualitative-links, symmetric-two-object-unpinned]
