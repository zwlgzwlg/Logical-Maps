id: independent-expansions-of-pure-models
name: Independent expansions of pure models
definition: >-
  {{source}} Preserve the complete pure theory of its designated point. In the numerical cases adjoin one relation
  constant of type $\nu_\sigma t$ and take a compactness model of the pure theory and the numerical conditions described
  in the shared proof. In the two finite entrance cases take the rooted category of arrows from the source and name
  the haecceity of the root individual.
parameters:
  source:
    text: The original pointed pure model and the type of the added relation.
    generate: true
    default: ultralimit-fork
    values:
      absorbing-entrance-hyperfinite-group:
        text: >-
          Use [[absorbing-entrance-hyperfinite-group]]. Use Frege numerals counted at $t$, distinguished by [[potential-infinity-t]].
        label: Four-proposition entrance into a hyperfinite group action
      absorbing-entrance-swappable-pairs:
        text: >-
          Use [[absorbing-entrance-swappable-pairs]]. Use Frege numerals counted at $e$, distinguished by [[infinity-e]].
        label: Absorbing entrance to an integer action, with finitely supported swappable pairs
      boolean-valued-collapse-without-new-reals:
        text: >-
          Use [[boolean-valued-collapse-without-new-reals]]. Use Frege numerals counted at $t$. The factor given by
          the regular-open algebra of the continuum collapse is infinite.
        label: Boolean-valued collapse without new reals
      descriptor-entrance-to-two-returns:
        text: >-
          Use [[descriptor-entrance-to-two-returns]]. Use Frege numerals counted at $t$. Infinitely many auxiliary
          proposition descriptors are distinguished by the freely varying old assignments.
        label: Descriptor entrance to the two-return category
      finite-support-sections-and-projection:
        text: >-
          Use [[finite-support-sections-and-projection]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Finite-support action model: N and N×2, sections and projection'
      finite-support-truncations:
        text: >-
          Use [[finite-support-truncations]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Finite-support action model: truncations of N'
      finite-support-two-object-all-maps-at-singleton:
        text: >-
          Use [[finite-support-two-object-all-maps-at-singleton]]. Use Frege numerals counted at $t$, distinguished
          by [[infinity-t]].
        label: 'Finite-support action model: N and singleton, all maps, evaluated at the singleton'
      four-proposition-entrance-to-paired-stages:
        text: >-
          Use [[four-proposition-entrance-to-paired-stages]]. Use Frege numerals counted at $t$. The entrance reaches
          stage zero, where tests for different subsets of the integer stages give infinitely many distinct propositions.
        label: Four-proposition entrance to the paired integer stages
      full-boolean-valued-atom-and-cohen-real-universe-constructible:
        text: >-
          Use [[full-boolean-valued-atom-and-cohen-real]], in its built in L setting. Use Frege numerals counted at
          $t$, distinguished by [[infinity-t]].
        label: 'Full Boolean-valued model: one atom and the Cohen algebra, with infinitely many individuals [built
          in L]'
      full-infinite-s5-metatheory-socks:
        text: >-
          Use [[full-infinite-s5]], in its ZF + socks setting. Use Frege numerals counted at $t$, distinguished by
          [[infinity-t]].
        label: 'Full action model: infinite S5 [ZF + socks]'
      full-monoid-ac-equals-bc:
        text: >-
          Use [[full-monoid-ac-equals-bc]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Full action model: the monoid with ac = bc'
      full-omega-chain-new-individuals:
        text: >-
          Use [[full-omega-chain-new-individuals]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Full action model: ω-chain, one new individual at each step'
      full-two-object-double-retraction-individuals-fixed-infinite:
        text: >-
          Use [[full-two-object-double-retraction]], in its infinitely many fixed individuals setting. Use Frege numerals
          counted at $e$, distinguished by [[infinity-e]].
        label: 'Full action model: two-object retract with two retractions [infinitely many fixed individuals]'
      iterated-ultrafilter-fronts:
        text: >-
          Use [[iterated-ultrafilter-fronts]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Iterated ultrafilters on well-founded fronts
      paired-individuals-two-object:
        text: >-
          Use [[paired-individuals-two-object]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Paired-individuals two-object model: block-respecting maps'
      paired-stages-with-zero-arrows:
        text: >-
          Use [[paired-stages-with-zero-arrows]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Paired stages with zero arrows
      profinite-s5-regular-world:
        text: >-
          Use [[profinite-s5-regular-world]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Profinite S5 Boolean algebras at a regular world
      stationary-entrance-successor:
        text: >-
          Use [[stationary-entrance-successor]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Eventually stationary entrance to the full successor action
      stitched-ch-reversing-universe-constructible:
        text: >-
          Use [[stitched-ch-reversing]], in its over L setting. Use Frege numerals counted at $e$, distinguished by
