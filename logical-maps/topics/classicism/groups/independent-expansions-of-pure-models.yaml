        label: 'Stitched forcing model: ground-model root with a CH-reversing extension at its one other world [over
          L]'
      stone-terminal-cantor:
        text: >-
          Use [[stone-terminal-cantor]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Cantor root loops with Maximalism and current Barcan
      supported-diagonal-tail-permutations:
        text: >-
          Use [[supported-diagonal-tail-permutations]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Supported model over Cantor space with diagonal tail permutations
      symmetric-class-reflecting-surjections:
        text: >-
          Use [[symmetric-class-reflecting-surjections]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Symmetric ideally-full model: class-reflecting surjections of infinitely many infinite classes'
      symmetric-collapse-pair:
        text: >-
          Use [[symmetric-collapse-pair]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Symmetric ideally-full model: permutations and collapsers of a fixed pair (Base 2)'
      symmetric-entrance-qualitative-links:
        text: >-
          Use [[symmetric-entrance-qualitative-links]]. Use Frege numerals counted at $t$, distinguished by [[potential-infinity-t]].
        label: 'Symmetric ideally-full model: a one-point entrance to the qualitative-links tail'
      symmetric-infinite-classes:
        text: >-
          Use [[symmetric-infinite-classes]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Symmetric ideally-full model: automorphisms of infinitely many infinite classes'
      symmetric-old-new-individuals:
        text: >-
          Use [[symmetric-old-new-individuals]]. Use Frege numerals counted at $e$, distinguished by [[infinity-e]].
        label: 'Symmetric ideally-full model: old and new individuals'
      symmetric-qualitative-links:
        text: >-
          Use [[symmetric-qualitative-links]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Symmetric ideally-full model: qualitative link structure (Base 3)'
      symmetric-two-object-unpinned:
        text: >-
          Use [[symmetric-two-object-unpinned]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Symmetric ideally-full model: two objects, the second unpinned'
      symmetry-constrained-full-point-and-three:
        text: >-
          Use [[symmetry-constrained-full-point-and-three]]. Use the root individual and the two distinct transports
          into the three-individual object.
        label: 'Symmetry-constrained full model: a one-point object and all maps to three individuals'
      symmetry-constrained-full-point-and-three-forward:
        text: >-
          Use [[symmetry-constrained-full-point-and-three-forward]]. Use the root individual and the two distinct
          transports into the three-individual object.
        label: 'Symmetry-constrained full model: a one-point object, its maps into three individuals, and their permutations'
      ultralimit-fork:
        text: >-
          Use [[ultralimit-fork]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Action model: a fork with an ultralimit world'
      ultraproduct-finite-full-s5:
        text: >-
          Use [[ultraproduct-finite-full-s5]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: 'Henkin ultraproduct: finite full S5 models, n worlds and n individuals'
      universal-actual-diagonal-tails:
        text: >-
          Use [[universal-actual-diagonal-tails]]. Use Frege numerals counted at $t$, distinguished by [[infinity-t]].
        label: Universal diagonal-tail model at an isolated fixed world
arguments:
- id: independent-nonempty
  holds: [independence-signature-r]
  fails: [witnessed-possibility-r]
  choice: uses
  writeup: independent-numeral-predicates
  text: >-
    In the numerical variants every finite list of closed pure terms excludes at most finitely many distinct numeral
    haecceities. Compactness supplies a necessarily nonempty predicate unequal to every such term. In the two finite
    entrance variants the named haecceity has unequal transports along arrows with the same old target, whereas every
    closed pure term has equal transports. The bottom predicate witnesses emptiness at the starting point and the
    named predicate cannot be empty.
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
- id: one-constant-modal-freedom
  when:
    source: [finite-support-truncations, full-infinite-s5-metatheory-socks, full-monoid-ac-equals-bc, iterated-ultrafilter-fronts,
      paired-stages-with-zero-arrows, supported-diagonal-tail-permutations, symmetric-class-reflecting-surjections,
      symmetric-collapse-pair, symmetric-infinite-classes, symmetric-qualitative-links, ultraproduct-finite-full-s5]
  holds: [modal-freedom-signature-r]
  choice: free
  writeup: independent-numeral-predicates
  text: >-
    The two tuples of constants in a Modal Freedom instance are disjoint. With only one available symbol, at least
    one side is pure. No Pure Contingency makes that side necessary whenever it is possible, so it may be conjoined
    with the other side at an accessible witness.
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
- id: pure-term-signature-b-r
  when:
    source: [boolean-valued-collapse-without-new-reals, finite-support-sections-and-projection, finite-support-truncations,
      finite-support-two-object-all-maps-at-singleton, full-boolean-valued-atom-and-cohen-real-universe-constructible,
      full-infinite-s5-metatheory-socks, full-monoid-ac-equals-bc, full-two-object-double-retraction-individuals-fixed-infinite,
      iterated-ultrafilter-fronts, paired-individuals-two-object, paired-stages-with-zero-arrows, profinite-s5-regular-world,
      supported-diagonal-tail-permutations, symmetric-class-reflecting-surjections, symmetric-collapse-pair, symmetric-infinite-classes,
      symmetric-old-new-individuals, symmetric-qualitative-links, ultraproduct-finite-full-s5, universal-actual-diagonal-tails]
  holds: [signature-b-r]
  choice: uses
  writeup: independent-numeral-predicates
  text: >-
    Every finite approximation interprets the new constant by a closed pure numeral haecceity. Replacing the constant
    by that term gives a pure instance of the source schema. Compactness preserves all requested signature instances
    together with Independence.
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
- id: pure-term-no-contingency-signature-r
  when:
