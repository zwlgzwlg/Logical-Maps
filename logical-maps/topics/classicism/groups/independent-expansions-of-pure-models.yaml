  choice: uses
  by: OpenAI Codex (GPT-6), prompted by Daniel Kodsi
  date: '2026-11-27'
  writeup: finite-scalar-atoms-exclude-mathematical-possibilism
  text: >-
    The indicated reduct has a fixed finite bound on its number of scalar
    atoms. In the Boolean-valued examples the second Boolean factor is
    atomless. The four-proposition entrance, the fixed one-point entrance
    to qualitative links and the old-and-new-individuals example have
    finite scalar carriers. In the three remaining symmetric cases all
    nonpermutation cylinders split. A finite upper bound on the number
    of scalar atoms is a single pure sentence, and is preserved by the
    expansion. Small finite Boolean algebras require arbitrarily many
    scalar atoms for Mathematical Possibilism.
