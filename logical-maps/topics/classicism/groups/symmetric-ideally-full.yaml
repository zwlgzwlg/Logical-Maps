id: symmetric-ideally-full
name: 'Symmetric ideally-full models'
references:
- paper: dorr-bc-not-rc
  role: proof
  locator: §3.1, p. 9; Definitions 15–18, p. 8; Lemma 21, p. 10
- paper: bacon-dorr-classicism
  role: background
  locator: Appendix D, pp. 73–79
  note: The ideally-full action models of which these are the symmetric variants, and on p. 79 the
    precursor recorded as symmetric-qualitative-contrast.

# The symmetric ideally-full intensional action models of Dorr's draft, with the Appendix D
# precursor. Each member keeps its own file, id and the arguments that are its alone; an argument
# that more than one member gave in substance is here, or in the topic's arguments/, stated once,
# with what varies between members under each member's `meets`. Built on 2 October 2026 by Claude
# Opus 5.5 at Cian Dorr's direction; texts are the members' unless a revision says otherwise.
#
# Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): every member is recorded at Σ
# top, its other interpretation generated, and with the individuals its construction gives, the
# base; its variant with one individual, the arrows still acting on the base, is generated. The
# arguments that work at type $e$ apply only at the base: in the variant, whether Relational
# Choice, Transversal and Rigid Comprehension still fail is open.

definition: >-
  {{construction}}


  {{individuals}}


  {{sigma}}

parameters:
  construction:
    text: The objects, arrows and symmetry groups, and which intensions the domains hold, as the
      member's source gives them.
  individuals:
    text: What the individuals are. Each member is recorded with the individuals its construction
      gives; its variant with one individual is generated.
    generate: true
    default: base
    values:
      base:
        text: >-
          Individuals, fixed for this record: the individuals at each object are the base the
          construction describes, and the arrows act on them as on the base.
        label: individuals the base
        brief: the individuals are the base, moved by the arrows
        # Revised 25 October 2026 (Claude Opus 5.5, prompted by Cian Dorr): generated only for a member
        # whose base at the evaluation object is infinite, as this value's meets assume.
        requires: [infinite-base]
        meets:
          infinitely-many-individuals: The base is infinite.
          construction-individuals: The individuals are the base, acted on as the construction says.
      singleton:
        text: >-
          Individuals, fixed for this record: there is a single individual at every object. The
          arrows still act on the base as the construction says, and the base still supplies the
          pinning sets and the symmetry groups.
        label: one individual
        brief: a single individual; the base still supplies the pinning sets and symmetries
        meets:
          one-individual: There is a single individual at every object.
          homogeneous-individuals: There is only one individual.
  sigma:
    text: The interpretation of Σ. Each member is recorded with Σ top; its variant with the other
      is generated.
    generate: true
    values:
      # Revised 3 October 2026 (Claude Opus 5.5, at Cian Dorr's direction): Σ has no individual
      # constants. The value "Σ one constant for ⊤" went, its verdicts never differing from these;
      # the individual constants that `top` and `true-atom` had left verdicts unknown where the
      # individuals are not homogeneous, and settled none differently.
      top:
        text: >-
          Interpretation of Σ, fixed for this record: every constant of Σ is relational, and each
          denotes the top element of its type.
        label: Σ top
        brief: every constant of Σ denotes the top element of its type
        meets:
          sigma-top: This is the interpretation.
      true-atom:
        text: >-
          Interpretation of Σ, fixed for this record: one designated relational constant $c$ of type
          $\tau=\bar\sigma t$ denotes $\lambda\bar x\, .\,a$, where $a$ is the unique true atom of
          the model, the actual-world proposition, the symmetry group; every other constant of Σ, of
          which there is at least one, is relational and denotes the top element of its type.
        label: Σ true atom
        brief: one constant denotes the true atom (as a constant relation), the others top
        requires: [actuality-contingent]
        meets:
          sigma-true-atom: This is the interpretation.

# Conditions of the topic that every member meets (4 October 2026, Claude Fable 5.1, at Cian Dorr's
# direction, when the collapse lemma for Intensional Choice became a general argument).
meets:
  symmetric-domains: >-
    The relational domains hold exactly the symmetric intensions pinned down by a finite set
    (Dorr, draft, Definitions 15–18).
  # Added 25 October 2026 (Claude Opus 5.5, prompted by Cian Dorr), for the general argument
  # second-order-analysis-full-continuum.
  full-continuum-everywhere:
    requires: [infinitely-many-orbits-everywhere]
    text: >-
      At a reachable object $v$, let $\tau$ be a type with infinitely many orbits there, and for a set $A$ of
      them let $Y_A$ be the intension of type $\tau t$ whose value at an arrow into $v$ is the union of the
      orbits in $A$ and at other arrows is empty: symmetric, the values being invariant, and pinned down by
      $\emptyset$, so in the domain; its transport along any arrow depends only on the arrow's codomain.
      The $Y_A$ are continuum many and pairwise distinct at $v$. For a set $T$ of $k$-tuples of them, the
      intension whose value at an arrow $h$ is the set of transports along $h$ of the tuples in $T$ depends
      only on $h$'s codomain, is symmetric, each such transport being fixed by the target's symmetries, and
      is pinned down by $\emptyset$; its extension at $v$ is $T$.
  infinitely-many-orbits-everywhere:
    requires: [one-object-action-model, infinitely-many-individuals]
    text: >-
      For a finite set $N$ of individuals, the property of being one of them, $h\mapsto h(N)$, is symmetric
      and pinned down by $N$; symmetries preserve the size of $N$, so these properties lie in infinitely many
      orbits at the one object.


# The group in Lean (Classicism/Models/SymBase.lean): its parameter is a base, Dorr's Definition 15.
lean:
  binder: '(S : Classicism.Meta.Intensional.SymBase)'
  var: S
  model: Classicism.Meta.Intensional.SymBase.model {param}
  is_model: Classicism.Meta.Intensional.SymBase.model_isModel {param}
  settings: {individuals: base}

conditions:
- id: moving-proposition-stabilizers
  text: >-
    At the evaluation object V, for every finite subset N of the pinning carrier,
    some designated symmetry fixing N pointwise moves a proposition in D_t(V)
    as a whole intension. The pinning carrier need not be the individual domain.
- id: infinitely-many-orbits-everywhere
  text: >-
    At every object reachable from the evaluation point, the entities of some relational type there fall
    into infinitely many orbits under that object's symmetry group.
- id: infinite-base
  text: >-
    The pinning base at the evaluation object is infinite.
- id: transposable
  text: >-
    For each finite set $N$ of individuals at the evaluation object, some property $A$ in the
    domain has a nonempty extension there, and each individual $y$ in that extension is moved by
    a member of the symmetry group that fixes $N$ pointwise and fixes $A$.
  lean: Classicism.Meta.Intensional.SymBase.Transposable
- id: separable-collapses
  text: >-
    There are infinitely many pairs of individuals such that, for any two of these pairs, some
    arrow collapses the one and not the other.
  lean: Classicism.Meta.Intensional.SymBase.SeparableCollapses
- id: surjective-arrows
  text: >-
    Every arrow is surjective.
  lean: Classicism.Meta.Intensional.SymBase.SurjectiveArrows
- id: finite-pinning
  text: >-
    At every object, the domains hold the symmetric intensions pinned down by a finite set: every
    object carries the ideal of finite sets.
  lean: Classicism.Meta.Intensional.SymBase.FinitePinning
- id: symmetry-group-pinned
  text: >-
    The symmetry group, the smallest symmetric set of arrows containing the identity, is pinned
    down by a finite set.
  lean: Classicism.Meta.Intensional.SymBase.SymmetryGroupPinned
- id: hull-conditions
  text: >-
    There is a finite set $M_0$ of individuals at the evaluation object such that: (B1) for every
    finite $M\supseteq M_0$ and every arrow $h$ from the evaluation object to itself that $M$
    does not separate (some arrow $k\notin G$ agrees with $h$ on $M$, or $h\in G$), every arrow
    $h'$ agreeing with $h$ on $M$, and finite $P,Q$ with $P\cap Q\subseteq M$, some arrow agrees
    with $h'$ on $P$ and with $h$ on $Q$; and (B2) for finite $N\supseteq M_0$ and finite $P,Q$,
    some member of the symmetry group fixes $N$ pointwise and moves every member of $P$ outside
    $N$ off $Q$. The arrows in (B1) go from the evaluation object to any one object, and $M$
    separates $h$ when every arrow agreeing with $h$ on $M$ is a member of the symmetry group of
    the evaluation object. These are the hypotheses of Dorr's main theorem (draft, Definitions
    28–30, Theorem 36).
  lean: Classicism.Meta.Intensional.SymBase.HullConditions
- id: fixes-or-omits
  text: >-
    There is a distinguished individual that every arrow either fixes or omits from its range, and
    some arrow moves it.
  lean: Classicism.Meta.Intensional.SymBase.FixesOrOmits

arguments:

- id: singleton-relational-choice
  when: {individuals: singleton}
  requires: [finitely-pinned-domains, moving-proposition-stabilizers]
  fails: [relational-choice-r]
  by: OpenAI Codex, prompted by Daniel Kodsi
  date: '2026-10-30'
  choice: free
  writeup: symmetric-singleton-relational-choice
  text: >-
    At input type $tt$ and output type $t$. The full symmetric profile construction
    admits the property $A$ whose profile at $w:V\to W$ is the propositions moved
    by some symmetry of W fixing $w[N]$ pointwise. It is N-pinned, and conjugation
    of stabilizers proves symmetry. If a selector S for the serial membership
    relation were pinned by finite N, every symmetry fixing N would fix both S
    and A as whole intensions. The condition makes A nonempty at V. A selected
    member would therefore be fixed by every such symmetry, contradicting its
    membership in A. This uses finite supports only at the evaluation object,
    full admission of symmetric pinned profiles, and no external choice. The
    construction-specific condition witnesses and complete proof are in the
    writeup. Original arguments: 22 October 2026, §§1–2 of the stabilizer note
    and §§1–2 of its singleton applications; direct source misc.

- id: relational-choice
  when: {individuals: base}
  requires: [transposable]
  fails: [relational-choice-r]
  by: Claude Fable 5.1 (Anthropic), prompted by Cian Dorr, after Cian Dorr’s observation that a choice over the
    individuals cannot be finitely pinned down
  date: '2026-09-23'
  text: >-
    At the types $(e\to t)$ and $e$. Let $U:=\lambda Xy\, .\,Xy\lor\neg\exists z\, .\,Xz$, a closed
    term, hence in the domain, and serial. A functional subrelation $S$ of $U$ would lie in the
    domain at the evaluation object, so it is symmetric and pinned down by a finite set $N$. Two
    facts about such an $S$ (Dorr, draft, Lemma 19(iv)): every $g\in G$ fixing $N$ pointwise satisfies
    $g^{[\sigma]}S=S$, and symmetry gives $\langle gA,gy,g\rangle\in S$ whenever $\langle
    A,y,1\rangle\in S$; together, $\langle gA,gy,1\rangle\in S$. Now let $A$ be the property the
    condition gives for $N$. Its extension is nonempty, so $S$ relates $A$ at the identity to some
    $y$ in its extension. The condition gives a member $g$ of the symmetry group that fixes
    $N$ pointwise, fixes $A$ and moves $y$ to some $gy\ne y$, so $S$ relates $A$ to $gy$ as
    well, and $S$ is not functional at the identity arrow. The well-ordering of the individuals
    that Cian Dorr had in mind is refuted by the same two facts, but the direct route needs no
    derivation of a well-ordering from Relational Choice in C.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The members' seven copies, which differed in the property $A$ and the transposition, stated
      once; each member's $A$ and transposition moved to the condition transposable. The
      qualitative-contrast model's second argument (OpenAI Codex, 24 September) was dropped.
  - date: '2026-10-06'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The condition transposable no longer mentions the finite set $M$ or the pinning of $A$ by
      $N\cup M$: the argument uses only that $g$ fixes $N$, the set pinning down $S$, and that
      $A$ is in the domain. So $g$ is now said to fix $N$ pointwise. Proved in Lean.
  lean:
  - fails: relational-choice-r
    ref: Classicism.Map.Arguments.symmetric_ideally_full.relational_choice.relational_choice_r


- id: axiom-of-infinity-e
  requires: [infinitely-many-individuals]
  when: {individuals: base}
  holds: [axiom-of-infinity-e]
  by: Claude Fable 5.1 (Anthropic), at Cian Dorr's direction
  date: '2026-09-20'
  text: >-
    There are infinitely many individuals, and identity at the identity arrow is literal, so no
    numeral counts them. The set of numerals at type $e$ is fixed by every arrow, hence symmetric
    and pinned down by the empty set, so finite cardinality is standard and no finite cardinality
    holds of the universal property.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The type-$e$ half of the members' argument, stated once; "the individuals are the natural
      numbers" became "there are infinitely many individuals", which also covers the qualitative
      links model. The type-$t$ half is axiom-of-infinity-t.
  lean:
  - holds: axiom-of-infinity-e
    ref: Classicism.Map.Arguments.symmetric_ideally_full.axiom_of_infinity_e.axiom_of_infinity_e


- id: axiom-of-infinity-t
  requires: [separable-collapses]
  holds: [axiom-of-infinity-t]
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  date: '2026-10-02'
  text: >-
    The propositions $C_{n,m}:=\{h : hn=hm\}$, that an arrow collapses $n$ and $m$, are symmetric,
    since relabelling the individuals of a world by a member of the symmetry group keeps identities
    among them, and each is pinned down by $\{n,m\}$; by the condition infinitely many of them are
    pairwise distinct, so there are infinitely many propositions. The set of numerals at type $t$
    is fixed by every arrow, hence symmetric and pinned down by the empty set, so finite cardinality
    is standard and no finite cardinality holds of the universal property.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      Replaces the members' argument of 20 September (Claude Fable 5.1), which used the
      propositions $\{h : hn=n\}$ that an arrow fixes a given individual. Those are not symmetric
      when the symmetry group moves $n$: symmetry asks that $h\in p$ imply $g\circ h\in p$, and
      $(g\circ h)n=gn$.
  lean:
  - holds: axiom-of-infinity-t
    ref: Classicism.Map.Arguments.symmetric_ideally_full.axiom_of_infinity_t.axiom_of_infinity_t


- id: barcan-surjective
  requires: [surjective-arrows, finite-pinning]
  holds: [barcan-r]
  source: {paper: dorr-bc-not-rc, locator: '§3.1, p. 9; Proposition 22, p. 11'}
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's request
  date: '2026-09-27'
  text: >-
    At every type. Let $B$ be an entity at the target of an arrow $i$, pinned down by the finite set
    $M$, and choose a finite set $P$ with a map $s:M\to P$ such that $i\circ s$ is the identity on
    $M$, possible because $i$ is surjective. Put $A:=\{\langle\bar x,j\rangle : \langle\bar
    x,k\rangle\in B$ for some arrow $k$ with $k|_M=j\circ s\}$. This is well defined because $B$ is
    pinned down by $M$. It is pinned down by $P$ and symmetric, since $B$ is. And $i\cdot A=B$:
    $\langle\bar x,k\rangle\in i\cdot A$ iff $\langle\bar x,k\circ i\rangle\in A$ iff $\langle\bar
    x,k'\rangle\in B$ for some $k'$ with $k'|_M=k|_M$, iff $\langle\bar x,k\rangle\in B$. So every
    entity at every world is the transport of an entity at the evaluation point, and a relation
    that is necessarily true of every entity is necessarily true of all of them.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The qualitative links model's argument, which proves the draft's claim for the
      all-surjections model ("at every type because every arrow is surjective and a finitely
      pinned symmetric intension can be pulled back along an arrow"), stated once for every member
      whose arrows are surjective.
  - date: '2026-10-06'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      Requires finite-pinning as well, which the argument uses (a finite preimage of the pinning
      set): stated when the group's Lean parameter admitted a per-object ideal, for the two-object
      model whose second object is unpinned. Every member meeting surjective-arrows meets it.
  lean:
  - holds: barcan-r
    ref: Classicism.Map.Arguments.symmetric_ideally_full.barcan_surjective.barcan_r


- id: actuality
  requires: [symmetry-group-pinned]
  holds: [actuality]
  source: {paper: dorr-bc-not-rc, locator: 'Proposition 24, p. 13; §7.1, p. 21; §8, pp. 23–26'}
  by: Cian Dorr
  date: '2026-09-19'
  text: >-
    The symmetry group is the smallest symmetric set of arrows containing the identity, and by the
    condition it is pinned down by a finite set, so it is a proposition in the domain, and an atom
    entailing every truth.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: The three members' versions stated once; what pins the group down is each member's reason for meeting symmetry-group-pinned.
  lean:
  - holds: actuality
    ref: Classicism.Map.Arguments.symmetric_ideally_full.actuality.actuality


- id: barcan-fixes-or-omits
  when: {individuals: base}
  requires: [fixes-or-omits]
  fails: [barcan-r]
  source: {paper: dorr-bc-not-rc, locator: '§7.1, p. 21; §7.2, p. 22'}
  by: Cian Dorr
  date: '2026-09-19'
  text: >-
    At type e. Take the property of being positive unless things are as they actually are, which is
    pinned down by the distinguished individual and is symmetric. Every individual necessarily has
    it, since an arrow either fixes the distinguished individual or omits it from its range and so
    sends everything to something positive; but it is not necessary that everything has it, since
    any arrow moving the distinguished individual leaves it out.
  revisions:
  - date: '2026-10-02'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: The range-gap model's argument, which its variant without Actuality invoked ("by the argument of the previous variant, which goes through verbatim"), stated once.
  lean:
  - fails: barcan-r
    ref: Classicism.Map.Arguments.symmetric_ideally_full.barcan_fixes_or_omits.barcan_r


- id: boolean-completeness
  requires: [hull-conditions]
  holds: [boolean-completeness-r]
  source: {paper: dorr-bc-not-rc, locator: 'Theorem 36, p. 18; Corollary 37, p. 19'}
  by: Cian Dorr
  date: '2026-09-19'
  text: >-
    At every relational type: a property $F$ of type-$\tau$ entities has a least upper bound,
    the union of the hulls of its instances. Let $F$ be pinned down by $N\supseteq M_0$. For
    each instance $u$ of $F$ at the identity, its hull is the closure of $u$ under the arrows
    that $N$ does not separate from the identity, transported along the arrows agreeing with
    the identity on $N$; it is symmetric, pinned down by $N$ (by (B1), which splices an arrow
    agreeing with $h'$ on the instance's pinning set with $h$ on $N$), and an upper bound of $u$.
    Every upper bound $z$ of all the instances, pinned down by $N'$, contains every hull: given a
    member of a hull, (B2) supplies a symmetry fixing $N$ and moving the instance's pinning set
    off $N'$, whose image is again an instance (by the orbit lemma, Lemma 35), lying under $z$;
    and $z$, pinned down by $N'$, cannot tell the moved instance's tuple from the original. The
    union of the hulls is pinned down by $N$ and symmetric, so it is in the domain, and it is the
    least upper bound.
  revisions:
  - date: '2026-10-06'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      The draft's main theorem, which the all-surjections and collapse-pair models each applied
      in an argument of their own, stated once; what each member does to meet its hypotheses is
      its reason for meeting hull-conditions. Proved in Lean (SymBase.lub_of_hull).
  - date: '2026-10-06'
    by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
    note: >-
      No longer requires one-object-action-model: as the draft notes (proof of Proposition 40),
      nothing in the theorem uses a single object, pinning, separation, amalgamability and hulls
      all quantifying over arrows with a fixed target; the condition hull-conditions now says so.
  lean:
  - holds: boolean-completeness-r
    ref: Classicism.Map.Arguments.symmetric_ideally_full.boolean_completeness.boolean_completeness_r
