papers:
- id: bacon-dorr-classicism
  title: Classicism
  citation: Bacon, Andrew, and Cian Dorr (2024). Classicism. In Peter Fritz and Nicholas K. Jones (eds),
    Higher-Order Metaphysics, Oxford University Press, pp. 109–190. The map was built from the draft dated
    16 May 2023, 87 pages, which does not differ materially from the published version; all page,
    proposition and footnote locators in this map refer to that draft's numbering.
- id: barcan-1946
  title: A Functional Calculus of First Order Based on Strict Implication
  citation: Barcan, Ruth C. (1946). A Functional Calculus of First Order Based on Strict Implication.
    Journal of Symbolic Logic 11, 1–16. Bibliography and attribution as given in Classicism.
- id: prior-1963
  title: Formal Logic
  citation: Prior, A. N. (1963). Formal Logic. Oxford University Press. Pages 206–207, as credited in
    Classicism, Proposition 2.2.
- id: prior-lemmon
  title: Modality and Quantification in S5; Past, Present, and Future
  citation: Prior, A. N. (1956). Modality and Quantification in S5. Journal of Symbolic Logic 21(1), 60–62.
    See also Prior (1967), Past, Present, and Future, p. 146, crediting E. J. Lemmon’s simplified proof.
    Attribution as given in Classicism, Proposition 2.3.
- id: gallin-1975
  title: Intensional and Higher-Order Modal Logic
  citation: 'Gallin, Daniel (1975). Intensional and Higher-Order Modal Logic: With Applications to Montague
    Semantics. North-Holland. Page 77, as cited in Classicism, n. 37.'
- id: bacon-2020
  title: Logical Combinatorialism
  citation: Bacon, Andrew (2020). Logical Combinatorialism. Philosophical Review 129(4), 537–589. As cited
    in Classicism, §§2.5 and 3.5. Read directly for the import of 22 September 2026; section, footnote and
    page locators refer to the published pagination.
- id: the-broadest-necessity
  title: The Broadest Necessity
  citation: Bacon, Andrew (2018). The Broadest Necessity. Journal of Philosophical Logic 47(5), 733–783.
    As credited in Classicism, §1.5.
- id: necessity-of-identity
  title: On a Derivation of the Necessity of Identity
  citation: Burgess, John P. (2014). On a Derivation of the Necessity of Identity. Synthese 191(7). Historical
    reference for Quine’s argument, as cited in Classicism, §1.5.
- id: goodsell-yli-vakkuri-unpublished
  title: Logical Foundations of Philosophy
  citation: Goodsell, Zachary, and Juhani Yli-Vakkuri. Logical Foundations of Philosophy. Unpublished
    work cited in Classicism, p. 27; no proof from that work is imported here.
- id: goodsell-pc
  title: Personal communication on Maximalist Classicism
  citation: Goodsell, Zachary. Personal communication reported by Bacon and Dorr in Classicism, p. 41,
    concerning Rigid Comprehension and Maximalist Classicism.
- id: dorr-bc-not-rc
  title: Boolean Completeness does not imply Rigid Comprehension
  citation: Dorr, Cian. Boolean Completeness does not imply Rigid Comprehension. Unpublished draft in
    progress, 30 July 2026, 27 pages. All page, proposition and lemma locators for this source refer to
    that draft. Parts of the draft were drafted with AI assistance; its mathematical claims are attributed
    to the author.
  note: Work in progress. No PDF is copied into the topic or its downloads.
- id: sun-possible-worlds-without-atomicity
  title: Possible Worlds Without Atomicity
  citation: Sun, Christopher. Possible Worlds Without Atomicity. Unpublished draft, September 2026.
  note: Work in progress. No PDF is copied into the topic or its downloads.
- id: goodsell-arithmetic-necessary
  title: Arithmetic is Necessary
  citation: Goodsell, Zachary William Lee. Arithmetic is Necessary. Draft dated 5 June 2024, 28 pages. Derives
    the necessity of arithmetic in the logic HKC (H plus K plus Countable Boolean Completeness) and shows
    that Boolean Completeness is inconsistent with the maximalization of any recursively enumerable extension
    of HK consistent with I, answering the question of Classicism, §2.6. Locators refer to this draft.
- id: bacon-2024-book
  title: A Philosophical Introduction to Higher-Order Logics
  citation: 'Bacon, Andrew (2024). A Philosophical Introduction to Higher-Order Logics. Routledge. DOI
    10.4324/9781003039181. Chapter 8, Application: Consequences and strengthenings of Classicism, pp. 155–182,
    and Chapter 18, The model theory of classicism, pp. 389–413, were read directly on 22 September 2026;
    locators give the book''s own page numbers. The book works in the full simple type hierarchy with Modalized
    Functionality at all types; its results are taken in the map''s relational type system, of which its
    models are models.'
- id: bacon-mathematical-contingency
  title: Could the truths of mathematics have been different?
  citation: Bacon, Andrew (2025). Could the truths of mathematics have been different? Draft
    dated 9 October 2025, with online appendix. The full Boolean-valued construction is in
    appendix §B.2, pp. 7–9 of the separately paginated appendix (PDF pp. 41–43).
  url: https://andrew-bacon.github.io/papers/Could%20mathematics%20have%20been%20different.pdf
  note: Only the Boolean-valued construction and its extensional fullness are used here;
    the paper’s mathematical-contingency results are not imported. No PDF is redistributed.
- id: dorr-prop-2-11-counterexample
  title: A counterexample to Proposition 2.11 of 'Classicism'
  citation: >-
    Cian Dorr, with Claude Opus 5.5 (Anthropic). A counterexample to Proposition 2.11 of 'Classicism':
    Fitelson's model, as an intensional action model. Draft of 1 October 2026, reworking a construction by
    Branden Fitelson, with Claude (Anthropic) and GPT-6 Astra (OpenAI).
  url: https://github.com/zwlgzwlg/Logical-Maps/blob/main/logical-maps/topics/classicism/sources/prop-2-11-counterexample.pdf
  note: The PDF is also published with this map, in its sources folder.
  file: sources/prop-2-11-counterexample.pdf
- id: fitelson-prop-2-11-isabelle
  title: Proposition 2.11 refuted (Isabelle/HOL)
  citation: >-
    Branden Fitelson, with Claude (Anthropic) and GPT-6 Astra (OpenAI). Isabelle/HOL verification
    that Rigid Comprehension for properties of propositions is not derivable from Classicism with □Atomicity,
    Boolean Completeness and BF; theorem proposition_2_11_refuted. Commit 4042cc0, 1 October 2026.
  url: https://github.com/fitelson/hom-isabelle/tree/4042cc0/Applications/2.11
