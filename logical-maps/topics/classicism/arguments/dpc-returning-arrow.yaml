id: dpc-returning-arrow
requires: [full-model, returning-arrow]
choice: free
fails: [distinctness-preserving-collapse]
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Let $p:=\{1\}$, in the domain since the model is full, and true. Any witness $q$ for
  $\Box_{\ne}p$ is true, so contains the identity; under an arrow $i\ne 1$ with a retraction $r$,
  the arrow $r\circ i=1$ makes $\Diamond q$ true, while $p$ is false. So no true $q$ has
  $\Box(\Diamond q\to p)$. (The surjection monoid's own argument of 23 September, stated once.)
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- fails: distinctness-preserving-collapse
  ref: Classicism.Map.Arguments.dpc_returning_arrow.distinctness_preserving_collapse
