id: intensional-choice-well-ordering
requires: [codomain-intensions, metatheory-choice]
holds: [necessary-intensional-choice-r]
by: Claude Fable 5.1 (Anthropic), at Cian Dorr's suggestion
date: '2026-10-03'
text: >-
  For each object $U$ and type $\sigma$ fix a well-ordering $<_U$ of the domain $D^\sigma_U$, and let
  $W$ be the intension of type $\sigma\to\sigma\to t$ with $W(h):={<_{\operatorname{cod}h}}$. Its
  value depends only on the arrow's codomain, so by the condition it is in the domain, and at
  every world its extension well-orders that world's type-$\sigma$ domain. Given $F$ with
  $\Box\exists x\, .\,Fx$, put $G:=\lambda x\, .\,Fx\land\forall y\, .\,(Fy\to\neg Wyx)$, the
  $W$-least $F$. It is definable from $F$ and $W$, so in the domain; $G\le F$, and its extension
  at every arrow is the singleton of the least element of $F$'s. So Intensional Choice holds, and
  the same at every reachable object gives $\Box$Intensional Choice. Cian Dorr's observation that
  such models are qualitatively full, made precise.
