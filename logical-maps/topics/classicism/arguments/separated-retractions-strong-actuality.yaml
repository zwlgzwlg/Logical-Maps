by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Let $h$ out of the evaluation object have retractions $j\ne j^{\prime}$, and let $q$ at $h$'s
  target contain $j$ but not $j^{\prime}$. A true proposition $p$ contains the identity, so under
  $h$ it becomes a proposition containing $j$ and $j^{\prime}$, since $j\circ h=j^{\prime}\circ
  h=1$. That proposition lies neither below $q$ nor below $\neg q$, so $p$ is not a strong world.
  No true proposition is.
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- fails: strong-actuality
  ref: Classicism.Map.Arguments.separated_retractions_strong_actuality.strong_actuality
