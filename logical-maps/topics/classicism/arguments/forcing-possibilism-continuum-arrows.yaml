writeup: choiceless-ordinal-obstruction-to-mathematical-possibilism
text: >-
  The closed finite order thresholds give a definable injection from the
  naturals into the inexact ordinal benchmark H. For each n an order on n
  individuals distinguishes consecutive thresholds, without choosing such
  orders simultaneously. Full current rows on these thresholds code all
  subsets of the naturals. Present the complete atomless regular-open
  algebra B of Cantor space using its canonical injection into those codes.
  If H were strictly smaller than a power-closed subset Y of B, its
  witnessing injection H to Y would give a specific countably infinite
  image A in Y, strictly smaller than Y since A embeds in H. A represented
  power of A in C strictly smaller than Y has one unique code for each
  subset of A. But Y embeds in B, hence in the powerset of the naturals
  and thus in the powerset of A. Composition gives an injection Y to C,
  a contradiction in ZF. This makes B revised-small. Each propositional
  interval in a full action model is a power set, atomic or trivial, and
  cannot represent B.
