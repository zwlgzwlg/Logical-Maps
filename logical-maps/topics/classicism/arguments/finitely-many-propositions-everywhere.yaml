text: >-
  At a world with $n$ propositions, the numeral $\operatorname{Suc}^n_t\mathbf{0}_t$, a finite
  cardinality, holds of the universal property of propositions, so the Axiom of Infinity at type
  $t$ fails there. It fails at every world, so Possible Infinity at type $t$ fails.
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- fails: possible-infinity-t
