id: barcan-t-transport
requires: [transport-gap]
fails: [barcan-t]
by: Claude Fable 5.1 (Anthropic), answering Cian Dorr’s question whether the failure of BF
  sharpens to type $t$
date: '2026-09-23'
text: >-
  In a one-object finitely pinned model, BF (type t) fails as soon as there are a finite $N$, an
  arrow $i$ and a proposition $q$ in the domain that is the transport $i^{\prime}\cdot p=\{k :
  k\circ i^{\prime}\in p\}$ of no proposition $p$ along any arrow $i^{\prime}$ agreeing with $i$ on
  $N$: the intension $X:=\{\langle r,j\rangle : r\ne q\text{ or }j\text{ disagrees with }i\text{ on
  }N\}$, which the condition puts in the domain, contains $\langle i^{\prime}\cdot
  p,i^{\prime}\rangle$ for every $p$ and $i^{\prime}$, so $\forall p\, .\,\Box Xp$ holds at the
  identity, and omits $\langle q,i\rangle$, so $\Box\forall p\, .\,Xp$ fails there. Since membership
  of $k$ in $i^{\prime}\cdot p$ depends only on $k$ restricted to the range of $i^{\prime}$, it
  suffices that $q$ separate two arrows agreeing on every such range, as the condition provides.
revisions:
- date: '2026-10-02'
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  note: >-
    The finite-support group's argument and the symmetric range-gap models' copies stated once for the topic; that $X$ is in the domain (pinned down by $N$, and in a symmetric model symmetric) is now part of each record's reason for meeting transport-gap.
