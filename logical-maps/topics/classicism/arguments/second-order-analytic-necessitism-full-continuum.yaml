id: second-order-analytic-necessitism-full-continuum
requires: [full-continuum-everywhere, symmetric-domains]
choice: free
holds: [second-order-analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  With the structure of analytic-necessitism-full-continuum: the intension whose value at each object is
  the set of codomain-only $k$-ary relations among the $Y_A$ there depends only on the codomain and
  consists of entities fixed by every symmetry, so it is symmetric and pinned down by $\varnothing$, and
  in the domain. It is rigid, its instances are rigid, and at every world each $k$-ary relation agrees on
  the carrier with one of them, every set of tuples of the $Y_A$ there being the value of one. So it is a
  represented power of arity $k$, for every $k$, and Second-Order Analytic Necessitism holds.
withdrawn:
  date: '2026-10-30'
  by: GPT-6 Astra, prompted by Daniel Kodsi
  reason: >-
    The stated hypotheses do not establish the native all-carrier AN/SOAN schemata.
    A structure at tt (or another selected carrier) does not answer an instance at e or t.
    A counterexample is the finite-pin, trivial-symmetry all-self-maps model of the reals, where an actual real field at e has no necessarily distinct carrier.
    See [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 1–3, for the full countermodels
    and exact condition checks. The original text and attribution are preserved; its
    selected-carrier construction is not rejected by this withdrawal.
revisions:
- date: '2026-10-30'
  by: GPT-6 Astra, prompted by Daniel Kodsi
  note: >-
    Withdrawn as an all-type sufficient-condition argument, following the 29 October
    counterexamples proved in the accompanying write-up. This does not assert
    failure of AN in every model formerly using this argument. Specific full-action
    replacements are proved in sections 4–5 of the linked write-up.
