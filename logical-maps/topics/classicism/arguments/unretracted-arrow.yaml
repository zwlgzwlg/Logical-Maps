id: unretracted-arrow
requires: [full-model, unretracted-arrow]
fails: [distinctness-necessary-t]
source: {paper: bacon-dorr-classicism, locator: '§3.5, Proposition 3.24(i)'}
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Let $k$ out of the evaluation object have no retraction. The propositions $\bot$ and $\{1\}$ are
  in the domain, the model being full, and $k$ transports both to $\bot$: no arrow $m$ after $k$
  has $m\circ k=1$. So $k$'s action at type $t$ is not injective, and ND fails there (Proposition
  3.24(i)).
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- fails: distinctness-necessary-t
  ref: Classicism.Map.Arguments.unretracted_arrow.distinctness_necessary_t
