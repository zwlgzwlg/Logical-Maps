id: rigid-power-tight
requires: [rigid-haecceity-disjunctions]
choice: free
holds: [rigid-power-r, necessary-rigid-power-r]
by: Claude Opus 5.5 (Anthropic), 3 October 2026 (full action models); extended by Claude Fable 5.1
  (Anthropic), 4 October 2026, at Cian Dorr's direction
date: '2026-10-04'
text: >-
  Write $X_0(E)$ for the intension $k\mapsto k\cdot E$. The extension at an arrow $h$ of the power
  property $\lambda X\, .\,\operatorname{Rigid}(X)\land X\le F$ is the set of rigid $X$ with
  $X\le h\cdot F$, the bound variable ranging over the domain untransported and the parameter
  transported. By the condition the rigid relations are the $X_0(E)$, and $X_0(T)\le X_0(S)$ iff
  $T\subseteq S$; so for rigid $F=X_0(S)$ the power property has extension
  $\{X_0(T'):T'\subseteq k\cdot S\}$ at $k$, while transporting its extension at the identity
  along $k$ gives $\{X_0(k\cdot T):T\subseteq S\}$. These coincide, since every $T'\subseteq
  k\cdot S$ is $k\cdot T$ for $T:=\{s\in S:k\cdot s\in T'\}$. So the power property is itself
  $X_0$ of its extension, hence rigid, and the same at every reachable object gives the boxed form.
