id: nc-sigma-homogeneous
requires: [sigma-top, homogeneous-individuals]
given: [no-pure-contingency-r]
holds: [no-contingency-signature-r]
by: Claude Fable 5.1 (Anthropic), at Cian Dorr’s request
date: '2026-09-23'
text: >-
  The relational constants denote pure entities, so a closed Σ-sentence denotes what some
  $P(d,\ldots,d)$ denotes for a pure formula $P$; the model’s automorphisms carry every individual
  to every other, so $P(d,\ldots,d)$ is materially equivalent to the pure sentence
  $\forall x\, .\,P(x,\ldots,x)$ and its negation to $\forall x\, .\,\neg P(x,\ldots,x)$; whichever
  is true is necessary by No Pure Contingency, and instantiation under the box gives
  $\Box P(d,\ldots,d)$ or $\Box\neg P(d,\ldots,d)$.
revisions:
