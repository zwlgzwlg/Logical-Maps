id: dpc-isolated-actual-world
requires: [actual-world-isolated]
holds: [distinctness-preserving-collapse]
by: Claude Fable 5.1 (Anthropic)
date: '2026-09-23'
text: >-
  For a true $p$, $a\le p$, since $a$ entails every truth. Take $q:=a$ in the definition of
  $\Box_{\ne}p$: at a world in $a$, $p$ holds; at a world outside $a$, $\Diamond a$ fails. So every
  truth is $\Box_{\ne}$-necessary.
revisions:
- date: '2026-10-02'
  by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
  note: >-
    The finite-support, symmetric and full action models' copies (eight records) stated once for the topic; what varied, why no world outside the actual world sees back into it, is each record's reason for meeting actual-world-isolated.
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- holds: distinctness-preserving-collapse
  ref: Classicism.Map.Arguments.dpc_isolated_actual_world.distinctness_preserving_collapse
