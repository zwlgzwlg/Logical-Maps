id: nonepic-strong-leibniz
requires: [full-model, nonepic-arrow]
fails: [strong-leibniz-t]
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Let $k$ out of the evaluation object have distinct $j\ne j^{\prime}$ after it with $j\circ k=
  j^{\prime}\circ k$. The proposition $\{j\circ k\}$, in the domain since the model is full, is
  possible, and the only possible proposition below it is itself. It is not a strong world: under
  $k$ it becomes $\{m : m\circ k=j\circ k\}$, which contains $j$ and $j^{\prime}$, and the
  proposition $\{j\}$ at $k$'s target, in the domain there, neither contains nor excludes it. So
  the type-$t$ Strong Leibniz Biconditionals fail. (The idempotent monoid's and the retract's own
  arguments of 22–23 September, stated once.)
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- fails: strong-leibniz-t
  ref: Classicism.Map.Arguments.nonepic_strong_leibniz.strong_leibniz_t
