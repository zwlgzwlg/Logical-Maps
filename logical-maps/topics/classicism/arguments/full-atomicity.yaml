id: full-atomicity
requires: [full-action-model]
holds: [necessary-atomicity-r]
source: {paper: bacon-dorr-classicism, locator: 'p. 61'}
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Entailment is inclusion of intensions. Below a relation $Y\ne\bot_\tau$ lies the relation whose
  intension is the singleton of one of $Y$'s tuples, which is in the domain since the model is full,
  and is an atom: its only proper part is $\bot_\tau$. Every object being full, the same holds at
  every arrow, so Atomicity is necessary. The source notes that full models are atomic (p. 61);
  stated once for the topic, in place of the full models' own arguments.
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- holds: necessary-atomicity-r
  ref: Classicism.Map.Arguments.full_atomicity.necessary_atomicity_r
