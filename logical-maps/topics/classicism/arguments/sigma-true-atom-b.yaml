text: >-
  B for sentences of Σ fails: the Σ-sentence $\forall\bar x\, .\,c\bar x$ denotes $a$, which is
  true, and under an arrow from which no world in $a$ is accessible $\Diamond a$ is false, so
  $\Box\Diamond a$ fails.
