id: infinitely-many-individuals
requires: [extensionally-full, infinitely-many-individuals]
choice: free
holds: [axiom-of-infinity-e, infinity-e]
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  The Infinity schema holds, there being $n$ distinct individuals for every $n$. For the Axiom: by
  extensional fullness the domain has a property of cardinalities true of $Z$ exactly when every
  property $Z$ holds of has a finite extension. It holds of $\mathbf{0}_e$, which holds only of
  empty properties, and passes from $Y$ to $\operatorname{Suc}_e Y$, which holds of $F$ only if $Y$
  holds of $F$ less one of its instances. So every finite cardinality has it, and none holds of the
  universal property, whose extension is infinite.
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- holds: axiom-of-infinity-e
  ref: Classicism.Map.Arguments.infinitely_many_individuals.axiom_of_infinity_e
- holds: infinity-e
  ref: Classicism.Map.Arguments.infinitely_many_individuals.infinity_e
