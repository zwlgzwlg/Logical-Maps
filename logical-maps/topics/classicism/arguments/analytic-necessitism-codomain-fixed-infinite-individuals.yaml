id: analytic-necessitism-codomain-fixed-infinite-individuals
requires: [codomain-intensions, fixed-infinite-individuals]
choice: free
holds: [analytic-necessitism, second-order-analytic-necessitism]
by: Claude Opus 5.5 (Anthropic), prompted by Cian Dorr, auditing the withdrawn arguments for the failure of Analytic Necessitism
date: '2026-10-29'
text: >-
  At type $\tau:=et$, as analytic-necessitism-codomain-everywhere with the individuals in place of the
  propositions: the individuals are the same infinite set $D$ at every object, so the codomain-only
  intension $Y_A$ whose value at every arrow is $E^A$, for an injection $A\mapsto E^A$ from the sets of
  natural numbers into the sets of individuals, is in the domain, and its transports are the $Y_A$ of the
  targets, distinct for distinct $A$; the real number structure on the $Y_A$ by codomain-only relations is
  carried along every arrow to an isomorphic one. Such a structure is rigid, its instances are necessarily
  distinct, and it is necessarily a real number structure; and the codomain-only intension of type
  $((\tau)^kt)t$ whose value at each object is the set of codomain-only $k$-ary relations among the
  carrier there is a represented power of arity $k$, since at every world each $k$-ary relation agrees on
  the carrier with one of them. So the consequents of Analytic Necessitism and of its second-order form
  hold, and both principles hold. (The argument of the withdrawn analytic-necessitism-unretracted-arrow
  would refute this structure; its step from inextensibility is the gap.)
withdrawn:
  date: '2026-10-30'
  by: GPT-6 Astra, prompted by Daniel Kodsi
  reason: >-
    The stated hypotheses do not establish the native all-carrier AN/SOAN schemata.
    A structure at tt (or another selected carrier) does not answer an instance at e or t.
    A counterexample is the full one-object model on the countable monoid with an absorbing zero and fixed natural-number individuals, where an actual real field at t has no necessarily distinct carrier.
    See [proof](../writeups/analytic-necessitism-carrier-correction.md), sections 1–3, for the full countermodels
    and exact condition checks. The original text and attribution are preserved; its
    selected-carrier construction is not rejected by this withdrawal.
revisions:
- date: '2026-10-30'
  by: GPT-6 Astra, prompted by Daniel Kodsi
  note: >-
    Withdrawn as an all-type sufficient-condition argument, following the 29 October
    counterexamples proved in the accompanying write-up. This does not assert
    failure of AN in every model formerly using this argument. Specific full-action
    replacements are proved in sections 4–5 of the linked write-up.
