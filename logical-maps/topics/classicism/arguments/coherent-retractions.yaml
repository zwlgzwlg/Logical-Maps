id: coherent-retractions
requires: [full-model, coherent-retractions]
holds: [gallin-extensional-comprehension-r]
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-06'
text: >-
  Given $X$ with extension $E$ at the evaluation object, let $Y$ hold at an arrow $g$ of a tuple
  $\bar b$ at $g$'s target iff $r_g\cdot\bar b\in E$; it is in the domain since the model is full.
  It is coextensive with $X$, since $r_1=1$. And whether it holds is unchanged along every arrow:
  at $x\circ g$, of $x\cdot\bar b$, it holds iff $r_{x\circ g}\cdot x\cdot\bar b=r_g\cdot\bar b\in E$.
  So $Y$ and its negation are persistent. (The retract's own argument of 25 September, generalized.)
# Proved in Lean (Classicism/MapArguments.lean), for every intensional action model meeting the conditions.
lean:
- holds: gallin-extensional-comprehension-r
  ref: Classicism.Map.Arguments.coherent_retractions.gallin_extensional_comprehension_r
