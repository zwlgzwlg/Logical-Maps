id: fixed-infinite-individuals
requires: [fixed-infinite-individuals, full-model]
holds: [axiom-of-infinity-e]
by: Claude Opus 5.5 (Anthropic), at Cian Dorr's direction
date: '2026-10-03'
text: >-
  The individuals at the evaluation object are an infinite set and identity there is literal. The
  numerals at type $e$ are intensions of a full model, so they are the finite cardinalities, and
  none of them holds of the universal property: no finite cardinality holds of an infinite set.
  This is the argument the full surjection-monoid record gave for its own infinite individuals.
