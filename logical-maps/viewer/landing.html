<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__LANDING_TITLE__</title>
  <!--__PMAP_THEME__-->
  <style>
    /* Aged paper palette for the collection homepage. */
    @media screen {
      :root {
        --bg: #f3e7c9;
        --panel: #f9f0da;
        --panel-2: #e9d8b0;
        --line: #d5c49c;
        --line-strong: #b3a074;
        --ink: #423822;
        --ink-2: #6a5938;
        --ink-3: #75623f;
        --accent: #77531f;
        --link-hover: #964a2d;
        --focus: #964a2d;
        --hl: #e5ce8f;
      }
      :root[data-theme="dark"] {
        --bg: #221e15;
        --panel: #2a251a;
        --panel-2: #332c1e;
        --line: #4d432d;
        --line-strong: #776645;
        --ink: #e9ddbd;
        --ink-2: #c4b38b;
        --ink-3: #ad9c73;
        --accent: #d6b36c;
        --link-hover: #e3bd8c;
        --focus: #e3bd8c;
        --hl: #504126;
      }
    }
    .landing { width: min(1040px, calc(100% - 64px)); margin: 28px auto 64px; }
    .landing-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
    h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 650; line-height: 1.15; letter-spacing: -.035em; margin: 38px 0 24px; }
    #introduction { max-width: 75ch; font-size: 16px; line-height: 1.75; }
    #introduction:empty { display: none; }
    #introduction p { margin: 0 0 20px; }
    section { margin-top: 34px; }
    h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--ink-2); }
    .map-list { list-style: none; padding: 0; margin: 34px 0 0; border-top: 1px solid var(--line); }
    .map-list li { border-bottom: 1px solid var(--line); }
    .map-link { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; font-size: 21px; font-weight: 550; }
    .map-link:hover { text-decoration: none; }
    .map-link:hover .map-name { text-decoration: underline; text-underline-offset: 4px; }
    .map-link .arrow { color: inherit; font-size: 24px; font-weight: 400; }
    .resources { display: flex; gap: 12px 28px; flex-wrap: wrap; }
    @media (max-width: 600px) {
      .landing { width: calc(100% - 32px); margin-top: 16px; }
      h1 { margin-top: 28px; }
      .map-link { font-size: 19px; padding: 16px 0; }
    }
    .iridescent { font-weight: 600; color: transparent; background: linear-gradient(90deg, #d946ef, #f59e0b, #22c55e, #06b6d4, #6366f1, #d946ef); background-size: 400% 100%; -webkit-background-clip: text; background-clip: text; animation: iridescence 6s linear infinite; }
    .iridescent.bronze { background-image: linear-gradient(90deg, #8a4b1f, #b87333, #d9955a, #7a3e14, #a0522d, #8a4b1f); }
    .iridescent.silver { background-image: linear-gradient(90deg, #6b7280, #e5e7eb, #ffffff, #9ca3af, #d1d5db, #6b7280); }
    .iridescent.gold { background-image: linear-gradient(90deg, #b8860b, #ffd700, #f0c419, #d4a017, #ffcc33, #b8860b); }
    @keyframes iridescence { to { background-position: 400% 50%; } }
    @media (prefers-reduced-motion: reduce) { .iridescent { animation: none; } }
  </style>
</head>
<body>
  <main class="landing">
    <nav class="landing-nav" aria-label="Site navigation">
      <a href="__HOME_URL__">__HOME_LABEL__</a>
      <div class="display-toggles">
        <button type="button" class="theme-toggle" data-theme-toggle>[Dark mode]</button>
        <button type="button" class="theme-toggle" data-colourblind-toggle aria-label="Colourblind mode" aria-pressed="false">[Colourblind mode: off]</button>
      </div>
    </nav>
    <h1>__LANDING_TITLE__</h1>
    <section id="introduction" aria-label="Introduction">__INTRODUCTION__</section>
    <ul class="map-list" aria-label="Logical maps">__MAP_LINKS__</ul>
    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create your own logical map</h2>
      <div class="resources">
        __STARTER_LINK__
        <a href="__REPOSITORY_URL__">GitHub</a>
      </div>
      __SUGGESTIONS__
    </section>
  </main>
</body>
</html>
